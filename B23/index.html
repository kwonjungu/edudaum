<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기록 간격 견주기 활동 — 에듀다움</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF; --soft:#F7F7F7;
    --point:#FF385C; --point-soft:#FFF0F3; --point-dim:#FFD1DA; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:10px 16px 28px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;
    border-radius:999px;padding:6px 14px;white-space:nowrap}

  h1{font-size:clamp(22px,5.4vw,28px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
  .lead{font-size:15px;color:var(--muted);margin-top:4px}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:12px;margin-top:12px}
  section.off{opacity:.45}
  h2{font-size:16px;font-weight:600;margin-bottom:8px}
  .hint{font-size:15px;color:var(--muted)}


  /* 막대 */
  .chart{display:grid;gap:3px;align-items:end;margin-top:10px}
  .col{display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0}
  .bar{position:relative;height:110px;width:100%;min-height:44px;display:flex;align-items:flex-end;
    background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0;font:inherit;color:inherit}
  button.bar{cursor:pointer;border-color:var(--ink)}
  button.bar:disabled{cursor:default;border-color:var(--line)}
  .bar i{display:block;width:100%;background:var(--ink);border-radius:4px 4px 0 0;opacity:.75}
  .bar.is30 i{background:var(--point);opacity:1}
  .bar.pick{background:var(--point-soft);outline:3px solid var(--point);outline-offset:-1px}
  .bar.most{outline:3px dashed var(--ink);outline-offset:-1px}
  .bar.blank{background:transparent;border-style:dashed;border-color:var(--line-strong)}
  .bar.h30{height:70px}
  .t{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{font:inherit;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink);background:#fff;
    border:1px solid var(--ink);border-radius:var(--r-sm);min-height:44px;padding:8px 14px;flex:1 1 auto}
  .btn.main{background:var(--point);border-color:var(--point);color:#fff;min-height:48px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.main:disabled{background:var(--point-dim);border-color:var(--point-dim);opacity:1}
  .say{margin-top:10px;font-size:16px;font-weight:600}
  .foot{margin-top:12px;font-size:14px;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">체험 목록</a><a class="back" href="../lessons/B23/">과정안</a></span>
    <span class="tag">17~18</span>
  </nav>
  <header>
    <h1>기록 간격 견주기 활동</h1>
    <p class="lead">30초 기록이 가장 크게 놓칠 변화를 짚어요</p>
  </header>

  <section id="s2" aria-labelledby="h2t">
    <h2 id="h2t">10초 기록 <span class="hint" id="info"></span></h2>
    <p class="hint" id="hint2"></p>
    <div class="chart" id="chart10" role="group" aria-label="10초 기록 막대"></div>
    <p class="t" style="text-align:right">걸은 시간(초)</p>
    <div class="acts">
      <button class="btn main" id="checkBtn" type="button" disabled>확인하기</button>
    </div>
  </section>

  <section id="s3" aria-labelledby="h3t" class="off">
    <h2 id="h3t">30초 기록 <span class="hint">같은 기록에서 30초마다 고른 값</span></h2>
    <div class="chart" id="chart30" aria-label="30초 기록 막대"></div>
    <p class="say" id="say" aria-live="polite"></p>
    <div class="acts">
      <button class="btn main" id="nextBtn" type="button">다음 판</button>
      <button class="btn" id="resetBtn" type="button">다시 하기</button>
    </div>
  </section>

  <p class="foot">기기로 잰 값이 아니에요. 활동3에서 마이크로비트로 걸으며 직접 재요.</p>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  var n = 0, v = [], pick = -1, checked = false, lastN = 0, flatLeft = 0;

  function is30(i){ return i % 3 === 0; }
  function sec(i){ return (i * 10) + '초'; }
  function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

  function lineAt(i){
    var a = i - (i % 3), b = a + 3;
    return (b < n) ? v[a] + (v[b] - v[a]) * (i - a) / 3 : v[a];
  }
  // 30초 기록이 그 칸에서 놓친 정도
  function miss(i){ return is30(i) ? 0 : Math.abs(v[i] - lineAt(i)); }
  function mostIdx(){
    var best = -1, bv = -1;
    for (var i = 0; i < n; i++){ var d = miss(i); if (d > bv){ bv = d; best = i; } }
    return best;
  }

  // 판을 그 자리에서 뽑는다. 창가(밝음)에서 안쪽(어두움)으로, 출렁임 한 번. 셋에 하나는 출렁임 없음.
  function newRound(){
    do { n = [7, 10, 13][rnd(0, 2)]; } while (n === lastN);
    lastN = n;
    var hi = rnd(170, 239), lo = rnd(20, 59);
    var flat = Math.random() < 1 / 3;
    var bump = rnd(1, n - 1); if (is30(bump)) bump = (bump + 1 < n) ? bump + 1 : bump - 1;
    var amp = (Math.random() < .5 ? -1 : 1) * rnd(40, 79);
    v = [];
    for (var i = 0; i < n; i++){
      var x = hi + (lo - hi) * i / (n - 1) + rnd(-5, 5) + (!flat && i === bump ? amp : 0);
      v.push(Math.max(0, Math.min(255, Math.round(x))));
    }
    pick = -1; checked = false;
    render();
  }

  function drawChart(box, opt){
    box.innerHTML = '';
    box.style.gridTemplateColumns = 'repeat(' + n + ',minmax(0,1fr))';
    var most = opt.most == null ? -1 : opt.most;
    for (var i = 0; i < n; i++){
      var col = document.createElement('div');
      col.className = 'col';
      var show = opt.only30 ? is30(i) : true;
      var el;
      if (opt.tap){
        el = document.createElement('button');
        el.type = 'button';
        (function(k){ el.addEventListener('click', function(){ if (!checked && !is30(k)){ pick = k; render(); } }); })(i);
        el.disabled = is30(i) || checked;
        el.setAttribute('aria-pressed', i === pick ? 'true' : 'false');
      } else {
        el = document.createElement('div');
      }
      el.className = 'bar' + (opt.only30 ? ' h30' : '') + (is30(i) ? ' is30' : '') +
        (show ? '' : ' blank') + (opt.tap && i === pick ? ' pick' : '') + (i === most ? ' most' : '');
      var fill = document.createElement('i');
      fill.style.height = (show ? Math.max(2, v[i] / 255 * 100) : 0) + '%';
      el.appendChild(fill);
      el.setAttribute('aria-label', show ? sec(i) + ' 빛 세기 ' + v[i] + (is30(i) ? ', 30초 기록에도 들어감' : '')
                                         : sec(i) + ' 30초 기록에 없음');
      var t = document.createElement('span');
      t.className = 't';
      t.textContent = String(i * 10);
      col.appendChild(el); col.appendChild(t);
      box.appendChild(col);
    }
  }

  function render(){
    $('info').textContent = '창가에서 안쪽으로 걸으며 잰 빛 세기 · ' + n + '칸';
    $('hint2').textContent = checked ? '점선 막대가 30초 기록이 가장 크게 놓친 변화예요'
      : pick < 0 ? '분홍이 아닌 막대를 하나 눌러요'
      : sec(pick) + '를 짚었어요. 확인 전엔 바꿔도 돼요';
    drawChart($('chart10'), { tap:true, most: checked ? mostIdx() : null });
    $('checkBtn').disabled = pick < 0 || checked;

    $('s3').classList.toggle('off', !checked);
    $('chart30').hidden = !checked;
    $('nextBtn').disabled = !checked;
    if (!checked){ $('say').textContent = '짚고 확인하면 30초 막대가 나와요'; return; }
    drawChart($('chart30'), { only30:true });

    var m = mostIdx(), mv = Math.round(miss(m));
    var say;
    if (mv <= 12) say = '30초 기록도 거의 같은 모양이에요 · 가장 큰 빛 세기 차이 ' + mv;
    else if (m === pick) say = '짚은 ' + sec(pick) + '에서 가장 크게 놓쳤어요 · 빛 세기 차이 ' + mv;
    else say = '가장 크게 놓친 곳은 짚은 곳에서 ' + Math.abs(m - pick) + '칸 옆 ' + sec(m) +
      '예요 · 짚은 곳은 빛 세기 차이 ' + Math.round(miss(pick));
    $('say').textContent = say;
  }

  $('checkBtn').addEventListener('click', function(){
    if (checked || pick < 0) return;
    checked = true; render();
    $('s3').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  $('nextBtn').addEventListener('click', function(){ if (checked){ newRound(); window.scrollTo(0, 0); } });
  $('resetBtn').addEventListener('click', function(){ pick = -1; checked = false; render(); window.scrollTo(0, 0); });

  newRound();
})();
</script>
</body>
</html>
