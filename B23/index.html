<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몇 칸으로 끊을까 — 에듀다움 B23</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#7C3AED; --point-soft:#EDE7FF;
    --muted:#5A5A5A;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 44px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:14px;background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:9px 15px;box-shadow:var(--hard-sm);min-height:44px}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;
    border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:var(--hard-sm)}
  h1{font-size:clamp(23px,5.2vw,34px);font-weight:900;letter-spacing:-.035em;line-height:1.06}
  .lead{font-size:15px;color:var(--muted);font-weight:700;margin-top:6px}
  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:13px;margin-top:12px}
  h2{font-size:14px;font-weight:900;letter-spacing:-.02em;margin-bottom:9px;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;
    border:2.5px solid var(--ink);background:var(--surface);font-size:14px;font-weight:900;
    padding:9px 12px;border-radius:var(--r-sm);min-height:44px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .btn.on{background:var(--point);color:#fff}
  .btn.main{background:var(--point);color:#fff}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:disabled{opacity:.42;cursor:default;box-shadow:none;transform:none}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

  .pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pic{display:flex;flex-direction:column;gap:5px}
  .pic svg{width:100%;height:auto;display:block;border:2.5px solid var(--ink);
    border-radius:var(--r-sm);background:var(--surface)}
  .pic .cap{font-size:12px;font-weight:900;color:var(--muted);text-align:center}
  .status{margin-top:9px;font-size:13px;font-weight:800;color:var(--muted)}

  .grids{display:flex;gap:7px;flex-wrap:wrap}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .say{margin-top:9px;font-size:14px;font-weight:900}
  .say.dim{color:var(--muted);font-weight:700}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">전체 목록</a>
    <span class="tag">17~18</span>
  </nav>
  <header>
    <h1>몇 칸으로 끊을까</h1>
    <p class="lead">2초만 보여 주고 가려요</p>
  </header>

  <section aria-labelledby="h-p">
    <h2 id="h-p">그림</h2>
    <div class="pics">
      <div class="pic">
        <svg id="orig" viewBox="0 0 100 100" role="img" aria-label="처음 그림"></svg>
        <p class="cap">처음 그림</p>
      </div>
      <div class="pic">
        <svg id="rec" viewBox="0 0 100 100" role="img" aria-label="되돌린 그림"></svg>
        <p class="cap">되돌린 그림</p>
      </div>
    </div>
    <p class="status" id="status">보여 주는 중이에요</p>
  </section>

  <section aria-labelledby="h-n">
    <h2 id="h-n">칸 수 고르기</h2>
    <div class="grids" id="grids"></div>
    <div class="tools">
      <button class="btn main" id="ok" type="button" disabled>이제 알겠어요</button>
      <button class="btn" id="again" type="button">다시 하기</button>
      <button class="btn" id="next" type="button">다음 판</button>
    </div>
    <p class="say dim" id="say">칸 수를 눌러 봐요</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var GRIDS = [4, 6, 8, 12, 16];
  var FLASH_MS = 2000;

  var SHAPES = [
    function heart(x, y){
      var X = x * 1.15, Y = (y - 0.15) * 1.15;
      return (X * X + Y * Y - 1) * (X * X + Y * Y - 1) * (X * X + Y * Y - 1) - X * X * Y * Y * Y < 0;
    },
    function cross(x, y){
      return (Math.abs(x) <= 0.28 && Math.abs(y) <= 0.85) || (Math.abs(y) <= 0.28 && Math.abs(x) <= 0.85);
    },
    function house(x, y){
      var body = Math.abs(x) <= 0.55 && y <= 0.1 && y >= -0.85;
      var roofY = 0.85 - (0.75 / 0.62) * Math.abs(x);
      var roof = Math.abs(x) <= 0.62 && y >= 0.1 && y <= roofY;
      return body || roof;
    },
    function arrow(x, y){
      var shaft = Math.abs(x) <= 0.18 && y <= 0.05 && y >= -0.85;
      var headY = 0.85 - (0.8 / 0.5) * Math.abs(x);
      var head = Math.abs(x) <= 0.5 && y >= 0.05 && y <= headY;
      return shaft || head;
    },
    function tree(x, y){
      var canY = 0.85 - (0.9 / 0.7) * Math.abs(x);
      var canopy = Math.abs(x) <= 0.7 && y >= -0.05 && y <= canY;
      var trunk = Math.abs(x) <= 0.13 && y <= -0.05 && y >= -0.85;
      return canopy || trunk;
    }
  ];

  var shapeIdx, prevShapeIdx;
  var flashing = true, flashTimer = null, gridN = null, confirmed = false;

  var origSvg = $('orig'), recSvg = $('rec');
  var status = $('status'), say = $('say');
  var gridsBox = $('grids'), okBtn = $('ok'), gridBtns = [];

  (function build(){
    for (var i = 0; i < GRIDS.length; i++){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = GRIDS[i] + '칸';
      (function(n){ b.addEventListener('click', function(){ chooseGrid(n); }); })(GRIDS[i]);
      gridsBox.appendChild(b);
      gridBtns.push(b);
    }
  })();

  function fraction(fn, cx0, cy0, cw){
    var sub = 4, hit = 0;
    for (var i = 0; i < sub; i++){
      for (var j = 0; j < sub; j++){
        var px = cx0 + (i + 0.5) / sub * cw;
        var py = cy0 + (j + 0.5) / sub * cw;
        if (fn(px, py)) hit++;
      }
    }
    return hit / (sub * sub);
  }

  function drawGrid(svg, fn, n){
    var cell = 2 / n, s = '';
    for (var r = 0; r < n; r++){
      for (var c = 0; c < n; c++){
        var x0 = -1 + c * cell, y1 = 1 - r * cell, y0 = y1 - cell;
        var f = fraction(fn, x0, y0, cell);
        var px = c * (100 / n), py = r * (100 / n), sz = 100 / n;
        var g = Math.round(255 - f * 235);
        s += '<rect x="' + px.toFixed(2) + '" y="' + py.toFixed(2) + '" width="' + (sz + 0.4).toFixed(2) +
          '" height="' + (sz + 0.4).toFixed(2) + '" fill="rgb(' + g + ',' + g + ',' + g + ')"/>';
      }
    }
    svg.innerHTML = s;
  }

  function coverSvg(svg, label){
    svg.innerHTML = '<defs><pattern id="hatchB23" width="9" height="9" patternUnits="userSpaceOnUse"' +
      ' patternTransform="rotate(45)"><rect width="9" height="9" fill="#EDE7FF"/>' +
      '<path d="M0 0 V9" stroke="#141414" stroke-width="1.6"/></pattern></defs>' +
      '<rect x="0" y="0" width="100" height="100" fill="url(#hatchB23)" stroke="#141414" stroke-width="2"/>' +
      '<text x="50" y="53" text-anchor="middle" font-size="9" font-weight="900" fill="#141414">' + label + '</text>';
  }

  function emptySvg(svg, label){
    svg.innerHTML = '<rect x="0" y="0" width="100" height="100" fill="#FFFFFF" stroke="#141414" stroke-width="2"/>' +
      '<text x="50" y="53" text-anchor="middle" font-size="8" font-weight="800" fill="#5A5A5A">' + label + '</text>';
  }

  function clearFlash(){
    if (flashTimer !== null){ clearTimeout(flashTimer); flashTimer = null; }
  }

  function endFlash(){
    clearFlash();
    flashing = false;
    render();
  }

  function startFlash(){
    clearFlash();
    flashing = true;
    flashTimer = setTimeout(endFlash, FLASH_MS);
    render();
  }

  function newShape(){
    var i;
    do { i = Math.floor(Math.random() * SHAPES.length); } while (i === prevShapeIdx);
    prevShapeIdx = i;
    shapeIdx = i;
  }

  function newRound(){
    newShape();
    gridN = null; confirmed = false;
    startFlash();
  }

  function sameRound(){
    gridN = null; confirmed = false;
    startFlash();
  }

  function chooseGrid(n){
    if (flashing || confirmed) return;
    gridN = n;
    render();
  }

  function confirm(){
    if (flashing || confirmed || gridN === null) return;
    confirmed = true;
    render();
  }

  function render(){
    var fn = SHAPES[shapeIdx];
    if (flashing){
      drawGrid(origSvg, fn, 28);
      emptySvg(recSvg, '가려져 있어요');
      status.textContent = '보여 주는 중이에요';
    } else if (!confirmed){
      coverSvg(origSvg, '가려짐');
      if (gridN === null){ emptySvg(recSvg, '칸 수를 골라요'); }
      else { drawGrid(recSvg, fn, gridN); }
      status.textContent = '가려졌어요';
    } else {
      drawGrid(origSvg, fn, 28);
      drawGrid(recSvg, fn, gridN);
      status.textContent = '나란히 놓았어요';
    }

    for (var i = 0; i < gridBtns.length; i++){
      gridBtns[i].disabled = flashing || confirmed;
      gridBtns[i].classList.toggle('on', gridN === GRIDS[i]);
    }
    okBtn.disabled = flashing || confirmed || gridN === null;

    if (confirmed){
      say.textContent = gridN + '칸으로 알아봤어요 · 숫자 ' + (gridN * gridN) + '개';
      say.className = 'say';
    } else if (flashing){
      say.textContent = '눈에 담아 둬요';
      say.className = 'say dim';
    } else if (gridN === null){
      say.textContent = '칸 수를 눌러 봐요';
      say.className = 'say dim';
    } else {
      say.textContent = '이제 알겠으면 눌러요';
      say.className = 'say dim';
    }
  }

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      clearFlash();
    } else if (flashing && flashTimer === null){
      endFlash();
    }
  });

  okBtn.addEventListener('click', confirm);
  $('again').addEventListener('click', sameRound);
  $('next').addEventListener('click', newRound);

  newRound();
})();
</script>
</body>
</html>
