<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두 절차 견주기 — 에듀다움</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#F59E0B; --point-soft:#FFF0C7; --muted:#6B6B6B;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;
    font-size:14px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;border:2.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5vw,27px);font-weight:900;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:10px;margin-top:9px}
  h2{font-size:13px;font-weight:900;margin-bottom:6px;color:var(--muted)}

  .cond{display:inline-block;padding:6px 14px;border:2.5px solid var(--ink);border-radius:999px;
    background:var(--point-soft);font-weight:800;font-size:15px}

  .deck{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:9px}
  @media(max-width:420px){ .deck{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .slot{display:block;height:20px;line-height:20px}
  .mk{display:inline-block;min-width:20px;padding:0 6px;background:var(--ink);color:var(--paper);
    border-radius:999px;font-weight:900;font-size:12px;text-align:center}
  .mk.b{background:var(--point);color:var(--ink);border:2px solid var(--ink)}
  .card{width:100%;min-height:42px;display:flex;align-items:center;justify-content:center;
    border:2.5px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);
    font-weight:900;font-size:16px}

  .how{margin-top:9px;display:grid;gap:5px}
  .how p{margin:0;font-weight:700;font-size:14px}
  .who{display:inline-block;min-width:20px;margin-right:8px;padding:1px 8px;
    border:2.5px solid var(--ink);border-radius:999px;background:var(--point-soft);
    font-weight:900;text-align:center;font-size:12px}

  .guess{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:46px;padding:8px 12px;box-shadow:var(--hard-sm);flex:1 1 76px;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point)}
  .btn[aria-pressed="true"]{background:var(--point-soft);border-width:3.5px}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none}

  .counts{display:flex;gap:8px;margin-top:9px}
  .cbox{flex:1;background:var(--paper);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    padding:7px 8px;text-align:center}
  .cbox span{display:block;font-size:12px;font-weight:900;color:var(--muted)}
  .cbox b{font-family:'Courier New',monospace;font-size:clamp(20px,6vw,26px);font-weight:900;color:var(--point)}

  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

  .say{margin-top:8px;font-size:13.5px;font-weight:900}
  .say.dim{color:var(--muted);font-weight:700}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">← 전체 목록</a>
    <span class="tag">11~12</span>
  </nav>

  <header>
    <h1>두 절차 견주기</h1>
    <p class="lead">어느 쪽이 적게 볼까</p>
  </header>

  <section aria-labelledby="h-d">
    <h2 id="h-d">이번 판</h2>
    <p class="cond" id="cond">찾을 숫자 6</p>
    <div class="deck" id="deck"></div>
    <div class="how">
      <p><span class="who">가</span>끝까지 다 본다</p>
      <p><span class="who">나</span>처음 찾으면 멈춘다</p>
    </div>
  </section>

  <section aria-labelledby="h-g">
    <h2 id="h-g">어느 쪽이 적게 볼까요</h2>
    <div class="guess" id="guess">
      <button class="btn" type="button" data-g="가">가</button>
      <button class="btn" type="button" data-g="나">나</button>
      <button class="btn" type="button" data-g="같다">같다</button>
    </div>
    <div class="counts">
      <div class="cbox"><span>가 본 장수</span><b id="cA">0</b></div>
      <div class="cbox"><span>나 본 장수</span><b id="cB">0</b></div>
    </div>
    <p class="say dim" id="say">셋 가운데 하나를 짚어요</p>
    <div class="acts">
      <button class="btn main" id="run" type="button" disabled>돌려 보기</button>
      <button class="btn" id="replay" type="button" disabled>다시 보기</button>
      <button class="btn" id="next" type="button">다음 판</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var STEP = 320;
  var $ = function (id) { return document.getElementById(id); };

  var deckEl = $('deck');
  var condEl = $('cond');
  var guessWrap = $('guess');
  var guessBtns = Array.prototype.slice.call(guessWrap.querySelectorAll('.btn'));
  var runBtn = $('run');
  var replayBtn = $('replay');
  var nextBtn = $('next');
  var sayEl = $('say');
  var cAEl = $('cA');
  var cBEl = $('cB');

  var mkA = document.createElement('span'); mkA.className = 'mk'; mkA.textContent = '가';
  var mkB = document.createElement('span'); mkB.className = 'mk b'; mkB.textContent = '나';

  var calm = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
    : false;

  var deck = [];
  var aStop = 7;
  var bStop = 7;
  var guess = null;
  var ran = false;
  var timer = null;
  var cells = [];
  var lastKey = '';

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function draw() {
    var pool = shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]);
    var newDeck = pool.slice(0, 8);
    var leftover = pool[8];
    var r = Math.random();
    var pos, target;
    if (r < 0.25) {
      pos = -1; target = leftover;
    } else if (r < 0.35) {
      pos = 7; target = newDeck[7];
    } else {
      pos = Math.floor(Math.random() * 7);
      target = newDeck[pos];
    }
    return { deck: newDeck, pos: pos, target: target, key: newDeck.join(',') + '|' + target + '|' + pos };
  }

  function halt() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }

  function newRound() {
    halt();
    var r = draw();
    var tries = 0;
    while (r.key === lastKey && tries < 8) { r = draw(); tries += 1; }
    lastKey = r.key;

    deck = r.deck;
    aStop = 7;
    bStop = r.pos === -1 ? 7 : r.pos;
    guess = null;
    ran = false;

    condEl.textContent = '찾을 숫자 ' + r.target;

    deckEl.innerHTML = '';
    cells = [];
    for (var i = 0; i < 8; i += 1) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var slotA = document.createElement('span'); slotA.className = 'slot slotA';
      var card = document.createElement('div'); card.className = 'card'; card.textContent = String(deck[i]);
      var slotB = document.createElement('span'); slotB.className = 'slot slotB';
      cell.appendChild(slotA); cell.appendChild(card); cell.appendChild(slotB);
      deckEl.appendChild(cell);
      cells.push(cell);
    }
    cells[0].querySelector('.slotA').appendChild(mkA);
    cells[0].querySelector('.slotB').appendChild(mkB);

    cAEl.textContent = '0';
    cBEl.textContent = '0';

    for (var k = 0; k < guessBtns.length; k += 1) {
      guessBtns[k].disabled = false;
      guessBtns[k].setAttribute('aria-pressed', 'false');
    }
    runBtn.disabled = true;
    replayBtn.disabled = true;
    sayEl.textContent = '셋 가운데 하나를 짚어요';
    sayEl.className = 'say dim';
  }

  function pickGuess(g) {
    if (guess !== null || ran) { return; }
    guess = g;
    for (var i = 0; i < guessBtns.length; i += 1) {
      var b = guessBtns[i];
      b.disabled = true;
      b.setAttribute('aria-pressed', b.getAttribute('data-g') === g ? 'true' : 'false');
    }
    runBtn.disabled = false;
    sayEl.textContent = '돌려 보기를 눌러요';
    sayEl.className = 'say dim';
  }

  function putA(i) { cells[i].querySelector('.slotA').appendChild(mkA); }
  function putB(i) { cells[i].querySelector('.slotB').appendChild(mkB); }

  function finish() {
    var aCount = aStop + 1;
    var bCount = bStop + 1;
    cAEl.textContent = String(aCount);
    cBEl.textContent = String(bCount);

    var answer = bCount < aCount ? '나' : '같다';
    if (guess === answer) {
      sayEl.textContent = '짚은 대로 갈렸어요';
    } else {
      sayEl.textContent = '가 ' + aCount + '장 · 나 ' + bCount + '장이었어요';
    }
    sayEl.className = 'say';
    ran = true;
    runBtn.disabled = true;
    replayBtn.disabled = false;
  }

  function play(showFromStart) {
    halt();
    if (showFromStart) {
      cells[0].querySelector('.slotA').appendChild(mkA);
      cells[0].querySelector('.slotB').appendChild(mkB);
    }
    if (calm) {
      putA(aStop); putB(bStop);
      if (showFromStart) { finish(); }
      return;
    }
    var k = 0;
    timer = setInterval(function () {
      k += 1;
      if (k <= aStop) { putA(k); }
      if (k <= bStop) { putB(k); }
      if (k >= aStop && k >= bStop) {
        halt();
        if (showFromStart) { finish(); }
      }
    }, STEP);
  }

  function run() {
    if (timer !== null || guess === null || ran) { return; }
    runBtn.disabled = true;
    play(true);
  }

  function replay() {
    if (timer !== null || !ran) { return; }
    play(false);
  }

  guessWrap.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('.btn') : null;
    if (!btn) { return; }
    pickGuess(btn.getAttribute('data-g'));
  });

  runBtn.addEventListener('click', run);
  replayBtn.addEventListener('click', replay);
  nextBtn.addEventListener('click', newRound);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { halt(); } });
  window.addEventListener('pagehide', halt);

  newRound();
})();
</script>
</body>
</html>
