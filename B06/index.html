<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>두 절차 견주기</title>
<style>
:root{
  --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
  --point:#F59E0B; --point-soft:#FFF0C7;
  --muted:#6B6B6B;
  --r:18px; --r-sm:12px;
  --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--ink) .5px,transparent .5px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:17px; line-height:1.45; font-weight:600;
  -webkit-text-size-adjust:100%;
}
main{max-width:900px;margin:0 auto;padding:16px 14px 28px}
h1{font-size:clamp(24px,5.6vw,34px);font-weight:900;letter-spacing:-.035em;margin:0 0 8px}

.cond{
  display:inline-block; margin:0 0 12px; padding:6px 14px;
  border:2.5px solid var(--ink); border-radius:999px;
  background:var(--point-soft); font-weight:800;
}
.face{
  background:var(--surface); border:3px solid var(--ink);
  border-radius:var(--r); box-shadow:var(--hard); padding:12px;
}
.deck{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
@media (max-width:719px){ .deck{grid-template-columns:repeat(4,minmax(0,1fr))} }
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.slot{display:block;height:26px;line-height:26px}
.mk{
  display:inline-block; min-width:26px; padding:0 8px;
  background:var(--ink); color:var(--paper); border-radius:999px;
  font-weight:900; font-size:15px; text-align:center;
}
.mk.b{background:var(--point);color:var(--ink);border:2px solid var(--ink)}
.card{
  width:100%; min-height:74px; padding:6px 2px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:3px solid var(--ink); border-radius:var(--r-sm);
  background:var(--paper); box-shadow:var(--hard-sm);
  font:inherit; color:var(--ink); cursor:pointer;
  transition:transform .1s ease, box-shadow .1s ease;
}
.card:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.card:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.card:disabled{cursor:not-allowed}
.card em{font-style:normal;font-weight:900;font-size:18px;line-height:1}
.ic{display:block;width:34px;height:30px}
.ic .cir,.ic .tri{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.ic .tri{display:none}
.card[aria-pressed="true"]{background:var(--point-soft)}
.card[aria-pressed="true"] .cir{display:none}
.card[aria-pressed="true"] .tri{display:block}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
button.act{
  font:inherit; font-weight:800; color:var(--ink); cursor:pointer;
  min-height:48px; min-width:96px; padding:10px 18px;
  border:3px solid var(--ink); border-radius:999px;
  background:var(--surface); box-shadow:var(--hard-sm);
  transition:transform .1s ease, box-shadow .1s ease;
}
button.act.main{background:var(--point)}
button.act:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button.act:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:disabled{opacity:.45;box-shadow:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.how{margin:14px 0 0;display:grid;gap:6px}
.how p{margin:0;font-weight:700}
.tag{
  display:inline-block; min-width:26px; margin-right:8px; padding:1px 9px;
  border:2.5px solid var(--ink); border-radius:999px; background:var(--point-soft);
  font-weight:900; text-align:center;
}
table{
  width:100%; margin:14px 0 0; border-collapse:collapse;
  border:3px solid var(--ink); border-radius:var(--r-sm); overflow:hidden;
  background:var(--surface);
}
th,td{border:2px solid var(--ink);padding:8px 6px;text-align:center;font-weight:800}
thead th{background:var(--ink);color:var(--paper)}
tbody th{background:var(--point-soft);width:56px}
td:empty::before{content:"—";color:var(--muted)}
.ask{
  margin:14px 0 0; padding:10px 14px; font-weight:800;
  border:2.5px dashed var(--ink); border-radius:var(--r-sm); background:var(--point-soft);
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<main>
  <h1>두 절차 견주기</h1>
  <p class="cond">세모이고 5보다 큰 카드</p>

  <section>
    <div class="face">
      <div class="deck" id="deck">
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="0" data-n="3" aria-pressed="false" aria-label="1번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>3</em></button><span class="slot slotB"></span></div>
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="1" data-n="7" aria-pressed="false" aria-label="2번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>7</em></button><span class="slot slotB"></span></div>
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="2" data-n="5" aria-pressed="false" aria-label="3번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>5</em></button><span class="slot slotB"></span></div>
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="3" data-n="8" aria-pressed="false" aria-label="4번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>8</em></button><span class="slot slotB"></span></div>
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="4" data-n="2" aria-pressed="false" aria-label="5번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>2</em></button><span class="slot slotB"></span></div>
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="5" data-n="9" aria-pressed="false" aria-label="6번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>9</em></button><span class="slot slotB"></span></div>
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="6" data-n="6" aria-pressed="false" aria-label="7번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>6</em></button><span class="slot slotB"></span></div>
        <div class="cell"><span class="slot slotA"></span><button class="card" type="button" data-i="7" data-n="4" aria-pressed="false" aria-label="8번 카드"><svg class="ic" viewBox="0 0 40 36" aria-hidden="true"><circle class="cir" cx="20" cy="18" r="13"/><polygon class="tri" points="20,4 34,30 6,30"/></svg><em>4</em></button><span class="slot slotB"></span></div>
      </div>

      <div class="row">
        <button id="run" class="act main" type="button">실행</button>
        <button id="reset" class="act" type="button">다시 하기</button>
      </div>
    </div>

    <div class="how">
      <p><span class="tag">가</span>끝까지 다 본다</p>
      <p><span class="tag">나</span>처음 찾으면 멈춘다</p>
    </div>

    <table>
      <thead><tr><th scope="col">절차</th><th scope="col">확인</th><th scope="col">답</th><th scope="col">빠뜨림</th></tr></thead>
      <tbody>
        <tr><th scope="row">가</th><td id="a1"></td><td id="a2"></td><td id="a3"></td></tr>
        <tr><th scope="row">나</th><td id="b1"></td><td id="b2"></td><td id="b3"></td></tr>
      </tbody>
    </table>

    <p class="ask">어느 수가 갈렸나요?</p>
  </section>

  <span id="mkA" class="mk">가</span>
  <span id="mkB" class="mk b">나</span>
</main>

<script>
(function () {
  'use strict';

  var STEP = 320;

  var deck = document.getElementById('deck');
  var cards = Array.prototype.slice.call(deck.querySelectorAll('.card'));
  var cells = Array.prototype.slice.call(deck.querySelectorAll('.cell'));
  var runBtn = document.getElementById('run');
  var resetBtn = document.getElementById('reset');
  var mkA = document.getElementById('mkA');
  var mkB = document.getElementById('mkB');
  var out = {
    a: [document.getElementById('a1'), document.getElementById('a2'), document.getElementById('a3')],
    b: [document.getElementById('b1'), document.getElementById('b2'), document.getElementById('b3')]
  };

  var nums = cards.map(function (c) { return parseInt(c.getAttribute('data-n'), 10); });
  var tri = cards.map(function () { return false; });
  var timer = null;

  var calm = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
    : false;

  function hits() {
    var list = [];
    for (var i = 0; i < nums.length; i += 1) {
      if (tri[i] && nums[i] > 5) { list.push(i); }
    }
    return list;
  }

  function putA(i) { cells[i].querySelector('.slotA').appendChild(mkA); }
  function putB(i) { cells[i].querySelector('.slotB').appendChild(mkB); }

  function blank() {
    for (var k = 0; k < 3; k += 1) {
      out.a[k].textContent = '';
      out.b[k].textContent = '';
    }
  }

  function fill() {
    var m = hits();
    var last = m.length ? m[0] : nums.length - 1;
    out.a[0].textContent = String(nums.length);
    out.a[1].textContent = String(m.length);
    out.a[2].textContent = '0';
    out.b[0].textContent = String(last + 1);
    out.b[1].textContent = m.length ? '1' : '0';
    out.b[2].textContent = m.length ? String(m.length - 1) : '0';
  }

  function lock(on) {
    runBtn.disabled = on;
    resetBtn.disabled = on;
    for (var i = 0; i < cards.length; i += 1) { cards[i].disabled = on; }
  }

  function halt() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }

  function run() {
    if (timer !== null) { return; }
    var m = hits();
    var aEnd = nums.length - 1;
    var bEnd = m.length ? m[0] : nums.length - 1;
    blank();

    if (calm) {
      putA(aEnd);
      putB(bEnd);
      fill();
      return;
    }

    var k = 0;
    putA(0);
    putB(0);
    lock(true);
    timer = setInterval(function () {
      k += 1;
      if (k <= aEnd) { putA(k); }
      if (k <= bEnd) { putB(k); }
      if (k >= aEnd && k >= bEnd) {
        halt();
        lock(false);
        fill();
      }
    }, STEP);
  }

  function reset() {
    halt();
    lock(false);
    for (var i = 0; i < cards.length; i += 1) {
      tri[i] = false;
      cards[i].setAttribute('aria-pressed', 'false');
    }
    blank();
    putA(0);
    putB(0);
  }

  deck.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('.card') : null;
    if (!btn || timer !== null) { return; }
    var i = parseInt(btn.getAttribute('data-i'), 10);
    tri[i] = !tri[i];
    btn.setAttribute('aria-pressed', tri[i] ? 'true' : 'false');
    blank();
  });

  runBtn.addEventListener('click', run);
  resetBtn.addEventListener('click', reset);
  window.addEventListener('pagehide', halt);

  reset();
})();
</script>
</body>
</html>
