<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>두 절차로 카드 찾기 견주기 — 에듀다움</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:10px;margin-top:9px}
  h2{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}

  .cond{display:inline-block;padding:6px 14px;border:1px solid var(--line);border-radius:999px;
    background:var(--point-soft);font-weight:600;font-size:15px}

  .deck{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;margin-top:9px}
  @media(max-width:420px){ .deck{grid-template-columns:repeat(4,minmax(0,1fr))} }
  .cell{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
  .slot{display:block;height:20px;line-height:20px}
  .mk{display:inline-block;min-width:20px;padding:0 6px;background:var(--ink);color:var(--paper);
    border-radius:999px;font-weight:700;font-size:12px;text-align:center}
  .mk.b{background:var(--point);color:var(--ink);border:1px solid var(--line)}
  .card{width:100%;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
    font-weight:700;font-size:16px;line-height:1.1;transition:transform .2s,background-color .2s}
  .card svg{width:24px;height:24px;display:block}
  .card.now{transform:translateY(-4px);background:var(--sun-l)}
  .cell.entry{animation:deal .35s ease-out both}
  @keyframes deal{from{opacity:0;transform:translateY(-10px) rotate(-4deg)}to{opacity:1;transform:none}}

  .how{margin-top:9px;display:grid;gap:5px}
  .how p{margin:0;font-weight:700;font-size:14px}
  .who{display:inline-block;min-width:20px;margin-right:8px;padding:1px 8px;
    border:1px solid var(--line);border-radius:999px;background:var(--point-soft);
    font-weight:700;text-align:center;font-size:12px}

  .guess{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:46px;padding:8px 12px;box-shadow:var(--hard-sm);flex:1 1 76px;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point)}
  .btn[aria-pressed="true"]{background:var(--point-soft);border-width:3.5px}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none}

  .counts{display:flex;gap:8px;margin-top:9px}
  .cbox{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:7px 8px;text-align:center}
  .cbox span{display:block;font-size:12px;font-weight:700;color:var(--muted)}
  .cbox b{font-family:'Courier New',monospace;font-size:clamp(20px,6vw,26px);font-weight:700;color:var(--point)}

  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

  .card.hit{border-width:4px;border-color:var(--ink)}
  .card.miss{border-style:dashed;border-width:3.5px;background:var(--point-soft)}
  .gone{display:inline-block;font-size:12px;font-weight:700;color:var(--ink)}
  .say{margin-top:8px;font-size:13.5px;font-weight:700}
  .say.dim{color:var(--muted);font-weight:700}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B06/">과정안</a></span>
    <span class="tag">11~12</span>
  </nav>

  <header>
    <h1>두 절차로 카드 찾기 견주기</h1>
    <p class="lead">절차 나는 몇 장을 빠뜨릴까</p>
  </header>

  <section aria-labelledby="h-d">
    <h2 id="h-d">이번 묶음</h2>
    <p class="cond">△이고 5보다 큰 카드 모두 찾기</p>
    <div class="deck" id="deck"></div>
    <div class="how">
      <p><span class="who">가</span>끝까지 다 본다</p>
      <p><span class="who">나</span>처음 찾으면 멈춘다</p>
    </div>
  </section>

  <section aria-labelledby="h-g">
    <h2 id="h-g">나는 몇 장을 빠뜨릴까요</h2>
    <div class="guess" id="guess">
      <button class="btn" type="button" data-g="0">0장</button>
      <button class="btn" type="button" data-g="1">1장</button>
      <button class="btn" type="button" data-g="2">2장</button>
    </div>
    <div class="counts">
      <div class="cbox"><span>가 확인한 수</span><b id="cA">0</b></div>
      <div class="cbox"><span>나 확인한 수</span><b id="cB">0</b></div>
      <div class="cbox"><span>나 빠뜨린 수</span><b id="cM">0</b></div>
    </div>
    <p class="say dim" id="say">셋 가운데 하나를 짚어요</p>
    <div class="acts">
      <button class="btn main" id="run" type="button" disabled>돌려 보기</button>
      <button class="btn" id="replay" type="button" disabled>다시 보기</button>
      <button class="btn" id="next" type="button">다음 판</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var STEP = 320;
  var $ = function (id) { return document.getElementById(id); };

  var deckEl = $('deck');
  var guessWrap = $('guess');
  var guessBtns = Array.prototype.slice.call(guessWrap.querySelectorAll('.btn'));
  var runBtn = $('run');
  var replayBtn = $('replay');
  var nextBtn = $('next');
  var sayEl = $('say');
  var cAEl = $('cA');
  var cBEl = $('cB');
  var cMEl = $('cM');

  var mkA = document.createElement('span'); mkA.className = 'mk'; mkA.textContent = '가';
  var mkB = document.createElement('span'); mkB.className = 'mk b'; mkB.textContent = '나';

  var calm = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
    : false;

  var deck = [];          // { tri: 세모인가, n: 숫자 }
  var aStop = 7;
  var bStop = 7;
  var miss = 0;           // 절차 나가 빠뜨린 장수
  var guess = null;
  var ran = false;
  var timer = null;
  var cells = [];
  var lastKey = '';
  var stamped = false;

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function fits(c) { return c.tri && c.n > 5; }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i -= 1) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // 조건에 맞는 카드 수를 먼저 뽑는다. 빠뜨림 0·1·2가 셋에 하나쯤씩 나온다.
  function draw() {
    var r = Math.random();
    var m = r < 0.15 ? 0 : (r < 0.35 ? 1 : (r < 0.68 ? 2 : 3));
    var d = [], i;
    for (i = 0; i < m; i += 1) { d.push({ tri: true, n: rnd(6, 9) }); }
    if (Math.random() < 0.6) { d.push({ tri: true, n: 5 }); }   // 숫자 5 카드
    while (d.length < 8) {
      if (Math.random() < 0.5) { d.push({ tri: true, n: rnd(1, 4) }); }
      else { d.push({ tri: false, n: rnd(1, 9) }); }
    }
    d = shuffle(d);
    var key = d.map(function (c) { return (c.tri ? 'T' : 'O') + c.n; }).join(',');
    return { deck: d, key: key };
  }

  function halt() {
    if (timer !== null) { clearInterval(timer); timer = null; }
  }

  function newRound() {
    halt();
    var r = draw();
    var tries = 0;
    while (r.key === lastKey && tries < 8) { r = draw(); tries += 1; }
    lastKey = r.key;

    deck = r.deck;
    aStop = 7;
    bStop = 7;
    var found = 0, i;
    for (i = 0; i < 8; i += 1) {
      if (fits(deck[i])) { if (found === 0) { bStop = i; } found += 1; }
    }
    miss = found > 0 ? found - 1 : 0;
    guess = null;
    ran = false;

    deckEl.innerHTML = '';
    cells = [];
    for (i = 0; i < 8; i += 1) {
      var cell = document.createElement('div');
      cell.className = 'cell';
      var slotA = document.createElement('span'); slotA.className = 'slot slotA';
      var card = document.createElement('div'); card.className = 'card';
      card.innerHTML = (deck[i].tri
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L22 21 H2 Z" fill="#ffc845" stroke="#33302b" stroke-width="1.8" stroke-linejoin="round"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#e6f3fc" stroke="#33302b" stroke-width="1.8"/></svg>')
        + '<span aria-hidden="true">' + deck[i].n + '</span>';
      cell.className = 'cell entry';
      cell.style.animationDelay = (i * 40) + 'ms';
      card.setAttribute('aria-label', (deck[i].tri ? '세모 ' : '동그라미 ') + deck[i].n);
      var slotB = document.createElement('span'); slotB.className = 'slot slotB';
      cell.appendChild(slotA); cell.appendChild(card); cell.appendChild(slotB);
      deckEl.appendChild(cell);
      cells.push(cell);
    }
    cells[0].querySelector('.slotA').appendChild(mkA);
    cells[0].querySelector('.slotB').appendChild(mkB);

    cAEl.textContent = '0';
    cBEl.textContent = '0';
    cMEl.textContent = '0';

    for (var k = 0; k < guessBtns.length; k += 1) {
      guessBtns[k].disabled = false;
      guessBtns[k].setAttribute('aria-pressed', 'false');
    }
    runBtn.disabled = true;
    replayBtn.disabled = true;
    sayEl.textContent = '셋 가운데 하나를 짚어요';
    sayEl.className = 'say dim';
    if (window.Fun) { Fun.say('새 묶음이에요. 나는 첫 카드를 찾으면 멈춰요. 몇 장을 빠뜨릴지 먼저 예측해 봐요.'); }
  }

  function pickGuess(g) {
    if (guess !== null || ran) { return; }
    guess = parseInt(g, 10);
    for (var i = 0; i < guessBtns.length; i += 1) {
      var b = guessBtns[i];
      b.disabled = true;
      b.setAttribute('aria-pressed', b.getAttribute('data-g') === g ? 'true' : 'false');
    }
    runBtn.disabled = false;
    if (window.Fun) { Fun.say(guess + '장으로 예측했어요. 이제 돌려서 확인해 봐요.'); }
    sayEl.textContent = '돌려 보기를 눌러요';
    sayEl.className = 'say dim';
  }

  function putA(i) { cells[i].querySelector('.slotA').appendChild(mkA); }
  function putB(i) {
    cells[i].querySelector('.slotB').appendChild(mkB);
    for (var j = 0; j < cells.length; j += 1) { cells[j].querySelector('.card').classList.toggle('now', j === i && !calm); }
  }

  // 조건에 맞는 카드는 테두리를 굵게, 나가 지나치지 못한 카드는 점선으로 드러낸다.
  function markCards() {
    for (var i = 0; i < 8; i += 1) {
      if (!fits(deck[i])) { continue; }
      var card = cells[i].querySelector('.card');
      card.classList.add('hit');
      if (i > bStop) {
        card.classList.add('miss');
        var g = document.createElement('span');
        g.className = 'gone'; g.textContent = '빠짐';
        cells[i].querySelector('.slotB').appendChild(g);
      }
    }
  }

  function finish() {
    for (var j = 0; j < cells.length; j += 1) { cells[j].querySelector('.card').classList.remove('now'); }
    cAEl.textContent = String(aStop + 1);
    cBEl.textContent = String(bStop + 1);
    cMEl.textContent = String(miss);
    markCards();

    if (guess === miss) {
      sayEl.textContent = '짚은 만큼 빠뜨렸어요';
    } else {
      sayEl.textContent = '나는 ' + miss + '장 빠뜨렸어요 · ' + Math.abs(guess - miss) + '장 차이';
    }
    sayEl.className = 'say';
    ran = true;
    runBtn.disabled = true;
    replayBtn.disabled = false;
    if (window.Fun) {
      var five = deck.some(function (c) { return c.tri && c.n === 5; });
      var tail = five ? ' △5는 5보다 크지 않아서 답이 아니에요.' : '';
      if (guess === miss) {
        Fun.say('예상한 대로 나왔어요. 가는 ' + (aStop + 1) + '장, 나는 ' + (bStop + 1) + '장 봤어요.' + tail, 'cheer');
        Fun.burst(cMEl);
      } else {
        Fun.say('예상과 다르게 나왔어요. 나가 멈춘 뒤 남은 카드에서 갈렸는지 봐요.' + tail, 'think');
        Fun.shake(cMEl);
      }
      if (!stamped) { stamped = true; Fun.stamp(); }
    }
  }

  function play(showFromStart) {
    halt();
    putA(0); putB(0);
    if (calm) {
      putA(aStop); putB(bStop);
      if (showFromStart) { finish(); }
      return;
    }
    var k = 0;
    timer = setInterval(function () {
      k += 1;
      if (k <= aStop) { putA(k); }
      if (k <= bStop) { putB(k); }
      if (k >= aStop && k >= bStop) {
        halt();
        if (showFromStart) { finish(); }
      }
    }, STEP);
  }

  function run() {
    if (timer !== null || guess === null || ran) { return; }
    runBtn.disabled = true;
    play(true);
  }

  function replay() {
    if (timer !== null || !ran) { return; }
    play(false);
  }

  guessWrap.addEventListener('click', function (ev) {
    var btn = ev.target.closest ? ev.target.closest('.btn') : null;
    if (!btn) { return; }
    pickGuess(btn.getAttribute('data-g'));
  });

  runBtn.addEventListener('click', run);
  replayBtn.addEventListener('click', replay);
  nextBtn.addEventListener('click', newRound);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { halt(); } });
  window.addEventListener('pagehide', halt);

  newRound();
})();
</script>
<script src="../assets/play/fun.js" data-block="B06" data-mission="같은 여덟 장을 두 절차로 훑어요. 나가 몇 장을 빠뜨릴지 먼저 예측하고 확인해요!"></script>
</body>
</html>
