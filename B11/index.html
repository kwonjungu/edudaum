<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>흔들어 목표 수에 딱 멈추기 — 에듀다움</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5vw,28px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}
  .safe{display:inline-flex;margin-top:6px;font-size:12.5px;font-weight:700;
    background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 12px}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:10px;margin-top:9px}
  h2{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}

  /* 목표 */
  .goal{display:flex;align-items:baseline;justify-content:center;gap:8px;
    background:var(--point-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px}
  .goal span{font-size:13px;font-weight:700;color:var(--muted)}
  .goal b{font-family:'Courier New',monospace;font-size:30px;font-weight:700;line-height:1}

  /* 지금 값 + 격자 */
  .stage{display:flex;align-items:center;gap:12px;margin-top:8px}
  .vbox{flex:1;text-align:center}
  .vbox b{font-family:'Courier New',monospace;font-size:clamp(46px,13vw,66px);font-weight:700;
    line-height:1;color:var(--point);display:block}
  .vbox b.pop{animation:pop .13s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  .panel{background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:7px;flex:none}
  #grid{width:96px;height:96px;display:block}
  .dot{fill:#3A3630}
  .panel.hit{animation:hit .55s ease-out}
  @keyframes hit{0%{background:var(--point)}100%{background:var(--ink)}}

  .say{margin-top:8px;font-size:15px;font-weight:700;min-height:1.5em}
  .say.dim{color:var(--muted);font-weight:700;font-size:13.5px}
  .say.over{color:var(--muted)}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:48px;padding:9px 14px;box-shadow:var(--hard-sm);flex:1 1 100px;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point)}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}

  .practice{margin-top:7px;display:inline-flex;font-size:12.5px;font-weight:700;color:var(--ink);
    background:var(--point-soft);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .note{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.btn.main{background:var(--point);border-color:var(--point);color:#fff}
.guess{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:inherit;cursor:pointer;color:var(--ink);font-size:14px;font-weight:700;background:var(--surface);
  border:2px solid var(--line-strong);border-radius:999px;min-height:44px;padding:7px 8px;flex:1 1 0;min-width:96px}
.chip[aria-pressed=true]{background:var(--sun-l);border-color:var(--ink)}
.chip:disabled{opacity:.6;cursor:default}
.track{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;align-items:center;min-height:22px}
.track i{width:16px;height:16px;border-radius:50%;background:var(--soft);border:2px solid var(--line-strong)}
.track i.on{background:var(--mint);border-color:var(--mint-d)}
.track i.goalmark{border-color:var(--ink)}
.track em{font-style:normal;font-weight:700;font-size:13px;color:var(--muted);margin-left:4px}
.btn.main{background:var(--point)}
@media(max-width:400px){.btn{flex:1 1 44%}.goal b{font-size:26px}}
body{overflow-x:hidden}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B11/">과정안</a></span>
    <span class="tag">21~24</span>
  </nav>

  <header>
    <h1>흔들어 목표 수에 딱 멈추기</h1>
    <p class="lead">목표에 딱 맞춰 멈춰요</p>
    <p class="safe">두 손으로 잡고 흔들어요</p>
  </header>

  <section aria-labelledby="h-g">
    <h2 id="h-g">이번 목표</h2>
    <p class="goal"><span>목표</span><b id="goal">12</b></p>
    <p class="note" id="gq" style="margin-top:8px">먼저 예상을 골라요. 흔들기 전에만 바꿀 수 있어요</p>
    <div class="guess" role="group" aria-labelledby="gq">
      <button class="chip" type="button" data-g="exact" aria-pressed="false">딱 맞출 것 같아요</button>
      <button class="chip" type="button" data-g="short" aria-pressed="false">모자랄 것 같아요</button>
      <button class="chip" type="button" data-g="over" aria-pressed="false">넘길 것 같아요</button>
    </div>
    <div class="track" id="track" role="img" aria-label="흔든 횟수와 목표"></div>
    <div class="stage">
      <p class="vbox"><b id="num" aria-live="off">0</b></p>
      <div class="panel" id="panel">
        <svg id="grid" viewBox="0 0 100 100" role="img" aria-label="주머니 값을 점으로 보여 줌"></svg>
      </div>
    </div>
    <p class="say dim" id="say">흔들어서 목표에 멈춰요</p>
    <p class="practice" id="practice" hidden>연습 모드 · 버튼을 눌러 세요</p>
  </section>

  <section aria-labelledby="h-a">
    <h2 id="h-a">손</h2>
    <div class="acts">
      <button class="btn main" id="shake" type="button">흔들기</button>
      <button class="btn" id="stop" type="button">멈추기</button>
      <button class="btn" id="again" type="button">다시 하기</button>
      <button class="btn" id="next" type="button">다음 판</button>
    </div>
    <p class="note">걷지 않고 흔들어도 올라가나요</p>
    <p class="note">마이크로비트로 다시 만들어요</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var CENTER = 12, CAP = 99;

  var goal = 12;
  var count = 0;
  var done = false;      // 멈췄거나 넘겨서 이 판이 끝났나
  var over = false;      // 목표를 넘겼나
  var lastGoal = 0;

  var guess = null;
  var lastShake = 0, prev = null, latest = null, hasNew = false;
  var sawMotion = false, sensorAttached = false, waitTimer = null, permissionAsked = false;

  var cells = [];
  (function build(){
    for (var r = 0; r < 5; r++) for (var c = 0; c < 5; c++){
      var e = document.createElementNS(NS, 'rect');
      e.setAttribute('x', (c * 21.25).toFixed(2)); e.setAttribute('y', (r * 21.25).toFixed(2));
      e.setAttribute('width', 15); e.setAttribute('height', 15); e.setAttribute('rx', 3);
      e.setAttribute('class', 'dot'); e.setAttribute('fill', '#3A3630');
      $('grid').appendChild(e); cells.push(e);
    }
  })();

  function render(){
    $('num').textContent = String(count);
    $('goal').textContent = String(goal);

    // 격자는 21차시 활동2 기능 카드 '목표 알림' 모양이다. 목표 아래는 가운데 한 점, 목표 이상은 전체.
    for (var i = 0; i < 25; i++){
      var on = (count < goal) ? (i === CENTER) : true;
      cells[i].style.fill = on ? '#FF7A00' : '#3A3630';
    }

    var s = $('say');
    if (!done){ s.textContent = '흔들어서 목표에 멈춰요'; s.className = 'say dim'; }
    else if (count === goal){ s.textContent = '목표에 딱 멈췄어요'; s.className = 'say'; }
    else if (over){ s.textContent = (count - goal) + '번 더 흔들렸어요'; s.className = 'say over'; }
    else { s.textContent = (goal - count) + '번 모자라요'; s.className = 'say over'; }

    var tr = $('track'), h = '';
    for (var k = 1; k <= goal; k++) h += '<i class="' + (k <= count ? 'on' : '') + (k === goal ? ' goalmark' : '') + '"></i>';
    if (count > goal) h += '<em>+' + (count - goal) + '</em>';
    tr.innerHTML = h;
    var chips = document.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++){
      chips[c].setAttribute('aria-pressed', chips[c].getAttribute('data-g') === guess ? 'true' : 'false');
      chips[c].disabled = count > 0 || done;
    }
    $('shake').disabled = done;
    $('stop').disabled = done || count === 0;
  }

  function newRound(){
    var g;
    do { g = 8 + Math.floor(Math.random() * 18); } while (g === lastGoal);   // 8~25
    lastGoal = g; goal = g;
    count = 0; done = false; over = false; prev = null; latest = null; hasNew = false; guess = null;
    render();
    if (window.Fun) Fun.say('목표는 ' + goal + '이에요. 흔들기 전에 예상부터 골라요.');
  }

  function bump(){
    if (done) return;
    lastShake = Date.now();
    count = Math.min(count + 1, CAP);
    var n = $('num');
    n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop');
    // 목표를 넘기는 그 순간 판이 끝난다. 되돌릴 수 없다.
    if (count > goal){
      done = true; over = true; render(); finish();
    } else if (count === goal){
      var p = $('panel');
      p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit');
      if (window.Fun) Fun.say('목표 ' + goal + '에 닿았어요. 여기서 멈출 수 있나요? 한 번 더 흔들면 넘어가요.', 'think');
    }
    render();
  }

  // 예상과 결과를 견주어 짚는다. 판정·칭찬 말은 쓰지 않는다.
  function finish(){
    if (!window.Fun) return;
    var res = count === goal ? 'exact' : (over ? 'over' : 'short');
    var nm = { exact:'딱 맞춘 것', short:'모자란 것', over:'넘긴 것' };
    var diff = count === goal ? '목표와 같은 ' + goal + '번이에요.' : (over ? (count - goal) + '번 더 흔들렸어요.' : (goal - count) + '번 모자랐어요.');
    if (guess === null) Fun.say('멈췄어요. ' + diff + ' 다음에는 흔들기 전에 예상을 골라 봐요.', 'think');
    else if (guess === res) { Fun.say('예상은 ' + nm[guess] + '이었고 결과도 같아요. ' + diff + ' 어떻게 멈출 때를 알았나요?', 'cheer'); Fun.burst($('num')); }
    else { Fun.say('예상은 ' + nm[guess] + '이었는데 결과는 ' + nm[res] + '이에요. ' + diff + ' 어디서 갈렸는지 봐요.', 'think'); Fun.shake($('num')); }
    Fun.stamp();
  }
  $('stop').addEventListener('click', function(){
    if (done || count === 0) return;
    done = true; over = false;
    render(); finish();
  });
  var chipEls = document.querySelectorAll('.chip');
  for (var ci = 0; ci < chipEls.length; ci++) chipEls[ci].addEventListener('click', function(){
    if (count > 0 || done) return;
    guess = this.getAttribute('data-g'); render();
  });
  // 같은 목표로 한 번 더. 넘겼을 때 다시 해 볼 길을 열어 둔다.
  $('again').addEventListener('click', function(){
    count = 0; done = false; over = false; prev = null; latest = null; hasNew = false; guess = null;
    render();
    if (window.Fun) Fun.say('목표는 ' + goal + '이에요. 흔들기 전에 예상부터 골라요.');
  });
  $('next').addEventListener('click', newRound);

  /* 흔들림 — 임계 16, 잠금 250ms, 50ms 틱 */
  function onMotion(e){
    var a = e.accelerationIncludingGravity;
    if (!a || a.x === null || a.x === undefined) return;
    latest = { x:a.x, y:a.y, z:a.z }; hasNew = true;
    if (!sawMotion){ sawMotion = true; $('practice').hidden = true; }
  }
  setInterval(function(){
    if (!hasNew) return;
    hasNew = false;
    if (prev){
      var d = Math.abs(latest.x - prev.x) + Math.abs(latest.y - prev.y) + Math.abs(latest.z - prev.z);
      if (d > 16 && Date.now() - lastShake > 250) bump();
    }
    prev = latest;
  }, 50);

  function attachSensor(){
    if (sensorAttached) return;
    window.addEventListener('devicemotion', onMotion);
    sensorAttached = true;
    if (waitTimer) clearTimeout(waitTimer);
    waitTimer = setTimeout(function(){ if (!sawMotion) $('practice').hidden = false; }, 1500);
  }
  function detachSensor(){
    if (!sensorAttached) return;
    window.removeEventListener('devicemotion', onMotion);
    sensorAttached = false;
    if (waitTimer){ clearTimeout(waitTimer); waitTimer = null; }
  }
  $('shake').addEventListener('click', function(){
    // 권한을 묻더라도 이 누름은 먹는다. 첫 누름이 삼켜지면 아이는 고장인 줄 안다.
    // iOS 사파리와 헤드리스 엣지가 requestPermission을 내놓는다.
    if (!sensorAttached && typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function' && !permissionAsked){
      permissionAsked = true;
      DeviceMotionEvent.requestPermission().then(function(r){
        if (r === 'granted') attachSensor();
      }).catch(function(){});
    }
    bump();
  });
  if (typeof DeviceMotionEvent === 'undefined') $('practice').hidden = false;
  else if (typeof DeviceMotionEvent.requestPermission === 'function') $('practice').hidden = false;
  else attachSensor();

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) detachSensor();
    else if (sawMotion) attachSensor();
  });
  window.addEventListener('pagehide', detachSensor);

  newRound();
})();
</script>
<script src="../assets/play/fun.js" data-block="B11" data-mission="태블릿을 흔들어 목표 수에 딱 멈춰 봐요. 흔들기 전에 예상부터!"></script>
</body>
</html>
