<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 카드로 판단 도우미 시험 — 에듀다움 B22</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3;
    --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 44px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--ink);
    border-radius:999px;padding:9px 15px;box-shadow:var(--hard-sm);min-height:44px}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:var(--ink);
    border:1px solid var(--line);border-radius:999px;padding:8px 14px;box-shadow:var(--hard-sm)}
  h1{font-size:clamp(23px,5.2vw,34px);font-weight:700;letter-spacing:-.035em;line-height:1.06}
  .lead{font-size:15px;color:var(--muted);font-weight:700;margin-top:6px}
  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:11px;margin-top:10px}
  h2{font-size:14px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:1px solid var(--ink);background:var(--surface);font-size:14.5px;font-weight:700;
    padding:9px 15px;border-radius:var(--r-sm);min-height:44px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .btn.main{background:var(--point)}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:disabled{opacity:.42;cursor:default;box-shadow:none;transform:none}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

  .big{font-size:clamp(28px,7vw,38px);font-weight:700;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;line-height:1;margin-bottom:8px}
  .big small{font-size:.42em;font-weight:600;color:var(--muted);margin-left:4px}

  .rows{display:grid;gap:6px;margin-top:2px}
  .row{display:flex;align-items:center;gap:9px;border:1px solid var(--line);
    border-radius:var(--r-sm);background:var(--surface);padding:6px 10px;min-height:44px}
  .row.hit{background:var(--point-soft);border-width:3.5px;border-color:var(--point)}
  .row .n{flex:0 0 26px;height:26px;display:grid;place-items:center;font-weight:700;font-size:13px;
    background:var(--ink);color:var(--paper);border-radius:8px}
  .row .cd{flex:0 0 auto;font-size:14px;font-weight:700}
  .row .to{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--muted)}
  .row .mk{flex:0 0 auto;width:18px;height:18px;visibility:hidden;margin-left:auto}
  .row.hit .mk{visibility:visible}

  .opts{display:grid;gap:6px}
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:1px solid var(--ink);background:var(--surface);border-radius:var(--r-sm);
    padding:8px 13px;min-height:44px;box-shadow:var(--hard-sm);font-size:14.5px;font-weight:600;
    transition:transform .1s,box-shadow .1s}
  .opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .opt:disabled{opacity:.55}
  .opt.pick{background:var(--point-soft);border-width:3.5px}
  .opt.hit{background:var(--point);border-width:3.5px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:14px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:4px 11px;background:var(--surface)}
  .chip.on{background:var(--point-soft)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .say{margin-top:9px;font-size:14px;font-weight:700}
  .say.dim{color:var(--muted);font-weight:700}
  .note{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:9px}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .card{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px;margin-bottom:9px;background:var(--paper)}
  .card .cn{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:5px}
  .card .cn.lim{color:var(--point)}
  .vals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .val{text-align:center}
  .val .k{display:block;font-size:12.5px;font-weight:700;color:var(--muted)}
  .val .v{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em;word-break:keep-all;line-height:1.2}
  .warn{margin-top:7px;font-size:14px;font-weight:700;color:var(--point);word-break:keep-all}
  .ord{display:inline-block;font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;margin-bottom:7px;
    border:1px solid var(--line-strong);color:var(--muted)}
  .ord.tf{border-color:var(--point);background:var(--point-soft);color:var(--ink)}
  .row .cd{flex:1 1 auto;min-width:0;word-break:keep-all;line-height:1.3}
  .row .to{flex:0 0 auto;max-width:44%;text-align:right;word-break:keep-all;line-height:1.3}
  .row .yn{flex:0 0 46px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);visibility:hidden}
  .row.asked .yn{visibility:visible}
  .row.no{opacity:.6}
  .row.hit .yn{color:var(--point)}
  .opts{grid-template-columns:repeat(3,minmax(0,1fr))}
  .opt{padding:6px 6px;line-height:1.2}
  .row{min-height:40px;padding:5px 9px}
  .row .cd,.row .to{font-size:13.5px}
  .row.mine{outline:2px dashed var(--ink);outline-offset:1px}
  .row .yn{flex-basis:40px}
  .val .v{font-size:19px}
  .btn.go{background:var(--point);border-color:var(--point);color:#fff}
  .opt{justify-content:center;text-align:center;word-break:keep-all;font-weight:700}
  .opt.hit{color:#fff;border-color:var(--point)}
  .tools .btn{flex:1 1 90px}
  .say.lim{color:var(--point)}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">체험 목록</a><a class="back" href="../lessons/B22/">과정안</a></span>
    <span class="tag">15~16</span>
  </nav>
  <header>
    <h1>날씨 카드로 판단 도우미 시험</h1>
    <p class="lead">규칙표를 위에서부터 따라가 결론을 짚어요</p>
  </header>

  <section aria-labelledby="h-t">
    <h2 id="h-t">이번 카드 · 확인 순서</h2>
    <div class="card">
      <p class="cn" id="cn">날씨 카드</p>
      <div class="vals">
        <p class="val"><span class="k">날씨</span><span class="v" id="vw">-</span></p>
        <p class="val"><span class="k">미세먼지</span><span class="v" id="vd">-</span></p>
        <p class="val"><span class="k">최고기온</span><span class="v" id="vt">-</span></p>
      </div>
      <p class="warn" id="warn" hidden></p>
    </div>
    <p class="ord" id="ord">원래 순서</p>
    <div class="rows" id="rows"></div>
  </section>

  <section aria-labelledby="h-o">
    <h2 id="h-o">결론 고르기</h2>
    <div class="opts" id="opts"></div>
    <div class="tools">
      <button class="btn main" id="check" type="button" disabled>확인하기</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
      <button class="btn" id="next" type="button">다음 카드</button>
    </div>
    <p class="say dim" id="say" role="status" aria-live="polite">결론을 하나 짚어요</p>
    <p class="say lim" id="lim" hidden>규칙표에 없는 날씨예요 · 알맞은 결론일까요?</p>
    <p class="note">실행 결과는 엔트리 도우미로 넣어 적어요</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  // 지도안 활동1 규칙표 그대로. 학생은 조건·결론·순서를 못 고친다.
  var RULES = [
    {cd:'비가 오면',                   ms:'강당 수업',     f:function(c){ return c.w === '비'; }},
    {cd:'미세먼지가 나쁨 또는 매우나쁨이면', ms:'교실 수업',     f:function(c){ return c.d === '나쁨' || c.d === '매우나쁨'; }},
    {cd:'최고기온 33도 이상이면',        ms:'실내 수업',     f:function(c){ return c.t >= 33; }},
    {cd:'28도 이상이면',               ms:'그늘에서 짧게', f:function(c){ return c.t >= 28; }}
  ];
  var ELSE = {cd:'어디에도 해당하지 않으면', ms:'운동장 수업'};
  var OPTS = ['강당 수업', '교실 수업', '실내 수업', '그늘에서 짧게', '운동장 수업'];
  var LINE = ['①번 줄', '②번 줄', '③번 줄', '④번 줄', '마지막 줄'];
  var NUM = ['①', '②', '③', '④', '-'];
  var BASE = [0, 1, 2, 3], TEMP_FIRST = [2, 3, 0, 1];

  // 카드 자료 세트(날씨 카드 A~E, 한계 카드 F~H)와 시험 활동지 3-② 기준 값
  var CARDS = {
    A: {w:'비', d:'보통', t:30}, B: {w:'맑음', d:'나쁨', t:24}, C: {w:'구름많음', d:'좋음', t:34},
    D: {w:'맑음', d:'보통', t:29}, E: {w:'구름조금', d:'좋음', t:21}
  };
  var LIMIT = {
    F: {w:'눈', d:'좋음', t:1, note:'눈이 펑펑 내려요'},
    G: {w:'맑음', d:'좋음', t:18, note:'강풍 · 바람이 초속 14m로 세게 불어요'},
    H: {w:'흐림', d:'보통', t:26, note:'천둥·번개가 쳐요 (비는 아직 안 와요)'}
  };
  var BOUND = [
    {w:'맑음', d:'좋음', t:28}, {w:'맑음', d:'좋음', t:27}, {w:'맑음', d:'좋음', t:33}, {w:'맑음', d:'좋음', t:32},
    {w:'맑음', d:'보통', t:20}, {w:'맑음', d:'나쁨', t:20}, {w:'맑음', d:'매우나쁨', t:20}
  ];
  var WEATHER = ['맑음', '구름조금', '구름많음', '흐림'];
  var DUST = ['좋음', '보통', '나쁨', '매우나쁨'];

  var deck = shuffle(['A', 'B', 'C', 'D', 'E']).map(function(k){ return {name:'날씨 카드 ' + k, c:CARDS[k], order:BASE}; });
  deck.push({name:'날씨 카드 A', c:CARDS.A, order:TEMP_FIRST});

  var cur, picked, confirmed, revealing, asked, prevSig = '', gen = 0;
  var rowsBox = $('rows'), optsBox = $('opts'), say = $('say');
  var checkBtn = $('check'), resetBtn = $('reset'), nextBtn = $('next');
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  function shuffle(a){
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function any(a){ return a[Math.floor(Math.random() * a.length)]; }

  var optBtns = OPTS.map(function(txt, i){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.textContent = txt;
    b.addEventListener('click', function(){ pick(i); });
    optsBox.appendChild(b);
    return b;
  });

  function randomRound(){
    var ord = Math.random() < 1 / 3 ? TEMP_FIRST : BASE;
    var r = Math.random();
    if (r < 0.3) return {name:'기준 값', c:any(BOUND), order:ord};
    if (r < 0.5){ var k = any(['F', 'G', 'H']); return {name:'한계 카드 ' + k, c:LIMIT[k], order:ord, limit:true}; }
    if (r < 0.75){ var a = any(['A', 'B', 'C', 'D', 'E']); return {name:'날씨 카드 ' + a, c:CARDS[a], order:ord}; }
    var rain = Math.random() < 0.3;
    return {name:'새 카드', order:ord,
      c:{w: rain ? '비' : any(WEATHER), d: any(DUST), t: 15 + Math.floor(Math.random() * 23)}};
  }
  function sigOf(r){ return r.name + r.c.w + r.c.d + r.c.t + r.order.join(''); }

  // 지금 순서에서 몇째 줄에 걸리는가(0~3, 어디에도 없으면 4)
  function firePos(r){
    for (var i = 0; i < r.order.length; i++){ if (RULES[r.order[i]].f(r.c)) return i; }
    return 4;
  }
  function lineAt(r, pos){ return pos === 4 ? ELSE : RULES[r.order[pos]]; }
  function posOfOpt(r, k){
    for (var i = 0; i < 5; i++){ if (lineAt(r, i).ms === OPTS[k]) return i; }
    return 4;
  }

  function newRound(){
    gen++;
    var r;
    if (deck.length) r = deck.shift();
    else { do { r = randomRound(); } while (sigOf(r) === prevSig); }
    prevSig = sigOf(r);
    cur = r; picked = null; confirmed = false; revealing = false; asked = -1;
    render();
  }

  function pick(k){
    if (confirmed) return;
    picked = k;
    render();
  }

  function check(){
    if (confirmed || picked === null) return;
    confirmed = true; revealing = true;
    var myGen = gen, hit = firePos(cur), step = reduceMotion ? 0 : 250;
    render();
    (function next(i){
      setTimeout(function(){
        if (myGen !== gen) return;
        asked = i;
        if (i >= hit){ revealing = false; finish(hit); }
        render();
        if (i >= hit){ try { nextBtn.focus({ preventScroll: true }); } catch (e) {} }
        if (i < hit) next(i + 1);
      }, step);
    })(0);
  }

  function finish(hit){
    var mine = posOfOpt(cur, picked);
    if (mine === hit) say.textContent = '짚은 대로 ' + LINE[hit] + '에서 정해졌어요';
    else say.textContent = LINE[hit] + '에서 정해졌어요 · 짚은 결론은 ' + LINE[mine] + '이에요';
    say.className = 'say';
  }

  function render(){
    var c = cur.c;
    $('cn').textContent = cur.name;
    $('cn').className = 'cn' + (cur.limit ? ' lim' : '');
    $('vw').textContent = c.w;
    $('vd').textContent = c.d;
    $('vt').textContent = c.t + '℃';
    var warn = $('warn');
    warn.hidden = !c.note;
    warn.textContent = c.note || '';
    var tf = cur.order === TEMP_FIRST;
    $('ord').textContent = tf ? '기온 규칙을 맨 앞으로 옮긴 순서' : '원래 순서';
    $('ord').className = 'ord' + (tf ? ' tf' : '');

    var hit = firePos(cur);
    var done = confirmed && !revealing;
    var mine = picked === null ? -1 : posOfOpt(cur, picked);
    rowsBox.textContent = '';
    for (var i = 0; i < 5; i++){
      var r = lineAt(cur, i);
      var row = document.createElement('div');
      var cls = 'row';
      if (confirmed && i <= asked){
        cls += ' asked' + (i === hit ? ' hit' : ' no');
      }
      if (done && i === mine && mine !== hit) cls += ' mine';
      row.className = cls;
      var yn = i === hit ? '예' : '아니요';
      row.innerHTML = '<span class="n" aria-hidden="true">' + NUM[i] + '</span>' +
        '<span class="cd">' + r.cd + '</span>' +
        '<span class="to">→ ' + r.ms + '</span>' +
        '<span class="yn">' + yn + '</span>';
      rowsBox.appendChild(row);
    }

    optBtns.forEach(function(b, k){
      b.disabled = confirmed;
      b.classList.toggle('pick', picked === k);
      b.setAttribute('aria-pressed', picked === k ? 'true' : 'false');
      b.classList.toggle('hit', done && lineAt(cur, hit).ms === OPTS[k]);
    });
    $('lim').hidden = !(done && cur.limit);

    checkBtn.disabled = confirmed || picked === null;
    resetBtn.disabled = confirmed || picked === null;
    nextBtn.disabled = revealing;
    nextBtn.classList.toggle('go', done);
    if (!confirmed){
      say.textContent = picked === null ? '결론을 하나 짚어요' : '확인하기를 눌러요';
      say.className = 'say dim';
    }
  }

  checkBtn.addEventListener('click', check);
  resetBtn.addEventListener('click', function(){ if (confirmed) return; picked = null; render(); });
  nextBtn.addEventListener('click', newRound);

  newRound();
})();
</script>
</body>
</html>
