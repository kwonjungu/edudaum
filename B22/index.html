<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>날씨 카드를 넣으면 — 에듀다움 B22</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#F59E0B; --point-soft:#FFF0C7;
    --muted:#5A5A5A;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 44px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:14px;background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:9px 15px;box-shadow:var(--hard-sm);min-height:44px}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:var(--ink);
    border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:var(--hard-sm)}
  h1{font-size:clamp(23px,5.2vw,34px);font-weight:900;letter-spacing:-.035em;line-height:1.06}
  .lead{font-size:15px;color:var(--muted);font-weight:700;margin-top:6px}
  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:11px;margin-top:10px}
  h2{font-size:14px;font-weight:900;letter-spacing:-.02em;margin-bottom:9px;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:2.5px solid var(--ink);background:var(--surface);font-size:14.5px;font-weight:900;
    padding:9px 15px;border-radius:var(--r-sm);min-height:44px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .btn.main{background:var(--point)}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:disabled{opacity:.42;cursor:default;box-shadow:none;transform:none}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

  .big{font-size:clamp(28px,7vw,38px);font-weight:900;letter-spacing:-.04em;
    font-variant-numeric:tabular-nums;line-height:1;margin-bottom:8px}
  .big small{font-size:.42em;font-weight:800;color:var(--muted);margin-left:4px}

  .rows{display:grid;gap:6px;margin-top:2px}
  .row{display:flex;align-items:center;gap:9px;border:2.5px solid var(--ink);
    border-radius:var(--r-sm);background:var(--surface);padding:6px 10px;min-height:44px}
  .row.hit{background:var(--point-soft);border-width:3.5px;border-color:var(--point)}
  .row .n{flex:0 0 26px;height:26px;display:grid;place-items:center;font-weight:900;font-size:13px;
    background:var(--ink);color:var(--paper);border-radius:8px}
  .row .cd{flex:0 0 auto;font-size:14px;font-weight:900}
  .row .to{flex:0 0 auto;font-size:14px;font-weight:700;color:var(--muted)}
  .row .mk{flex:0 0 auto;width:18px;height:18px;visibility:hidden;margin-left:auto}
  .row.hit .mk{visibility:visible}

  .opts{display:grid;gap:6px}
  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    border:2.5px solid var(--ink);background:var(--surface);border-radius:var(--r-sm);
    padding:8px 13px;min-height:44px;box-shadow:var(--hard-sm);font-size:14.5px;font-weight:800;
    transition:transform .1s,box-shadow .1s}
  .opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .opt:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .opt:disabled{opacity:.55}
  .opt.pick{background:var(--point-soft);border-width:3.5px}
  .opt.hit{background:var(--point);border-width:3.5px}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{font-size:14px;font-weight:900;border:2.5px solid var(--ink);border-radius:999px;padding:4px 11px;background:var(--surface)}
  .chip.on{background:var(--point-soft)}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .say{margin-top:9px;font-size:14px;font-weight:900}
  .say.dim{color:var(--muted);font-weight:700}
  .note{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:9px}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">체험 목록</a><a class="back" href="../lessons/B22/">과정안</a></span>
    <span class="tag">15~16</span>
  </nav>
  <header>
    <h1>날씨 카드를 넣으면</h1>
    <p class="lead">이 카드에서 뭐라고 할지 짚어요</p>
  </header>

  <section aria-labelledby="h-t">
    <h2 id="h-t">이번 날씨 카드 · 확인 순서</h2>
    <p class="big"><span id="tv">20</span><small>도</small></p>
    <p class="chips"><span class="chip" id="rain">비 안 옴</span><span class="chip" id="dust">미세먼지 보통</span></p>
    <div class="rows" id="rows"></div>
    <p class="note">엔트리 도우미에도 넣어 봐요</p>
  </section>

  <section aria-labelledby="h-o">
    <h2 id="h-o">결론 고르기</h2>
    <div class="opts" id="opts"></div>
    <div class="tools">
      <button class="btn main" id="check" type="button" disabled>확인하기</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
      <button class="btn" id="next" type="button">다음 판</button>
    </div>
    <p class="say dim" id="say">결론을 하나 짚어요</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var RULES = [
    {cd:'비가 오면',        ms:'강당 수업',     f:function(c){ return c.rain; }},
    {cd:'미세먼지 나쁨이면', ms:'실내 수업',     f:function(c){ return c.dust === 2; }},
    {cd:'33도 이상이면',    ms:'실내 수업',     f:function(c){ return c.t >= 33; }},
    {cd:'28도 이상이면',    ms:'그늘에서 짧게', f:function(c){ return c.t >= 28; }}
  ];
  var OPTS = ['강당 수업', '실내 수업', '그늘에서 짧게', '운동장 수업'];
  var NUM = ['①','②','③','④'];
  var BOUND = [28, 33];
  var DUST = ['좋음', '보통', '나쁨'];
  var BASE = [0, 1, 2, 3], TEMP_FIRST = [2, 3, 0, 1];

  var order, card, picked, confirmed, prevSig;
  var rowsBox = $('rows'), optsBox = $('opts'), say = $('say'), tv = $('tv');
  var checkBtn = $('check'), resetBtn = $('reset');
  var optBtns = [];

  (function build(){
    for (var i = 0; i < OPTS.length; i++){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'opt';
      b.textContent = OPTS[i];
      (function(idx){ b.addEventListener('click', function(){ pick(idx); }); })(i);
      optsBox.appendChild(b);
      optBtns.push(b);
    }
  })();

  function fire(ord, c){
    for (var i = 0; i < ord.length; i++){ if (RULES[ord[i]].f(c)) return ord[i]; }
    return -1;
  }

  function randTemp(){
    if (Math.random() < 0.3) return BOUND[Math.floor(Math.random() * BOUND.length)];
    return 15 + Math.floor(Math.random() * 23);   /* 15~37도 */
  }

  function pickRound(){
    var ord = (Math.random() < 1 / 3) ? TEMP_FIRST : BASE;
    var c;
    if (Math.random() < 0.15){
      c = { t: 30, rain: true, dust: 1 };          /* 비 오는 30도 카드 */
    } else {
      var d = Math.random();
      c = { t: randTemp(), rain: Math.random() < 0.35, dust: d < 0.25 ? 2 : (d < 0.6 ? 1 : 0) };
    }
    return { order: ord, card: c, sig: ord.join('') + '|' + c.t + c.rain + c.dust };
  }

  function newRound(){
    var r;
    do { r = pickRound(); } while (r.sig === prevSig);
    prevSig = r.sig;
    order = r.order; card = r.card;
    picked = null; confirmed = false;
    render();
  }

  function pick(i){
    if (confirmed) return;
    picked = i;
    render();
  }

  function confirm(){
    if (confirmed || picked === null) return;
    confirmed = true;
    render();
  }

  function render(){
    tv.textContent = String(card.t);
    var rainEl = $('rain'), dustEl = $('dust');
    rainEl.textContent = card.rain ? '비 옴' : '비 안 옴';
    rainEl.classList.toggle('on', card.rain);
    dustEl.textContent = '미세먼지 ' + DUST[card.dust];
    dustEl.classList.toggle('on', card.dust === 2);

    var actual = fire(order, card);
    var showHit = confirmed;
    rowsBox.textContent = '';
    for (var i = 0; i <= order.length; i++){
      var last = (i === order.length);
      var r = last ? {cd:'그 밖에', ms:'운동장 수업'} : RULES[order[i]];
      var on = showHit && (last ? actual === -1 : order[i] === actual);
      var row = document.createElement('div');
      row.className = 'row' + (on ? ' hit' : '');
      row.innerHTML = '<span class="n" aria-hidden="true">' + (last ? '-' : NUM[i]) + '</span>' +
        '<span class="cd">' + r.cd + '</span>' +
        '<span class="to">→ ' + r.ms + '</span>' +
        '<svg class="mk" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10.5 8 15.5 17 4.5"' +
        ' fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      rowsBox.appendChild(row);
    }

    for (var k = 0; k < optBtns.length; k++){
      optBtns[k].disabled = confirmed;
      optBtns[k].classList.toggle('pick', !confirmed && picked === k);
      var isActualOpt = (actual === -1) ? (k === 3) : (OPTS[k] === RULES[actual].ms);
      optBtns[k].classList.toggle('hit', confirmed && isActualOpt);
    }

    checkBtn.disabled = confirmed || picked === null;
    resetBtn.disabled = confirmed || picked === null;

    if (confirmed){
      var pickedIsActual = (actual === -1) ? (picked === 3) : (OPTS[picked] === RULES[actual].ms);
      say.textContent = pickedIsActual ? '짚은 대로 나왔어요' : '다른 줄이 먼저 걸렸어요';
      say.className = 'say';
    } else if (picked === null){
      say.textContent = '결론을 하나 짚어요';
      say.className = 'say dim';
    } else {
      say.textContent = '확인하기를 눌러요';
      say.className = 'say dim';
    }
  }

  checkBtn.addEventListener('click', confirm);
  resetBtn.addEventListener('click', function(){
    if (confirmed) return;
    picked = null; render();
  });
  $('next').addEventListener('click', newRound);

  newRound();
})();
</script>
</body>
</html>
