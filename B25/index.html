<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>같은 시험 데이터로 견주기 — 에듀다움 B25</title>
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3;
    --green:#12B76A; --muted:#6A6A6A; --desk:#EFE2CB;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:4px 14px 10px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:600;font-size:13px;background:var(--surface);border:1px solid var(--ink);
    border-radius:999px;padding:7px 14px;box-shadow:var(--hard-sm);min-height:44px;
    transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;
    border:1px solid var(--line);border-radius:999px;padding:5px 14px;box-shadow:var(--hard-sm)}
  h1{font-size:clamp(18px,4.3vw,24px);font-weight:700;letter-spacing:-.035em;line-height:1.02}
  .lead{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:1px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:4px 6px;margin-top:3px}
  h2{font-size:12px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px}
  h2:not(:first-child){margin-top:3px}
  .cond{display:grid;grid-template-columns:48px 1fr auto auto;align-items:center;gap:5px;
    border:1px solid var(--line);border-radius:var(--r-sm);padding:2px 5px;margin-top:2px;
    background:var(--paper)}
  .cond.chg{background:var(--point-soft)}
  .cond.lock{opacity:.55}
  .cl{font-size:12px;font-weight:700;white-space:nowrap}
  .cv{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .keep{font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
  button{font-family:inherit;cursor:pointer;color:var(--ink)}
  .mini{min-height:44px;min-width:56px;font-size:12.5px;font-weight:700;background:var(--surface);
    border:1px solid var(--line);border-radius:10px;box-shadow:var(--hard-sm);padding:4px 7px;
    transition:transform .1s,box-shadow .1s}
  .mini:hover:not(:disabled){transform:translate(-1px,-1px)}
  .mini:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .btn{display:block;width:100%;min-height:44px;margin-top:3px;font-size:14.5px;font-weight:700;
    background:var(--point);color:#fff;border:1px solid var(--ink);border-radius:var(--r-sm);
    box-shadow:var(--hard-sm);padding:7px 10px;transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px)}
  .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .btn.ghost{background:var(--surface);color:var(--ink)}
  button:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  .hint{margin-top:4px;font-size:11.5px;font-weight:600;text-align:center;
    background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 8px}
  .trow{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .tile{min-width:0;border:1px solid var(--line);border-radius:6px;padding:1px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--surface);line-height:1}
  .tile.bgd{background:var(--desk)}
  .tile.now{box-shadow:var(--hard-sm)}
  .hand{width:13px;height:13px;color:var(--ink)}
  .tile.angs .hand{transform:rotate(-24deg)}
  .tl{font-size:8px;font-weight:700;color:var(--muted);text-align:center;line-height:1}
  .marks{display:flex;gap:2px;margin-top:1px}
  .m{width:10px;height:10px;display:block;border:1px solid var(--line);border-radius:3px;background:var(--paper)}
  .m svg{width:100%;height:100%;display:block}
  .m.ok{background:#DFF6E9;border-color:var(--green)}
  .m.no{background:var(--point-soft);border-color:var(--point)}
  .gwrap{margin-top:3px}
  .gstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .g{min-height:44px;font-family:inherit;cursor:pointer;color:var(--ink);font-weight:700;font-size:13px;
    background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--hard-sm)}
  .g[aria-pressed="true"]{background:var(--point);color:#fff}
  .g:disabled{opacity:.5;cursor:default;box-shadow:none}
  .row2{display:flex;gap:8px;margin-top:3px}
  .row2 .btn{margin-top:0;flex:1}
  #hint2:empty{display:none}
  .cap{font-size:10px;font-weight:700;color:var(--muted);margin-top:1px;text-align:center}
  table.sc{width:100%;border-collapse:collapse;margin-top:2px;font-size:12px}
  table.sc th,table.sc td{border:1px solid var(--line);padding:2px;text-align:center;
    font-weight:600;font-variant-numeric:tabular-nums}
  table.sc thead th{background:var(--ink);color:var(--paper);font-size:11px}
  table.sc td.tot{background:var(--point-soft)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="h-palm" viewBox="0 0 44 44">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="18" width="13" height="18" rx="4"/>
      <path d="M9.5 18v-6M13 18v-8M16.5 18v-6"/>
      <rect x="25" y="18" width="13" height="18" rx="4"/>
      <path d="M28.5 18v-6M32 18v-8M35.5 18v-6"/>
    </g>
  </symbol>
  <symbol id="h-back" viewBox="0 0 44 44">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="7" y="16" width="18" height="18" rx="5"/>
      <rect x="17" y="10" width="18" height="18" rx="5"/>
      <path d="M8 39h26M30 36l4 3-4 3"/>
    </g>
  </symbol>
  <symbol id="h-shake" viewBox="0 0 44 44">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="14" y="6" width="16" height="20" rx="5"/>
      <path d="M10 30l-2 4M22 32v5M34 30l2 4"/>
    </g>
  </symbol>
  <symbol id="mk-o" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="5.5" fill="none" stroke="#12B76A" stroke-width="3"/>
  </symbol>
  <symbol id="mk-x" viewBox="0 0 20 20">
    <g stroke="#FF5A5F" stroke-width="3" stroke-linecap="round"><path d="M6 6l8 8M14 6l-8 8"/></g>
  </symbol>
</svg>

<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">
      <svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L6 10l6 6"/></svg>
      체험 목록</a><a class="back" href="../lessons/B25/">과정안</a></span>
    <span class="tag">21~24</span>
  </nav>

  <section>
    <h1>같은 시험 데이터로 견주기</h1>
    <p class="lead">아홉 번을 다 알아보게 만들어요.</p>
    <div class="card">
      <h2>학습 데이터</h2>
      <div class="cond" id="r-bg"><span class="cl">샘플 수</span><span class="cv" id="v-bg">3개</span><button class="mini" id="b-bg" disabled>바꾸기</button></div>
      <div class="cond" id="r-ang"><span class="cl">빠르기</span><span class="cv" id="v-ang">보통</span><button class="mini" id="b-ang" disabled>바꾸기</button></div>
      <div class="cond" id="r-cnt"><span class="cl">착용 손</span><span class="cv" id="v-cnt">오른손</span><button class="mini" id="b-cnt" disabled>바꾸기</button></div>
    </div>
    <button class="btn" id="run">시험하기</button>
    <p class="hint" id="hint">시험하기를 누르세요</p>
    <div class="gwrap" id="gwrap" hidden>
      <div class="gstrip" id="gstrip" role="group" aria-label="몇 번 알아볼지 짚어요"></div>
    </div>
    <button class="btn" id="retest" disabled>다시 시험</button>
  </section>

  <section>
    <div class="card">
      <h2>시험 데이터 9번</h2>
      <div id="grid"></div>
      <p class="cap">연습용 기록 · 왼쪽 1회차 · 오른쪽 2회차</p><p class="cap">CreateAI로 다시 해 봐요</p>
      <h2>맞힌 수</h2>
      <table class="sc">
        <thead><tr><th></th><th>손바닥</th><th>손등</th><th>물 털기</th><th>모두</th></tr></thead>
        <tbody id="scb"></tbody>
      </table>
      <p class="hint" id="hint2"></p>
    </div>
    <div class="row2">
      <button class="btn" id="next">다음 판</button>
      <button class="btn ghost" id="reset">다시 하기</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var NAME = ['손바닥 문지르기', '손등 문지르기', '물 털기'];
  var SYM = ['h-palm', 'h-back', 'h-shake'];
  var HAND = { r: '오른손', l: '왼손' };
  var SPD = { n: '보통', f: '빠르게' };

  /* 판마다 시험 데이터 9번(동작마다 셋)을 그 자리에서 뽑는다.
     학습 데이터의 시작은 과정안 그대로 샘플 3개·오른손·보통이다.
     샘플 3개로는 두 문지르기가 서로 헷갈리고, 또렷하게 한 시도만 알아본다.
     셋에 한 판꼴로 빠르게 하거나 왼손에 찬 시도가 하나 섞인다. 그 판은 한 가지만 바꿔서는
     아홉 번을 다 알아볼 수 없다. */
  function makeBoard() {
    var cards = [];
    for (var a = 0; a < 3; a++) {
      for (var k = 0; k < 3; k++) {
        cards.push({ n: a, hand: 'r', spd: 'n', clear: a < 2 && Math.random() < 0.35 });
      }
    }
    if (Math.random() < 1 / 3) {
      var j = Math.floor(Math.random() * 9);
      if (Math.random() < 0.5) { cards[j].spd = 'f'; } else { cards[j].hand = 'l'; }
    }
    return { cards: cards };
  }

  var st, lastSig = '';
  var gcells = [];

  function sig(t) {
    return t.cards.map(function (c) { return c.n + c.hand + c.spd + (c.clear ? 1 : 0); }).join('');
  }

  function firstScore(t) {
    var n = 0;
    for (var i = 0; i < t.cards.length; i++) {
      var c = t.cards[i];
      if (c.hand === 'r' && c.spd === 'n' && (c.n === 2 || c.clear)) { n++; }
    }
    return n;
  }

  /* 직전 판과 같거나 1회차에 두 번도 안 빗나가는 판이면 다시 뽑는다. */
  function pickBoard() {
    var t;
    do { t = makeBoard(); } while (sig(t) === lastSig || firstScore(t) > 7);
    return t;
  }

  function fresh(t) {
    return {
      tmpl: t, smp: 3, spd: ['n'], hand: ['r'],
      changed: null, round: 0, marks: [null, null], guess: null
    };
  }

  /* 학습 데이터에 그 시도의 빠르기와 착용 손이 있어야 하고,
     샘플이 8개이거나 헷갈리지 않는 시도여야 알아본다. */
  function judge(t) {
    return st.spd.indexOf(t.spd) >= 0 && st.hand.indexOf(t.hand) >= 0 &&
      (st.smp >= 8 || t.n === 2 || t.clear);
  }

  function $(id) { return document.getElementById(id); }

  function buildGrid() {
    var cards = st.tmpl.cards;
    var g = $('grid');
    g.textContent = '';
    var row = document.createElement('div');
    row.className = 'trow';
    for (var i = 0; i < cards.length; i++) {
      var t = cards[i];
      var tile = document.createElement('div');
      tile.className = 'tile' + (t.hand === 'l' ? ' bgd' : '') + (t.spd === 'f' ? ' angs' : '');
      tile.setAttribute('data-i', String(i));
      tile.setAttribute('aria-label', NAME[t.n] + ' ' + HAND[t.hand] + ' ' + SPD[t.spd]);
      tile.innerHTML =
        '<svg class="hand" aria-hidden="true"><use href="#' + SYM[t.n] + '"></use></svg>' +
        '<span class="tl">' + HAND[t.hand] + ' ' + SPD[t.spd] + '</span>' +
        '<span class="marks"><i class="m" data-m="' + i + '-0"></i>' +
        '<i class="m" data-m="' + i + '-1"></i></span>';
      row.appendChild(tile);
    }
    g.appendChild(row);
  }

  function paintMarks() {
    var cells = document.querySelectorAll('.m');
    for (var k = 0; k < cells.length; k++) {
      var p = cells[k].getAttribute('data-m').split('-');
      var i = Number(p[0]);
      var r = Number(p[1]);
      var res = st.marks[r];
      if (!res) {
        cells[k].className = 'm';
        cells[k].innerHTML = '';
        cells[k].removeAttribute('aria-label');
        continue;
      }
      var ok = res[i];
      cells[k].className = 'm ' + (ok ? 'ok' : 'no');
      cells[k].innerHTML = '<svg aria-hidden="true"><use href="#' + (ok ? 'mk-o' : 'mk-x') + '"></use></svg>';
      cells[k].setAttribute('aria-label', (r + 1) + '회차 ' + (ok ? '맞음' : '틀림'));
    }
    var tiles = document.querySelectorAll('.tile');
    for (var q = 0; q < tiles.length; q++) {
      var idx = Number(tiles[q].getAttribute('data-i'));
      var moved = !!(st.marks[0] && st.marks[1] && st.marks[0][idx] !== st.marks[1][idx]);
      tiles[q].classList.toggle('now', moved);
    }
  }

  function paintScore() {
    var cards = st.tmpl.cards;
    var body = $('scb');
    body.textContent = '';
    for (var r = 0; r < 2; r++) {
      var res = st.marks[r];
      if (!res) { continue; }
      var per = [0, 0, 0];
      var all = 0;
      for (var i = 0; i < cards.length; i++) {
        if (res[i]) { per[cards[i].n] += 1; all += 1; }
      }
      var tr = document.createElement('tr');
      tr.innerHTML = '<th>' + (r + 1) + '회차</th><td>' + per[0] + '</td><td>' + per[1] +
        '</td><td>' + per[2] + '</td><td class="tot">' + all + '</td>';
      body.appendChild(tr);
    }
  }

  function paintCond() {
    $('v-bg').textContent = st.smp + '개';
    $('v-ang').textContent = st.spd.map(function (k) { return SPD[k]; }).join('·');
    $('v-cnt').textContent = st.hand.map(function (k) { return HAND[k]; }).join('·');
    var keys = ['bg', 'ang', 'cnt'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var row = $('r-' + k);
      var btn = $('b-' + k);
      btn.disabled = !(st.round === 1 && !st.changed);
      row.className = 'cond' + (st.changed === k ? ' chg' : (st.changed ? ' lock' : ''));
      var tag = row.querySelector('.keep');
      if (st.changed) {
        if (!tag) {
          tag = document.createElement('span');
          tag.className = 'keep';
          row.insertBefore(tag, btn);
        }
        tag.textContent = st.changed === k ? '바꿈' : '그대로';
      } else if (tag) {
        row.removeChild(tag);
      }
    }
  }

  function paintGuess() {
    var show = (st.round === 1 && !!st.changed);
    $('gwrap').hidden = !show;
    gcells.forEach(function (b, v) {
      b.disabled = !show || st.guess !== null;
      b.setAttribute('aria-pressed', st.guess === v ? 'true' : 'false');
    });
    $('retest').disabled = !(st.round === 1 && st.changed && st.guess !== null);
  }

  function paintHint() {
    var h = $('hint');
    if (st.round === 0) { h.textContent = '시험하기를 누르세요'; }
    else if (st.round === 1 && !st.changed) { h.textContent = '조건 하나만 바꾸세요'; }
    else if (st.round === 1 && st.guess === null) { h.textContent = '몇 번 알아볼지 짚어요'; }
    else if (st.round === 1) { h.textContent = '다시 시험을 누르세요'; }
    else { h.textContent = ''; }
    $('run').disabled = st.round !== 0;
  }

  function render() { paintCond(); paintMarks(); paintScore(); paintGuess(); paintHint(); }

  function run() {
    if ($('run').disabled) { return; }
    var cards = st.tmpl.cards;
    var res = [];
    for (var i = 0; i < cards.length; i++) { res.push(judge(cards[i])); }
    st.marks[0] = res;
    st.round = 1;
    render();
  }

  function change(k) {
    if (st.round !== 1 || st.changed) { return; }
    st.changed = k;
    if (k === 'bg') { st.smp = 8; }
    if (k === 'ang') { st.spd = ['n', 'f']; }
    if (k === 'cnt') { st.hand = ['r', 'l']; }
    render();
  }

  function pickGuess(v) {
    if (st.round !== 1 || !st.changed || st.guess !== null) { return; }
    st.guess = v;
    render();
  }

  function retest() {
    if ($('retest').disabled) { return; }
    var cards = st.tmpl.cards;
    var res = [];
    for (var i = 0; i < cards.length; i++) { res.push(judge(cards[i])); }
    st.marks[1] = res;
    st.round = 2;
    var score2 = res.filter(function (x) { return x; }).length;
    var g = st.guess, msg;
    if (g === score2) { msg = score2 === 9 ? '짚은 대로 아홉 번을 다 알아봤어요' : '짚은 대로였어요'; }
    else if (score2 > g) { msg = (score2 - g) + '번 더 알아봤어요'; }
    else { msg = (g - score2) + '번 덜 알아봤어요'; }
    $('hint2').textContent = msg;
    render();
  }

  function startRound(t) {
    st = fresh(t);
    buildGrid();
    $('hint2').textContent = '';
    render();
  }
  function nextRound() { lastSig = sig(st.tmpl); startRound(pickBoard()); }
  function resetRound() { startRound(st.tmpl); }

  (function buildGuessStrip() {
    for (var v = 0; v <= 9; v++) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'g'; b.textContent = String(v);
      b.setAttribute('aria-label', v + '번'); b.setAttribute('aria-pressed', 'false');
      (function (k) { b.addEventListener('click', function () { pickGuess(k); }); })(v);
      $('gstrip').appendChild(b);
      gcells.push(b);
    }
  })();

  $('run').addEventListener('click', run);
  $('retest').addEventListener('click', retest);
  $('next').addEventListener('click', nextRound);
  $('reset').addEventListener('click', resetRound);
  $('b-bg').addEventListener('click', function () { change('bg'); });
  $('b-ang').addEventListener('click', function () { change('ang'); });
  $('b-cnt').addEventListener('click', function () { change('cnt'); });

  startRound(pickBoard());
}());
</script>
</body>
</html>
