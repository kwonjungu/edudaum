<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>같은 시험지로 견주기 — 에듀다움 B25</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#FF5A5F; --point-soft:#FFE3E4;
    --green:#12B76A; --muted:#6B6B6B; --desk:#EFE2CB;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px;
  }
  .wrap{max-width:680px;margin:0 auto;padding:4px 14px 10px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:13px;background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:7px 14px;box-shadow:var(--hard-sm);min-height:44px;
    transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;
    border:2.5px solid var(--ink);border-radius:999px;padding:5px 14px;box-shadow:var(--hard-sm)}
  h1{font-size:clamp(18px,4.3vw,24px);font-weight:900;letter-spacing:-.035em;line-height:1.02}
  .lead{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:1px}
  .card{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:4px 6px;margin-top:3px}
  h2{font-size:12px;font-weight:900;letter-spacing:-.02em;margin-bottom:2px}
  h2:not(:first-child){margin-top:3px}
  .cond{display:grid;grid-template-columns:36px 1fr auto auto;align-items:center;gap:5px;
    border:2.5px solid var(--ink);border-radius:var(--r-sm);padding:2px 5px;margin-top:2px;
    background:var(--paper)}
  .cond.chg{background:var(--point-soft)}
  .cond.lock{opacity:.55}
  .cl{font-size:12px;font-weight:900}
  .cv{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .keep{font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}
  button{font-family:inherit;cursor:pointer;color:var(--ink)}
  .mini{min-height:44px;min-width:56px;font-size:12.5px;font-weight:900;background:var(--surface);
    border:2.5px solid var(--ink);border-radius:10px;box-shadow:var(--hard-sm);padding:4px 7px;
    transition:transform .1s,box-shadow .1s}
  .mini:hover:not(:disabled){transform:translate(-1px,-1px)}
  .mini:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .btn{display:block;width:100%;min-height:44px;margin-top:3px;font-size:14.5px;font-weight:900;
    background:var(--point);color:#fff;border:2.5px solid var(--ink);border-radius:var(--r-sm);
    box-shadow:var(--hard-sm);padding:7px 10px;transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px)}
  .btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
  .btn.ghost{background:var(--surface);color:var(--ink)}
  button:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  .hint{margin-top:4px;font-size:11.5px;font-weight:800;text-align:center;
    background:var(--ink);color:var(--paper);border-radius:999px;padding:4px 8px}
  .trow{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .tile{min-width:0;border:2.5px solid var(--ink);border-radius:6px;padding:1px}
  .tile{display:flex;flex-direction:column;align-items:center;gap:0;background:var(--surface);line-height:1}
  .tile.bgd{background:var(--desk)}
  .tile.now{box-shadow:var(--hard-sm)}
  .hand{width:13px;height:13px;color:var(--ink)}
  .tile.angs .hand{transform:rotate(-24deg)}
  .tl{font-size:8px;font-weight:700;color:var(--muted);text-align:center;line-height:1}
  .marks{display:flex;gap:2px;margin-top:1px}
  .m{width:10px;height:10px;display:block;border:1.5px solid var(--ink);border-radius:3px;background:var(--paper)}
  .m svg{width:100%;height:100%;display:block}
  .m.ok{background:#DFF6E9;border-color:var(--green)}
  .m.no{background:var(--point-soft);border-color:var(--point)}
  .gwrap{margin-top:3px}
  .gstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
  .g{min-height:44px;font-family:inherit;cursor:pointer;color:var(--ink);font-weight:900;font-size:13px;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:8px;box-shadow:var(--hard-sm)}
  .g[aria-pressed="true"]{background:var(--point);color:#fff}
  .g:disabled{opacity:.5;cursor:default;box-shadow:none}
  .row2{display:flex;gap:8px;margin-top:3px}
  .row2 .btn{margin-top:0;flex:1}
  #hint2:empty{display:none}
  .cap{font-size:10px;font-weight:700;color:var(--muted);margin-top:1px;text-align:center}
  table.sc{width:100%;border-collapse:collapse;margin-top:2px;font-size:12px}
  table.sc th,table.sc td{border:2px solid var(--ink);padding:2px;text-align:center;
    font-weight:800;font-variant-numeric:tabular-nums}
  table.sc thead th{background:var(--ink);color:var(--paper);font-size:11px}
  table.sc td.tot{background:var(--point-soft)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="h-palm" viewBox="0 0 44 44">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="6" y="18" width="13" height="18" rx="4"/>
      <path d="M9.5 18v-6M13 18v-8M16.5 18v-6"/>
      <rect x="25" y="18" width="13" height="18" rx="4"/>
      <path d="M28.5 18v-6M32 18v-8M35.5 18v-6"/>
    </g>
  </symbol>
  <symbol id="h-fist" viewBox="0 0 44 44">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="16" y="16" width="19" height="19" rx="6"/>
      <path d="M21 16v-4M26 16v-5M31 16v-4"/>
      <path d="M16 26h9"/>
      <path d="M12 16c-4 5-4 13 0 18"/>
      <path d="M12 16h4M12 34h4"/>
    </g>
  </symbol>
  <symbol id="h-lock" viewBox="0 0 44 44">
    <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 28v-6l4-4 4 4v6"/>
      <path d="M17 28V16l4-4 4 4v12"/>
      <path d="M25 28v-6l4-4 4 4v6"/>
      <rect x="7" y="28" width="30" height="8" rx="3"/>
    </g>
  </symbol>
  <symbol id="mk-o" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="5.5" fill="none" stroke="#12B76A" stroke-width="3"/>
  </symbol>
  <symbol id="mk-x" viewBox="0 0 20 20">
    <g stroke="#FF5A5F" stroke-width="3" stroke-linecap="round"><path d="M6 6l8 8M14 6l-8 8"/></g>
  </symbol>
</svg>

<div class="wrap">
  <nav class="nav">
    <a class="back" href="../index.html">
      <svg width="13" height="13" viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L6 10l6 6"/></svg>
      전체 목록</a>
    <span class="tag">21~24</span>
  </nav>

  <section>
    <h1>같은 시험지로 견주기</h1>
    <p class="lead">아홉 장을 다 맞게 만들어요.</p>
    <div class="card">
      <h2>학습 묶음</h2>
      <div class="cond" id="r-bg"><span class="cl">배경</span><span class="cv" id="v-bg">흰 종이</span><button class="mini" id="b-bg" disabled>바꾸기</button></div>
      <div class="cond" id="r-ang"><span class="cl">각도</span><span class="cv" id="v-ang">위</span><button class="mini" id="b-ang" disabled>바꾸기</button></div>
      <div class="cond" id="r-cnt"><span class="cl">장수</span><span class="cv" id="v-cnt">넉넉함</span><button class="mini" id="b-cnt" disabled>바꾸기</button></div>
    </div>
    <button class="btn" id="run">시험하기</button>
    <p class="hint" id="hint">시험하기를 누르세요</p>
    <div class="gwrap" id="gwrap" hidden>
      <div class="gstrip" id="gstrip" role="group" aria-label="몇 장 맞을지 짚어요"></div>
    </div>
    <button class="btn" id="retest" disabled>다시 시험</button>
  </section>

  <section>
    <div class="card">
      <h2>시험 자료 9장</h2>
      <div id="grid"></div>
      <p class="cap">수업용 자료 · 왼쪽 1회차 · 오른쪽 2회차</p>
      <h2>맞힌 수</h2>
      <table class="sc">
        <thead><tr><th></th><th>손바닥</th><th>주먹</th><th>깍지</th><th>모두</th></tr></thead>
        <tbody id="scb"></tbody>
      </table>
      <p class="hint" id="hint2"></p>
    </div>
    <div class="row2">
      <button class="btn" id="next">다음 판</button>
      <button class="btn ghost" id="reset">다시 하기</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';

  var NAME = ['손바닥', '주먹', '깍지'];
  var SYM = ['h-palm', 'h-fist', 'h-lock'];
  var BG = { w: '흰 종이', d: '책상' };
  var ANG = { t: '위', s: '옆' };
  function otherBg(x) { return x === 'w' ? 'd' : 'w'; }
  function otherAng(x) { return x === 't' ? 's' : 't'; }

  /* 판마다 학습 묶음의 시작 상태와 시험 자료 9장의 짜임이 template 하나로 정해진다.
     넷에 하나쯤은 조건 하나로는 아홉 장을 다 맞힐 수 없게 지어 두었다(아래 T5·T6). */
  function mk(bg0, ang0, cnt0, arr) {
    return {
      bg0: bg0, ang0: ang0, cnt0: cnt0,
      cards: arr.map(function (c) { return { n: c[0], bg: c[1], ang: c[2] }; })
    };
  }
  function allSame(bg0, ang0) {
    var out = [];
    for (var c = 0; c < 3; c++) { for (var k = 0; k < 3; k++) { out.push([c, bg0, ang0]); } }
    return out;
  }
  var TEMPLATES = [
    mk('w', 't', [10, 10, 10], [[0,'w','t'],[0,'w','t'],[0,'d','t'], [1,'w','t'],[1,'d','t'],[1,'w','t'], [2,'w','t'],[2,'w','t'],[2,'d','t']]),
    mk('w', 't', [10, 10, 10], [[0,'w','t'],[0,'w','t'],[0,'w','s'], [1,'w','t'],[1,'w','s'],[1,'w','t'], [2,'w','t'],[2,'w','t'],[2,'w','s']]),
    mk('w', 't', [10, 4, 10], allSame('w', 't')),
    mk('d', 's', [2, 10, 4], allSame('d', 's')),
    mk('w', 't', [10, 10, 10], [[0,'w','t'],[0,'w','t'],[0,'d','t'], [1,'w','t'],[1,'d','s'],[1,'w','t'], [2,'w','t'],[2,'w','t'],[2,'d','t']]),
    mk('w', 't', [10, 10, 10], [[0,'w','t'],[0,'w','t'],[0,'w','s'], [1,'w','t'],[1,'d','s'],[1,'w','t'], [2,'w','t'],[2,'w','t'],[2,'w','s']]),
    mk('d', 's', [10, 10, 10], [[0,'d','s'],[0,'d','s'],[0,'w','s'], [1,'d','s'],[1,'w','s'],[1,'d','s'], [2,'d','s'],[2,'d','s'],[2,'w','s']]),
    mk('d', 't', [10, 10, 10], [[0,'d','t'],[0,'d','t'],[0,'d','s'], [1,'d','t'],[1,'d','s'],[1,'d','t'], [2,'d','t'],[2,'d','t'],[2,'d','s']])
  ];

  var st, lastSig = '';
  var gcells = [];

  function sig(t) { return t.bg0 + t.ang0 + t.cnt0.join(','); }

  /* 시작 상태(배경·각도·장수)가 직전 판과 같으면 다시 뽑는다. */
  function pickIdx() {
    var i = Math.floor(Math.random() * TEMPLATES.length);
    return sig(TEMPLATES[i]) === lastSig ? pickIdx() : i;
  }

  function fresh(idx) {
    var t = TEMPLATES[idx];
    return {
      idx: idx, tmpl: t, bg: [t.bg0], ang: [t.ang0], cnt: t.cnt0.slice(),
      changed: null, round: 0, marks: [null, null], guess: null
    };
  }

  /* 학습 묶음이 그 장의 배경과 각도를 담고 있고, 그 이름의 장수가 넉넉해야 알아본다. */
  function judge(t) {
    return st.bg.indexOf(t.bg) >= 0 && st.ang.indexOf(t.ang) >= 0 && st.cnt[t.n] >= 8;
  }

  function $(id) { return document.getElementById(id); }

  function buildGrid() {
    var cards = st.tmpl.cards;
    var g = $('grid');
    g.textContent = '';
    var row = document.createElement('div');
    row.className = 'trow';
    for (var i = 0; i < cards.length; i++) {
      var t = cards[i];
      var tile = document.createElement('div');
      tile.className = 'tile' + (t.bg === 'd' ? ' bgd' : '') + (t.ang === 's' ? ' angs' : '');
      tile.setAttribute('data-i', String(i));
      tile.setAttribute('aria-label', NAME[t.n] + ' ' + BG[t.bg] + ' ' + ANG[t.ang]);
      tile.innerHTML =
        '<svg class="hand" aria-hidden="true"><use href="#' + SYM[t.n] + '"></use></svg>' +
        '<span class="tl">' + BG[t.bg] + ' ' + ANG[t.ang] + '</span>' +
        '<span class="marks"><i class="m" data-m="' + i + '-0"></i>' +
        '<i class="m" data-m="' + i + '-1"></i></span>';
      row.appendChild(tile);
    }
    g.appendChild(row);
  }

  function paintMarks() {
    var cells = document.querySelectorAll('.m');
    for (var k = 0; k < cells.length; k++) {
      var p = cells[k].getAttribute('data-m').split('-');
      var i = Number(p[0]);
      var r = Number(p[1]);
      var res = st.marks[r];
      if (!res) {
        cells[k].className = 'm';
        cells[k].innerHTML = '';
        cells[k].removeAttribute('aria-label');
        continue;
      }
      var ok = res[i];
      cells[k].className = 'm ' + (ok ? 'ok' : 'no');
      cells[k].innerHTML = '<svg aria-hidden="true"><use href="#' + (ok ? 'mk-o' : 'mk-x') + '"></use></svg>';
      cells[k].setAttribute('aria-label', (r + 1) + '회차 ' + (ok ? '맞음' : '틀림'));
    }
    var tiles = document.querySelectorAll('.tile');
    for (var q = 0; q < tiles.length; q++) {
      var idx = Number(tiles[q].getAttribute('data-i'));
      var moved = !!(st.marks[0] && st.marks[1] && st.marks[0][idx] !== st.marks[1][idx]);
      tiles[q].classList.toggle('now', moved);
    }
  }

  function paintScore() {
    var cards = st.tmpl.cards;
    var body = $('scb');
    body.textContent = '';
    for (var r = 0; r < 2; r++) {
      var res = st.marks[r];
      if (!res) { continue; }
      var per = [0, 0, 0];
      var all = 0;
      for (var i = 0; i < cards.length; i++) {
        if (res[i]) { per[cards[i].n] += 1; all += 1; }
      }
      var tr = document.createElement('tr');
      tr.innerHTML = '<th>' + (r + 1) + '회차</th><td>' + per[0] + '</td><td>' + per[1] +
        '</td><td>' + per[2] + '</td><td class="tot">' + all + '</td>';
      body.appendChild(tr);
    }
  }

  function cntLabel(cnt) {
    var lack = [];
    for (var c = 0; c < 3; c++) { if (cnt[c] < 8) { lack.push(NAME[c]); } }
    return lack.length ? lack.join('·') + ' 적음' : '넉넉함';
  }

  function paintCond() {
    $('v-bg').textContent = st.bg.map(function (k) { return BG[k]; }).join('·');
    $('v-ang').textContent = st.ang.map(function (k) { return ANG[k]; }).join('·');
    $('v-cnt').textContent = cntLabel(st.cnt);
    var keys = ['bg', 'ang', 'cnt'];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var row = $('r-' + k);
      var btn = $('b-' + k);
      btn.disabled = !(st.round === 1 && !st.changed);
      row.className = 'cond' + (st.changed === k ? ' chg' : (st.changed ? ' lock' : ''));
      var tag = row.querySelector('.keep');
      if (st.changed) {
        if (!tag) {
          tag = document.createElement('span');
          tag.className = 'keep';
          row.insertBefore(tag, btn);
        }
        tag.textContent = st.changed === k ? '바꿈' : '그대로';
      } else if (tag) {
        row.removeChild(tag);
      }
    }
  }

  function paintGuess() {
    var show = (st.round === 1 && !!st.changed);
    $('gwrap').hidden = !show;
    gcells.forEach(function (b, v) {
      b.disabled = !show || st.guess !== null;
      b.setAttribute('aria-pressed', st.guess === v ? 'true' : 'false');
    });
    $('retest').disabled = !(st.round === 1 && st.changed && st.guess !== null);
  }

  function paintHint() {
    var h = $('hint');
    if (st.round === 0) { h.textContent = '시험하기를 누르세요'; }
    else if (st.round === 1 && !st.changed) { h.textContent = '조건 하나만 바꾸세요'; }
    else if (st.round === 1 && st.guess === null) { h.textContent = '몇 장 맞을지 짚어요'; }
    else if (st.round === 1) { h.textContent = '다시 시험을 누르세요'; }
    else { h.textContent = ''; }
    $('run').disabled = st.round !== 0;
  }

  function render() { paintCond(); paintMarks(); paintScore(); paintGuess(); paintHint(); }

  function run() {
    if ($('run').disabled) { return; }
    var cards = st.tmpl.cards;
    var res = [];
    for (var i = 0; i < cards.length; i++) { res.push(judge(cards[i])); }
    st.marks[0] = res;
    st.round = 1;
    render();
  }

  function change(k) {
    if (st.round !== 1 || st.changed) { return; }
    st.changed = k;
    if (k === 'bg') { st.bg = [st.tmpl.bg0, otherBg(st.tmpl.bg0)]; }
    if (k === 'ang') { st.ang = [st.tmpl.ang0, otherAng(st.tmpl.ang0)]; }
    if (k === 'cnt') { st.cnt = [10, 10, 10]; }
    render();
  }

  function pickGuess(v) {
    if (st.round !== 1 || !st.changed || st.guess !== null) { return; }
    st.guess = v;
    render();
  }

  function retest() {
    if ($('retest').disabled) { return; }
    var cards = st.tmpl.cards;
    var res = [];
    for (var i = 0; i < cards.length; i++) { res.push(judge(cards[i])); }
    st.marks[1] = res;
    st.round = 2;
    var score2 = res.filter(function (x) { return x; }).length;
    var g = st.guess, msg;
    if (score2 === 9) { msg = '아홉 장을 다 맞혔어요'; }
    else if (g === score2) { msg = '짚은 대로였어요'; }
    else if (score2 > g) { msg = (score2 - g) + '장 더 맞았어요'; }
    else { msg = (g - score2) + '장 덜 맞았어요'; }
    $('hint2').textContent = msg;
    render();
  }

  function startRound(idx) {
    st = fresh(idx);
    buildGrid();
    $('hint2').textContent = '';
    render();
  }
  function nextRound() { lastSig = sig(st.tmpl); startRound(pickIdx()); }
  function resetRound() { startRound(st.idx); }

  (function buildGuessStrip() {
    for (var v = 0; v <= 9; v++) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'g'; b.textContent = String(v);
      b.setAttribute('aria-label', v + '장'); b.setAttribute('aria-pressed', 'false');
      (function (k) { b.addEventListener('click', function () { pickGuess(k); }); })(v);
      $('gstrip').appendChild(b);
      gcells.push(b);
    }
  })();

  $('run').addEventListener('click', run);
  $('retest').addEventListener('click', retest);
  $('next').addEventListener('click', nextRound);
  $('reset').addEventListener('click', resetRound);
  $('b-bg').addEventListener('click', function () { change('bg'); });
  $('b-ang').addEventListener('click', function () { change('ang'); });
  $('b-cnt').addEventListener('click', function () { change('cnt'); });

  startRound(pickIdx());
}());
</script>
</body>
</html>
