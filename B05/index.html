<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>도서관 순서도 시험</title>
<style>
:root{--line:#DDDDDD;--line-strong:#C1C1C1;
  --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
  --point:#FF385C; --point-soft:#FFF0F3;
  --muted:#6A6A6A;
  --r:14px; --r-sm:8px;
  --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  
  
  color:var(--ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:17px; line-height:1.45; font-weight:600;
  -webkit-text-size-adjust:100%;
}
main{max-width:900px;margin:0 auto;padding:10px 14px 20px}
h1{font-size:clamp(24px,5.6vw,34px);font-weight:700;letter-spacing:-.035em;margin:0 0 4px}
.lead{font-size:15px;color:var(--muted);margin:0 0 12px;font-weight:700}

.face{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--hard); padding:9px; margin:0 0 9px;
}
.face h2{font-size:13.5px;font-weight:700;letter-spacing:-.02em;margin:0 0 8px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 4px}
.chip{display:inline-block;font-weight:600;font-size:14px;background:var(--point-soft);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 4px}
button{
  font:inherit; font-weight:600; color:var(--ink); cursor:pointer;
  min-height:48px; min-width:96px; padding:10px 16px;
  border:1px solid var(--ink); border-radius:999px;
  background:var(--surface); box-shadow:var(--hard-sm);
  transition:transform .1s ease, box-shadow .1s ease;
}
button.main{background:var(--point)}
button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:719px){ .wrap{grid-template-columns:minmax(0,1fr)} }

.diagram svg{display:block;width:100%;max-width:262px;margin:0 auto;height:auto}

.shape{fill:var(--surface);stroke:var(--ink);stroke-width:3}
.node.lit .shape{fill:var(--point-soft);stroke-width:5}
.cap{font:800 15px "Pretendard","Malgun Gothic",sans-serif;fill:var(--ink)}
.yn{font:900 15px "Pretendard","Malgun Gothic",sans-serif;fill:var(--ink)}
.edge{fill:none;stroke:var(--ink);stroke-width:3;marker-end:url(#arw)}
.edge.lit{stroke:var(--point);stroke-width:7}

.rec{
  display:flex; align-items:center; gap:8px; min-height:44px;
  border:1px solid var(--line); border-radius:var(--r-sm);
  background:var(--paper); padding:8px 12px; margin:0 0 8px;
  font-weight:600;
}
.rec span:empty::before{content:"—";color:var(--muted)}
.say{font-size:13.5px;font-weight:700;color:var(--point);min-height:20px}
.ask{
  margin:10px 0 0; padding:10px 14px; font-weight:600;
  border:1.5px dashed var(--line-strong); border-radius:var(--r-sm); background:var(--point-soft);
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

/* 쪽 위 차시 표시 */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.topnav a{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);
  font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--ink);
  border-radius:999px;padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
.topnav b{font-weight:700;font-size:14px;background:var(--point);color:#fff;
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  box-shadow:var(--hard-sm);white-space:nowrap}

/* 에듀다움 통일 테마 2026-09-27 */
</style>
</head>
<body>
<main>
  <nav class="topnav"><span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a href="../play/">← 체험 목록</a><a href="../lessons/B05/">과정안</a></span><b>9~10</b></nav>
  <h1>도서관 순서도 시험</h1>
  <p class="lead">이 책이 어느 끝으로 갈지 짚어요</p>

  <section class="face">
    <h2>이번 책</h2>
    <div class="chips" id="chips"></div>
  </section>

  <section>
    <div class="wrap">
      <div class="face diagram">
        <h2>순서도</h2>
        <svg viewBox="0 0 360 392" role="img" aria-label="도서관 대출 순서도">
          <defs>
            <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#222222"/>
            </marker>
          </defs>

          <path id="e0" class="edge" d="M180 46 V56"/>
          <path id="e1" class="edge" d="M180 98 V116"/>
          <path id="eL" class="edge" d="M110 148 H78 V210"/>
          <path id="eR" class="edge" d="M250 148 H282 V210"/>
          <path id="eL2" class="edge" d="M78 252 V270"/>
          <path id="eLE" class="edge" d="M78 312 V356 H132"/>
          <path id="eRE" class="edge" d="M282 252 V356 H228"/>

          <g id="nStart" class="node">
            <ellipse class="shape" cx="180" cy="26" rx="46" ry="19"/>
            <text class="cap" x="180" y="32" text-anchor="middle">시작</text>
          </g>
          <g id="nCheck" class="node">
            <rect class="shape" x="114" y="56" width="132" height="42" rx="4"/>
            <text class="cap" x="180" y="83" text-anchor="middle">책 상태 확인</text>
          </g>
          <g id="nAsk" class="node">
            <polygon class="shape" points="180,116 252,148 180,180 108,148"/>
            <text class="cap" x="180" y="154" text-anchor="middle">대출 가능인가?</text>
          </g>
          <text class="yn" id="ynL" x="102" y="140" text-anchor="end">예</text>
          <text class="yn" id="ynR" x="258" y="140" text-anchor="start">아니요</text>

          <g id="nLog" class="node">
            <rect class="shape" x="20" y="210" width="116" height="42" rx="4"/>
            <text class="cap" x="78" y="237" text-anchor="middle">기록 남기기</text>
          </g>
          <g id="nHand" class="node">
            <rect class="shape" x="20" y="270" width="116" height="42" rx="4"/>
            <text class="cap" x="78" y="297" text-anchor="middle">책 건네기</text>
          </g>
          <g id="nBook" class="node">
            <rect class="shape" x="224" y="210" width="116" height="42" rx="4"/>
            <text class="cap" x="282" y="237" text-anchor="middle" style="font-size:13.5px">예약 방법 안내</text>
          </g>
          <g id="nEnd" class="node">
            <ellipse class="shape" cx="180" cy="356" rx="46" ry="19"/>
            <text class="cap" x="180" y="362" text-anchor="middle">끝</text>
          </g>
        </svg>
      </div>

      <div class="face">
        <h2>어느 끝일까요</h2>
        <div class="row">
          <button id="guessHand" type="button" aria-pressed="false">책 건네기</button>
          <button id="guessBook" type="button" aria-pressed="false">예약 방법 안내</button>
        </div>
        <div class="row">
          <button id="run" class="main" type="button">굴려 보기</button>
          <button id="reset" type="button">다시 하기</button>
          <button id="next" type="button">다음 판</button>
        </div>
        <p class="rec"><span id="recEl"></span></p>
        <p class="say" id="say" role="status" aria-live="polite"></p>
        <p class="ask">두 끝 가운데 하나를 짚어요</p>
      </div>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  var STEP = 380;

  var BOOKS = [
    { traits: ['그림책', '서가에 꽂혀 있음'], avail: true },
    { traits: ['과학책', '빌린 사람 없음'], avail: true },
    { traits: ['위인전', '어제 반납됨'], avail: true },
    { traits: ['동화책', '다른 친구가 빌림'], avail: false },
    { traits: ['만화책', '아직 안 돌아옴'], avail: false },
    { traits: ['백과사전', '지금 대출 중'], avail: false }
  ];

  var chipsEl = document.getElementById('chips');
  var guessHandBtn = document.getElementById('guessHand');
  var guessBookBtn = document.getElementById('guessBook');
  var runBtn = document.getElementById('run');
  var resetBtn = document.getElementById('reset');
  var nextBtn = document.getElementById('next');
  var recEl = document.getElementById('recEl');
  var sayEl = document.getElementById('say');

  var LEFT = ['nStart', 'e0', 'nCheck', 'e1', 'nAsk', 'eL', 'nLog', 'eL2', 'nHand', 'eLE', 'nEnd'];
  var RIGHT = ['nStart', 'e0', 'nCheck', 'e1', 'nAsk', 'eR', 'nBook', 'eRE', 'nEnd'];
  var ALL = ['nStart', 'nCheck', 'nAsk', 'nLog', 'nHand', 'nBook', 'nEnd',
             'e0', 'e1', 'eL', 'eR', 'eL2', 'eLE', 'eRE'];

  var bookIdx = -1, swapped = false;
  var prevBookIdx = null, prevSwapped = null;
  var guess = null;
  var running = false;
  var ran = false;       // 확인을 눌렀나. 그 뒤로는 짚기가 잠긴다.
  var timer = null;

  var calm = window.matchMedia
    ? window.matchMedia('(prefers-reduced-motion: reduce)').matches
    : false;

  function clearLit() {
    for (var i = 0; i < ALL.length; i += 1) {
      document.getElementById(ALL[i]).classList.remove('lit');
    }
  }

  function pickRound() {
    var bi, sw;
    do {
      bi = Math.floor(Math.random() * BOOKS.length);
      sw = Math.random() < (1 / 3);
    } while (bi === prevBookIdx && sw === prevSwapped);
    prevBookIdx = bi; prevSwapped = sw;
    return { bi: bi, sw: sw };
  }

  function loadBook() {
    var book = BOOKS[bookIdx];
    chipsEl.innerHTML = '';
    for (var i = 0; i < book.traits.length; i++) {
      var c = document.createElement('span');
      c.className = 'chip';
      c.textContent = book.traits[i];
      chipsEl.appendChild(c);
    }
  }

  function lock(on) {
    runBtn.disabled = on || guess === null;
    resetBtn.disabled = on;
    nextBtn.disabled = on;
    guessHandBtn.disabled = on || ran;
    guessBookBtn.disabled = on || ran;
  }

  function halt() {
    if (timer !== null) { clearInterval(timer); timer = null; }
    running = false;
  }

  function setGuess(label) {
    if (running || ran) { return; }
    guess = label;
    guessHandBtn.setAttribute('aria-pressed', String(label === '책 건네기'));
    guessBookBtn.setAttribute('aria-pressed', String(label === '예약 방법 안내'));
    lock(false);
  }

  function walk() {
    if (running || guess === null) { return; }
    var book = BOOKS[bookIdx];
    var takeLeft = swapped ? !book.avail : book.avail;
    var reached = takeLeft ? '책 건네기' : '예약 방법 안내';
    var path = takeLeft ? LEFT : RIGHT;
    clearLit();
    recEl.textContent = '';
    sayEl.textContent = '';

    function finishWalk() {
      recEl.textContent = '→ ' + reached;
      sayEl.textContent = reached === guess ? '짚은 곳에 닿았어요' : '다른 끝으로 갔어요';
      running = false;
      lock(false);
    }

    if (calm) {
      for (var i = 0; i < path.length; i += 1) {
        document.getElementById(path[i]).classList.add('lit');
      }
      finishWalk();
      return;
    }

    var k = 0;
    running = true; ran = true;
    lock(true);
    timer = setInterval(function () {
      document.getElementById(path[k]).classList.add('lit');
      k += 1;
      if (k >= path.length) {
        halt();
        finishWalk();
      }
    }, STEP);
  }

  function resetRun() {
    ran = false;
    if (running) { return; }
    halt();
    clearLit();
    recEl.textContent = '';
    sayEl.textContent = '';
  }

  function newRound() {
    ran = false;
    halt();
    var r = pickRound();
    bookIdx = r.bi; swapped = r.sw;
    guess = null;
    loadBook();
    // 화살표대로만 걷는다. 뒤바뀐 판은 예·아니요 글자부터 뒤바뀌어 있다.
    document.getElementById('ynL').textContent = swapped ? '아니요' : '예';
    document.getElementById('ynR').textContent = swapped ? '예' : '아니요';
    guessHandBtn.setAttribute('aria-pressed', 'false');
    guessBookBtn.setAttribute('aria-pressed', 'false');
    clearLit();
    recEl.textContent = '';
    sayEl.textContent = '';
    lock(false);
  }

  guessHandBtn.addEventListener('click', function () { setGuess('책 건네기'); });
  guessBookBtn.addEventListener('click', function () { setGuess('예약 방법 안내'); });
  runBtn.addEventListener('click', walk);
  resetBtn.addEventListener('click', resetRun);
  nextBtn.addEventListener('click', newRound);
  window.addEventListener('pagehide', halt);

  newRound();
})();
</script>
</body>
</html>
