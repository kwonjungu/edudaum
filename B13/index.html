<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>삼십 초 나누기 — 에듀다움 B13</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#EA580C; --point-soft:#FBD9BE; --muted:#5E5E5E;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 32px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;
    font-size:14px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;border:2.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(24px,5.8vw,34px);font-weight:900;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:15px;color:var(--muted);margin-top:6px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:13px 12px;margin-top:12px}
  h2{font-size:13.5px;font-weight:900;letter-spacing:-.02em;margin-bottom:9px;color:var(--muted)}

  .timebox{display:flex;flex-direction:column;align-items:center;text-align:center}
  #time{font-family:'Courier New',monospace;font-size:clamp(40px,11vw,58px);font-weight:900;
    line-height:1;color:var(--point)}
  .unit{font-size:14px;font-weight:800;color:var(--muted);margin-left:4px}
  #cellname{margin-top:4px;font-size:16px;font-weight:900}

  #belt{width:100%;height:auto;display:block;margin-top:10px}
  .seg{fill:var(--surface);stroke:var(--ink);stroke-width:2}
  .seg.active{fill:var(--point)}
  .divider{fill:var(--ink)}
  .pointer{fill:var(--ink);opacity:0}

  .ask{margin-top:9px;font-size:13.5px;font-weight:800;color:var(--muted)}

  .row{display:flex;align-items:center;gap:8px;justify-content:space-between;
    padding:8px 0;border-top:2px solid var(--ink)}
  .row:first-of-type{border-top:none}
  .rowname{font-size:14.5px;font-weight:900;flex:1 1 auto;min-width:0}
  .rowval{font-family:'Courier New',monospace;font-size:16px;font-weight:900;white-space:nowrap}
  .rowbtns{display:flex;gap:6px}

  .mini{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-width:44px;min-height:44px;padding:8px 10px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .mini:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .mini:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .mini:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;transform:none}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:10px 18px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point-soft);flex:1 1 160px}
  .btn.sub{flex:1 1 120px}

  .end{margin-top:9px;font-size:14px;font-weight:900;background:var(--ink);color:var(--paper);
    border-radius:999px;padding:7px 13px;display:inline-flex}
  .end[hidden]{display:none}
  .note{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--muted)}

  button, a{outline-offset:3px}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">← 전체 목록</a>
    <span class="tag">29~30</span>
  </nav>

  <header>
    <h1>삼십 초 나누기</h1>
    <p class="lead">어디에 시간을 더 줄까요</p>
  </header>

  <section aria-labelledby="h-t">
    <h2 id="h-t">남은 시간</h2>
    <div class="timebox">
      <p><span id="time">30.0</span><span class="unit">초</span></p>
      <p id="cellname" aria-live="polite">누가 편해지나</p>
    </div>
    <svg id="belt" viewBox="0 0 300 56" role="img" aria-label="30초 띠에서 지금 자리를 보여 줌"></svg>
    <p class="ask">어느 칸이 모자랐나요</p>
    <p class="end" id="endMsg" hidden>삼십 초가 지났어요</p>
  </section>

  <section aria-labelledby="h-c">
    <h2 id="h-c">시간 나누기</h2>

    <div class="row">
      <span class="rowname">누가 편해지나</span>
      <span class="rowval" id="v0">10초</span>
      <span class="rowbtns">
        <button class="mini" type="button" data-i="0" data-op="minus" aria-label="누가 편해지나 −5초">−5초</button>
        <button class="mini" type="button" data-i="0" data-op="plus" aria-label="누가 편해지나 +5초">+5초</button>
      </span>
    </div>
    <div class="row">
      <span class="rowname">목표 앞뒤 보이기</span>
      <span class="rowval" id="v1">10초</span>
      <span class="rowbtns">
        <button class="mini" type="button" data-i="1" data-op="minus" aria-label="목표 앞뒤 보이기 −5초">−5초</button>
        <button class="mini" type="button" data-i="1" data-op="plus" aria-label="목표 앞뒤 보이기 +5초">+5초</button>
      </span>
    </div>
    <div class="row">
      <span class="rowname">무엇을 고쳤나</span>
      <span class="rowval" id="v2">10초</span>
      <span class="rowbtns">
        <button class="mini" type="button" data-i="2" data-op="minus" aria-label="무엇을 고쳤나 −5초">−5초</button>
        <button class="mini" type="button" data-i="2" data-op="plus" aria-label="무엇을 고쳤나 +5초">+5초</button>
      </span>
    </div>

    <div class="acts">
      <button class="btn main" id="startBtn" type="button">연습 시작</button>
      <button class="btn sub" id="resetBtn" type="button">처음으로</button>
    </div>
    <p class="note">발표는 모둠 앞에서 해요</p>
  </section>
</div>

<script>
(function(){
  'use strict';

  var NAMES = ['누가 편해지나', '목표 앞뒤 보이기', '무엇을 고쳤나'];
  var NS = 'http://www.w3.org/2000/svg';
  var W = 300, H = 56, TOP = 8, SEGH = 32;

  var cuts = [10, 10, 10];
  var running = false;
  var remaining = 30.0;
  var lastIdx = -1;
  var timerId = null;

  var timeEl = document.getElementById('time');
  var cellEl = document.getElementById('cellname');
  var beltEl = document.getElementById('belt');
  var endEl = document.getElementById('endMsg');
  var startBtn = document.getElementById('startBtn');
  var resetBtn = document.getElementById('resetBtn');
  var valEls = [document.getElementById('v0'), document.getElementById('v1'), document.getElementById('v2')];
  var minusBtns = Array.prototype.slice.call(document.querySelectorAll('.mini[data-op="minus"]'));
  var plusBtns = Array.prototype.slice.call(document.querySelectorAll('.mini[data-op="plus"]'));

  var segs = [], dividers = [], pointer;
  (function buildBelt(){
    var i;
    for (i = 0; i < 3; i++) {
      var r = document.createElementNS(NS, 'rect');
      r.setAttribute('class', 'seg');
      r.setAttribute('y', TOP);
      r.setAttribute('height', SEGH);
      beltEl.appendChild(r);
      segs.push(r);
    }
    for (i = 0; i < 2; i++) {
      var d = document.createElementNS(NS, 'rect');
      d.setAttribute('class', 'divider');
      d.setAttribute('y', TOP);
      d.setAttribute('width', 3);
      d.setAttribute('height', SEGH);
      beltEl.appendChild(d);
      dividers.push(d);
    }
    pointer = document.createElementNS(NS, 'rect');
    pointer.setAttribute('class', 'pointer');
    pointer.setAttribute('y', 2);
    pointer.setAttribute('width', 4);
    pointer.setAttribute('height', H - 4);
    beltEl.appendChild(pointer);
  })();

  function cum(){
    return [cuts[0], cuts[0] + cuts[1], 30];
  }

  function renderCuts(){
    var c = cum();
    var x = 0, i;
    for (i = 0; i < 3; i++) {
      var w = (cuts[i] / 30) * W;
      segs[i].setAttribute('x', x.toFixed(2));
      segs[i].setAttribute('width', w.toFixed(2));
      x += w;
    }
    dividers[0].setAttribute('x', (((c[0] / 30) * W) - 1.5).toFixed(2));
    dividers[1].setAttribute('x', (((c[1] / 30) * W) - 1.5).toFixed(2));
    for (i = 0; i < 3; i++) valEls[i].textContent = cuts[i] + '초';
    updateLocks();
  }

  function updateLocks(){
    var i;
    for (i = 0; i < 3; i++) {
      var next = (i + 1) % 3;
      var canPlus = cuts[i] < 20 && cuts[next] > 5;
      var canMinus = cuts[i] > 5 && cuts[next] < 20;
      plusBtns[i].disabled = running || !canPlus;
      minusBtns[i].disabled = running || !canMinus;
    }
  }

  function renderRun(idx, elapsed, idle){
    timeEl.textContent = remaining.toFixed(1);
    if (idx !== lastIdx) {
      cellEl.textContent = NAMES[idx];
      segs.forEach(function(s, k){ s.classList.toggle('active', !idle && k === idx); });
      lastIdx = idx;
    }
    pointer.setAttribute('opacity', idle ? 0 : 1);
    if (!idle) pointer.setAttribute('x', (((elapsed / 30) * W) - 2).toFixed(2));
  }

  function hideEnd(){ endEl.hidden = true; }
  function showEnd(){ endEl.hidden = false; }

  function tick(){
    remaining = Math.max(0, remaining - 0.1);
    var elapsed = 30 - remaining;
    var c = cum();
    var idx = elapsed < c[0] ? 0 : (elapsed < c[1] ? 1 : 2);
    renderRun(idx, elapsed, false);
    if (remaining <= 0) finish();
  }

  function startPractice(){
    if (running) return;
    hideEnd();
    running = true;
    remaining = 30.0;
    lastIdx = -1;
    updateLocks();
    startBtn.textContent = '멈추기';
    renderRun(0, 0, false);
    timerId = setInterval(tick, 100);
  }

  function finish(){
    clearInterval(timerId);
    running = false;
    updateLocks();
    startBtn.textContent = '연습 시작';
    showEnd();
  }

  function stopToIdle(){
    if (timerId) clearInterval(timerId);
    running = false;
    remaining = 30.0;
    lastIdx = -1;
    updateLocks();
    startBtn.textContent = '연습 시작';
    hideEnd();
    renderRun(0, 0, true);
  }

  startBtn.addEventListener('click', function(){
    if (running) stopToIdle(); else startPractice();
  });

  resetBtn.addEventListener('click', function(){
    stopToIdle();
    cuts = [10, 10, 10];
    renderCuts();
  });

  minusBtns.forEach(function(btn, i){
    btn.addEventListener('click', function(){
      var next = (i + 1) % 3;
      if (cuts[i] > 5 && cuts[next] < 20) {
        cuts[i] -= 5;
        cuts[next] += 5;
        renderCuts();
      }
    });
  });
  plusBtns.forEach(function(btn, i){
    btn.addEventListener('click', function(){
      var next = (i + 1) % 3;
      if (cuts[i] < 20 && cuts[next] > 5) {
        cuts[i] += 5;
        cuts[next] -= 5;
        renderCuts();
      }
    });
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden && running) stopToIdle();
  });
  window.addEventListener('pagehide', function(){
    if (running) stopToIdle();
  });

  renderCuts();
  renderRun(0, 0, true);
})();
</script>
</body>
</html>
