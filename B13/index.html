<style>
  :root{--shade:#f3efe6}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    color:var(--ink);font-size:17px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:10px;margin-top:9px}
  h2{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}
  .note{font-size:12.5px;color:var(--muted);font-weight:600}

  table.rec{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px}
  .rec th,.rec td{border:1px solid var(--line);padding:5px 4px;text-align:center;height:34px;word-break:keep-all}
  .rec th{font-size:12px;color:var(--muted);font-weight:700}
  .rec col.c1{width:17%} .rec col.c2{width:17%} .rec col.c3{width:20%}
  .rec tr.hide td{background:var(--shade);color:var(--muted);letter-spacing:.2em}
  .rec tr.new td{animation:pop .35s ease-out}
  .rec td.stop{color:#b4532a;font-weight:700}
  .rec td.ok{color:var(--mint-d);font-weight:700}
  .rec td.where{font-weight:700}
  .rec tr.hide td:not(:first-child){background:repeating-linear-gradient(45deg,var(--shade) 0 6px,var(--line) 6px 7px)}
  @keyframes pop{from{background:var(--sun-l);transform:scale(1.03)}to{background:transparent;transform:none}}
  .booth svg{width:26px;height:22px;vertical-align:-5px;margin-right:3px}

  .q{font-size:15px;font-weight:700;margin-bottom:6px}
  .cands{display:flex;gap:6px;flex-wrap:wrap}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:14.5px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:46px;padding:8px 10px;box-shadow:var(--hard-sm);flex:1 1 96px;word-break:keep-all;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none;transform:none}
  .btn[aria-pressed="true"]{background:var(--sun-l);border:3px solid var(--point)}
  .btn.main{background:var(--point);border-color:var(--point);color:#fff}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .say{margin-top:8px;font-size:14px;font-weight:700}
  .say.dim{color:var(--muted)}

  .bars{display:grid;gap:5px;margin-top:8px}
  .bar{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:6px;align-items:center;font-size:13.5px;font-weight:600}
  .bar i{display:block;height:14px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i b{display:block;height:100%;background:var(--sky);width:0;transition:width .4s}
  .bar.me i b{background:var(--mint)}
  .bar.top i b{box-shadow:0 0 0 2px var(--sun) inset}
  .bar em{font-style:normal;font-family:'Courier New',monospace;font-weight:700;text-align:right}
  .bar.me span{text-decoration:underline;text-decoration-color:var(--point);text-decoration-thickness:3px}

  .grid{display:grid;grid-template-columns:58px 1fr 1fr;gap:4px;font-size:12.5px;margin-top:4px}
  .grid .hd{white-space:pre-line;word-break:keep-all;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;text-align:center}
  .grid .cell{border:1px dashed var(--line-strong);border-radius:6px;min-height:52px;padding:4px;display:flex;
    flex-wrap:wrap;gap:4px;align-content:flex-start}
  .chip{background:var(--sky-l);border:1px solid var(--point);border-radius:999px;padding:1px 8px;font-weight:700;font-size:12.5px}
  .chip.pick{background:var(--point);color:#fff}
  .cell.hot{background:var(--sun-l)}
  .out{margin-top:8px;font-size:13.5px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);
    padding:8px 10px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
  .out b{display:block;font-size:12px;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>

<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B13/">과정안</a></span>
    <span class="tag">29~30</span>
  </nav>

  <header>
    <h1>기록 두 장으로 막힌 곳 짚기</h1>
    <p class="lead">다 펼쳐 세어 보고 고칠 점을 골라요 · 체험 활동</p>
  </header>

  <section aria-labelledby="h-rec">
    <h2 id="h-rec">활동 기록지 <span class="note booth"><svg viewBox="0 0 26 22" aria-hidden="true"><path d="M2 9 L5 2 H21 L24 9Z" fill="#ffc845" stroke="#33302b" stroke-width="1.5" stroke-linejoin="round"/><path d="M2 9h22v2H2z" fill="#5aa9e6" stroke="#33302b" stroke-width="1.5"/><path d="M5 11v9M21 11v9" stroke="#33302b" stroke-width="1.5"/></svg><span id="booth"></span></span></h2>
    <table class="rec">
      <colgroup><col class="c1"><col class="c2"><col class="c3"><col></colgroup>
      <thead><tr><th scope="col">친구</th><th scope="col">결과</th><th scope="col">걸린 시간</th><th scope="col">막힌 곳</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="note" style="margin-top:6px">연습용 기록이에요. 우리 기록지는 종이에</p>
  </section>

  <section aria-labelledby="h-pick">
    <h2 id="h-pick">짚기</h2>
    <p class="q">두 장만 보고, 가장 자주 막힌 곳은?</p>
    <div class="cands" id="cands"></div>
    <div class="acts">
      <button class="btn main" id="open" type="button" disabled>나머지 펼치기</button>
    </div>
    <p class="say dim" id="say" aria-live="polite">한 곳을 짚어야 펼칠 수 있어요</p>
    <div class="bars" id="bars" hidden></div>
  </section>

  <section aria-labelledby="h-fix" id="fixSec" hidden>
    <h2 id="h-fix">많이 막힘·고치기 쉬움 표</h2>
    <div class="grid" id="grid"></div>
    <p class="q" style="margin-top:10px">다음에 고칠 점 한 가지는?</p>
    <div class="cands" id="fixes"></div>
    <p class="out" id="out" hidden><b>이 부스라면 기록지 맨 아래 칸에</b><span id="outText"></span></p>
    <p class="note" style="margin-top:8px">이제 우리 기록지로: 세기 → 1분 말하기(기록에 나온 수로) → 표에 놓기 → 맨 아래 칸 쓰기</p>
  </section>

  <section aria-label="판 넘기기">
    <div class="acts" style="margin-top:0">
      <button class="btn" id="next" type="button" disabled>다음 판</button>
      <button class="btn" id="reset" type="button">처음으로</button>
    </div>
  </section>
</div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // 막힌 곳 후보: 이름, 고치는 길, 고치기 쉬움(지도안 활동2: 활동 안내 고치기 / 코드 조정하기)
  var POOL = [
    { name: '어느 버튼인지', fix: '안내에 버튼 그림·화살표', easy: true },
    { name: 'LED 모양 뜻', fix: '안내에 모양과 뜻 짝 짓기', easy: true },
    { name: '흔들기를 모름', fix: '안내에 흔들기 그림', easy: true },
    { name: '안내 글이 김', fix: '글 줄이고 그림으로', easy: true },
    { name: '수신기가 늦음', fix: '코드의 기다리기 줄이기', easy: false },
    { name: 'A·B 결과 비슷', fix: '코드에서 LED 모양 바꾸기', easy: false }
  ];
  var FRIENDS = 6, SHOWN = 2;

  var rowsEl = $('rows'), candsEl = $('cands'), openBtn = $('open'), sayEl = $('say'), barsEl = $('bars');
  var fixSec = $('fixSec'), gridEl = $('grid'), fixesEl = $('fixes'), outEl = $('out'), outText = $('outText');
  var nextBtn = $('next'), resetBtn = $('reset'), boothEl = $('booth');

  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = rnd(0, i); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function take(arr, v) { var i = arr.indexOf(v); if (i >= 0) { arr.splice(i, 1); return true; } return false; }

  var lastKey = '', mislead = Math.random() < 0.5, booth = 0;
  var round = null, guess = -1, step = 'pick', fixPick = -1;

  // 한 판: 후보 셋, 줄 여섯. 가장 많은 곳 3번, 나머지 1~2번.
  function makeRound() {
    var idx, key;
    do {
      idx = shuffle([0, 1, 2, 3, 4, 5]).slice(0, 3);
      key = idx.slice().sort().join(',');
    } while (key === lastKey);
    lastKey = key;
    var cands = idx.map(function (i) { return POOL[i]; });
    var pairs = [[1, 1], [1, 2], [2, 1]];
    var p = pairs[rnd(0, 2)];
    var counts = [3, p[0], p[1]];          // 0번이 가장 많은 곳
    var bag = [];
    for (var c = 0; c < 3; c++) { for (var k = 0; k < counts[c]; k++) { bag.push(c); } }
    while (bag.length < FRIENDS) { bag.push(-1); }   // -1: 막힌 곳 없음

    // 첫 두 장: 판의 절반은 다른 곳을 가리키게, 절반은 실제와 같은 쪽을 가리키게
    mislead = !mislead;
    var first = [];
    if (mislead) {
      var other = counts[1] >= counts[2] ? 1 : 2;
      first.push(other); take(bag, other);
      if (counts[other] >= 2) { first.push(other); take(bag, other); }
      else { var o2 = other === 1 ? 2 : 1; first.push(o2); take(bag, o2); }
      first = shuffle(first);
    } else {
      first.push(0); take(bag, 0);
      if (take(bag, -1)) { first.push(-1); } else { first.push(0); take(bag, 0); }
      first = shuffle(first);
    }
    var order = first.concat(shuffle(bag));

    // 성공 3~5명. 막힌 곳이 없는 줄은 성공, 멈춤은 막힌 줄 가운데서.
    var success = rnd(3, 5);
    var stuckRows = [];
    for (var r = 0; r < FRIENDS; r++) { if (order[r] >= 0) { stuckRows.push(r); } }
    var stopN = Math.min(FRIENDS - success, stuckRows.length);
    var stops = shuffle(stuckRows.slice()).slice(0, stopN);
    var rows = [];
    for (r = 0; r < FRIENDS; r++) {
      var stop = stops.indexOf(r) >= 0;
      rows.push({
        who: '친구' + (r + 1),
        stop: stop,
        sec: stop ? null : (order[r] >= 0 ? rnd(60, 95) : rnd(25, 55)),
        where: order[r]
      });
    }
    var winner = 0;
    var order3 = shuffle([0, 1, 2]);   // 후보 단추 순서를 섞어 가장 많은 곳이 늘 첫째가 아니게
    var inMin = 0;
    for (r = 0; r < FRIENDS; r++) { if (!rows[r].stop && rows[r].sec <= 60) { inMin += 1; } }
    return { cands: cands, counts: counts, rows: rows, winner: winner, order: order3,
      success: FRIENDS - stopN, inMin: inMin };
  }

  function cell(tr, text, cls) {
    var td = document.createElement('td');
    td.textContent = text;
    if (cls) { td.className = cls; }
    tr.appendChild(td);
  }

  // upto: 몇 째 줄까지 펼쳐 보이나. 막 펼친 줄(fresh)은 잠깐 빛난다.
  function renderRows(upto, fresh) {
    rowsEl.innerHTML = '';
    for (var r = 0; r < round.rows.length; r++) {
      var row = round.rows[r];
      var tr = document.createElement('tr');
      if (r >= upto) {
        tr.className = 'hide';
        cell(tr, row.who); cell(tr, '?'); cell(tr, '?'); cell(tr, '?');
      } else {
        if (r === fresh) { tr.className = 'new'; }
        cell(tr, row.who);
        cell(tr, row.stop ? '멈춤' : '성공', row.stop ? 'stop' : 'ok');
        cell(tr, row.sec === null ? '—' : row.sec + '초');
        cell(tr, row.where < 0 ? '—' : round.cands[row.where].name, 'where');
      }
      rowsEl.appendChild(tr);
    }
  }

  function candButtons(wrap, onPick) {
    wrap.innerHTML = '';
    for (var i = 0; i < 3; i++) {
      var c = round.order[i];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = round.cands[c].name;
      b.setAttribute('data-c', String(c));
      b.setAttribute('aria-pressed', 'false');
      wrap.appendChild(b);
    }
    wrap.onclick = function (ev) {
      var b = ev.target.closest ? ev.target.closest('button') : null;
      if (!b || b.disabled) { return; }
      onPick(parseInt(b.getAttribute('data-c'), 10));
    };
  }

  function press(wrap, c) {
    var bs = wrap.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) {
      bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-c') === String(c) ? 'true' : 'false');
    }
  }

  function setSay(t, strong) { sayEl.textContent = t; sayEl.className = strong ? 'say' : 'say dim'; }

  function newRound() {
    round = makeRound();
    booth += 1;
    boothEl.textContent = '· 부스 ' + booth;
    guess = -1; fixPick = -1; step = 'pick';
    clearTick();
    renderRows(SHOWN, -1);
    candButtons(candsEl, pickGuess);
    openBtn.disabled = true;
    barsEl.hidden = true; barsEl.innerHTML = '';
    fixSec.hidden = true; outEl.hidden = true;
    nextBtn.disabled = true;
    setSay('한 곳을 짚어야 펼칠 수 있어요', false);
    if (window.Fun) { Fun.say(booth === 1 ? '기록 두 장만 보여요. 가장 자주 막힌 곳을 먼저 걸어 봐요.' : '부스 ' + booth + '의 기록이에요. 이번에도 두 장만 보고 걸어 봐요.'); }
  }

  // 펼치기 전까지는 다른 곳으로 바꿀 수 있다.
  function pickGuess(c) {
    if (step !== 'pick') { return; }
    guess = c;
    press(candsEl, c);
    openBtn.disabled = false;
    setSay('짚은 곳: ' + round.cands[c].name + '. 펼치기 전엔 바꿀 수 있어요', false);
  }

  var tick = null, stamped = false;
  function clearTick() { if (tick) { clearTimeout(tick); tick = null; } }
  var REDUCE = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 펼치기: 3~6째 줄을 한 줄씩 펼치며 막대를 그 자리에서 센다.
  function openAll() {
    if (step !== 'pick' || guess < 0) { return; }
    step = 'opening';
    openBtn.disabled = true;
    var bs = candsEl.querySelectorAll('button');
    for (var i = 0; i < bs.length; i++) { bs[i].disabled = true; }

    barsEl.innerHTML = '';
    var fills = {}, nums = {};
    for (i = 0; i < 3; i++) {
      var c = round.order[i];
      var d = document.createElement('div');
      d.className = 'bar' + (c === guess ? ' me' : '') + (c === round.winner ? ' top' : '');
      var sp = document.createElement('span'); sp.textContent = round.cands[c].name;
      var track = document.createElement('i'); var fill = document.createElement('b');
      track.appendChild(fill);
      var n = document.createElement('em');
      d.appendChild(sp); d.appendChild(track); d.appendChild(n);
      barsEl.appendChild(d);
      fills[c] = fill; nums[c] = n;
    }
    barsEl.hidden = false;
    setSay('세는 중이에요', false);
    if (window.Fun) { Fun.say('한 줄씩 펼쳐요. 짚은 곳의 막대가 따라잡는지 지켜봐요.', 'think'); }

    var upto = SHOWN;
    var countTo = function (k) {
      var got = [0, 0, 0];
      for (var r = 0; r < k; r++) { if (round.rows[r].where >= 0) { got[round.rows[r].where] += 1; } }
      for (var q = 0; q < 3; q++) {
        fills[q].style.width = (got[q] / FRIENDS * 100) + '%';
        nums[q].textContent = got[q] + '번';
      }
    };
    countTo(upto);
    var stepOne = function () {
      upto += 1;
      renderRows(upto, upto - 1);
      countTo(upto);
      if (upto < FRIENDS) { tick = setTimeout(stepOne, REDUCE ? 0 : 420); }
      else { tick = null; finish(); }
    };
    tick = setTimeout(stepOne, REDUCE ? 0 : 300);
  }

  function finish() {
    step = 'open';
    var top = round.cands[round.winner], topN = round.counts[round.winner], myN = round.counts[guess];
    var tally = ' 친구 ' + FRIENDS + '명 중 ' + round.success + '명 성공, 1분 안에 ' + round.inMin + '명.';
    if (guess === round.winner) {
      setSay('짚은 곳이 가장 많이 막혔어요(' + topN + '번).' + tally, true);
      if (window.Fun) { Fun.say('두 장으로 짚은 곳이 다 세어 본 것과 같았어요. 이번엔 두 장이 실제와 같은 쪽을 가리켰네요.', 'cheer'); Fun.burst(barsEl); }
    } else {
      setSay("짚은 곳 " + myN + "번, 가장 많은 곳 '" + top.name + "' " + topN + '번. ' + (topN - myN) +
        '번 차이예요.' + tally, true);
      if (window.Fun) { Fun.say('두 장으로 짚은 곳과 다 센 결과가 달랐어요. 기록이 적을 때는 어디서 갈릴 수 있을까요?', 'think'); Fun.shake(barsEl); }
    }
    renderGrid();
    candButtons(fixesEl, pickFix);
    fixSec.hidden = false;
    nextBtn.disabled = false;
    stamped = false;
  }

  function renderGrid() {
    gridEl.innerHTML = '';
    var heads = ['', '많이 막힘', '덜 막힘'];
    for (var h = 0; h < 3; h++) { var e = document.createElement('div'); e.className = 'hd'; e.textContent = heads[h]; gridEl.appendChild(e); }
    var rowsH = ['고치기\n쉬움', '고치기\n어려움'];
    for (var r = 0; r < 2; r++) {
      var rh = document.createElement('div'); rh.className = 'hd'; rh.textContent = rowsH[r]; gridEl.appendChild(rh);
      for (var col = 0; col < 2; col++) {
        var box = document.createElement('div'); box.className = 'cell';
        for (var i = 0; i < 3; i++) {
          var c = round.order[i], cand = round.cands[c];
          var many = c === round.winner;
          if ((cand.easy ? 0 : 1) === r && (many ? 0 : 1) === col) {
            var chip = document.createElement('span');
            chip.className = 'chip' + (c === fixPick ? ' pick' : '');
            chip.textContent = cand.name + ' ' + round.counts[c];
            box.appendChild(chip);
          }
        }
        gridEl.appendChild(box);
      }
    }
  }

  // 고칠 점은 학생이 고른다. 화면은 무엇이 낫다고 말하지 않는다.
  function pickFix(c) {
    if (step !== 'open') { return; }
    fixPick = c;
    press(fixesEl, c);
    renderGrid();
    if (window.Fun) { Fun.burst(gridEl); }
    var cand = round.cands[c];
    outText.textContent = '고칠 점: ' + cand.name + ' → ' + cand.fix + ' / 까닭: ' + FRIENDS + '명 중 ' +
      round.counts[c] + '번 막힘, 고치기 ' + (cand.easy ? '쉬움' : '어려움');
    outEl.hidden = false;
    if (window.Fun) {
      Fun.say('고칠 점으로 「' + cand.name + '」을 골랐어요. 까닭에 기록의 수가 들어 있는지 살펴봐요.');
      if (!stamped) { stamped = true; Fun.stamp(); }
    }
  }

  openBtn.addEventListener('click', openAll);
  nextBtn.addEventListener('click', function () { if (step === 'open') { newRound(); } });
  resetBtn.addEventListener('click', function () { booth = 0; newRound(); });
  window.addEventListener('pagehide', clearTick);

  newRound();
})();
</script>
