<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학습에서 빠질 사람 짚기 — 에듀다움</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45;
    
    background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:9px 14px 18px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(20px,4.8vw,26px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:13.5px;color:var(--muted);margin-top:2px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:8px 9px;margin-top:7px}
  h2{font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--muted)}

  .rows{display:grid;gap:3px}
  .pick{display:flex;align-items:center;gap:7px;width:100%;font-family:inherit;cursor:pointer;
    color:var(--ink);background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:4px 9px;box-shadow:var(--hard-sm);text-align:left}
  .pick img{width:56px;height:56px;flex:none;object-fit:contain;border-radius:6px}
  .pick .nm{flex:1;font-weight:700;font-size:14px}
  .pick .n{font-family:'Courier New',monospace;font-weight:700;font-size:14px;min-width:2.6em;
    text-align:right;color:var(--muted)}
  .pick .vd{font-weight:700;font-size:12.5px;min-width:6.4em;text-align:right}
  .pick[aria-pressed="true"]{background:var(--point-soft);border-width:3.5px}
  .pick:disabled{opacity:.45;cursor:default;box-shadow:none}
  .pick.guess{box-shadow:inset 6px 0 0 var(--point), var(--hard-sm)}


  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:8px 12px;box-shadow:var(--hard-sm);flex:1 1 90px}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}

  .say{margin-top:6px;font-size:13.5px;font-weight:700;min-height:1.4em}
  .say.dim{color:var(--muted);font-weight:700;font-size:12.5px}
  .note{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B28/">과정안</a></span>
    <span class="tag">31~32</span>
  </nav>

  <header>
    <h1>학습에서 빠질 사람 짚기</h1>
    <p class="lead">열 장을 넣어도 여전히 못 알아볼 사람을 짚어요</p>
  </header>

  <section aria-labelledby="h-p">
    <h2 id="h-p">쓸 사람 셋</h2>
    <div class="rows" id="people"></div>
  </section>

  <section aria-labelledby="h-w">
    <h2 id="h-w">열 장 더 넣을 곳</h2>
    <div class="rows" id="wheres"></div>
  </section>

  <section aria-labelledby="h-c">
    <h2 id="h-c">확인</h2>
    <p class="say dim" id="say">쓸 사람 셋을 골라요</p>
    <div class="acts">
      <button class="btn main" id="go" type="button" disabled>넣어 보기</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
    </div>
    <p class="note">우리 도우미를 왼손으로 써 봐요. 이 도우미는 수업용으로 만든 가상 도우미예요.</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  // 31차시 활동2 가상 도우미 학습 사진 서른 장(오른손 스물네 장). 줄마다 장수.
  var BASE = [
    { key:'오른손밝', nm:'오른손 · 밝은 곳', n:24 },
    { key:'왼손밝',   nm:'왼손 · 밝은 곳',   n:4 },
    { key:'긴소매밝', nm:'긴소매 · 밝은 곳', n:2 },
    { key:'오른손어', nm:'오른손 · 어두운 곳', n:0 }
  ];
  // 쓸 사람과 닮은 줄. 털장갑 손은 학습 사진에 맨손밖에 없어 닮은 줄이 없다(반창고 손은 오른손과 너무 닮아 2026-10-30 바꿈).
  var PEOPLE = [
    { nm:'오른손 · 교실', row:'오른손밝', img:'right_bright' },
    { nm:'왼손 · 교실',   row:'왼손밝', img:'left_bright' },
    { nm:'긴소매 · 교실', row:'긴소매밝', img:'sleeve_bright' },
    { nm:'오른손 · 복도', row:'오른손어', img:'right_dark' },
    { nm:'털장갑 낀 손 · 교실', row:null, img:'glove' }
  ];
  var WHERES = [
    { nm:'왼손 열 장',     row:'왼손밝', img:'add_left' },
    { nm:'긴소매 열 장',   row:'긴소매밝', img:'add_sleeve' },
    { nm:'어두운 곳 열 장', row:'오른손어', img:'add_dark' }
  ];

  var chosen = [];      // 고른 사람 (셋)
  var where = null;     // 넣을 곳
  var guess = null;     // 그대로일 사람. 사람 번호 또는 -1(없어요)
  var done = false;

  var pEls = [], wEls = [];

  (function build(){
    PEOPLE.forEach(function(p, i){
      var b = document.createElement('button');
      b.className = 'pick'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<img alt="" src="assets/' + p.img + '.webp"><span class="nm"></span><span class="n"></span><span class="vd"></span>';
      b.querySelector('.nm').textContent = p.nm;
      b.addEventListener('click', function(){ tapPerson(i); });
      $('people').appendChild(b); pEls.push(b);
    });
    // '없어요'도 짚을 수 있는 한 갈래다
    var none = document.createElement('button');
    none.className = 'pick'; none.type = 'button'; none.setAttribute('aria-pressed', 'false');
    none.innerHTML = '<span class="nm">그런 사람 없어요</span>';
    none.addEventListener('click', function(){ tapPerson(-1); });
    $('people').appendChild(none); pEls.push(none);

    WHERES.forEach(function(w, i){
      var b = document.createElement('button');
      b.className = 'pick'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<img alt="" src="assets/' + w.img + '.webp"><span class="nm"></span>';
      b.querySelector('.nm').textContent = w.nm;
      b.addEventListener('click', function(){ tapWhere(i); });
      $('wheres').appendChild(b); wEls.push(b);
    });

  })();

  function counts(){
    var c = {};
    BASE.forEach(function(r){ c[r.key] = r.n; });
    if (done && where !== null) c[WHERES[where].row] += 10;
    return c;
  }

  // 판정은 닮은 사진이 몇 장인지로만 갈린다. 미리 적어 두지 않는다.
  function verdict(p, c){
    if (p.row === null) return '거의 못 알아봐요';
    var n = c[p.row];
    if (n >= 8) return '잘 알아봐요';
    if (n >= 1) return '자주 놓쳐요';
    return '거의 못 알아봐요';
  }

  function tapPerson(i){
    if (done) return;
    if (chosen.length < 3){
      if (i < 0) return;                       // 셋을 다 고르기 전엔 '없어요'를 못 짚는다
      var k = chosen.indexOf(i);
      if (k >= 0) chosen.splice(k, 1); else chosen.push(i);
      render(); return;
    }
    if (where === null) return;                // 넣을 곳을 고른 뒤에 짚는다
    // 넣어 보기 전까지는 바꿀 수 있다.
    if (i >= 0 && chosen.indexOf(i) < 0) return;
    guess = i;
    render();
  }
  function tapWhere(i){
    if (done || chosen.length < 3) return;
    where = (where === i) ? null : i;
    render();
  }

  $('go').addEventListener('click', function(){
    if (chosen.length < 3 || where === null || guess === null) return;
    done = true;
    render();
    if (window.Fun) {
      var c = counts(), stuck = chosen.filter(function(i){ return verdict(PEOPLE[i], c) === '거의 못 알아봐요'; });
      var ok = (guess === -1) ? (stuck.length === 0) : (stuck.indexOf(guess) >= 0);
      var box = $('people');
      var jo = function(w, a, b){ var k = w.charCodeAt(w.length - 1) - 0xAC00; return w + (k >= 0 && k % 28 ? a : b); };
      var lead = ok ? '' : '짚은 것과 달랐어요. ';
      if (stuck.length === 0) { Fun.say(lead + jo(WHERES[where].nm, '을', '를') + ' 넣으니 고른 세 사람 모두 닮은 사진이 충분해졌어요. 다른 셋을 골라도 그럴까요?', ok ? 'cheer' : 'think'); if (ok) Fun.burst(box); else Fun.shake(box); }
      else { Fun.say(lead + jo(stuck.map(function(i){ return PEOPLE[i].nm; }).join(', '), '은', '는') + ' 넣은 뒤에도 닮은 사진이 없어요. 장수 칸을 보며 누구의 사진이 더 필요한지 짝과 말해 봐요.', 'think'); Fun.shake(box); }
      Fun.stamp();
    }
  });
  $('reset').addEventListener('click', function(){
    chosen = []; where = null; guess = null; done = false;
    render();
    if (window.Fun) Fun.say('이번에는 다른 세 사람과 다른 곳으로 해 봐요.');
  });

  function render(){
    var c = counts();
    var stuck = [];    // 넣은 뒤에도 거의 못 알아보는 사람
    if (done){
      chosen.forEach(function(i){
        if (verdict(PEOPLE[i], c) === '거의 못 알아봐요') stuck.push(i);
      });
    }

    PEOPLE.forEach(function(p, i){
      var b = pEls[i];
      b.setAttribute('aria-pressed', chosen.indexOf(i) >= 0 ? 'true' : 'false');
      b.classList.toggle('guess', guess === i);
      b.querySelector('.n').textContent = (p.row === null) ? '0장' : (c[p.row] + '장');
      b.querySelector('.vd').textContent = done && chosen.indexOf(i) >= 0 ? verdict(p, c) : '';
      b.disabled = done || (chosen.length >= 3 && chosen.indexOf(i) < 0 && guess === null && where === null);
    });
    var noneEl = pEls[PEOPLE.length];
    noneEl.setAttribute('aria-pressed', guess === -1 ? 'true' : 'false');
    noneEl.classList.toggle('guess', guess === -1);
    noneEl.disabled = done || chosen.length < 3 || where === null;

    WHERES.forEach(function(w, i){
      wEls[i].setAttribute('aria-pressed', where === i ? 'true' : 'false');
      wEls[i].disabled = done || chosen.length < 3;
    });


    var s = $('say');
    if (chosen.length < 3){ s.textContent = '쓸 사람 셋을 골라요'; s.className = 'say dim'; }
    else if (where === null){ s.textContent = '열 장 넣을 곳을 골라요'; s.className = 'say dim'; }
    else if (guess === null){ s.textContent = '열 장을 넣어도 여전히 못 알아볼 사람을 짚어요'; s.className = 'say dim'; }
    else if (!done){ s.textContent = '넣어 보기를 눌러요'; s.className = 'say dim'; }
    else {
      var ok = (guess === -1) ? (stuck.length === 0) : (stuck.indexOf(guess) >= 0);
      if (ok) s.textContent = guess === -1 ? '예상대로 모두 알아보게 됐어요' : '예상대로 이 사람은 여전히 못 알아봐요';
      else if (stuck.length === 0) s.textContent = '여전히 못 알아볼 사람은 없었어요';
      else s.textContent = '다른 사람이 여전히 못 알아봐요';
      s.className = 'say';
    }

    $('go').disabled = done || guess === null;
  }

  render();
})();
</script>
<script src="../assets/play/fun.js" data-block="B28" data-mission="도우미가 알아보기 어려운 사람이 없게 사진 열 장을 어디에 더 넣을지 골라요. 넣기 전에, 열 장을 넣어도 여전히 못 알아볼 사람을 먼저 짚어요."></script>
</body>
</html>
