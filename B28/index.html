<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>빠진 사람 찾기 — 에듀다움</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#12B76A; --point-soft:#D6F5E6; --muted:#5E5E5E;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:9px 14px 18px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;
    font-size:14px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;border:2.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(20px,4.8vw,26px);font-weight:900;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:13.5px;color:var(--muted);margin-top:2px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:8px 9px;margin-top:7px}
  h2{font-size:12.5px;font-weight:900;margin-bottom:5px;color:var(--muted)}

  .rows{display:grid;gap:3px}
  .pick{display:flex;align-items:center;gap:7px;width:100%;font-family:inherit;cursor:pointer;
    color:var(--ink);background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:4px 9px;box-shadow:var(--hard-sm);text-align:left}
  .pick .nm{flex:1;font-weight:900;font-size:14px}
  .pick .n{font-family:'Courier New',monospace;font-weight:900;font-size:14px;min-width:2.6em;
    text-align:right;color:var(--muted)}
  .pick .vd{font-weight:900;font-size:12.5px;min-width:6.4em;text-align:right}
  .pick[aria-pressed="true"]{background:var(--point-soft);border-width:3.5px}
  .pick:disabled{opacity:.45;cursor:default;box-shadow:none}
  .pick.guess{box-shadow:inset 6px 0 0 var(--point), var(--hard-sm)}


  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:8px 12px;box-shadow:var(--hard-sm);flex:1 1 90px}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}

  .say{margin-top:6px;font-size:13.5px;font-weight:900;min-height:1.4em}
  .say.dim{color:var(--muted);font-weight:700;font-size:12.5px}
  .note{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">← 전체 목록</a>
    <span class="tag">31~32</span>
  </nav>

  <header>
    <h1>빠진 사람 찾기</h1>
    <p class="lead">넣어도 그대로일 사람을 짚어요</p>
  </header>

  <section aria-labelledby="h-p">
    <h2 id="h-p">쓸 사람 셋</h2>
    <div class="rows" id="people"></div>
  </section>

  <section aria-labelledby="h-w">
    <h2 id="h-w">열 장 더 넣을 곳</h2>
    <div class="rows" id="wheres"></div>
  </section>

  <section aria-labelledby="h-c">
    <h2 id="h-c">확인</h2>
    <p class="say dim" id="say">쓸 사람 셋을 골라요</p>
    <div class="acts">
      <button class="btn main" id="go" type="button" disabled>넣어 보기</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
    </div>
    <p class="note">사진은 교실에서 직접 찍어요</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  // 31차시 활동1 구성표 그대로. 줄마다 학습 사진 장수.
  var BASE = [
    { key:'오른손밝', nm:'오른손 · 밝은 곳', n:24 },
    { key:'왼손밝',   nm:'왼손 · 밝은 곳',   n:4 },
    { key:'긴소매밝', nm:'긴소매 · 밝은 곳', n:2 },
    { key:'오른손어', nm:'오른손 · 어두운 곳', n:0 }
  ];
  // 쓸 사람과 닮은 줄. 반창고 손은 닮은 줄이 없다.
  var PEOPLE = [
    { nm:'오른손 · 교실', row:'오른손밝' },
    { nm:'왼손 · 교실',   row:'왼손밝' },
    { nm:'긴소매 · 교실', row:'긴소매밝' },
    { nm:'오른손 · 복도', row:'오른손어' },
    { nm:'반창고 손 · 교실', row:null }
  ];
  var WHERES = [
    { nm:'왼손 열 장',     row:'왼손밝' },
    { nm:'긴소매 열 장',   row:'긴소매밝' },
    { nm:'어두운 곳 열 장', row:'오른손어' }
  ];

  var chosen = [];      // 고른 사람 (셋)
  var where = null;     // 넣을 곳
  var guess = null;     // 그대로일 사람. 사람 번호 또는 -1(없어요)
  var done = false;

  var pEls = [], wEls = [];

  (function build(){
    PEOPLE.forEach(function(p, i){
      var b = document.createElement('button');
      b.className = 'pick'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="nm"></span><span class="n"></span><span class="vd"></span>';
      b.querySelector('.nm').textContent = p.nm;
      b.addEventListener('click', function(){ tapPerson(i); });
      $('people').appendChild(b); pEls.push(b);
    });
    // '없어요'도 짚을 수 있는 한 갈래다
    var none = document.createElement('button');
    none.className = 'pick'; none.type = 'button'; none.setAttribute('aria-pressed', 'false');
    none.innerHTML = '<span class="nm">그런 사람 없어요</span>';
    none.addEventListener('click', function(){ tapPerson(-1); });
    $('people').appendChild(none); pEls.push(none);

    WHERES.forEach(function(w, i){
      var b = document.createElement('button');
      b.className = 'pick'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="nm"></span>';
      b.querySelector('.nm').textContent = w.nm;
      b.addEventListener('click', function(){ tapWhere(i); });
      $('wheres').appendChild(b); wEls.push(b);
    });

  })();

  function counts(){
    var c = {};
    BASE.forEach(function(r){ c[r.key] = r.n; });
    if (done && where !== null) c[WHERES[where].row] += 10;
    return c;
  }

  // 판정은 닮은 사진이 몇 장인지로만 갈린다. 미리 적어 두지 않는다.
  function verdict(p, c){
    if (p.row === null) return '거의 못 알아봐요';
    var n = c[p.row];
    if (n >= 8) return '잘 알아봐요';
    if (n >= 1) return '자주 놓쳐요';
    return '거의 못 알아봐요';
  }

  function tapPerson(i){
    if (done) return;
    if (chosen.length < 3){
      if (i < 0) return;                       // 셋을 다 고르기 전엔 '없어요'를 못 짚는다
      var k = chosen.indexOf(i);
      if (k >= 0) chosen.splice(k, 1); else chosen.push(i);
      render(); return;
    }
    if (where === null) return;                // 넣을 곳을 고른 뒤에 짚는다
    if (guess !== null) return;                // 짚기는 한 번. 무르지 못한다.
    if (i >= 0 && chosen.indexOf(i) < 0) return;
    guess = i;
    render();
  }
  function tapWhere(i){
    if (done || chosen.length < 3 || guess !== null) return;
    where = (where === i) ? null : i;
    render();
  }

  $('go').addEventListener('click', function(){
    if (chosen.length < 3 || where === null || guess === null) return;
    done = true;
    render();
  });
  $('reset').addEventListener('click', function(){
    chosen = []; where = null; guess = null; done = false;
    render();
  });

  function render(){
    var c = counts();
    var stuck = [];    // 넣은 뒤에도 거의 못 알아보는 사람
    if (done){
      chosen.forEach(function(i){
        if (verdict(PEOPLE[i], c) === '거의 못 알아봐요') stuck.push(i);
      });
    }

    PEOPLE.forEach(function(p, i){
      var b = pEls[i];
      b.setAttribute('aria-pressed', chosen.indexOf(i) >= 0 ? 'true' : 'false');
      b.classList.toggle('guess', guess === i);
      b.querySelector('.n').textContent = (p.row === null) ? '0장' : (c[p.row] + '장');
      b.querySelector('.vd').textContent = done && chosen.indexOf(i) >= 0 ? verdict(p, c) : '';
      b.disabled = done || (chosen.length >= 3 && chosen.indexOf(i) < 0 && guess === null && where === null);
    });
    var noneEl = pEls[PEOPLE.length];
    noneEl.setAttribute('aria-pressed', guess === -1 ? 'true' : 'false');
    noneEl.classList.toggle('guess', guess === -1);
    noneEl.disabled = done || chosen.length < 3 || where === null || guess !== null;

    WHERES.forEach(function(w, i){
      wEls[i].setAttribute('aria-pressed', where === i ? 'true' : 'false');
      wEls[i].disabled = done || chosen.length < 3 || guess !== null;
    });


    var s = $('say');
    if (chosen.length < 3){ s.textContent = '쓸 사람 셋을 골라요'; s.className = 'say dim'; }
    else if (where === null){ s.textContent = '열 장 넣을 곳을 골라요'; s.className = 'say dim'; }
    else if (guess === null){ s.textContent = '넣어도 그대로일 사람을 짚어요'; s.className = 'say dim'; }
    else if (!done){ s.textContent = '넣어 보기를 눌러요'; s.className = 'say dim'; }
    else {
      var ok = (guess === -1) ? (stuck.length === 0) : (stuck.indexOf(guess) >= 0);
      if (ok) s.textContent = '짚은 대로 그대로예요';
      else if (stuck.length === 0) s.textContent = '그대로인 사람은 없었어요';
      else s.textContent = '다른 사람이 그대로였어요';
      s.className = 'say';
    }

    $('go').disabled = done || guess === null;
  }

  render();
})();
</script>
</body>
</html>
