<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>규칙 순서를 바꾸면 — 에듀다움 B20</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#7C3AED; --point-soft:#EDE7FF;
    --amber:#F59E0B; --amber-soft:#FFF0C7; --muted:#5A5A5A;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 30px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:14px;background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:9px 15px;box-shadow:var(--hard-sm);min-height:44px}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;
    border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:var(--hard-sm)}
  h1{font-size:clamp(23px,5.4vw,34px);font-weight:900;letter-spacing:-.035em;line-height:1.05}
  .lead{font-size:14px;color:var(--muted);font-weight:700;margin-top:5px}
  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:8px 11px;margin-top:7px}
  h2{font-size:13.5px;font-weight:900;letter-spacing:-.02em;margin-bottom:8px;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:2.5px solid var(--ink);background:var(--amber);font-size:14.5px;font-weight:900;
    padding:9px 14px;border-radius:var(--r-sm);min-height:46px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s;flex:1 1 96px}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none}
  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

  /* 규칙표 */
  .rules{display:grid;gap:7px}
  .rule{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
    border:2.5px solid var(--ink);background:var(--surface);border-radius:var(--r-sm);
    padding:7px 9px;min-height:48px}
  .rule.target{background:var(--point-soft);border-width:3.5px}
  .rule .num{flex:0 0 28px;height:28px;display:grid;place-items:center;font-weight:900;font-size:14px;
    background:var(--point);color:#fff;border:2px solid var(--ink);border-radius:8px}
  .rule .cond{flex:1;min-width:0;font-size:14px;font-weight:800;word-break:keep-all}
  .rule .box{flex:0 0 auto;font-weight:900;font-size:15px;background:var(--amber-soft);
    border:2px solid var(--ink);border-radius:8px;padding:3px 10px}
  .rule .mk2{flex:0 0 auto;display:none}
  .rule.target .mk2{display:block}
  .hint{font-size:12.5px;font-weight:700;color:var(--muted);margin-top:8px}

  /* 짚기 */
  .gstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:9px}
  .gc{min-height:44px;font-weight:900;font-size:16px;background:var(--surface);color:var(--ink);
    border:2.5px solid var(--ink);border-radius:9px;box-shadow:2px 2px 0 var(--ink);
    transition:transform .1s,box-shadow .1s,background .1s}
  .gc[aria-pressed="true"]{background:var(--point);color:#fff}
  .msg{margin-top:9px;font-size:14px;font-weight:900;min-height:20px}
  .msg.dim{color:var(--muted);font-weight:700}

  /* 카드 18장 */
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}

  .card{position:relative;border:2.5px solid var(--ink);border-radius:8px;background:var(--paper);
    padding:2px 2px 1px;text-align:center;line-height:1}
  .card .idx{position:absolute;left:2px;top:1px;font-size:8.5px;font-weight:800;color:var(--muted)}
  .card .v{display:block;font-size:12px;font-weight:900;line-height:1;margin-top:0}
  .card.diff{background:var(--point-soft);border-color:var(--point);border-width:3.5px}
  .card .mk{position:absolute;right:3px;top:3px;display:none}
  .card.diff .mk{display:block}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">전체 목록</a>
    <span class="tag">11~12</span>
  </nav>
  <header>
    <h1>규칙 순서를 바꾸면</h1>
    <p class="lead">몇 장이 옮겨갈지 짚어요</p>
  </header>

  <section aria-labelledby="h-rule">
    <h2 id="h-rule">규칙표</h2>
    <div class="rules" id="rules"></div>
    <p class="hint" id="hint">표시된 두 줄이 자리를 바꿔요</p>

    <div class="gstrip" id="gstrip" role="group" aria-label="옮겨갈 카드 수 짚기"></div>
    <p class="msg dim" id="msg" role="status" aria-live="polite">몇 장이 옮겨갈지 짚어요</p>
    <div class="acts">
      <button class="btn" id="swapBtn" type="button" disabled>순서 바꾸기</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
      <button class="btn" id="nextBtn" type="button">다음 판</button>
    </div>
  </section>

  <section aria-labelledby="h-card">
    <h2 id="h-card">카드 18장</h2>
    <div class="cards" id="cards"></div>
  </section>
</div>

<script>
(function(){
  'use strict';
  var INK = '#141414';
  var NUM = ['①', '②', '③', '④'];
  var IDS = ['edge', 'colorA', 'colorB', 'edgeShape'];
  var IDX = { edge: 0, colorA: 1, colorB: 2, edgeShape: 3 };
  var PAIRS_OTHER = [['edge', 'colorA'], ['edge', 'colorB'], ['edge', 'edgeShape'],
    ['colorA', 'edgeShape'], ['colorB', 'edgeShape']];

  var rulesBox = document.getElementById('rules');
  var cardsBox = document.getElementById('cards');
  var gstrip = document.getElementById('gstrip');
  var msgEl = document.getElementById('msg');
  var hintEl = document.getElementById('hint');
  var swapBtn = document.getElementById('swapBtn');
  var resetBtn = document.getElementById('reset');
  var nextBtn = document.getElementById('nextBtn');

  var RULES, cardDeck, baseOrder, curOrder, pos1, pos2, guess, confirmed, lastSig;
  lastSig = null;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function buildCards() {
    var COLORS = [['빨강', '#EF4444'], ['파랑', '#3D5AFE'], ['노랑', '#F5C518']];
    var SHAPES = ['동그라미', '세모', '네모'];
    var deck = [];
    [false, true].forEach(function (edge) {
      SHAPES.forEach(function (sh) {
        COLORS.forEach(function (co) {
          deck.push({ shape: sh, color: co[0], hex: co[1], edge: edge });
        });
      });
    });
    deck.forEach(function (c, i) { c.n = i + 1; });
    return shuffle(deck);
  }

  function makeRound() {
    var colors = shuffle(['빨강', '파랑', '노랑']);
    var colorA = colors[0], colorB = colors[1];
    var shapes = ['동그라미', '세모', '네모'];
    var shapeZ = shapes[Math.floor(Math.random() * 3)];
    var rules = [
      { cond: '테두리가 있으면', box: '가', f: function (c) { return c.edge; } },
      { cond: colorA + '이면', box: '나', f: function (c) { return c.color === colorA; } },
      { cond: colorB + '이면', box: '다', f: function (c) { return c.color === colorB; } },
      { cond: '테두리 있는 ' + shapeZ + '면', box: '다', f: function (c) { return c.edge && c.shape === shapeZ; } }
    ];
    var pairIds = Math.random() < 0.3
      ? ['colorA', 'colorB']
      : PAIRS_OTHER[Math.floor(Math.random() * PAIRS_OTHER.length)];
    // 두 줄은 늘 이웃해서 놓는다 — 사이에 낀 규칙이 있으면 바꿀 때 옮겨가는 장수가
    // 가늠하기 어렵게 커진다. 이웃이면 두 규칙 자신의 겹침만으로 정해져 0~6 안에 든다.
    var restIds = IDS.filter(function (id) { return pairIds.indexOf(id) < 0; });
    var restOrder = shuffle(restIds);
    var slot = Math.floor(Math.random() * 3);
    var pairOrder = Math.random() < 0.5 ? [pairIds[0], pairIds[1]] : [pairIds[1], pairIds[0]];
    var order = new Array(4);
    order[slot] = IDX[pairOrder[0]];
    order[slot + 1] = IDX[pairOrder[1]];
    var ri = 0;
    for (var i = 0; i < 4; i++) { if (order[i] === undefined) { order[i] = IDX[restOrder[ri++]]; } }
    var p1 = slot, p2 = slot + 1;
    return { rules: rules, order: order, p1: p1, p2: p2, deck: buildCards() };
  }

  function sigOf(r) {
    return r.rules.map(function (x) { return x.cond + x.box; }).join('|') + '#' + r.order.join(',') +
      '#' + r.p1 + ',' + r.p2;
  }

  function judge(ord, card) {
    for (var i = 0; i < ord.length; i++) { if (RULES[ord[i]].f(card)) { return RULES[ord[i]].box; } }
    return '—';
  }

  function shapeSvg(c) {
    var inner = '';
    if (c.shape === '동그라미') { inner = '<circle cx="22" cy="23" r="9.5" fill="' + c.hex + '" stroke="' + INK + '" stroke-width="2.2"/>'; }
    else if (c.shape === '세모') { inner = '<path d="M22 13 L32 32 L12 32 Z" fill="' + c.hex + '" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="round"/>'; }
    else { inner = '<rect x="13" y="14" width="18" height="18" rx="3" fill="' + c.hex + '" stroke="' + INK + '" stroke-width="2.2"/>'; }
    var ring = c.edge ? '<rect x="3.2" y="3.2" width="37.6" height="37.6" rx="8" fill="none" stroke="' + INK + '" stroke-width="2.6"/>' : '';
    return '<svg width="28" height="28" viewBox="0 0 44 44" aria-hidden="true" focusable="false">' + ring + inner + '</svg>';
  }

  var MARK = '<svg class="mk" width="13" height="13" viewBox="0 0 14 14" aria-hidden="true" focusable="false">'
    + '<path d="M7 1.5 8.7 5.2 12.5 5.7 9.7 8.4 10.4 12.2 7 10.4 3.6 12.2 4.3 8.4 1.5 5.7 5.3 5.2Z"'
    + ' fill="#7C3AED" stroke="' + INK + '" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  var SWAPICON = '<svg class="mk2" width="16" height="16" viewBox="0 0 20 20" aria-hidden="true" focusable="false">'
    + '<path d="M4 7h10M11 4l3 3-3 3M16 13H6M9 10l-3 3 3 3" fill="none" stroke="' + INK + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function drawRules() {
    rulesBox.innerHTML = '';
    for (var i = 0; i < curOrder.length; i++) {
      var r = RULES[curOrder[i]];
      var row = document.createElement('div');
      row.className = 'rule' + (!confirmed && (i === pos1 || i === pos2) ? ' target' : '');
      var num = document.createElement('span'); num.className = 'num'; num.textContent = NUM[i];
      var cond = document.createElement('span'); cond.className = 'cond'; cond.textContent = r.cond;
      var box = document.createElement('span'); box.className = 'box'; box.textContent = r.box;
      var mk2 = document.createElement('span'); mk2.className = 'mk2'; mk2.innerHTML = SWAPICON;
      row.appendChild(num); row.appendChild(cond); row.appendChild(box); row.appendChild(mk2);
      rulesBox.appendChild(row);
    }
  }

  function drawCards() {
    cardsBox.innerHTML = '';
    for (var i = 0; i < cardDeck.length; i++) {
      var c = cardDeck[i];
      var before = judge(baseOrder, c);
      var now = confirmed ? judge(curOrder, c) : before;
      var changed = confirmed && now !== before;
      var tile = document.createElement('div');
      tile.className = 'card' + (changed ? ' diff' : '');
      tile.setAttribute('role', 'img');
      tile.setAttribute('aria-label', c.color + ' ' + c.shape + (c.edge ? ', 테두리 있음' : ', 테두리 없음')
        + ', 상자 ' + now + (changed ? ', 달라짐' : ''));
      var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = String(c.n);
      var mark = document.createElement('span'); mark.innerHTML = MARK;
      var pic = document.createElement('span'); pic.innerHTML = shapeSvg(c);
      var val = document.createElement('span'); val.className = 'v'; val.textContent = now;
      tile.appendChild(idx); tile.appendChild(mark); tile.appendChild(pic); tile.appendChild(val);
      cardsBox.appendChild(tile);
    }
  }

  function drawGuess() {
    gstrip.innerHTML = '';
    for (var n = 0; n <= 6; n++) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'gc';
      b.textContent = String(n);
      b.setAttribute('aria-pressed', guess === n ? 'true' : 'false');
      b.disabled = confirmed;
      (function (v) { b.addEventListener('click', function () { pick(v); }); })(n);
      gstrip.appendChild(b);
    }
  }

  function pick(n) {
    if (confirmed) { return; }
    guess = n;
    drawGuess();
    swapBtn.disabled = false;
    msgEl.textContent = '순서 바꾸기를 눌러요';
    msgEl.className = 'msg dim';
  }

  function doSwap() {
    if (confirmed || guess === null) { return; }
    confirmed = true;
    curOrder = baseOrder.slice();
    var t = curOrder[pos1]; curOrder[pos1] = curOrder[pos2]; curOrder[pos2] = t;
    var actual = 0;
    cardDeck.forEach(function (c) { if (judge(baseOrder, c) !== judge(curOrder, c)) { actual++; } });
    var diff = actual - guess;
    var msg = diff === 0 ? ('짚은 대로 ' + actual + '장 옮겨갔어요')
      : (diff > 0 ? (diff + '장 더 옮겨갔어요') : ((-diff) + '장 덜 옮겨갔어요'));
    msgEl.textContent = msg;
    msgEl.className = 'msg';
    hintEl.textContent = '순서가 바뀌었어요';
    drawRules(); drawCards(); drawGuess();
    swapBtn.disabled = true;
  }

  function restartRound() {
    curOrder = baseOrder.slice();
    guess = null; confirmed = false;
    hintEl.textContent = '표시된 두 줄이 자리를 바꿔요';
    msgEl.textContent = '몇 장이 옮겨갈지 짚어요';
    msgEl.className = 'msg dim';
    swapBtn.disabled = true;
    drawRules(); drawCards(); drawGuess();
  }

  function newRound() {
    var r, sig, tries = 0;
    do { r = makeRound(); sig = sigOf(r); tries++; } while (lastSig !== null && sig === lastSig && tries < 10);
    lastSig = sig;
    RULES = r.rules; baseOrder = r.order; pos1 = r.p1; pos2 = r.p2; cardDeck = r.deck;
    restartRound();
  }

  swapBtn.addEventListener('click', doSwap);
  resetBtn.addEventListener('click', restartRound);
  nextBtn.addEventListener('click', newRound);

  newRound();
})();
</script>
</body>
</html>
