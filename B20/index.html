<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>규칙 순서 바꾸기 — 에듀다움 B20</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#7C3AED; --point-soft:#EDE7FF;
    --amber:#F59E0B; --amber-soft:#FFF0C7; --muted:#5A5A5A;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 44px}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:14px;background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:9px 15px;box-shadow:var(--hard-sm);min-height:44px}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;
    border:2.5px solid var(--ink);border-radius:999px;padding:8px 14px;box-shadow:var(--hard-sm)}
  h1{font-size:clamp(25px,5.6vw,38px);font-weight:900;letter-spacing:-.035em;line-height:1.05}
  .lead{font-size:15px;color:var(--muted);font-weight:700;margin-top:7px}
  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:15px 13px;margin-top:14px}
  h2{font-size:14.5px;font-weight:900;letter-spacing:-.02em;margin-bottom:10px;color:var(--muted)}
  button{font-family:inherit;cursor:pointer;color:var(--ink)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:2.5px solid var(--ink);background:var(--amber);font-size:15px;font-weight:900;
    padding:10px 18px;border-radius:var(--r-sm);min-height:44px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s;margin-top:12px}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

  /* 규칙표 */
  .rules{display:grid;gap:8px}
  .rule{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    border:2.5px solid var(--ink);background:var(--surface);border-radius:var(--r-sm);
    padding:8px 10px;min-height:54px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .rule:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .rule:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .rule[disabled]{background:var(--paper);box-shadow:none;transform:none;cursor:default;opacity:.75}
  .rule .num{flex:0 0 30px;height:30px;display:grid;place-items:center;font-weight:900;font-size:15px;
    background:var(--point);color:#fff;border:2px solid var(--ink);border-radius:8px}
  .rule .cond{flex:1;min-width:0;font-size:15px;font-weight:800;word-break:keep-all}
  .rule .box{flex:0 0 auto;font-weight:900;font-size:16px;background:var(--point-soft);
    border:2px solid var(--ink);border-radius:8px;padding:3px 11px}
  .hint{font-size:13px;font-weight:700;color:var(--muted);margin-top:9px}

  /* 결과 */
  .readout{display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:900;
    background:var(--ink);color:var(--paper);border-radius:999px;padding:7px 15px}
  .readout b{color:var(--amber)}
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:12px}
  @media(max-width:560px){.cards{grid-template-columns:repeat(3,1fr)}}
  .card{position:relative;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper);
    padding:5px 3px 4px;text-align:center}
  .card .idx{position:absolute;left:4px;top:2px;font-size:10.5px;font-weight:800;color:var(--muted)}
  .card .v{display:block;font-size:16px;font-weight:900;line-height:1.15;margin-top:1px}
  .card.diff{background:var(--point-soft);border-color:var(--point);border-width:3.5px}
  .card .mk{position:absolute;right:3px;top:3px;display:none}
  .card.diff .mk{display:block}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">전체 목록</a>
    <span class="tag">B20</span>
  </nav>
  <header>
    <h1>규칙 순서를 바꾸면</h1>
    <p class="lead">위에서 처음 맞는 규칙 하나만 걸려요</p>
  </header>

  <section aria-labelledby="h-rule">
    <h2 id="h-rule">규칙표</h2>
    <div class="rules" id="rules"></div>
    <p class="hint">규칙 줄을 누르면 한 칸 위로 올라가요</p>
  </section>

  <section aria-labelledby="h-card">
    <h2 id="h-card">카드 18장</h2>
    <p class="readout" id="out">처음 순서</p>
    <div class="cards" id="cards"></div>
    <button class="btn" id="reset" type="button">다시 하기</button>
  </section>
</div>

<script>
(function(){
  'use strict';
  var INK = '#141414';
  var COLORS = [['빨강','#EF4444'],['파랑','#3D5AFE'],['노랑','#F5C518']];
  var SHAPES = ['동그라미','세모','네모'];

  var cards = [];
  [false,true].forEach(function(edge){
    SHAPES.forEach(function(sh){
      COLORS.forEach(function(co){
        cards.push({shape:sh,color:co[0],hex:co[1],edge:edge});
      });
    });
  });
  cards.forEach(function(c,i){ c.n = i + 1; });

  var RULES = [
    {cond:'테두리가 있으면',   box:'가', f:function(c){ return c.edge; }},
    {cond:'빨강이면',         box:'나', f:function(c){ return c.color === '빨강'; }},
    {cond:'파랑이면',         box:'다', f:function(c){ return c.color === '파랑'; }},
    {cond:'테두리 있는 네모면', box:'다', f:function(c){ return c.edge && c.shape === '네모'; }}
  ];
  var START = [0,1,2,3];
  var order = START.slice();

  function judge(ord, c){
    for (var i = 0; i < ord.length; i++){
      var r = RULES[ord[i]];
      if (r.f(c)) return r.box;
    }
    return '—';
  }

  var NUM = ['①','②','③','④'];
  var rulesBox = document.getElementById('rules');
  var cardsBox = document.getElementById('cards');
  var out = document.getElementById('out');

  function shapeSvg(c){
    var inner = '';
    if (c.shape === '동그라미'){
      inner = '<circle cx="22" cy="23" r="9.5" fill="' + c.hex + '" stroke="' + INK + '" stroke-width="2.2"/>';
    } else if (c.shape === '세모'){
      inner = '<path d="M22 13 L32 32 L12 32 Z" fill="' + c.hex + '" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="round"/>';
    } else {
      inner = '<rect x="13" y="14" width="18" height="18" rx="3" fill="' + c.hex + '" stroke="' + INK + '" stroke-width="2.2"/>';
    }
    var ring = c.edge
      ? '<rect x="3.2" y="3.2" width="37.6" height="37.6" rx="8" fill="none" stroke="' + INK + '" stroke-width="2.6"/>'
      : '';
    return '<svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" focusable="false">' + ring + inner + '</svg>';
  }

  var MARK = '<svg class="mk" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false">'
    + '<path d="M7 1.5 8.7 5.2 12.5 5.7 9.7 8.4 10.4 12.2 7 10.4 3.6 12.2 4.3 8.4 1.5 5.7 5.3 5.2Z"'
    + ' fill="#7C3AED" stroke="' + INK + '" stroke-width="1.4" stroke-linejoin="round"/></svg>';

  function buildCards(){
    var html = '';
    for (var i = 0; i < cards.length; i++){
      var c = cards[i];
      html += '<div class="card" id="c' + c.n + '" role="img">'
            + '<span class="idx">' + c.n + '</span>' + MARK
            + shapeSvg(c) + '<span class="v" id="v' + c.n + '"></span></div>';
    }
    cardsBox.innerHTML = html;
  }

  function part(cls, text, hide){
    var s = document.createElement('span');
    s.className = cls;
    s.textContent = text;
    if (hide) s.setAttribute('aria-hidden', 'true');
    return s;
  }

  function drawRules(){
    rulesBox.textContent = '';
    for (var i = 0; i < order.length; i++){
      var r = RULES[order[i]];
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'rule';
      b.setAttribute('data-pos', String(i));
      if (i === 0) b.disabled = true;
      b.setAttribute('aria-label', r.cond + ' 상자 ' + r.box + ', 한 칸 위로');
      b.appendChild(part('num', NUM[i], true));
      b.appendChild(part('cond', r.cond, false));
      b.appendChild(part('box', r.box, false));
      rulesBox.appendChild(b);
    }
  }

  function drawResult(){
    var diff = 0;
    for (var i = 0; i < cards.length; i++){
      var c = cards[i];
      var now = judge(order, c);
      var base = judge(START, c);
      document.getElementById('v' + c.n).textContent = now;
      var tile = document.getElementById('c' + c.n);
      var changed = (now !== base);
      if (changed) diff++;
      tile.className = changed ? 'card diff' : 'card';
      tile.setAttribute('aria-label', c.color + ' ' + c.shape
        + (c.edge ? ', 테두리 있음' : ', 테두리 없음') + ', 상자 ' + now
        + (changed ? ', 달라짐' : ''));
    }
    var same = true;
    for (var k = 0; k < order.length; k++){ if (order[k] !== START[k]) same = false; }
    out.innerHTML = same
      ? '처음 순서'
      : '달라진 카드 <b>' + diff + '</b>장';
  }

  function render(){ drawRules(); drawResult(); }

  rulesBox.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.rule') : null;
    if (!b || b.disabled) return;
    var p = parseInt(b.getAttribute('data-pos'), 10);
    if (!(p > 0)) return;
    var t = order[p - 1]; order[p - 1] = order[p]; order[p] = t;
    render();
    var next = rulesBox.querySelector('[data-pos="' + (p - 1) + '"]');
    if (next && !next.disabled) next.focus();
  });

  document.getElementById('reset').addEventListener('click', function(){
    order = START.slice();
    render();
  });

  buildCards();
  render();
})();
</script>
</body>
</html>
