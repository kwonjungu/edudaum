<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>보내기 전 수신 화면 맞히기 — 에듀다움 B12</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:12px 16px 28px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:600;font-size:13.5px;background:var(--surface);border:1px solid var(--ink);
    border-radius:999px;padding:7px 14px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .back:active{transform:translate(2px,2px);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;white-space:nowrap;
    border:1px solid var(--line);border-radius:999px;padding:5px 14px;box-shadow:var(--hard-sm)}

  .kicker{display:inline-block;font-weight:700;font-size:11.5px;letter-spacing:.06em;
    background:var(--sun-l);border:1px solid var(--line);border-radius:8px;
    padding:3px 9px;box-shadow:var(--hard-sm);margin-bottom:8px}
  h1{font-size:clamp(23px,5.4vw,32px);font-weight:700;letter-spacing:-.035em;line-height:1.06}
  .lead{font-size:14.5px;color:var(--muted);margin-top:6px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:12px 13px;margin-top:12px}
  h2{font-size:13px;font-weight:700;letter-spacing:-.02em;text-align:center;color:var(--muted)}

  /* 약속표 */
  .deal{margin-top:8px;background:var(--point-soft);border:1px solid var(--line);
    border-radius:var(--r-sm);padding:7px 10px;text-align:center;font-weight:700;font-size:15px}
  .deal .tool{display:block;font-size:12px;color:var(--muted);font-weight:600}

  /* 송신기·수신기 코드 */
  .codes{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px}
  .card .who{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
  .blk{margin-top:4px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--grape);border-radius:8px;
    padding:4px 8px;font-size:13.5px;font-weight:600;line-height:1.35;animation:pop .3s ease both}
  .blk.send{border-left-color:var(--pink)}
  .blk.ev{background:transparent;border:0;padding:4px 0 0;font-weight:700;font-size:12.5px;color:var(--muted)}
  .blk.in{margin-left:14px}
  .blk.recv{border-left-color:var(--sky)}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .blk b{font-family:'Courier New',monospace;font-weight:700}

  /* 수신 화면 */
  .rx{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px}
  .dev{flex:0 0 auto;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted)}
  .dev svg{display:block;margin:0 auto 2px}
  .abtn{transition:fill .15s}
  .dev.pressed .abtn{fill:var(--pink)}
  .track{position:relative;flex:1 1 40px;max-width:120px;height:30px}
  .track::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:3px dotted var(--line-strong)}
  .track i{position:absolute;top:50%;left:0;width:16px;height:16px;margin:-8px 0 0 -2px;border-radius:50%;background:var(--sky);opacity:0}
  .track.fly i{animation:fly .45s linear forwards}
  @keyframes fly{0%{left:0;opacity:1}85%{opacity:1}100%{left:calc(100% - 14px);opacity:0}}
  .rcv{flex:1 1 130px;max-width:210px;min-width:0;text-align:center}
  .rcv .cap{display:block;margin-top:2px;font-size:11.5px;font-weight:700;color:var(--muted)}
  .scr{width:100%;gap:8px;min-width:0;min-height:52px;background:var(--ink);color:var(--paper);border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;padding:6px 12px;font-weight:700;font-size:16px}
  .scr .lamp{width:16px;height:16px;border-radius:50%;flex:0 0 auto;border:2px solid #fff}
  .scr.arrive{animation:arrive .35s ease}
  @keyframes arrive{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:none}}
  .scr .dim{color:#9C978C;font-weight:600;font-size:13px}

  .picks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:9px}
  .pk{flex:1 1 100px;max-width:170px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
  .pk .lamp{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:0 0 auto}
  .pk[aria-pressed="true"]{background:var(--point-soft);border-width:3.5px;border-color:var(--point)}
  .pk[aria-pressed="true"]:disabled{opacity:1}

  .status{margin-top:9px;text-align:center;font-size:14px;font-weight:700;min-height:1.5em}
  .status.dim{color:var(--muted);font-weight:700}

  .row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:10px}
  button{font-family:inherit;cursor:pointer;border:1px solid var(--ink);border-radius:var(--r-sm);
    background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;min-height:46px;padding:0 12px;
    box-shadow:var(--hard-sm);transition:transform .1s,box-shadow .1s,background .1s}
  button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:var(--hard-sm)}
  .go{flex:1 1 130px;max-width:180px;font-size:16px;background:var(--point);color:#fff}
  .lamp.c1{background:var(--pink)} .lamp.c0{background:var(--mint)}
  /* 마이크로비트 LED 5×5: 빨간 LED만 있어 글자 대신 아이콘으로 보인다 */
  .led{display:inline-grid;grid-template-columns:repeat(5,7px);gap:3px;padding:4px;background:#222;border-radius:4px;flex:0 0 auto;vertical-align:middle}
  .led i{width:7px;height:7px;border-radius:1px;background:#4a4540}
  .led i.on{background:#ff3b2f;box-shadow:0 0 4px #ff3b2f}
  .led.s{grid-template-columns:repeat(5,4px);gap:1px;padding:3px}
  .led.s i{width:4px;height:4px;border-radius:0}
  .scr .led{grid-template-columns:repeat(5,8px);gap:4px;padding:2px;background:transparent}
  .scr .led i{width:8px;height:8px}
  .scr .mean{font-size:13px;color:#d9d4c8;font-weight:600}
  .sub{flex:0 0 auto;min-width:88px;font-size:14px;padding:0 14px}

  .note{margin-top:9px;text-align:center;font-size:12.5px;font-weight:700;color:var(--muted)}
  .foot{margin-top:18px;text-align:center}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media (max-width:420px){ .codes{grid-template-columns:1fr} .scr{min-width:0} }
  body{overflow-x:hidden}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
</style>

<body>
<div class="wrap">

  <div class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#222222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      체험 목록</a><a class="back" href="../lessons/B12/">과정안</a></span>
    <span class="tag">25~28</span>
  </div>

  <span class="kicker">27차시 활동5 앞</span>
  <h1>보내기 전 수신 화면 맞히기</h1>
  <p class="lead">보내기 전에 수신 화면을 짚어요</p>

  <section aria-labelledby="h-c">
    <h2 id="h-c">통신 약속표와 코드</h2>
    <p class="deal"><span class="tool" id="tool"></span><span id="deal"></span></p>
    <div class="codes">
      <div class="card"><span class="who">송신기</span><div id="tx"></div></div>
      <div class="card"><span class="who">수신기</span><div id="rxcode"></div></div>
    </div>
    <div class="rx">
      <div class="dev" id="devTx"><svg width="54" height="46" viewBox="0 0 54 46" aria-hidden="true"><rect x="2" y="2" width="50" height="42" rx="8" fill="#fff" stroke="#222" stroke-width="2.5"/><circle cx="14" cy="23" r="6" class="abtn" fill="#eee" stroke="#222" stroke-width="2"/><text x="14" y="26" font-size="8" font-weight="700" text-anchor="middle" fill="#222">A</text><g fill="#bbb"><circle cx="30" cy="14" r="2.4"/><circle cx="38" cy="14" r="2.4"/><circle cx="46" cy="14" r="2.4"/><circle cx="34" cy="23" r="2.4"/><circle cx="42" cy="23" r="2.4"/><circle cx="30" cy="32" r="2.4"/><circle cx="38" cy="32" r="2.4"/></g></svg>송신기</div>
      <div class="track" id="track" aria-hidden="true"><i></i></div>
      <div class="rcv"><div class="scr" id="scr" role="status" aria-live="polite"></div><span class="cap" id="cap">수신 화면</span></div>
    </div>
  </section>

  <section aria-labelledby="h-p">
    <h2 id="h-p">A를 누르면 무엇이 뜰까요</h2>
    <div class="picks" id="picks"></div>
    <p class="status dim" id="status"></p>
    <div class="row">
      <button class="go" id="send" type="button" disabled>A 누르기</button>
      <button class="sub" id="replay" type="button" disabled>다시 보기</button>
      <button class="sub" id="next" type="button">다음 판</button>
    </div>
    <p class="note">기기로 다시 보내 봐요</p>
  </section>

  <div class="foot">
    <a class="back" href="../play/">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#222222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      체험 목록</a>
  </div>

</div>
<script>
(function () {
  'use strict';

  // 과정안 25차시 도구 후보에서 가져온 무선 도구. 약속: 1 → one, 0 → zero.
  var TOOLS = [
    { name: '교실 소음 신호등', one: '빨간불', zero: '초록불' },
    { name: '사용 중 알림판', one: '사용 중', zero: '비었어요' },
    { name: '보건실 호출기', one: '와 주세요', zero: '괜찮아요' }
  ];
  // 판의 갈래. ok가 반, 나머지는 코드 살펴보기 세 항목 가운데 앞의 둘에 걸리는 판이다.
  //   group   : 수신기 그룹 번호가 다르다 → 아무것도 안 뜬다
  //   missing : 보낸 수에 대한 [만약]이 없다 → 아무것도 안 뜬다
  //   swap    : [만약]의 표시가 약속표와 뒤바뀌었다 → 다른 표시가 뜬다
  var KINDS = ['ok', 'ok', 'ok', 'group', 'missing', 'swap'];
  var NONE = 'none';

  var tool = null, num = 1, gTx = 1, gRx = 1, kind = 'ok', actual = NONE;
  var guess = null, sent = false, timer = null, lastKey = '';

  var $ = function (id) { return document.getElementById(id); };
  var scrEl = $('scr'), statusEl = $('status'), picksEl = $('picks');
  var sendBtn = $('send'), replayBtn = $('replay'), nextBtn = $('next');

  function blk(text, cls, icon) {
    var d = document.createElement('div');
    d.className = 'blk' + (cls ? ' ' + cls : '');
    d.textContent = text;
    if (icon) { d.appendChild(document.createTextNode(' 아이콘 출력 ')); d.insertAdjacentHTML('beforeend', ledOf(icon, true)); }
    return d;
  }
  // 1 쪽 표시는 ✕, 0 쪽 표시는 ✓ 아이콘으로 정한다(마이크로비트 기본 아이콘 NO·YES 모양)
  var PAT = { X: '1000101010001000101010001', V: '0000000001000101010001000' };
  function iconOf(label) { return label === tool.one ? 'X' : 'V'; }
  function ledOf(label, small) {
    var p = label === null ? '0000000000000000000000000' : PAT[iconOf(label)], h = '';
    for (var i = 0; i < 25; i++) h += '<i' + (p[i] === '1' ? ' class="on"' : '') + '></i>';
    return '<span class="led' + (small ? ' s' : '') + '" aria-hidden="true">' + h + '</span>';
  }

  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }

  function draw() {
    var t = Math.floor(Math.random() * TOOLS.length);
    var n = Math.random() < 0.5 ? 1 : 0;
    var k = KINDS[Math.floor(Math.random() * KINDS.length)];
    return { t: t, n: n, k: k, key: t + ',' + n + ',' + k };
  }

  function labelOf(v) { return v === 1 ? tool.one : tool.zero; }

  function newRound() {
    clearTimer();
    var r = draw(), tries = 0;
    while (r.key === lastKey && tries < 8) { r = draw(); tries += 1; }
    lastKey = r.key;

    tool = TOOLS[r.t]; num = r.n; kind = r.k;
    gTx = 1 + Math.floor(Math.random() * 9);                 // 1~9
    gRx = gTx;
    if (kind === 'group') {
      do { gRx = 1 + Math.floor(Math.random() * 9); } while (gRx === gTx);
    }

    // 수신기 [만약] 줄: 1과 0 차례. missing이면 보낸 수의 줄이 빠진다.
    var rules = [];
    [1, 0].forEach(function (v) {
      if (kind === 'missing' && v === num) return;
      var shown = kind === 'swap' ? labelOf(1 - v) : labelOf(v);
      rules.push({ v: v, shown: shown });
    });

    actual = NONE;
    if (gRx === gTx) {
      rules.forEach(function (ru) { if (ru.v === num) actual = ru.shown; });
    }

    $('tool').textContent = tool.name;
    $('deal').innerHTML = '1 → ' + ledOf(tool.one, true) + ' ' + tool.one + ', 0 → ' + ledOf(tool.zero, true) + ' ' + tool.zero;
    var tx = $('tx'), rx = $('rxcode');
    tx.innerHTML = ''; rx.innerHTML = '';
    // 블록 이름은 MakeCode 그대로: [시작하면] 안 [라디오 그룹을 ( ) 로 설정], [A 버튼 누를 때] 안 [라디오 전송: 수],
    // [라디오 숫자 수신시] 안 [만약 receivedNumber = ( ) 이면 실행] → [아이콘 출력]
    tx.appendChild(blk('시작하면', 'ev'));
    tx.appendChild(blk('라디오 그룹을 ' + gTx + ' 로 설정', 'in'));
    tx.appendChild(blk('A 버튼 누를 때', 'ev'));
    tx.appendChild(blk('라디오 전송: 수 ' + num, 'send in'));
    rx.appendChild(blk('시작하면', 'ev'));
    rx.appendChild(blk('라디오 그룹을 ' + gRx + ' 로 설정', 'in'));
    rx.appendChild(blk('라디오 숫자 수신시 (receivedNumber)', 'ev'));
    rules.forEach(function (ru) {
      rx.appendChild(blk('만약 receivedNumber = ' + ru.v + ' 이면', 'recv in', ru.shown));
    });

    // 짚기 버튼: 약속표의 두 표시와 '안 뜸'
    picksEl.innerHTML = '';
    [tool.one, tool.zero, NONE].forEach(function (val) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pk';
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('data-v', val);
      if (val !== NONE) {
        b.insertAdjacentHTML('beforeend', ledOf(val, true));
      }
      b.appendChild(document.createTextNode(val === NONE ? '안 뜸' : val));
      picksEl.appendChild(b);
    });

    guess = null; sent = false;
    $('devTx').classList.remove('pressed');
    $('track').classList.remove('fly');
    render();
    say('새 판이에요. 「' + tool.name + '」 약속표와 두 코드 카드를 읽고, 무엇이 뜰지 먼저 예측해요.');
  }

  function say(text, mood) { if (window.Fun) { Fun.say(text, mood); } }

  function pick(val) {
    if (guess !== null || sent) return;   // 짚기는 판마다 한 번
    guess = val;
    render();
    say(val === NONE ? '아무것도 안 뜬다고 예측했어요. A를 눌러 보내 봐요.' : '「' + val + '」 표시가 뜬다고 예측했어요. A를 눌러 보내 봐요.');
  }

  function showResult(done) {
    clearTimer();
    scrEl.innerHTML = ledOf(null); $('cap').textContent = '수신 화면 · 받는 중';
    var trk = $('track');
    trk.classList.remove('fly'); void trk.offsetWidth; trk.classList.add('fly');
    timer = setTimeout(function () {
      timer = null;
      trk.classList.remove('fly');
      if (actual === NONE) {
        scrEl.innerHTML = ledOf(null); $('cap').textContent = '수신 화면 · 모두 꺼짐';
      } else {
        scrEl.innerHTML = ledOf(actual); $('cap').textContent = '수신 화면 · 뜻: ' + actual;   // 기기 화면에는 LED만, 뜻은 밖에
      }
      scrEl.classList.remove('arrive'); void scrEl.offsetWidth; scrEl.classList.add('arrive');
      if (done) done();
    }, 450);
  }

  function send() {
    if (guess === null || sent || timer) return;
    sent = true;
    $('devTx').classList.add('pressed');
    render();
    showResult(function () {
      $('devTx').classList.remove('pressed');
      if (guess === actual) {
        statusEl.textContent = actual === NONE ? '짚은 대로 아무것도 안 떴어요' : '짚은 대로 떴어요';
        say(actual === NONE ? '예측해 둔 대로 아무것도 안 떴어요. 왜 안 떴는지 두 코드 카드에서 찾아봐요.' : '예측해 둔 대로 떴어요. 기기로도 같게 뜨는지 보내 봐요.', 'cheer');
        if (window.Fun) { Fun.burst(scrEl); }
      } else {
        statusEl.textContent = actual === NONE ? '아무것도 안 떴어요' : '수신 화면에 「' + actual + '」 뜻의 아이콘이 떴어요';
        say('예상과 다르게 나왔어요. 송신기와 수신기 코드 카드를 줄마다 견주어 어디서 갈렸는지 찾아봐요.', 'think');
        if (window.Fun) { Fun.shake(scrEl); }
      }
      if (window.Fun) { Fun.stamp(); }
      statusEl.className = 'status';
      replayBtn.disabled = false;
    });
  }

  function replay() {
    if (!sent || timer) return;
    replayBtn.disabled = true;
    $('devTx').classList.add('pressed');
    showResult(function () { $('devTx').classList.remove('pressed'); replayBtn.disabled = false; });
  }

  function render() {
    if (!sent) { scrEl.innerHTML = ledOf(null); $('cap').textContent = '수신 화면'; }
    var btns = picksEl.querySelectorAll('.pk');
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      b.setAttribute('aria-pressed', b.getAttribute('data-v') === guess ? 'true' : 'false');
      b.disabled = guess !== null;
    }
    sendBtn.disabled = guess === null || sent;
    if (!sent) {
      replayBtn.disabled = true;
      statusEl.textContent = guess === null ? '무엇이 뜰지 먼저 짚어요' : 'A 누르기로 보내요';
      statusEl.className = 'status dim';
    }
  }

  picksEl.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.pk') : null;
    if (b) pick(b.getAttribute('data-v'));
  });
  sendBtn.addEventListener('click', send);
  replayBtn.addEventListener('click', replay);
  nextBtn.addEventListener('click', newRound);
  window.addEventListener('pagehide', clearTimer);

  newRound();
})();
