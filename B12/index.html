<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>처음 보는 안내기 — 에듀다움 B12</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#FF5A5F; --point-soft:#FFE3E4;
    --amber:#FFB800; --muted:#6B6B6B;
    --r:20px; --r-sm:13px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:12px 16px 28px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:13.5px;background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:7px 14px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;
    border:2.5px solid var(--ink);border-radius:999px;padding:5px 14px;box-shadow:var(--hard-sm)}

  .kicker{display:inline-block;font-weight:900;font-size:11.5px;letter-spacing:.06em;
    background:var(--amber);border:2.5px solid var(--ink);border-radius:8px;
    padding:3px 9px;box-shadow:var(--hard-sm);margin-bottom:8px}
  h1{font-size:clamp(23px,5.4vw,32px);font-weight:900;letter-spacing:-.035em;line-height:1.06}
  .lead{font-size:14.5px;color:var(--muted);margin-top:6px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:13px 14px;margin-top:12px}
  h2{font-size:13px;font-weight:900;letter-spacing:-.02em;text-align:center;color:var(--muted)}

  .rule{margin-top:8px;font-size:clamp(15px,4vw,18px);font-weight:900;letter-spacing:-.02em;
    background:var(--point-soft);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    padding:9px 11px;text-align:center}

  /* 기기 */
  .dev{max-width:250px;margin:10px auto 0;background:var(--paper);
    border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--hard-sm);padding:10px}
  .scr{background:var(--ink);color:var(--paper);border-radius:var(--r-sm);
    min-height:64px;display:flex;align-items:center;justify-content:center;
    flex-wrap:wrap;gap:6px 10px;padding:8px;text-align:center}
  .scr .dim{color:#9C978C;font-weight:800;font-size:13px}
  .chip{font-weight:900;font-size:13px;letter-spacing:-.01em}
  .chip b{font-family:'Courier New',monospace;font-size:15px}

  .status{margin-top:9px;text-align:center;font-size:14px;font-weight:900}
  .status.dim{color:var(--muted);font-weight:700}

  .toggles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .tg{flex:1 1 108px;max-width:150px;display:inline-flex;align-items:center;justify-content:center;
    gap:6px;font-family:inherit;cursor:pointer;border:2.5px solid var(--ink);border-radius:var(--r-sm);
    background:var(--surface);color:var(--ink);font-weight:900;font-size:14px;min-height:46px;
    padding:0 10px;box-shadow:var(--hard-sm);transition:transform .1s,box-shadow .1s,background .1s}
  .tg:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tg:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .tg:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:var(--hard-sm)}
  .tg .ck{opacity:0}
  .tg.on{background:var(--point-soft);border-color:var(--point)}
  .tg.on .ck{opacity:1}
  .lim{text-align:center;font-size:12px;color:var(--muted);font-weight:700;margin-top:6px}

  .row{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:12px}
  button{font-family:inherit;cursor:pointer;border:2.5px solid var(--ink);border-radius:var(--r-sm);
    background:var(--surface);color:var(--ink);font-weight:900;min-height:46px;
    box-shadow:var(--hard-sm);transition:transform .1s,box-shadow .1s,background .1s}
  button:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  button:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  button:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:var(--hard-sm)}
  .go{flex:1 1 130px;max-width:180px;font-size:16px;background:var(--point);color:#fff}
  .sub{flex:0 0 auto;min-width:88px;font-size:14px;padding:0 14px}

  .ask{background:var(--ink);color:var(--paper);text-align:center;
    font-size:14.5px;font-weight:800}

  .foot{margin-top:18px;text-align:center}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="nav">
    <a class="back" href="../index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      전체 목록</a>
    <span class="tag">25~28</span>
  </div>

  <span class="kicker">27차시 활동5 앞</span>
  <h1>처음 보는 안내기</h1>
  <p class="lead">두 개까지 켜서 물음에 답해요</p>

  <section aria-labelledby="h-q">
    <h2 id="h-q">이번 물음</h2>
    <p class="rule" id="q"></p>
    <div class="dev"><div class="scr" id="scr" role="status" aria-live="polite"></div></div>
    <p class="status" id="status"></p>
  </section>

  <section aria-labelledby="h-t">
    <h2 id="h-t">기기가 보여 줄 것</h2>
    <div class="toggles" id="toggles"></div>
    <p class="lim">두 개까지만 켜져요</p>
    <div class="row">
      <button class="go" id="check" type="button">확인하기</button>
      <button class="sub" id="again" type="button">다시 하기</button>
      <button class="sub" id="next" type="button">다음 판</button>
    </div>
  </section>

  <section class="ask">무엇을 켜면 알 수 있을지 짚어요</section>

  <div class="foot">
    <a class="back" href="../index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      전체 목록</a>
  </div>

</div>
<script>
(function () {
  'use strict';

  // 다섯 가지 표시 항목. 값은 판마다 새로 뽑는다.
  var KEYS = ['cur', 'goal', 'left', 'over', 'time'];
  var LABEL = { cur: '지금 수', goal: '목표', left: '남은 수', over: '목표를 넘었는지', time: '지난 시간' };

  // 물음 다섯 개. combos는 "이 조합이면 답할 수 있다"의 여러 벌이다.
  var QUESTIONS = [
    { text: '지금 몇 번 흔들었나요', combos: [['cur'], ['left', 'goal']] },
    { text: '목표까지 몇 번 남았나요', combos: [['left'], ['cur', 'goal']] },
    { text: '목표를 넘겼나요', combos: [['over'], ['left'], ['cur', 'goal']] },
    { text: '목표가 몇 번인가요', combos: [['goal'], ['cur', 'left']] },
    { text: '흔든 지 얼마나 됐나요', combos: [['time']] }
  ];

  var qIdx = -1, cur = 0, goal = 0, left = 0, over = false, timeSec = 0;
  var selected = [], confirmed = false, result = null;

  var qEl = document.getElementById('q');
  var scrEl = document.getElementById('scr');
  var statusEl = document.getElementById('status');
  var togglesEl = document.getElementById('toggles');
  var checkBtn = document.getElementById('check');
  var againBtn = document.getElementById('again');
  var nextBtn = document.getElementById('next');

  var tgBtns = {};
  (function buildToggles() {
    for (var i = 0; i < KEYS.length; i++) {
      var k = KEYS[i];
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'tg'; b.setAttribute('data-k', k);
      b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<svg class="ck" width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
        + '<path d="M4 12.8l5 5L20 6.5" stroke="#141414" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '<span>' + LABEL[k] + '</span>';
      (function (key) { b.addEventListener('click', function () { toggle(key); }); })(k);
      togglesEl.appendChild(b);
      tgBtns[k] = b;
    }
  })();

  function pickQuestion() {
    var i;
    do { i = Math.floor(Math.random() * QUESTIONS.length); } while (i === qIdx && QUESTIONS.length > 1);
    qIdx = i;
    return QUESTIONS[i];
  }

  function valueText(k) {
    if (k === 'cur') return String(cur);
    if (k === 'goal') return String(goal);
    if (k === 'left') return String(left);
    if (k === 'over') return over ? '예' : '아니요';
    return timeSec + '초 전';
  }

  function newRound() {
    var q = pickQuestion();
    qEl.textContent = q.text;
    goal = 6 + Math.floor(Math.random() * 9);          // 6~14
    cur = Math.floor(Math.random() * (goal + 5));       // 0 ~ 목표+4, 넘길 수도 있다
    left = goal - cur;
    over = cur > goal;
    timeSec = 3 + Math.floor(Math.random() * 88);       // 3~90
    selected = [];
    confirmed = false;
    result = null;
    render();
  }

  function toggle(k) {
    if (confirmed) return;
    var i = selected.indexOf(k);
    if (i >= 0) { selected.splice(i, 1); }
    else {
      if (selected.length >= 2) return;   // 제약: 두 개까지만
      selected.push(k);
    }
    render();
  }

  function doCheck() {
    if (confirmed || selected.length === 0) return;
    confirmed = true;
    var q = QUESTIONS[qIdx];
    result = q.combos.some(function (combo) {
      return combo.every(function (k) { return selected.indexOf(k) >= 0; });
    });
    render();
  }

  function doAgain() {
    // 확인 전이면 고른 것만 지운다. 확인한 뒤에는 다음 판과 같다(무를 수 없어서).
    if (!confirmed) { selected = []; render(); return; }
    newRound();
  }

  checkBtn.addEventListener('click', doCheck);
  againBtn.addEventListener('click', doAgain);
  nextBtn.addEventListener('click', newRound);

  function render() {
    if (!confirmed) {
      scrEl.innerHTML = '<span class="dim">확인하면 여기 켜져요</span>';
    } else {
      var html = '';
      for (var i = 0; i < selected.length; i++) {
        var k = selected[i];
        html += '<span class="chip">' + LABEL[k] + ' <b>' + valueText(k) + '</b></span>';
      }
      scrEl.innerHTML = html;
    }

    if (!confirmed) {
      statusEl.textContent = selected.length === 0 ? '켤 것을 골라요' : '확인하면 켜져요';
      statusEl.className = 'status dim';
    } else {
      statusEl.textContent = result ? '이걸로 알 수 있어요' : '이걸로는 알 수 없어요';
      statusEl.className = 'status';
    }

    for (var j = 0; j < KEYS.length; j++) {
      var k2 = KEYS[j], on = selected.indexOf(k2) >= 0, b = tgBtns[k2];
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      b.disabled = confirmed || (!on && selected.length >= 2);
    }

    checkBtn.disabled = confirmed || selected.length === 0;
  }

  newRound();
})();
</script>
</body>
</html>
