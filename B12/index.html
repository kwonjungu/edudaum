<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>처음 보는 안내기 — 에듀다움 B12</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#FF5A5F; --point-soft:#FFE3E4;
    --amber:#FFB800; --muted:#6B6B6B;
    --r:20px; --r-sm:13px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px;
  }
  .wrap{max-width:640px;margin:0 auto;padding:14px 16px 48px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
  .back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    font-weight:800;font-size:13.5px;background:var(--surface);border:2.5px solid var(--ink);
    border-radius:999px;padding:7px 14px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .back:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;
    border:2.5px solid var(--ink);border-radius:999px;padding:5px 14px;box-shadow:var(--hard-sm)}

  .kicker{display:inline-block;font-weight:900;font-size:12px;letter-spacing:.1em;
    background:var(--amber);border:2.5px solid var(--ink);border-radius:8px;
    padding:3px 10px;box-shadow:var(--hard-sm);margin-bottom:10px}
  h1{font-size:clamp(26px,6vw,38px);font-weight:900;letter-spacing:-.035em;line-height:1.05}
  .lead{font-size:15.5px;color:var(--muted);margin-top:8px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:18px 16px;margin-top:16px}

  /* 기기 */
  .dev{max-width:260px;margin:0 auto;background:var(--paper);
    border:3px solid var(--ink);border-radius:var(--r);box-shadow:var(--hard-sm);padding:14px}
  .dev.wig{animation:wig .3s ease}
  @keyframes wig{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .scr{background:var(--ink);color:var(--paper);border-radius:var(--r-sm);
    min-height:96px;display:flex;align-items:center;justify-content:center;gap:10px;
    font-weight:900;letter-spacing:-.02em}
  .scr .num{font-size:46px;line-height:1}
  .scr .word{font-size:19px}
  .scr svg{flex-shrink:0}

  .tally{display:flex;align-items:baseline;justify-content:center;gap:10px;margin-top:14px;
    font-size:14.5px;font-weight:800;color:var(--muted)}
  .tally b{font-size:26px;font-weight:900;color:var(--ink)}
  .note{text-align:center;font-size:12.5px;color:var(--muted);font-weight:700;margin-top:6px}
  .hint{color:var(--point);font-weight:800}

  .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
  button{font-family:inherit;cursor:pointer;border:2.5px solid var(--ink);border-radius:var(--r-sm);
    background:var(--surface);color:var(--ink);font-weight:900;min-height:48px;
    box-shadow:var(--hard-sm);transition:transform .1s,box-shadow .1s,background .1s}
  button:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:var(--hard-sm)}
  .go{flex:1 1 160px;max-width:220px;min-height:64px;font-size:20px;
    background:var(--point);color:#fff}
  .reset{flex:0 0 auto;min-width:104px;font-size:15px;padding:0 16px}

  h2{font-size:15px;font-weight:900;letter-spacing:-.02em;text-align:center}
  .toggles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
  .tg{flex:1 1 130px;max-width:180px;display:inline-flex;align-items:center;justify-content:center;
    gap:8px;font-size:15px;padding:0 12px}
  .tg .ck{opacity:0}
  .tg.on{background:var(--point-soft);border-color:var(--point)}
  .tg.on .ck{opacity:1}

  .ask{background:var(--ink);color:var(--paper);text-align:center;
    font-size:15.5px;font-weight:800}

  .foot{margin-top:22px;text-align:center}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="nav">
    <a class="back" href="../index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      전체 목록</a>
    <span class="tag">B12</span>
  </div>

  <span class="kicker">27차시 활동5 앞</span>
  <h1>처음 보는 안내기</h1>
  <p class="lead">기기가 보여 줄 것을 하나씩 켜 보세요</p>

  <section>
    <div class="dev" id="dev">
      <div class="scr" id="scr" role="status" aria-live="polite"></div>
    </div>
    <p class="tally">내가 센 횟수 <b id="cnt">0</b></p>
    <p class="note">숫자는 흔들림을 센 값</p>
    <p class="note hint" id="hint" hidden>99에서 멈춰요</p>
    <div class="row">
      <button class="go" id="go" type="button">흔들기</button>
      <button class="reset" id="reset" type="button">다시 하기</button>
    </div>
  </section>

  <section>
    <h2>기기가 보여 줄 것</h2>
    <div class="toggles">
      <button class="tg" type="button" data-k="start" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#141414" stroke-width="2.5"/><path class="ck" d="M7 12.5l3.2 3.2L17 9" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        시작 안내</button>
      <button class="tg" type="button" data-k="num" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#141414" stroke-width="2.5"/><path class="ck" d="M7 12.5l3.2 3.2L17 9" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        지금 숫자</button>
      <button class="tg" type="button" data-k="goal" aria-pressed="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" stroke="#141414" stroke-width="2.5"/><path class="ck" d="M7 12.5l3.2 3.2L17 9" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        목표 알림</button>
    </div>
  </section>

  <section class="ask">무엇을 켜니 쓸 수 있게 되었나요?</section>

  <div class="foot">
    <a class="back" href="../index.html">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      전체 목록</a>
  </div>

</div>
<script>
(function () {
  'use strict';

  var GOAL = 10, MAX = 99;
  var n = 0;
  var on = { start: false, num: false, goal: false };

  var dev = document.getElementById('dev');
  var scr = document.getElementById('scr');
  var cnt = document.getElementById('cnt');
  var go = document.getElementById('go');
  var hint = document.getElementById('hint');
  var reset = document.getElementById('reset');
  var tgs = Array.prototype.slice.call(document.querySelectorAll('.tg'));

  var SHAKE = '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
    + '<path d="M9 6.5L5.5 12 9 17.5" stroke="#FBF7EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<path d="M15 6.5L18.5 12 15 17.5" stroke="#FBF7EC" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<rect x="10.5" y="4" width="3" height="16" rx="1.5" stroke="#FBF7EC" stroke-width="2.4"/></svg>';

  var DONE = '<svg width="42" height="42" viewBox="0 0 24 24" fill="none" aria-hidden="true">'
    + '<path d="M4 12.8l5 5L20 6.5" stroke="#FBF7EC" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  function screenHTML() {
    if (on.goal && n >= GOAL) {
      return DONE + (on.num ? '<span class="num">' + n + '</span>' : '');
    }
    if (on.num && n > 0) {
      return '<span class="num">' + n + '</span>';
    }
    if (on.start && n === 0) {
      return SHAKE + '<span class="word">흔들어요</span>';
    }
    return '';
  }

  function draw() {
    cnt.textContent = String(n);
    scr.innerHTML = screenHTML();
    go.disabled = (n >= MAX);
    hint.hidden = (n < MAX);
    for (var i = 0; i < tgs.length; i++) {
      var b = tgs[i], v = !!on[b.getAttribute('data-k')];
      b.classList.toggle('on', v);
      b.setAttribute('aria-pressed', v ? 'true' : 'false');
    }
  }

  go.addEventListener('click', function () {
    if (n >= MAX) { return; }
    n += 1;
    draw();
    dev.classList.remove('wig');
    void dev.offsetWidth;
    dev.classList.add('wig');
  });

  dev.addEventListener('animationend', function () { dev.classList.remove('wig'); });

  reset.addEventListener('click', function () {
    n = 0;
    on.start = false; on.num = false; on.goal = false;
    draw();
  });

  for (var i = 0; i < tgs.length; i++) {
    tgs[i].addEventListener('click', function () {
      var k = this.getAttribute('data-k');
      on[k] = !on[k];
      draw();
    });
  }

  draw();
})();
</script>
</body>
</html>
