<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기준 바꿔 다시 나누기 활동 — 에듀다움</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF; --soft:#F7F7F7;
    --point:#FF385C; --point-soft:#FFF0F3; --point-dim:#FFD1DA; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:10px 16px 28px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;
    border-radius:999px;padding:6px 14px;white-space:nowrap}

  h1{font-size:clamp(22px,5.4vw,28px);font-weight:700;letter-spacing:-.03em;line-height:1.15}
  .lead{font-size:15px;color:var(--muted);margin-top:4px}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:12px;margin-top:12px}
  section.off{opacity:.45}
  h2{font-size:16px;font-weight:600;margin-bottom:8px}
  .hint{font-size:15px;color:var(--muted)}


  .crit{display:grid;gap:4px;margin-bottom:10px;font-size:15px}
  .crit p{display:flex;gap:8px;align-items:baseline}
  .crit .k{flex:none;font-size:13px;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid var(--ink)}
  .crit .k2{background:var(--point);border-color:var(--point);color:#fff}

  .tbl{display:grid;gap:4px;margin-top:8px}
  .tr{display:grid;grid-template-columns:1.2em 1fr 3.1em 3.6em 3.6em 3.6em;gap:4px;align-items:center;
    font:inherit;font-size:15px;color:var(--ink);text-align:left;width:100%}
  .th span{white-space:nowrap}
  .th{font-size:12px;letter-spacing:-.03em;color:var(--muted);padding:0 10px}
  button.tr{background:#fff;border:1px solid var(--ink);border-radius:var(--r-sm);min-height:44px;padding:4px 10px;cursor:pointer}
  button.tr:disabled{cursor:default;border-color:var(--line)}
  button.tr[aria-pressed="true"]{background:var(--point-soft);outline:2px solid var(--point);outline-offset:-1px}
  button.tr.chg{box-shadow:inset 6px 0 0 var(--point)}
  button.tr.extra{border-style:dashed;border-color:var(--ink);background:#fff;outline:none}
  .tr .tag2{animation:pop .35s ease-out}
  @keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
  .tr .no{color:var(--muted);font-size:13px}
  .tr .num{text-align:right}
  .tr .g{text-align:center;font-weight:600;font-size:14px}
  .tr .g2{color:var(--point)}
  .tr .tag2{display:block;font-size:11px;font-weight:600;color:var(--point);text-align:center;line-height:1}

  .bars{display:grid;gap:6px}
  .bline{display:grid;grid-template-columns:5.6em 1fr 2.6em;gap:8px;align-items:center;font-size:14px}
  .track{height:18px;background:var(--soft);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .track i{display:block;height:100%;background:var(--ink);opacity:.75;transition:width .3s}
  .track.p i{background:var(--point);opacity:1}
  .bline .v{text-align:right;font-weight:600}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .btn{font:inherit;font-size:15px;font-weight:500;cursor:pointer;color:var(--ink);background:#fff;
    border:1px solid var(--ink);border-radius:var(--r-sm);min-height:44px;padding:8px 14px;flex:1 1 auto}
  .btn.main{background:var(--point);border-color:var(--point);color:#fff;min-height:48px}
  .btn:disabled{opacity:.45;cursor:default}
  .btn.main:disabled{background:var(--point-dim);border-color:var(--point-dim);opacity:1}
  .say{margin-top:10px;font-size:16px;font-weight:600}
  .foot{margin-top:12px;font-size:14px;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">체험 목록</a><a class="back" href="../lessons/B24/">과정안</a></span>
    <span class="tag">19~20</span>
  </nav>
  <header>
    <h1>기준 바꿔 다시 나누기 활동</h1>
    <p class="lead">기준2로 바꾸면 묶음이 달라질 줄을 짚어요</p>
  </header>

  <section aria-labelledby="h1t">
    <h2 id="h1t">등교 표 <span class="hint">줄마다 한 사람</span></h2>
    <div class="crit">
      <p><span class="k">기준1</span><span id="c1"></span></p>
      <p><span class="k k2">기준2</span><span id="c2"></span></p>
    </div>
    <p class="hint" id="hint"></p>
    <div class="tbl" id="tbl">
      <div class="tr th" aria-hidden="true"><span></span><span>등교 방법</span><span class="num">시간</span><span class="num">횡단보도</span><span class="g">기준1</span><span class="g">기준2</span></div>
    </div>
    <div class="acts">
      <button class="btn main" id="checkBtn" type="button" disabled>확인하기</button>
    </div>
  </section>

  <section aria-labelledby="h2t" id="s2">
    <h2 id="h2t">막대 차트 <span class="hint">기준별 사람 수</span></h2>
    <div class="bars" id="bars"></div>
    <p class="say" id="say" aria-live="polite"></p>
    <div class="acts">
      <button class="btn main" id="nextBtn" type="button">다음 판</button>
      <button class="btn" id="resetBtn" type="button">다시 하기</button>
    </div>
  </section>

  <p class="foot">판마다 뽑은 예시 표예요. 우리 반 표는 엔트리에서 나눠요.</p>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var ROWS = 8;
  function rnd(a, b){ return a + Math.floor(Math.random() * (b - a + 1)); }

  var WAYS = {
    '걸어서': { t:[5, 25], x:[0, 3] },
    '자전거': { t:[5, 15], x:[0, 3] },
    '자동차': { t:[5, 20], x:[0, 4] },
    '버스':   { t:[10, 30], x:[1, 4] }
  };
  var CRITS = [
    { id:'t10', key:'t', text:'걸리는 시간이 10분보다 오래 걸리나?', test:function(r){ return r.t > 10; } },
    { id:'t15', key:'t', text:'걸리는 시간이 15분보다 오래 걸리나?', test:function(r){ return r.t > 15; } },
    { id:'t20', key:'t', text:'걸리는 시간이 20분보다 오래 걸리나?', test:function(r){ return r.t > 20; } },
    { id:'x1',  key:'x', text:'횡단보도를 1개보다 많이 건너나?', test:function(r){ return r.x > 1; } },
    { id:'x2',  key:'x', text:'횡단보도를 2개보다 많이 건너나?', test:function(r){ return r.x > 2; } },
    { id:'w',   key:'w', text:'걸어서 오나?', test:function(r){ return r.w === '걸어서'; } }
  ];

  var rows = [], c1 = null, c2 = null, marked = [], checked = false, lastPair = '';
  var rowEls = [];

  function ans(c, r){
    if (c.key === 't' && r.t === null) return null;
    return c.test(r) ? '예' : '아니요';
  }
  function changed(r){
    var a = ans(c1, r), b = ans(c2, r);
    return a !== null && b !== null && a !== b;
  }
  function pairOf(){ return [c1.id, c2.id].sort().join('-'); }
  function pickWay(){
    var u = Math.random();
    return u < .5 ? '걸어서' : u < .67 ? '자전거' : u < .84 ? '자동차' : '버스';
  }

  // 판을 그 자리에서 뽑는다. 달라지는 줄이 1~6줄인 판만 낸다.
  function newRound(){
    var tries = 0, nch;
    do {
      rows = [];
      for (var i = 0; i < ROWS; i++){
        var w = pickWay(), d = WAYS[w];
        rows.push({ w:w, t:rnd(d.t[0], d.t[1]), x:rnd(d.x[0], d.x[1]) });
      }
      rows[rnd(0, ROWS - 1)].t = [10, 15, 20][rnd(0, 2)];   // 기준값과 딱 같은 줄
      if (Math.random() < 1 / 3) rows[rnd(0, ROWS - 1)].t = null;  // 빈칸 줄
      var i1 = rnd(0, CRITS.length - 1), i2;
      do { i2 = rnd(0, CRITS.length - 1); } while (i2 === i1);
      c1 = CRITS[i1]; c2 = CRITS[i2];
      nch = rows.filter(changed).length;
      tries++;
    } while ((nch < 1 || nch > 6 || pairOf() === lastPair) && tries < 200);
    lastPair = pairOf();
    marked = rows.map(function(){ return false; });
    checked = false;
    build();
    render();
  }

  function build(){
    var tbl = $('tbl');
    rowEls.forEach(function(el){ tbl.removeChild(el); });
    rowEls = [];
    rows.forEach(function(r, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tr';
      b.innerHTML = '<span class="no"></span><span class="w"></span><span class="num nt"></span>' +
        '<span class="num nx"></span><span class="g g1"></span><span class="g g2"></span>';
      b.querySelector('.no').textContent = String(i + 1);
      b.querySelector('.w').textContent = r.w;
      b.querySelector('.nt').textContent = r.t === null ? '—' : r.t + '분';
      b.querySelector('.nx').textContent = r.x + '개';
      b.addEventListener('click', function(){
        if (checked) return;
        marked[i] = !marked[i];
        render();
      });
      tbl.appendChild(b);
      rowEls.push(b);
    });
    $('c1').textContent = c1.text;
    $('c2').textContent = c2.text;
  }

  function g(v){ return v === null ? '못 정함' : v; }

  function render(){
    var nMark = marked.filter(Boolean).length;
    rows.forEach(function(r, i){
      var el = rowEls[i], ch = changed(r);
      el.setAttribute('aria-pressed', marked[i] ? 'true' : 'false');
      el.disabled = checked;
      el.querySelector('.g1').textContent = g(ans(c1, r));
      var g2 = el.querySelector('.g2');
      g2.textContent = checked ? g(ans(c2, r)) : '?';
      if (checked && ch){
        var t = document.createElement('span'); t.className = 'tag2'; t.textContent = '달라짐'; g2.appendChild(t);
      }
      el.classList.toggle('chg', checked && ch);
      el.classList.toggle('extra', checked && marked[i] && !ch);
      el.setAttribute('aria-label', (i + 1) + '번 ' + r.w + ' ' + (r.t === null ? '시간 빈칸' : r.t + '분') +
        ' 횡단보도 ' + r.x + '개 기준1 ' + g(ans(c1, r)) + (checked ? ' 기준2 ' + g(ans(c2, r)) + (ch ? ' 달라짐' : '') : ''));
    });
    $('hint').textContent = checked ? '띠가 붙은 줄이 달라진 줄, 점선은 그대로인 줄이에요'
      : nMark === 0 ? '기준2로 묶음이 달라질 줄을 모두 눌러요'
      : nMark + '줄 짚었어요. 확인 전엔 바꿔도 돼요';
    $('checkBtn').disabled = checked || nMark === 0;
    $('nextBtn').disabled = !checked;
    $('s2').style.opacity = checked ? '1' : '.45';

    drawBars();
    if (!checked){ $('say').textContent = '짚고 확인하면 기준2 막대가 나와요'; return; }
    var act = 0, hit = 0, extra = 0;
    rows.forEach(function(r, i){
      var ch = changed(r);
      if (ch) act++;
      if (ch && marked[i]) hit++;
      if (!ch && marked[i]) extra++;
    });
    var miss = act - hit, say;
    if (miss === 0 && extra === 0) say = '짚은 ' + hit + '줄이 모두 묶음이 달라졌어요';
    else {
      say = '달라진 줄 ' + act + '줄 가운데 ' + hit + '줄을 짚었어요';
      if (miss) say += ' · 놓친 줄 ' + miss;
      if (extra) say += ' · 그대로인 줄 짚음 ' + extra;
    }
    if (rows.some(function(r){ return ans(c1, r) === null || ans(c2, r) === null; }))
      say += ' · 빈칸 줄은 어느 묶음에도 넣지 못했어요';
    $('say').textContent = say;
  }

  function drawBars(){
    var box = $('bars');
    box.innerHTML = '';
    [[c1, '기준1', false], [c2, '기준2', true]].forEach(function(p){
      ['예', '아니요'].forEach(function(v){
        var hide = p[2] && !checked;
        var cnt = rows.filter(function(r){ return ans(p[0], r) === v; }).length;
        var line = document.createElement('div');
        line.className = 'bline';
        line.innerHTML = '<span></span><span class="track' + (p[2] ? ' p' : '') + '"><i></i></span><span class="v"></span>';
        line.firstChild.textContent = p[1] + ' ' + v;
        line.querySelector('i').style.width = hide ? '0' : (cnt / ROWS * 100) + '%';
        line.querySelector('.v').textContent = hide ? '?' : cnt + '명';
        box.appendChild(line);
      });
    });
  }

  $('checkBtn').addEventListener('click', function(){
    if (checked || !marked.some(Boolean)) return;
    checked = true; render();
    $('s2').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  $('nextBtn').addEventListener('click', function(){ if (checked){ newRound(); window.scrollTo(0, 0); } });
  $('resetBtn').addEventListener('click', function(){
    marked = rows.map(function(){ return false; }); checked = false; render(); window.scrollTo(0, 0);
  });

  newRound();
})();
</script>
</body>
</html>
