<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>걸리는 곳 찾기 — 에듀다움 B14</title>
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5.0vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14.5px;color:var(--muted);margin-top:5px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:12px 12px;margin-top:11px}
  h2{font-size:13px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;color:var(--muted);text-align:center}

  #scene{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
  .zbg{fill:var(--surface);stroke:var(--ink);stroke-width:2}
  .zbg.hit{stroke:var(--point);stroke-width:4}
  .zlabel{font:700 11.5px "Malgun Gothic",sans-serif;fill:var(--muted)}
  .zval{font:900 12.5px "Courier New",monospace;fill:var(--ink)}

  .status{margin-top:9px;text-align:center;font-size:14.5px;font-weight:700}
  .status.dim{color:var(--muted);font-weight:700}

  .picks{display:flex;flex-direction:column;gap:7px}
  .pk{width:100%;text-align:left;display:flex;align-items:center;gap:9px;font-family:inherit;
    cursor:pointer;color:var(--ink);font-size:14.5px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
    min-height:46px;padding:8px 12px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s,background .1s}
  .pk:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .pk:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .pk[aria-pressed="true"]{background:var(--point-soft);border-width:3.5px}
  .pk:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:var(--hard-sm)}
  .pk .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;border:1px solid var(--line);background:var(--surface)}
  .pk[aria-pressed="true"] .dot{background:var(--point)}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:10px 16px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff;flex:1 1 140px}
  .btn.sub{flex:1 1 100px}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}

  .note{margin-top:8px;font-size:12px;font-weight:700;color:var(--muted)}

  button, a{outline-offset:3px}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B14/">과정안</a></span>
    <span class="tag">31~32</span>
  </nav>

  <header>
    <h1>걸리는 곳 찾기</h1>
    <p class="lead">예시 작품에서 점검표에 걸리는 곳을 짚어요</p>
  </header>

  <section aria-labelledby="h-s">
    <h2 id="h-s">예시 작품</h2>
    <svg id="scene" viewBox="0 0 300 140" role="img" aria-label="예시 작품의 코드·화면·카드 다섯 곳"></svg>
    <p class="status" id="status">다섯 가운데 하나를 짚어요</p>
  </section>

  <section aria-labelledby="h-p">
    <h2 id="h-p">몇 번 항목에 걸리나요</h2>
    <div class="picks" id="picks"></div>
    <div class="acts">
      <button class="btn main" id="checkBtn" type="button" disabled>확인하기</button>
      <button class="btn sub" id="againBtn" type="button">다시 하기</button>
      <button class="btn sub" id="nextBtn" type="button">다음 판</button>
    </div>
    <p class="note">고치는 일은 우리 작품에서 해요</p>
  </section>
</div>

<script>
(function(){
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  // 과정안 32차시 점검표 다섯 항목. 줄 이름은 '어느 코드·화면·카드인지'(활동3)를 따른다.
  var LABELS = ['코드 · 보내는 것', '코드 · 그룹 번호', '안내 화면', '설명 카드 · 그림', '설명 카드 · 소리'];
  var PICK_TEXT = ['① 개인정보', '② 그룹 번호', '③ 친구 이름', '④ 그림 출처', '⑤ 소리 출처'];
  // 바르게 된 값과 어긋난 값. 판마다 그 가운데 하나를 뽑는다. 실제 사람 이름을 쓰지 않는다.
  var OK = [['수 1', '수 0', 'GOAL'], null, ['사용자1 · 12걸음', '사용자2 · 성공'],
            ['LED로 직접 그림', '출처·BY 적음'], ['출처·BY 적음', '소리 없음']];
  var BAD = [['이름 ㅇㅇㅇ', '전화번호', '지금 위치'], null, ['ㅇㅇㅇ · 12걸음', 'ㅇㅇ이 · 성공'],
             ['출처 없음', 'ND 그림 · 바꿔 씀'], ['출처 없음', '허락 없이 쓴 노래']];
  function any(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  var shownVals = ['', '', '', '', ''];

  var wrongIdx = -1, prevWrong = -1;
  var picked = null, confirmed = false, result = null;

  var sceneEl = document.getElementById('scene');
  var statusEl = document.getElementById('status');
  var picksEl = document.getElementById('picks');
  var checkBtn = document.getElementById('checkBtn');
  var againBtn = document.getElementById('againBtn');
  var nextBtn = document.getElementById('nextBtn');

  var rowH = 26, top = 4;
  var zoneEls = [];
  (function buildScene(){
    for (var i = 0; i < 5; i++) {
      var y = top + i * rowH;
      var rect = document.createElementNS(NS, 'rect');
      rect.setAttribute('class', 'zbg');
      rect.setAttribute('x', 6); rect.setAttribute('y', y);
      rect.setAttribute('width', 288); rect.setAttribute('height', rowH - 4);
      rect.setAttribute('rx', 6);
      sceneEl.appendChild(rect);

      var label = document.createElementNS(NS, 'text');
      label.setAttribute('class', 'zlabel');
      label.setAttribute('x', 16); label.setAttribute('y', y + (rowH - 4) / 2 + 4);
      sceneEl.appendChild(label);

      var val = document.createElementNS(NS, 'text');
      val.setAttribute('class', 'zval');
      val.setAttribute('x', 286); val.setAttribute('y', y + (rowH - 4) / 2 + 4);
      val.setAttribute('text-anchor', 'end');
      sceneEl.appendChild(val);

      label.textContent = LABELS[i];
      zoneEls.push({ rect: rect, val: val });
    }
  })();

  var pkBtns = [];
  (function buildPicks(){
    for (var i = 0; i < 5; i++) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pk'; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = '<span class="dot" aria-hidden="true"></span><span>' + PICK_TEXT[i] + '</span>';
      (function (idx) { b.addEventListener('click', function () { choose(idx); }); })(i);
      picksEl.appendChild(b);
      pkBtns.push(b);
    }
  })();

  function pickWrong(){
    var i;
    do { i = Math.floor(Math.random() * 5); } while (i === prevWrong);
    prevWrong = i;
    return i;
  }

  function newRound(){
    wrongIdx = pickWrong();
    for (var i = 0; i < 5; i++) {
      if (i === 1) {
        // ② 배정받은 번호와 코드의 번호. 어긋난 판에서만 서로 다르다.
        var g = 1 + Math.floor(Math.random() * 9), c = g;
        if (i === wrongIdx) { do { c = 1 + Math.floor(Math.random() * 9); } while (c === g); }
        shownVals[i] = '배정 ' + g + ' · 코드 ' + c;
      } else {
        shownVals[i] = any(i === wrongIdx ? BAD[i] : OK[i]);
      }
    }
    picked = null;
    confirmed = false;
    result = null;
    render();
  }

  function choose(i){
    if (confirmed) return;
    picked = i;
    render();
  }

  function doCheck(){
    if (confirmed || picked === null) return;
    confirmed = true;
    result = (picked === wrongIdx);
    render();
  }

  function doAgain(){
    // 확인 전이면 고른 것만 지운다. 확인한 뒤에는 다음 판과 같다(무를 수 없어서).
    if (!confirmed) { picked = null; render(); return; }
    newRound();
  }

  checkBtn.addEventListener('click', doCheck);
  againBtn.addEventListener('click', doAgain);
  nextBtn.addEventListener('click', newRound);

  function render(){
    for (var i = 0; i < 5; i++) {
      zoneEls[i].val.textContent = shownVals[i];
      zoneEls[i].rect.classList.toggle('hit', confirmed && i === wrongIdx);
    }
    for (var j = 0; j < 5; j++) {
      var on = picked === j;
      pkBtns[j].setAttribute('aria-pressed', on ? 'true' : 'false');
      pkBtns[j].disabled = confirmed;
    }
    checkBtn.disabled = confirmed || picked === null;

    if (!confirmed) {
      statusEl.textContent = picked === null ? '다섯 가운데 하나를 짚어요' : '확인하면 드러나요';
      statusEl.className = 'status dim';
    } else {
      statusEl.textContent = result ? '짚은 자리에서 걸렸어요' : '다른 곳이 걸렸어요';
      statusEl.className = 'status';
    }
  }

  newRound();
})();
</script>
</body>
</html>
