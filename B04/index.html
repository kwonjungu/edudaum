<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로봇 셰프 레시피 고치기 — 에듀다움 B04</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3; --soft:#F7F7F7; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.45}
  .wrap{max-width:640px;margin:0 auto;padding:14px 16px 32px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(24px,5.8vw,32px);font-weight:700;letter-spacing:-.035em;line-height:1.1}
  .lead{font-size:15px;color:var(--muted);margin-top:6px;font-weight:600}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:12px;margin-top:12px}
  h2{font-size:13.5px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px;color:var(--muted)}
  .dish{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px}

  .sheet{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;
    padding:8px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--soft)}
  .sheet.cooked{border:2px solid var(--ink)}
  .cut{position:relative;cursor:pointer;font-family:inherit;color:var(--ink);text-align:center;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:22px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;
    transition:background .15s,transform .12s}
  .cut svg{width:72px;height:54px;display:block}
  .cut .cap{font-size:14.5px;font-weight:600;line-height:1.25}
  .cut .no{position:absolute;left:6px;top:5px;width:22px;height:22px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:13px;font-weight:700;line-height:22px}
  .cut .st{position:absolute;right:6px;top:5px;font-size:12px;font-weight:700;padding:0 6px;border-radius:999px}
  .cut .st{z-index:2;background:var(--surface)}
  .cut .st:empty{display:none}
  .cut.did .st{background:var(--soft);border:1px solid var(--line-strong)}
  .cut.stop{background:var(--point-soft)}
  .cut.stop .st{background:var(--point);color:#fff}
  .cut.cur{background:var(--point-soft)}
  .cut.lift{transform:translateY(-3px);border:2px solid var(--point)}
  .cut.lift .st{background:var(--point);color:#fff}
  .cut.circled::after{content:"";position:absolute;inset:-6px;border:3px dashed var(--point);border-radius:50%;pointer-events:none}
  .cut:disabled{cursor:default}

  .say{margin-top:10px;font-size:14.5px;font-weight:600;color:var(--point);min-height:21px}

  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:600;
    background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    min-height:48px;padding:10px 16px;box-shadow:var(--hard-sm);flex:1 1 100px}
  .btn.main{background:var(--point);border-color:var(--point);color:#fff;flex:2 1 150px}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

  .out{margin-top:10px;border-radius:var(--r-sm);padding:10px 12px;min-height:48px;background:var(--soft);font-size:16px;font-weight:600}
  .out.show{background:var(--ink);color:#fff}
  .out p + p{margin-top:4px}
  .note{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--muted)}

  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.04)}100%{transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B04/">과정안</a></span>
    <span class="tag">7~8</span>
  </nav>

  <header>
    <h1>로봇 셰프 레시피 고치기</h1>
    <p class="lead">로봇 셰프가 헷갈릴 한 곳에 동그라미 치고 고쳐요</p>
  </header>

  <section aria-labelledby="h-r">
    <h2 id="h-r">옆 모둠 4컷 레시피</h2>
    <p class="dish" id="dish"></p>
    <div class="sheet" id="sheet">
      <button class="cut" type="button" id="cut-0"><span class="no">1</span><span class="st"></span><span class="pic"></span><span class="cap"></span></button>
      <button class="cut" type="button" id="cut-1"><span class="no">2</span><span class="st"></span><span class="pic"></span><span class="cap"></span></button>
      <button class="cut" type="button" id="cut-2"><span class="no">3</span><span class="st"></span><span class="pic"></span><span class="cap"></span></button>
      <button class="cut" type="button" id="cut-3"><span class="no">4</span><span class="st"></span><span class="pic"></span><span class="cap"></span></button>
    </div>
    <p class="say" id="say" aria-live="polite"></p>
  </section>

  <section aria-labelledby="h-a">
    <h2 id="h-a">로봇 셰프</h2>
    <div class="acts">
      <button class="btn main" id="run" type="button">보여 주기</button>
      <button class="btn" id="reset" type="button">처음으로</button>
      <button class="btn" id="next" type="button">다른 레시피</button>
    </div>
    <div class="out" id="out" role="status" aria-live="polite"></div>
    <p class="note">우리 레시피는 A4로 옆 모둠과 바꿔 봐요</p>
  </section>
</div>

<script>
(function(){
  'use strict';

  // ── 그림 (선 1.8px, 먹색)
  var K = 'stroke="#222222" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"';
  var PLATE = '<ellipse cx="36" cy="46" rx="30" ry="6" fill="#FFFFFF" ' + K + '/>';
  var BREAD = '<path d="M18 44 V24 a8 8 0 0 1 4-14 h28 a8 8 0 0 1 4 14 V44 Z" fill="#F2D7A6" ' + K + '/>';
  var JAM = '<path d="M23 26 q6-6 13-2 t13 2 q-1 9-6 12 q-7 3-14 0 q-6-4-6-12 Z" fill="#E5484D" ' + K + '/>';
  function berry(x, y) { return '<path d="M' + x + ' ' + y + ' q-5-1-4-6 q4-2 8 0 q1 5-4 6 Z" fill="#E5484D" ' + K + '/><path d="M' + (x - 3) + ' ' + (y - 6) + ' l3 -2 l3 2" fill="none" stroke="#12B76A" stroke-width="1.8"/>'; }
  var BOWL = '<path d="M10 26 h52 q-3 20-26 20 q-23 0-26-20 Z" fill="#FFFFFF" ' + K + '/>';
  var RICE = '<path d="M14 26 q4-10 22-10 q18 0 22 10 Z" fill="#FFFFFF" ' + K + '/>';
  var BALL = '<path d="M36 8 q5 0 18 26 q3 10-8 10 h-20 q-11 0-8-10 q13-26 18-26 Z" fill="#FFFFFF" ' + K + '/>';
  var JAR = '<path d="M22 8 h28 l-3 32 h-22 Z" fill="#FFFFFF" ' + K + '/><rect x="20" y="40" width="32" height="8" rx="2" fill="#C1C1C1" ' + K + '/>';
  var TOASTER = '<rect x="12" y="20" width="44" height="26" rx="6" fill="#DDDDDD" ' + K + '/>';
  var TOAST = '<path d="M20 42 V26 a7 7 0 0 1 3-12 h26 a7 7 0 0 1 3 12 V42 Z" fill="#C98B4A" ' + K + '/>';
  function svg(inner) { return '<svg viewBox="0 0 72 54" aria-hidden="true">' + inner + '</svg>'; }

  var RECIPES = [
    { dish: '딸기잼 샌드위치', steps: [
      { cap: '식빵 한 장 놓기', pic: PLATE + BREAD },
      { cap: '식빵에 잼 바르기', pic: PLATE + BREAD + JAM, need: [0], needMsg: '잼을 바를 식빵이 없어요' },
      { cap: '잼 위에 딸기 올리기', pic: PLATE + BREAD + JAM + berry(30, 32) + berry(42, 34) + berry(36, 26), need: [1], needMsg: '딸기를 올릴 잼이 없어요', not: [3], notMsg: '식빵이 덮여 잼이 안 보여요' },
      { cap: '식빵으로 덮기', pic: PLATE + BREAD + '<path d="M14 38 V20 a8 8 0 0 1 4-14 h28 a8 8 0 0 1 4 14 V38 Z" fill="#F2D7A6" ' + K + '/>', need: [0], needMsg: '덮을 식빵이 아래에 없어요' }
    ]},
    { dish: '주먹밥', steps: [
      { cap: '그릇에 밥 담기', pic: RICE + BOWL },
      { cap: '밥에 깨 섞기', pic: RICE + BOWL + '<path d="M28 20h1M36 18h1M44 21h1M32 23h1M40 23h1" stroke="#222222" stroke-width="3" stroke-linecap="round"/><path d="M50 6 L40 22" ' + K + ' fill="none"/>', need: [0], needMsg: '섞을 밥이 없어요', not: [2], notMsg: '벌써 뭉쳐서 섞을 수 없어요' },
      { cap: '밥을 동그랗게 뭉치기', pic: BALL, need: [0], needMsg: '뭉칠 밥이 없어요' },
      { cap: '김 두르기', pic: BALL + '<rect x="27" y="30" width="18" height="14" fill="#222222"/>', need: [2], needMsg: '김을 두를 주먹밥이 없어요' }
    ]},
    { dish: '바나나 우유', steps: [
      { cap: '바나나 껍질 벗기기', pic: '<path d="M14 36 q22 14 44-8 q-6 20-26 20 q-12 0-18-12 Z" fill="#FDE68A" ' + K + '/><path d="M58 28 l6-10 M58 28 l-2-12" ' + K + ' fill="none"/>' },
      { cap: '믹서에 바나나·우유 넣기', pic: JAR + '<path d="M25 24 h22 l-2 16 h-18 Z" fill="#FFF8E1" ' + K + '/><path d="M28 30 q8 4 16-2" fill="none" stroke="#E0B400" stroke-width="3"/>', need: [0], needMsg: '껍질을 안 벗긴 바나나예요' },
      { cap: '뚜껑 닫고 갈기', pic: JAR + '<rect x="20" y="4" width="32" height="6" rx="2" fill="#222222"/><path d="M25 24 h22 l-2 16 h-18 Z" fill="#FDE68A" ' + K + '/><path d="M8 18 h8 M8 26 h8 M56 18 h8 M56 26 h8" ' + K + '/>', need: [1], needMsg: '믹서가 비어 있어요' },
      { cap: '컵에 따르기', pic: '<path d="M22 12 h28 l-4 34 h-20 Z" fill="#FFFFFF" ' + K + '/><path d="M24 22 h24 l-3 24 h-18 Z" fill="#FDE68A" ' + K + '/>', need: [2], needMsg: '아직 갈지 않았어요' }
    ]},
    { dish: '토스트', steps: [
      { cap: '식빵을 토스터에 넣기', pic: '<path d="M24 26 V10 h22 V26" fill="#F2D7A6" ' + K + '/>' + TOASTER },
      { cap: '레버 내리기', pic: TOASTER + '<rect x="56" y="34" width="8" height="5" rx="1" fill="#222222"/><path d="M60 14 v14 m-4-4 l4 4 l4-4" fill="none" ' + K + '/>', need: [0], needMsg: '토스터가 비어 있어요' },
      { cap: '구운 빵 접시에 놓기', pic: PLATE + TOAST, need: [1], needMsg: '빵이 아직 안 구워졌어요' },
      { cap: '빵에 버터 바르기', pic: PLATE + TOAST + '<rect x="29" y="24" width="14" height="10" rx="2" fill="#FDE68A" ' + K + '/>', need: [2], needMsg: '버터를 바를 빵이 접시에 없어요' }
    ]}
  ];
  var NUM = ['', '한', '두', '세'];

  var $ = function (id) { return document.getElementById(id); };
  var cuts = [0, 1, 2, 3].map(function (i) { return $('cut-' + i); });
  var dishEl = $('dish'), sheet = $('sheet'), say = $('say'), out = $('out');
  var runBtn = $('run'), resetBtn = $('reset'), nextBtn = $('next');

  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { reduced = false; }

  var rec = null, prevKey = null, swapAt = 0;
  var order = [];        // 자리마다 칸 번호(바른 순서 기준)
  var circle = null;     // 동그라미 친 자리
  var phase = 'circle';  // circle → fix → done
  var lift = null;       // 고칠 때 들어 올린 자리
  var running = false;
  var marks = ['', '', '', ''];
  var firstStop = null;

  function rnd(n) { return Math.floor(Math.random() * n); }

  function simulate(ord) {
    var did = {};
    for (var pos = 0; pos < ord.length; pos++) {
      var s = rec.steps[ord[pos]];
      var need = s.need || [], not = s.not || [];
      for (var i = 0; i < need.length; i++) { if (!did[need[i]]) { return { stop: pos, why: s.needMsg }; } }
      for (var j = 0; j < not.length; j++) { if (did[not[j]]) { return { stop: pos, why: s.notMsg }; } }
      did[ord[pos]] = true;
    }
    return { stop: null };
  }

  function drawCut(pos) {
    var b = cuts[pos], s = rec.steps[order[pos]];
    b.querySelector('.pic').innerHTML = svg(s.pic);
    b.querySelector('.cap').textContent = s.cap;
    b.setAttribute('aria-label', (pos + 1) + '번 칸 ' + s.cap);
  }

  function render() {
    for (var p = 0; p < 4; p++) {
      var b = cuts[p], m = marks[p];
      b.classList.toggle('circled', circle === p);
      b.classList.toggle('did', m === 'did');
      b.classList.toggle('stop', m === 'stop');
      b.classList.toggle('cur', m === 'cur');
      b.classList.toggle('lift', lift === p);
      b.querySelector('.st').textContent = lift === p ? '들림' : (m === 'did' ? '함' : (m === 'stop' ? '멈춤' : ''));
      b.disabled = running || phase === 'done';
      b.setAttribute('aria-pressed', (phase === 'circle' ? circle === p : lift === p) ? 'true' : 'false');
    }
    runBtn.textContent = phase === 'circle' ? '보여 주기' : '다시 보여 주기';
    runBtn.disabled = running || phase === 'done' || (phase === 'circle' && circle === null);
    resetBtn.disabled = running;
    nextBtn.disabled = running;
    runBtn.classList.toggle('main', phase !== 'done');
    nextBtn.classList.toggle('main', phase === 'done');

    if (running) { say.textContent = '로봇 셰프가 그림 순서대로 해요'; }
    else if (phase === 'circle') { say.textContent = circle === null ? '로봇 셰프가 헷갈릴 칸에 동그라미 쳐요' : '보여 주기를 눌러요'; }
    else if (phase === 'fix') { say.textContent = lift === null ? '바꿀 두 칸을 차례로 눌러요' : '자리를 바꿀 칸을 하나 더 눌러요'; }
    else { say.textContent = ''; }
  }

  function tap(pos) {
    if (running || phase === 'done') { return; }
    if (phase === 'circle') { circle = pos; render(); return; }
    // 고치기: 들어 올린 칸과 자리 바꾸기
    marks = ['', '', '', ''];
    if (lift === null) { lift = pos; }
    else if (lift === pos) { lift = null; }
    else {
      var t = order[lift]; order[lift] = order[pos]; order[pos] = t;
      drawCut(lift); drawCut(pos);
      bump(cuts[lift]); bump(cuts[pos]);   // 바뀐 두 칸만 한 번 튄다
      lift = null;
    }
    render();
  }

  function bump(el) { el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  function lines(arr) {
    out.textContent = '';
    arr.forEach(function (t) { var p = document.createElement('p'); p.textContent = t; out.appendChild(p); });
    out.classList.add('show');
  }

  function distLine(stop) {
    var d = stop - circle;
    if (d === 0) { return '동그라미 친 칸에서 멈췄어요'; }
    return '동그라미보다 ' + Math.abs(d) + '칸 ' + (d > 0 ? '뒤' : '앞') + '에서 멈췄어요';
  }

  function finish(res, first) {
    running = false;
    if (res.stop === null) {
      phase = 'done';
      var msg = ['요리가 나왔어요: ' + rec.dish];
      if (firstStop !== null) { msg.push('처음 헷갈린 곳: ' + (firstStop + 1) + '번 칸 → 자리를 바꿔 고쳤어요'); }
      lines(msg);
      sheet.classList.add('cooked');
      bump(sheet);
    } else {
      marks[res.stop] = 'stop';
      var m = [(res.stop + 1) + '번 칸: ' + res.why];
      if (first) { firstStop = res.stop; m.push(distLine(res.stop)); }
      lines(m);
      phase = 'fix';
    }
    render();
    try { out.scrollIntoView({ block: 'nearest', behavior: reduced ? 'auto' : 'smooth' }); } catch (e) { /* 결과는 그대로 보인다 */ }
  }

  function run() {
    if (running || phase === 'done' || (phase === 'circle' && circle === null)) { return; }
    var first = phase === 'circle';
    running = true; lift = null;
    marks = ['', '', '', ''];
    out.textContent = ''; out.classList.remove('show');
    var res = simulate(order);
    var last = res.stop === null ? 3 : res.stop;
    if (reduced) {
      for (var k = 0; k < last + (res.stop === null ? 1 : 0); k++) { marks[k] = 'did'; }
      finish(res, first);
      return;
    }
    var pos = 0;
    render();
    (function step() {
      if (res.stop !== null && pos === res.stop) { finish(res, first); return; }
      marks[pos] = 'cur'; render();
      setTimeout(function () {
        marks[pos] = 'did';
        pos += 1;
        if (pos > 3) { finish(res, first); return; }
        step();
      }, 600);
    })();
  }

  function startOrder() {
    order = [0, 1, 2, 3];
    var t = order[swapAt]; order[swapAt] = order[swapAt + 1]; order[swapAt + 1] = t;
  }

  function clearRound() {
    startOrder();
    circle = null; lift = null; phase = 'circle'; firstStop = null;
    marks = ['', '', '', ''];
    out.textContent = ''; out.classList.remove('show');
    sheet.classList.remove('cooked', 'pop');
    for (var p = 0; p < 4; p++) { drawCut(p); }
    render();
  }

  function newRound() {
    var ri, sa, key;
    do { ri = rnd(RECIPES.length); sa = rnd(3); key = ri + ':' + sa; } while (key === prevKey);
    prevKey = key;
    rec = RECIPES[ri]; swapAt = sa;
    dishEl.textContent = rec.dish;
    clearRound();
  }

  cuts.forEach(function (b, i) { b.addEventListener('click', function () { tap(i); }); });
  runBtn.addEventListener('click', run);
  resetBtn.addEventListener('click', function () { if (!running) { clearRound(); } });
  nextBtn.addEventListener('click', function () { if (!running) { newRound(); } });

  newRound();
})();
</script>
</body>
</html>
