<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>적힌 대로만 — 에듀다움 B04</title>
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 32px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(24px,5.8vw,34px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:15px;color:var(--muted);margin-top:6px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:8px 12px;margin-top:8px}
  h2{font-size:13.5px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;color:var(--muted)}

  .setname{font-size:15px;font-weight:700;margin-bottom:8px}

  .steps{list-style:none;display:flex;flex-direction:column;gap:4px}
  .step{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 8px;
    border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);
    transition:background .15s,border-color .15s}
  .step.guess{border-color:var(--point);border-width:3px}
  .step.current{background:var(--point-soft);border-color:var(--point)}
  .step.stopped{background:var(--point-soft);border-color:var(--point);border-width:3px}
  .pickbtn{flex:0 0 auto;font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:50%;
    min-height:44px;min-width:44px;width:44px;height:44px;padding:0;
    display:flex;align-items:center;justify-content:center}
  .pickbtn[aria-pressed="true"]{background:var(--point);color:#fff}
  .pickbtn:disabled{opacity:.6;cursor:not-allowed}
  .stext{flex:1 1 auto;font-size:14.5px;font-weight:700}

  .status{margin-top:8px;font-size:13.5px;font-weight:700;color:var(--point)}
  .status[hidden]{display:none}

  .scene{background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);
    display:flex;align-items:center;justify-content:center;padding:5px;max-width:190px;margin:6px auto 0}
  #stagesvg{max-height:72px;width:100%;max-width:150px;height:auto;display:block}
  #stagesvg [hidden]{display:none}

  .ask{margin-top:7px;font-size:13.5px;font-weight:600;color:var(--muted)}

  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:10px 18px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff;flex:1 1 140px}
  .btn.sub{flex:1 1 120px}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:var(--hard-sm)}

  .note{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--muted)}

  button, a{outline-offset:3px}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

  .pop{animation:pop .17s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B04/">과정안</a></span>
    <span class="tag">7~8</span>
  </nav>

  <header>
    <h1>적힌 대로만</h1>
    <p class="lead">고지식한 로봇이 어느 줄에서 막힐까</p>
  </header>

  <section aria-labelledby="h-s">
    <h2 id="h-s">단계</h2>
    <p class="setname" id="setname"></p>
    <ol class="steps" id="steps">
      <li class="step" id="row-1">
        <button class="pickbtn" id="pick-1" type="button" aria-pressed="false" aria-label="1번 줄 짚기">1</button>
        <span class="stext" id="txt-1"></span>
      </li>
      <li class="step" id="row-2">
        <button class="pickbtn" id="pick-2" type="button" aria-pressed="false" aria-label="2번 줄 짚기">2</button>
        <span class="stext" id="txt-2"></span>
      </li>
      <li class="step" id="row-3">
        <button class="pickbtn" id="pick-3" type="button" aria-pressed="false" aria-label="3번 줄 짚기">3</button>
        <span class="stext" id="txt-3"></span>
      </li>
      <li class="step" id="row-4">
        <button class="pickbtn" id="pick-4" type="button" aria-pressed="false" aria-label="4번 줄 짚기">4</button>
        <span class="stext" id="txt-4"></span>
      </li>
      <li class="step" id="row-5">
        <button class="pickbtn" id="pick-5" type="button" aria-pressed="false" aria-label="5번 줄 짚기">5</button>
        <span class="stext" id="txt-5"></span>
      </li>
    </ol>
    <div class="scene">
      <svg id="stagesvg" viewBox="0 0 200 120" role="img" aria-label="이번 과제에서 다루는 물건">
        <rect x="8" y="86" width="184" height="10" fill="#C9C2B4" stroke="#222222" stroke-width="2"/>
        <rect x="20" y="96" width="10" height="20" fill="#C9C2B4" stroke="#222222" stroke-width="2"/>
        <rect x="170" y="96" width="10" height="20" fill="#C9C2B4" stroke="#222222" stroke-width="2"/>
        <g id="icon-0" hidden>
          <rect x="72" y="60" width="56" height="22" rx="6" fill="#FFFFFF" stroke="#222222" stroke-width="3"/>
          <rect x="72" y="60" width="56" height="9" rx="4" fill="#E11D48" stroke="#222222" stroke-width="2"/>
          <rect x="118" y="38" width="8" height="44" rx="3" fill="#F5D77A" stroke="#222222" stroke-width="2" transform="rotate(20 122 60)"/>
        </g>
        <g id="icon-1" hidden>
          <rect x="40" y="62" width="22" height="22" rx="2" fill="#E11D48" stroke="#222222" stroke-width="2.5"/>
          <rect x="64" y="62" width="22" height="22" rx="2" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
          <rect x="88" y="62" width="22" height="22" rx="2" fill="#F5D77A" stroke="#222222" stroke-width="2.5"/>
          <rect x="120" y="54" width="22" height="22" rx="2" fill="#FFFFFF" stroke="#222222" stroke-width="2.5" transform="rotate(-12 131 65)"/>
          <rect x="146" y="60" width="22" height="22" rx="2" fill="#F5D77A" stroke="#222222" stroke-width="2.5" transform="rotate(10 157 71)"/>
        </g>
        <g id="icon-2" hidden>
          <path d="M58 84 L62 64 H80 L84 84 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
          <path d="M86 84 L90 64 H108 L112 84 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
          <path d="M114 84 L118 64 H136 L140 84 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
          <path d="M72 64 L76 44 H94 L98 64 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
          <path d="M100 64 L104 44 H122 L126 64 Z" fill="#FFFFFF" stroke="#222222" stroke-width="2.5"/>
          <path d="M86 44 L90 24 H108 L112 44 Z" fill="#E11D48" stroke="#222222" stroke-width="2.5" stroke-dasharray="4 3"/>
        </g>
      </svg>
    </div>
    <p class="status" id="status" hidden></p>
  </section>


  <section aria-labelledby="h-a">
    <h2 id="h-a">해보기</h2>
    <div class="acts">
      <button class="btn main" id="run" type="button">해 보기</button>
      <button class="btn sub" id="reset" type="button">처음으로</button>
      <button class="btn sub" id="next" type="button">다음 판</button>
    </div>
    <p class="note">내 설명서는 옆 모둠이 시험해요</p>
  </section>
</div>

<script>
(function(){
  'use strict';

  var SETS = [
    {
      name: '필통 정리',
      lines: ['지퍼를 연다', '필통을 잘 정리한다', '연필 세 자루를 넣는다', '지우개 한 개를 넣는다', '지퍼를 닫는다'],
      vague: 2,
      icon: 0
    },
    {
      name: '색 블록 줄 세우기',
      lines: ['블록 다섯 개를 책상에 놓는다', '빨간 블록을 맨 왼쪽에 둔다', '나머지 블록을 잘 늘어놓는다', '블록끼리 붙인다', '손을 뗀다'],
      vague: 3,
      icon: 1
    },
    {
      name: '종이컵 탑 쌓기',
      lines: ['종이컵 여섯 개를 꺼낸다', '세 개를 한 줄로 엎어 놓는다', '그 위에 두 개를 엎어 올린다', '남은 컵을 적당히 올린다', '손을 뗀다'],
      vague: 4,
      icon: 2
    }
  ];

  var setIdx = -1, prevSetIdx = null;
  var guess = null;
  var running = false;
  var ran = false;       // 확인을 눌렀나. 그 뒤로는 짚기가 잠긴다.

  var runBtn = document.getElementById('run');
  var resetBtn = document.getElementById('reset');
  var nextBtn = document.getElementById('next');
  var statusEl = document.getElementById('status');
  var setnameEl = document.getElementById('setname');
  var icons = [document.getElementById('icon-0'), document.getElementById('icon-1'), document.getElementById('icon-2')];
  var pickBtns = [1, 2, 3, 4, 5].map(function (i) { return document.getElementById('pick-' + i); });

  var reduced = false;
  try {
    reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  function pickSetIdx() {
    var v;
    do { v = Math.floor(Math.random() * SETS.length); } while (v === prevSetIdx);
    prevSetIdx = v;
    return v;
  }

  function clearMarks() {
    for (var i = 1; i <= 5; i++) {
      document.getElementById('row-' + i).classList.remove('current', 'stopped');
    }
    statusEl.hidden = true;
    statusEl.textContent = '';
  }

  function clearGuessMarks() {
    for (var i = 1; i <= 5; i++) {
      document.getElementById('row-' + i).classList.remove('guess');
      pickBtns[i - 1].setAttribute('aria-pressed', 'false');
      pickBtns[i - 1].disabled = false;
    }
  }

  function lockAll(on) {
    runBtn.disabled = on || guess === null;
    resetBtn.disabled = on;
    nextBtn.disabled = on;
    for (var i = 0; i < 5; i++) { pickBtns[i].disabled = on || ran; }
  }

  function loadSet() {
    var set = SETS[setIdx];
    setnameEl.textContent = set.name;
    for (var i = 1; i <= 5; i++) {
      document.getElementById('txt-' + i).textContent = set.lines[i - 1];
    }
    for (var k = 0; k < icons.length; k++) {
      if (k === set.icon) { icons[k].removeAttribute('hidden'); }
      else { icons[k].setAttribute('hidden', ''); }
    }
  }

  function pick(i) {
    if (running || ran) { return; }
    guess = i;
    document.getElementById('row-' + i).classList.add('guess');
    pickBtns[i - 1].setAttribute('aria-pressed', 'true');
    for (var k = 0; k < 5; k++) { pickBtns[k].disabled = true; }
    lockAll(false);
  }

  function run() {
    if (running || guess === null) { return; }
    running = true; ran = true;
    lockAll(true);
    clearMarks();

    var vague = SETS[setIdx].vague;
    var i = 1;

    function step() {
      var row = document.getElementById('row-' + i);
      if (i === vague) {
        row.classList.add('stopped');
        var diff = guess - vague;
        var msg;
        if (diff === 0) { msg = '짚은 줄에서 멈췄어요'; }
        else if (diff > 0) { msg = diff + '줄 위에서 막혔어요'; }
        else { msg = (-diff) + '줄 아래에서 막혔어요'; }
        statusEl.textContent = msg;
        statusEl.classList.remove('pop'); void statusEl.offsetWidth; statusEl.classList.add('pop');
        statusEl.hidden = false;
        running = false;
        lockAll(false);
        return;
      }
      row.classList.add('current');
      if (reduced) {
        row.classList.remove('current');
        i += 1;
        step();
      } else {
        setTimeout(function () {
          row.classList.remove('current');
          i += 1;
          step();
        }, 600);
      }
    }
    step();
  }

  function resetRun() {
    ran = false;
    if (running) { return; }
    clearMarks();
  }

  function newRound() {
    ran = false;
    running = false;
    setIdx = pickSetIdx();
    guess = null;
    loadSet();
    clearGuessMarks();
    clearMarks();
    lockAll(false);
  }

  runBtn.addEventListener('click', run);
  resetBtn.addEventListener('click', resetRun);
  nextBtn.addEventListener('click', newRound);
  for (var p = 0; p < 5; p++) {
    (function (idx) { pickBtns[idx].addEventListener('click', function () { pick(idx + 1); }); })(p);
  }

  newRound();
})();
</script>
</body>
</html>
