<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세 칸으로 나누기 활동 — 에듀다움 B15</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF; --soft:#F7F7F7;
    --point:#FF385C; --point-soft:#FFF0F3; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5.0vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.15}
  .lead{font-size:14.5px;color:var(--muted);margin-top:5px;font-weight:600}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:12px;margin-top:11px}
  h2{font-size:13px;font-weight:700;letter-spacing:-.02em;margin-bottom:8px;color:var(--muted);text-align:center}

  .scene{display:flex;align-items:center;justify-content:center;gap:10px;font-size:17px;font-weight:700;margin-bottom:10px}
  .scene img{flex:0 0 auto;width:72px;height:72px;display:block;border-radius:16px;object-fit:contain;background:#f8f6f1}
  .scene.flip{animation:b15flip .42s ease}
  @keyframes b15flip{0%{transform:rotateX(80deg);opacity:.2}100%{transform:none;opacity:1}}

  .slots{display:flex;flex-direction:column;gap:7px}
  .slot{width:100%;text-align:left;font-family:inherit;cursor:pointer;color:var(--ink);
    background:var(--soft);border:1px dashed var(--line-strong);border-radius:var(--r-sm);
    min-height:58px;padding:7px 12px;display:flex;flex-direction:column;justify-content:center}
  .slot{position:relative;padding-left:46px;border-left:6px solid var(--bar,var(--line-strong))}
  .slot.s0{--bar:var(--sky,#5aa9e6)}
  .slot.s1{--bar:var(--sun,#ffc845)}
  .slot.s2{--bar:var(--mint,#4cbf9a)}
  .slot .no{position:absolute;left:8px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:50%;
    background:var(--bar);color:var(--ink);font-weight:700;font-size:14px;display:grid;place-items:center}
  .slot.drop .sc{animation:b15drop .3s ease}
  @keyframes b15drop{0%{transform:translateY(-14px);opacity:0}100%{transform:none;opacity:1}}
  .slot .sl{font-size:12.5px;font-weight:700;color:var(--muted)}
  .slot .sc{font-size:15.5px;font-weight:600;min-height:1.4em}
  .slot.full{background:var(--surface);border:1px solid var(--line)}
  .slot.full,.slot.far,.slot.same{border-left:6px solid var(--bar)}
  .slot.far{background:var(--pink-l,#ffeef1);border:2px solid var(--pink,#ff8fa3);border-left:6px solid var(--bar)}
  .slot.same{background:var(--mint-l,#e3f6ef);border:2px solid var(--mint,#4cbf9a);border-left:6px solid var(--bar)}
  .slot .sd{font-size:13px;font-weight:700;color:var(--ink)}
  .slot:disabled{cursor:default}
  .arrow{text-align:center;color:var(--muted);font-size:15px;line-height:1}

  .cards{display:flex;flex-direction:column;gap:7px}
  .card{width:100%;text-align:left;font-family:inherit;cursor:pointer;color:var(--ink);
    font-size:15.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-sm);min-height:48px;padding:8px 12px;box-shadow:var(--hard-sm)}
  .card:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
  .card{border-left:6px solid var(--grape,#9b8cf2);min-width:0;overflow-wrap:anywhere}

  .status{margin-top:10px;text-align:center;font-size:15px;font-weight:700;min-height:1.5em}
  .status.dim{color:var(--muted)}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:600;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:48px;padding:10px 16px}
  .btn.main{background:var(--point);border-color:var(--point);color:#fff;flex:1 1 140px}
  .btn.sub{flex:1 1 100px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .note{margin-top:8px;font-size:13px;font-weight:600;color:var(--muted)}

  button, a{outline-offset:3px}
  :focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B15/">과정안</a></span>
    <span class="tag">1~2</span>
  </nav>

  <header>
    <h1>세 칸으로 나누기 활동</h1>
    <p class="lead">장면 카드를 받아들였나·알아냈나·해 주었나 칸에 놓아요</p>
  </header>

  <section aria-labelledby="h-c">
    <h2 id="h-c">카드</h2>
    <div class="scene" id="sceneBox"><span id="sceneIcon" aria-hidden="true"></span><span id="scene"></span></div>
    <div class="cards" id="cards"></div>
  </section>

  <section aria-labelledby="h-s">
    <h2 id="h-s">세 칸</h2>
    <div class="slots" id="slots"></div>
    <p class="status dim" id="status" aria-live="polite">카드를 눌러 위 칸부터 채워요</p>
    <div class="acts">
      <button class="btn main" id="checkBtn" type="button" disabled>확인하기</button>
      <button class="btn sub" id="againBtn" type="button">다시 하기</button>
      <button class="btn sub" id="nextBtn" type="button">다음 장면</button>
    </div>
    <p class="note">어느 것이 인공지능인지는 교실에서 이야기해요</p>
  </section>
</div>

<script>
(function(){
  'use strict';

  // 지도안 1차시 활동1: 무엇을 받아들였나(보기·듣기) / 무엇을 알아냈나(판단) / 무엇을 해 주었나(결과)
  var SLOT_NAMES = ['받아들였나 (보기·듣기)', '알아냈나 (판단)', '해 주었나 (결과)'];
  // 장면 카드. 배열 순서가 제 칸 순서다. 앞 둘은 지도안 도입 장면, 뒤 둘은 활동2 사례 카드.
  var SCENES = [
    ['음성 비서에게 날씨 묻기', ['“오늘 날씨 어때?” 말을 들어요', '날씨를 묻는 말인 줄 알아내요', '“맑아요”라고 알려 줘요']],
    ['사진첩이 얼굴별로 묶어 주기', ['사진 속 얼굴을 봐요', '같은 사람끼리 알아내요', '얼굴별로 사진을 묶어 줘요']],
    ['손동작 알아보기', ['카메라로 손 모양을 봐요', '주먹인지 보자기인지 알아내요', '알아낸 모양을 화면에 띄워요']],
    ['영상 추천', ['내가 본 영상 목록을 읽어요', '좋아할 만한 영상을 골라내요', '다음 볼 영상을 띄워 줘요']]
  ];
  var NUM = ['', '한', '두', '세'];
  var ST = 'fill="none" stroke="#33302b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"';
  var ICONS = ['weather', 'faces', 'hand', 'video'].map(function (n) { return '<img src="assets/' + n + '.webp" alt="" width="72" height="72">'; });

  var sceneIdx = -1, order = [0, 1, 2];
  var slots = [null, null, null];   // 칸마다 놓인 카드(제 칸 번호)
  var confirmed = false, lastPut = -1;

  var sceneEl = document.getElementById('scene');
  var sceneBox = document.getElementById('sceneBox');
  var sceneIcon = document.getElementById('sceneIcon');
  var cardsEl = document.getElementById('cards');
  var slotsEl = document.getElementById('slots');
  var statusEl = document.getElementById('status');
  var checkBtn = document.getElementById('checkBtn');
  var againBtn = document.getElementById('againBtn');
  var nextBtn = document.getElementById('nextBtn');

  var slotBtns = [];
  (function buildSlots(){
    for (var k = 0; k < 3; k++) {
      if (k > 0) {
        var ar = document.createElement('div');
        ar.className = 'arrow'; ar.setAttribute('aria-hidden', 'true'); ar.textContent = '↓';
        slotsEl.appendChild(ar);
      }
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'slot';
      b.innerHTML = '<span class="no" aria-hidden="true">' + (k + 1) + '</span><span class="sl"></span><span class="sc"></span><span class="sd"></span>';
      b.querySelector('.sl').textContent = SLOT_NAMES[k];
      (function (idx) { b.addEventListener('click', function () { takeOut(idx); }); })(k);
      slotsEl.appendChild(b);
      slotBtns.push(b);
    }
  })();

  var cardBtns = [];
  (function buildCards(){
    for (var i = 0; i < 3; i++) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'card';
      (function (idx) { b.addEventListener('click', function () { putIn(idx); }); })(i);
      cardsEl.appendChild(b);
      cardBtns.push(b);
    }
  })();

  function shuffle(){
    var a;
    do {
      a = [0, 1, 2];
      for (var i = 2; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
    } while (a[0] === 0 && a[1] === 1);   // 칸 순서 그대로 놓이지 않게
    return a;
  }

  function newRound(){
    var s, first = sceneIdx === -1;
    do { s = Math.floor(Math.random() * SCENES.length); } while (s === sceneIdx);
    sceneIdx = s;
    order = shuffle();
    slots = [null, null, null];
    confirmed = false;
    lastPut = -1;
    render();
    sceneBox.classList.remove('flip'); void sceneBox.offsetWidth; sceneBox.classList.add('flip');
    if (!first && window.Fun) Fun.say('새 장면 「' + SCENES[sceneIdx][0] + '」이에요. 카드를 칸에 놓아 봐요.');
  }

  function putIn(pos){
    if (confirmed) return;
    var card = order[pos];
    if (slots.indexOf(card) !== -1) return;
    var k = slots.indexOf(null);
    if (k === -1) return;
    slots[k] = card;
    lastPut = k;
    render();
    if (window.Fun && slots.indexOf(null) === -1) Fun.say('세 칸이 다 찼어요. 확인하기 전에 순서를 한 번 더 읽어 봐요.', 'think');
  }

  function takeOut(k){
    if (confirmed || slots[k] === null) return;
    slots[k] = null;
    lastPut = -1;
    render();
  }

  function doCheck(){
    if (confirmed || slots.indexOf(null) !== -1) return;
    confirmed = true;
    lastPut = -1;
    render();
    nextBtn.focus({ preventScroll: true });
    var off = 0;
    for (var k = 0; k < 3; k++) if (slots[k] !== k) off++;
    if (window.Fun) {
      if (off) {
        Fun.say('제 칸에서 떨어진 카드가 ' + off + '장 있어요. 그 카드가 왜 그 칸이 아닌지 살펴봐요.', 'think');
        Fun.shake(slotsEl);
      } else {
        Fun.say('세 장이 모두 그 칸에 있었어요. 다음 장면에서도 같은 세 칸을 찾아봐요.', 'cheer');
        Fun.burst(slotsEl);
      }
      Fun.stamp();
    }
  }

  function doAgain(){
    // 확인 전이면 놓은 카드를 다 뺀다. 확인한 뒤에는 다음 장면과 같다.
    if (!confirmed) {
      slots = [null, null, null]; lastPut = -1; render();
      if (window.Fun) Fun.say('카드를 모두 뺐어요. 같은 장면을 처음부터 놓아 봐요.', 'think');
      return;
    }
    newRound();
  }

  checkBtn.addEventListener('click', doCheck);
  againBtn.addEventListener('click', doAgain);
  nextBtn.addEventListener('click', newRound);

  function render(){
    var texts = SCENES[sceneIdx][1];
    sceneEl.textContent = SCENES[sceneIdx][0];
    sceneIcon.innerHTML = ICONS[sceneIdx];

    for (var i = 0; i < 3; i++) {
      var c = order[i];
      cardBtns[i].textContent = texts[c];
      cardBtns[i].disabled = confirmed || slots.indexOf(c) !== -1;
    }

    var off = 0;
    for (var k = 0; k < 3; k++) {
      var b = slotBtns[k], v = slots[k];
      b.querySelector('.sc').textContent = v === null ? '' : texts[v];
      var d = (confirmed && v !== null) ? Math.abs(k - v) : 0;
      if (d) off++;
      b.querySelector('.sd').textContent = confirmed ? (d ? NUM[d] + ' 칸 떨어짐' : '같은 칸') : '';
      b.className = 'slot s' + k + (v !== null ? ' full' : '') + (confirmed && v !== null ? (d ? ' far' : ' same') : '') + (k === lastPut ? ' drop' : '');
      b.disabled = confirmed || v === null;
      b.setAttribute('aria-label', SLOT_NAMES[k] + (v === null ? ', 빈 칸' : ', ' + texts[v]));
    }
    checkBtn.disabled = confirmed || slots.indexOf(null) !== -1;
    // 확인한 뒤에는 '다음 장면'이 주 단추가 된다.
    checkBtn.className = 'btn ' + (confirmed ? 'sub' : 'main');
    nextBtn.className = 'btn ' + (confirmed ? 'main' : 'sub');

    if (!confirmed) {
      var n = 3 - slots.filter(function (x) { return x === null; }).length;
      statusEl.textContent = n === 0 ? '카드를 눌러 위 칸부터 채워요'
        : n < 3 ? '칸을 누르면 카드가 빠져요' : '확인하면 드러나요';
      statusEl.className = 'status dim';
    } else {
      statusEl.textContent = off ? NUM[off] + ' 장이 제 칸에서 떨어져 있었어요' : '세 장 모두 그 칸이었어요';
      statusEl.className = 'status';
    }
  }

  newRound();
})();
</script>
<script src="../assets/play/fun.js" data-block="B15" data-mission="장면 카드 세 장을 받아들였나, 알아냈나, 해 주었나 칸에 놓아요. 다 놓기 전에는 확인할 수 없어요!"></script>
</body>
</html>
