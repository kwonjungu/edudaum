<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가르쳐 보기 — 에듀다움 B15</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#00A39B; --point-soft:#CFF0ED; --muted:#5E5E5E;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:8px 14px 16px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;
    font-size:14px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;border:2.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(23px,5.6vw,32px);font-weight:900;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:15px;color:var(--muted);margin-top:5px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:9px;margin-top:8px}
  h2{font-size:13.5px;font-weight:900;letter-spacing:-.02em;margin-bottom:6px;color:var(--muted)}

  .top{display:flex;align-items:center;gap:14px}
  .cnt{font-family:'Courier New',monospace;font-size:clamp(34px,9vw,48px);font-weight:900;
    line-height:1;color:var(--point)}
  .cnt.pop{animation:pop .13s ease-out}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  .empty{font-size:13.5px;font-weight:800;color:var(--muted);flex:1}
  .empty .code{font-family:'Courier New',monospace;font-weight:900;color:var(--ink)}
  .lamp{width:44px;height:44px;flex:0 0 44px;display:block}
  .lamp circle{fill:#D9D9D9;stroke:var(--ink);stroke-width:3}
  .lamp circle.on{fill:#E5484D}
  #slide{width:100%;min-height:44px;margin-top:4px;accent-color:var(--point)}

  .view{position:relative;width:100%;aspect-ratio:4/3;max-height:135px;background:var(--ink);
    border:2.5px solid var(--ink);border-radius:var(--r-sm);overflow:hidden;display:flex}
  #cam{width:100%;height:100%;object-fit:cover;display:block}
  #pad{width:100%;height:100%;display:block;background:#fff;touch-action:none;cursor:crosshair}
  [hidden]{display:none!important}
  .priv{position:absolute;left:7px;bottom:7px;right:7px;font-size:11.5px;font-weight:900;
    color:var(--paper);background:rgba(20,20,20,.82);border-radius:999px;padding:4px 10px;text-align:center}

  .bars{margin-top:6px;display:grid;gap:4px}
  .bar{display:flex;align-items:center;gap:8px}
  .bar .nm{width:1.4em;font-weight:900;font-size:16px}
  .bar svg{flex:1;height:16px;display:block}
  .track{fill:var(--point-soft);stroke:var(--ink);stroke-width:2}
  .fill{fill:var(--point)}

  .chips{display:flex;flex-wrap:wrap;gap:3px;margin:2px 0 0 calc(1.4em + 8px);min-height:10px}
  .chips i{width:10px;height:10px;border:1.5px solid var(--ink);border-radius:3px;display:block}
  .chips i.in{animation:drop .18s ease-out}
  @keyframes drop{0%{transform:translateY(-7px) scale(.5);opacity:0}100%{transform:none;opacity:1}}
  .bar .nm{transition:font-size .15s,color .15s}
  .bar .nm.big{font-size:25px;color:var(--point)}
  .meta{margin-top:5px;font-size:13.5px;font-weight:800;font-family:'Courier New',monospace}
  .practice{margin-top:5px;display:inline-flex;font-size:12.5px;font-weight:900;color:var(--ink);
    background:var(--point-soft);border:2px solid var(--ink);border-radius:999px;padding:4px 10px}

  .peg{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
  .pbtn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:13.5px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    min-height:44px;padding:8px 13px;box-shadow:var(--hard-sm)}
  .pbtn.sel{background:var(--point);color:#fff}
  .pbtn:disabled{opacity:.55;cursor:default}
  .lockmsg{font-size:12.5px;font-weight:800;color:var(--muted)}
  .reveal{margin-top:5px;font-size:13.5px;font-weight:900}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:9px 16px;box-shadow:var(--hard-sm);flex:1 1 92px;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point)}
  .btn:disabled{opacity:.42;cursor:default;box-shadow:none}

  .note{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .note b{font-weight:900;color:var(--ink)}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B15/">과정안</a></span>
    <span class="tag">1~2</span>
  </nav>

  <header>
    <h1>가르쳐 보기</h1>
    <p class="lead">어느 쪽이 배우고 있나요</p>
  </header>

  <section aria-labelledby="h-t">
    <h2 id="h-t">소음 신호등 칸</h2>
    <div class="peg" role="group" aria-label="소음 신호등 칸 걸기">
      <button class="pbtn" id="pegT1" type="button">가르칠 수 있어요</button>
      <button class="pbtn" id="pegT2" type="button">가르칠 수 없어요</button>
    </div>
    <p class="lockmsg" id="lockT">두 칸을 걸면 만질 수 있어요</p>
    <div class="top">
      <svg class="lamp" viewBox="0 0 40 40" aria-hidden="true"><circle id="lampC" cx="20" cy="20" r="16"></circle></svg>
      <b class="cnt" id="cnt" aria-live="off">0</b>
      <span class="empty"><span class="code">소리 크기 &gt; 60 → 빨간불</span><br><b id="lampT">꺼짐</b> · 여기엔 담기 칸이 없어요</span>
    </div>
    <input type="range" id="slide" min="0" max="99" step="1" aria-label="소리 크기" hidden>
    <p class="practice" id="practiceT" hidden>연습 모드 · 막대로 소리를 옮겨요</p>
    <p class="note">소리를 내 보세요 · 소리는 저장되지 않아요</p>
    <p class="reveal" id="sayTop" hidden></p>
  </section>

  <section aria-labelledby="h-l">
    <h2 id="h-l">예시로 배우는 칸</h2>
    <div class="peg" role="group" aria-label="예시로 배우는 칸 걸기">
      <button class="pbtn" id="pegB1" type="button">가르칠 수 있어요</button>
      <button class="pbtn" id="pegB2" type="button">가르칠 수 없어요</button>
    </div>
    <div class="view">
      <video id="cam" playsinline muted hidden></video>
      <canvas id="pad" width="320" height="240" hidden></canvas>
      <span class="priv">손과 물건만 비춰요 · 화면에만 보이고 저장되지 않아요</span>
    </div>

    <div class="bars">
      <div class="bar"><span class="nm" id="nmA">가</span>
        <svg viewBox="0 0 100 14" preserveAspectRatio="none" role="img" aria-label="가 쪽으로 기운 정도">
          <rect class="track" x="1" y="1" width="98" height="12" rx="3"></rect>
          <rect class="fill" id="barA" x="2" y="2" width="0" height="10" rx="2"></rect>
        </svg></div>
      <div class="chips" id="chipA" aria-hidden="true"></div>
      <div class="bar"><span class="nm" id="nmB">나</span>
        <svg viewBox="0 0 100 14" preserveAspectRatio="none" role="img" aria-label="나 쪽으로 기운 정도">
          <rect class="track" x="1" y="1" width="98" height="12" rx="3"></rect>
          <rect class="fill" id="barB" x="2" y="2" width="0" height="10" rx="2"></rect>
        </svg></div>
      <div class="chips" id="chipB" aria-hidden="true"></div>
    </div>

    <p class="meta" id="meta">가 0장 · 나 0장</p>
    <p class="practice" id="practice" hidden>연습 모드 · 손으로 그려 담아요</p>
    <p class="reveal" id="sayBottom" hidden></p>

    <div class="acts">
      <button class="btn main" id="addA" type="button">가 담기</button>
      <button class="btn main" id="addB" type="button">나 담기</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
    </div>

    <p class="note">예시를 더 담으면 달라지나요</p>
    <p class="note"><b>사례 카드는 손가락으로 판정해요</b></p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var cntEl = $('cnt');
  var cam = $('cam'), pad = $('pad');
  var barA = $('barA'), barB = $('barB'), metaEl = $('meta'), practiceEl = $('practice');
  var nmA = $('nmA'), nmB = $('nmB'), chipA = $('chipA'), chipB = $('chipB');

  /* 두 칸을 만지기 전에 거는 자리. 판마다(=다시 하기 전까지) 한 번뿐이다. */
  var pegTop = null, pegBottom = null;
  var revealedTop = false, revealedBottom = false;
  function unlocked(){ return pegTop !== null && pegBottom !== null; }

  $('pegT1').addEventListener('click', function(){
    if (pegTop !== null) return; pegTop = 'yes'; renderPeg();
  });
  $('pegT2').addEventListener('click', function(){
    if (pegTop !== null) return; pegTop = 'no'; renderPeg();
  });
  $('pegB1').addEventListener('click', function(){
    if (pegBottom !== null) return; pegBottom = 'yes'; renderPeg();
  });
  $('pegB2').addEventListener('click', function(){
    if (pegBottom !== null) return; pegBottom = 'no'; renderPeg();
  });

  function renderPeg(){
    $('pegT1').classList.toggle('sel', pegTop === 'yes');
    $('pegT2').classList.toggle('sel', pegTop === 'no');
    $('pegT1').disabled = pegTop !== null; $('pegT2').disabled = pegTop !== null;
    $('pegB1').classList.toggle('sel', pegBottom === 'yes');
    $('pegB2').classList.toggle('sel', pegBottom === 'no');
    $('pegB1').disabled = pegBottom !== null; $('pegB2').disabled = pegBottom !== null;
    $('lockT').hidden = unlocked();
    renderMeta();
  }

  /* 위 칸: 소음 신호등. 기준 60은 고정이다 — 무엇을 해도 규칙이 달라지지 않는다.
     지금 이 순간의 소리 크기만 본다. 어떤 표본도 담아 두지 않는다. */
  var LIMIT = 60, level = 0, lampOn = false, flips = 0;
  var slide = $('slide'), lampC = $('lampC'), lampT = $('lampT');
  var practiceT = false;

  function pop(){ cntEl.classList.remove('pop'); void cntEl.offsetWidth; cntEl.classList.add('pop'); }
  function setLevel(v){
    if (!unlocked()){ return; }        // 두 칸을 걸기 전에는 불이 움직이지 않는다
    level = v;
    cntEl.textContent = String(level);
    var on = level > LIMIT;
    if (on !== lampOn){
      lampOn = on;
      lampC.classList.toggle('on', on);
      lampT.textContent = on ? '빨간불' : '꺼짐';
      if (on){
        pop(); flips++;
        if (!revealedTop && flips >= 3){
          revealedTop = true;
          var el = $('sayTop');
          el.hidden = false;
          el.textContent = (pegTop === 'no') ? '건 대로였어요' : '달랐어요';
        }
      }
    }
  }
  function clearLamp(){
    level = 0; lampOn = false; flips = 0;
    cntEl.textContent = '0'; lampC.classList.remove('on'); lampT.textContent = '꺼짐';
  }

  function usePracticeT(){
    if (practiceT) return;
    practiceT = true;
    stopMic();
    slide.hidden = false; $('practiceT').hidden = false;
    slide.value = String(level);
  }
  slide.addEventListener('input', function(){ setLevel(parseInt(this.value, 10) || 0); });

  var mStream = null, actx = null, analyser = null, abuf = null, mTimer = null, smooth = 0;
  function stopMic(){
    if (mTimer){ clearInterval(mTimer); mTimer = null; }
    if (mStream){ mStream.getTracks().forEach(function(t){ t.stop(); }); mStream = null; }
    if (actx){ actx.close(); actx = null; }
    analyser = null; abuf = null;
  }
  function micTick(){
    if (!analyser) return;
    analyser.getByteTimeDomainData(abuf);
    var sq = 0;
    for (var i = 0; i < abuf.length; i++){ var t = (abuf[i] - 128) / 128; sq += t * t; }
    var rms = Math.sqrt(sq / abuf.length);
    var db = 20 * Math.log(Math.max(rms, 1e-6)) / Math.LN10;
    var v = Math.round((db + 60) / 50 * 99);
    if (v < 0) v = 0; if (v > 99) v = 99;
    smooth = Math.round(smooth * 0.4 + v * 0.6);
    setLevel(smooth);
  }
  function startMic(){
    if (practiceT || mStream) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ usePracticeT(); return; }
    navigator.mediaDevices.getUserMedia({
      // 자동 게인이 켜져 있으면 조용할 때 마이크가 저 혼자 키워 수가 제멋대로 움직인다(B18과 같다).
      audio:{ autoGainControl:false, noiseSuppression:false, echoCancellation:false }, video:false
    }).then(function(st){
      if (document.hidden){ st.getTracks().forEach(function(t){ t.stop(); }); return; }
      mStream = st;
      actx = new AC();
      if (actx.state === 'suspended') actx.resume();
      analyser = actx.createAnalyser();
      analyser.fftSize = 1024;
      abuf = new Uint8Array(analyser.fftSize);
      actx.createMediaStreamSource(st).connect(analyser);
      st.getTracks()[0].addEventListener('ended', usePracticeT);
      mTimer = setInterval(micTick, 100);
    }).catch(function(){ usePracticeT(); });
  }

  /* 아래 칸: 24x24 특징 스무 개와 가까운 셋 */
  var S = 24, N = S * S;
  var work = document.createElement('canvas'); work.width = S; work.height = S;
  var wctx = work.getContext('2d', { willReadFrequently:true });
  var W = [1,1,1,1]; for (var wi = 0; wi < 16; wi++) W.push(0.6);

  var samples = [];
  var MAX = 20;
  var source = null;

  function feat(){
    if (!source) return null;
    if (source === 'cam'){
      var vw = cam.videoWidth, vh = cam.videoHeight;
      if (!vw || !vh) return null;
      var side = Math.min(vw, vh);
      wctx.drawImage(cam, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, S, S);
    } else {
      wctx.drawImage(pad, 0, 0, pad.width, pad.height, 0, 0, S, S);
    }
    var d = wctx.getImageData(0, 0, S, S).data;
    var r = 0, g = 0, b = 0, lum = 0, cell = [], k;
    for (k = 0; k < 16; k++) cell.push(0);
    for (var y = 0; y < S; y++) for (var x = 0; x < S; x++){
      var p = (y * S + x) * 4;
      r += d[p]; g += d[p+1]; b += d[p+2];
      var L = d[p] * 0.299 + d[p+1] * 0.587 + d[p+2] * 0.114;
      lum += L;
      cell[((y / 6) | 0) * 4 + ((x / 6) | 0)] += L;
    }
    var f = [r / N / 255, g / N / 255, b / N / 255, lum / N / 255];
    for (k = 0; k < 16; k++) f.push(cell[k] / 36 / 255);
    return f;
  }

  function dist(a, b){
    var s = 0;
    for (var i = 0; i < 20; i++){ var t = a[i] - b[i]; s += W[i] * t * t; }
    return Math.sqrt(s);
  }

  function nOf(c){ var n = 0; for (var i = 0; i < samples.length; i++) if (samples[i].cls === c) n++; return n; }

  function setBars(a, b){
    barA.setAttribute('width', (a * 96).toFixed(1));
    barB.setAttribute('width', (b * 96).toFixed(1));
    nmA.classList.toggle('big', a >= 0.8);
    nmB.classList.toggle('big', b >= 0.8);
  }

  // 담은 예시를 평균색 칩으로 쌓는다. 담자마자 눈에 보여야 가르치는 맛이 난다.
  function chip(cls, f){
    var el = document.createElement('i');
    el.style.background = 'rgb(' + Math.round(f[0]*255) + ',' + Math.round(f[1]*255) + ',' + Math.round(f[2]*255) + ')';
    el.className = 'in';
    (cls === '가' ? chipA : chipB).appendChild(el);
  }

  function classify(){
    if (nOf('가') === 0 || nOf('나') === 0) return;
    var q = feat(); if (!q) return;
    var ds = samples.map(function(s){ return { cls:s.cls, d:dist(q, s.feat) }; });
    ds.sort(function(p, r){ return p.d - r.d; });
    var sa = 0, sb = 0;
    for (var i = 0; i < Math.min(3, ds.length); i++){
      var sim = 1 / (ds[i].d + 0.001);
      if (ds[i].cls === '가') sa += sim; else sb += sim;
    }
    var tot = sa + sb || 1;
    setBars(sa / tot, sb / tot);
  }
  setInterval(classify, 300);

  function renderMeta(){
    metaEl.textContent = '가 ' + nOf('가') + '장 · 나 ' + nOf('나') + '장';
    // 두 칸을 걸기 전, 또는 비출 것이 정해지기 전에는 눌러도 담기지 않는다.
    $('addA').disabled = !unlocked() || !source || nOf('가') >= MAX;
    $('addB').disabled = !unlocked() || !source || nOf('나') >= MAX;
  }

  function add(cls){
    if (!unlocked()) return;
    if (nOf(cls) >= MAX) return;
    var f = feat(); if (!f) return;
    samples.push({ cls:cls, feat:f });
    chip(cls, f);
    if (source === 'pad') clearPad();   // 지우지 않으면 다음 그림을 그릴 수 없다
    if (!revealedBottom && nOf('가') >= 1 && nOf('나') >= 1){
      revealedBottom = true;
      var el = $('sayBottom');
      el.hidden = false;
      el.textContent = (pegBottom === 'yes') ? '건 대로였어요' : '달랐어요';
    }
    renderMeta();
  }
  $('addA').addEventListener('click', function(){ add('가'); });
  $('addB').addEventListener('click', function(){ add('나'); });

  $('reset').addEventListener('click', function(){
    samples = []; clearLamp(); setBars(0, 0);
    chipA.textContent = ''; chipB.textContent = '';
    pegTop = null; pegBottom = null; revealedTop = false; revealedBottom = false;
    $('sayTop').hidden = true; $('sayTop').textContent = '';
    $('sayBottom').hidden = true; $('sayBottom').textContent = '';
    renderPeg();
    if (source === 'pad') clearPad();
    slide.value = '0';
  });

  /* 그리기 칸 */
  var pctx = pad.getContext('2d'), drawing = false;
  function clearPad(){ pctx.fillStyle = '#fff'; pctx.fillRect(0, 0, pad.width, pad.height); }
  function at(e){
    var r = pad.getBoundingClientRect();
    return { x:(e.clientX - r.left) * pad.width / r.width, y:(e.clientY - r.top) * pad.height / r.height };
  }
  pad.addEventListener('pointerdown', function(e){
    drawing = true; pad.setPointerCapture(e.pointerId);
    var p = at(e); pctx.beginPath(); pctx.moveTo(p.x, p.y);
  });
  pad.addEventListener('pointermove', function(e){
    if (!drawing) return;
    var p = at(e);
    pctx.strokeStyle = '#141414'; pctx.lineWidth = 16; pctx.lineCap = 'round'; pctx.lineJoin = 'round';
    pctx.lineTo(p.x, p.y); pctx.stroke();
  });
  pad.addEventListener('pointerup', function(){ drawing = false; });
  pad.addEventListener('pointercancel', function(){ drawing = false; });

  function usePad(){
    source = 'pad'; cam.hidden = true; pad.hidden = false;
    practiceEl.hidden = false;
    clearPad(); renderMeta();
  }

  /* 카메라 */
  var stream = null;
  function stopCam(){
    if (!stream) return;
    stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null;
  }
  function startCam(){
    if (source === 'pad' || stream) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ usePad(); return; }
    navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false })
      .then(function(s){
        stream = s; cam.srcObject = s; cam.hidden = false; pad.hidden = true;
        source = 'cam'; practiceEl.hidden = true;
        renderMeta();
        return cam.play();
      })
      .catch(function(){ usePad(); });
  }
  startCam();
  startMic();

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){ stopMic(); stopCam(); }
    else { startMic(); startCam(); }
  });
  window.addEventListener('pagehide', function(){ stopMic(); stopCam(); });

  renderMeta();
})();
</script>
</body>
</html>
