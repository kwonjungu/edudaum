<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>물건 카드 두 칸 나누기</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
:root{--line:#DDDDDD;--line-strong:#C1C1C1;
  --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
  --point:#FF385C; --point-soft:#FFF0F3; --soft:#F7F7F7;
  --muted:#6A6A6A;
  --r:14px; --r-sm:8px;
  --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  font-size:17px; line-height:1.45; font-weight:400;
  -webkit-text-size-adjust:100%;
}
main{max-width:760px;margin:0 auto;padding:16px 16px 28px}
h1{font-size:clamp(24px,5.6vw,32px);font-weight:700;letter-spacing:-.035em;margin:0 0 4px}
.lead{font-size:15px;color:var(--muted);margin:0 0 12px;font-weight:600}

/* 쪽 위 차시 표시 */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.topnav a{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);
  font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--ink);
  border-radius:999px;padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
.topnav b{font-weight:700;font-size:14px;background:var(--point);color:#fff;
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  box-shadow:var(--hard-sm);white-space:nowrap}

section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--hard);padding:12px;margin:0 0 12px}
h2{font-size:13.5px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;color:var(--muted)}

.card{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.card svg{flex:0 0 auto}
.cardname{font-size:21px;font-weight:700;letter-spacing:-.02em}
.ask{font-size:15px;font-weight:600;margin:0 0 6px}
.guess{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

button{font-family:inherit}
.opt{cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--ink);
  border-radius:var(--r-sm);min-height:44px;padding:6px 4px;font-size:15px;font-weight:600;line-height:1.2}
.opt[aria-pressed="true"]{background:var(--point);border-color:var(--point);color:#fff}
.opt:disabled{cursor:not-allowed}
.opt:disabled:not([aria-pressed="true"]){opacity:.5}

.hint{font-size:14px;font-weight:600;color:var(--point);margin:10px 0 0;min-height:20px}

.tray{display:flex;flex-direction:column;gap:6px;margin:8px 0 0}
.tray:empty{display:none}
.piece{cursor:pointer;text-align:left;width:100%;color:var(--ink);background:var(--soft);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);min-height:44px;padding:8px 10px;
  font-size:15px;font-weight:600;line-height:1.3;transition:transform .12s,background .12s}
.piece.held{background:var(--point-soft);border:2px solid var(--point);transform:translateY(-1px)}
.piece:disabled{cursor:default}
.piece .tag{display:block;margin-top:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
.piece .moved{display:inline-block;margin-right:6px;padding:0 6px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:12px;font-weight:600}
.piece.wasmoved{border:1.5px dashed var(--line-strong)}

.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin:10px 0 0}
.col{border:1px dashed var(--line-strong);border-radius:var(--r);padding:6px;min-height:120px;
  display:flex;flex-direction:column;gap:6px}
.col.full{border-style:solid;border-color:var(--ink)}
.drop{cursor:pointer;width:100%;min-height:48px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:15.5px;font-weight:700;line-height:1.15;padding:4px}
.drop:disabled{opacity:.5;cursor:not-allowed}
.cnt{display:block;font-size:12.5px;font-weight:600;color:var(--muted)}

.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0}
.act{cursor:pointer;font-size:16px;font-weight:600;color:var(--ink);
  min-height:48px;padding:10px 16px;flex:1 1 90px;
  border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:var(--hard-sm)}
.act.main{background:var(--point);border-color:var(--point);color:#fff}
.act:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.out{margin:12px 0 0;border-radius:var(--r-sm);padding:10px 12px;min-height:48px;
  background:var(--soft);font-size:16px;font-weight:600}
.out.show{background:var(--ink);color:#fff}
.out p{margin:0}
.out p + p{margin-top:4px}
.note{font-size:13.5px;color:var(--muted);font-weight:600;margin:10px 0 0}

.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* 재미 개편 2026-10-29 */
.card{background:var(--sun-l);border-radius:var(--r-sm);padding:8px 10px}
.card.flip{animation:flip .38s ease-out}
@keyframes flip{0%{transform:rotateX(80deg);opacity:.2}100%{transform:none;opacity:1}}
.piece.landed{animation:land .26s ease-out}
@keyframes land{0%{transform:translateY(-10px);opacity:.4}100%{transform:none;opacity:1}}
.piece.k-hw{border-left:6px solid var(--sky)}
.piece.k-sw{border-left:6px solid var(--mint)}
.col.hwc{background:var(--sky-l)} .col.swc{background:var(--mint-l)}
.col.empty-end{border-style:dotted}
.meter{display:flex;gap:6px;margin:8px 0 0}
.meter i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.meter i.on{background:var(--point)}
@media (max-width:400px){.guess{gap:6px}.opt{font-size:14px}.drop{font-size:14.5px}}
main{overflow-x:hidden}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<main>
  <nav class="topnav"><span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a href="../play/">← 체험 목록</a><a href="../lessons/B01/">과정안</a></span><b>1~2</b></nav>
  <h1>물건 카드 두 칸 나누기</h1>
  <p class="lead">한 물건 속 조각을 하드웨어·소프트웨어 칸에 나눠요</p>

  <section aria-labelledby="h-card">
    <h2 id="h-card">물건 카드</h2>
    <div class="card">
      <img id="cardicon" src="" alt="" width="64" height="64" style="object-fit:contain;mix-blend-mode:multiply;border-radius:10px">
      <span class="cardname" id="cardname"></span>
    </div>
    <p class="ask" id="ask">이 물건엔 무엇이 들어 있을까?</p>
    <div class="guess" role="group" aria-labelledby="ask">
      <button class="opt" type="button" data-g="hw" aria-pressed="false">하드웨어만</button>
      <button class="opt" type="button" data-g="sw" aria-pressed="false">소프트웨어만</button>
      <button class="opt" type="button" data-g="both" aria-pressed="false">둘 다</button>
    </div>
    <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="tray" id="tray" aria-label="아직 안 넣은 조각"></div>
  </section>

  <section aria-labelledby="h-cols">
    <h2 id="h-cols">두 칸</h2>
    <div class="cols">
      <div class="col hwc" id="col-hw">
        <button class="drop" type="button" id="drop-hw">하드웨어 칸<span class="cnt" id="cnt-hw">0개</span></button>
      </div>
      <div class="col swc" id="col-sw">
        <button class="drop" type="button" id="drop-sw">소프트웨어 칸<span class="cnt" id="cnt-sw">0개</span></button>
      </div>
    </div>
    <div class="row">
      <button class="act main" id="check" type="button">확인하기</button>
      <button class="act" id="reset" type="button">다시 하기</button>
      <button class="act" id="next" type="button">다음 물건</button>
    </div>
    <div class="out" id="out" role="status" aria-live="polite"></div>
    <p class="note">한 물건 속 두 가지를 기록지에 적어요</p>
  </section>
</main>

<script>
(function () {
  'use strict';

  // 물건 카드 — 지도안 탐험 구역과 도입 물건에서 고름. sw가 빈 카드는 소프트웨어가 없는 물건.
  var CARDS = [
    { name: '계산기',
      hw: ['숫자 버튼', '숫자가 뜨는 화면', '플라스틱 몸체', '안에 든 건전지'],
      sw: ['× 버튼을 누르면 → 두 수를 곱한다', '= 버튼을 누르면 → 답을 화면에 띄운다', '한참 안 쓰면 → 화면을 끈다'] },
    { name: '보행자 신호등',
      hw: ['빨강·초록 불빛(LED)', '건너기 누름 버튼', '쇠기둥'],
      sw: ['누름 버튼을 누르면 → 초록불을 켠다', '초록불 20초가 지나면 → 빨간불로 바꾼다', '끝나기 5초 전 → 초록불을 깜빡인다'] },
    { name: '현관 자동문',
      hw: ['유리문', '사람을 알아채는 센서', '문을 미는 모터'],
      sw: ['사람이 다가오면 → 문을 연다', '아무도 없으면 → 5초 뒤 닫는다', '문 사이에 무엇이 있으면 → 닫지 않는다'] },
    { name: '보건실 체온계',
      hw: ['끝에 달린 온도 센서', '숫자 화면', '재기 단추'],
      sw: ['단추를 누르면 → 온도를 잰다', '37.5도가 넘으면 → 삐 소리를 낸다'] },
    { name: '마이크로비트',
      hw: ['LED 25개', 'A 버튼', '작은 칩'],
      sw: ['A 버튼을 누르면 → 하트를 보여 준다', 'B 버튼을 누르면 → 숫자 3을 보여 준다'] },
    { name: '손으로 돌리는 연필깎이',
      hw: ['칼날', '돌리는 손잡이', '톱니바퀴', '가루 통'],
      sw: [] }
  ];
  var IMG = { '계산기': 'calculator', '보행자 신호등': 'crosswalk', '현관 자동문': 'autodoor', '보건실 체온계': 'thermometer', '마이크로비트': 'microbit', '손으로 돌리는 연필깎이': 'sharpener' };
  var TAG = { hw: '만질 수 있는 몸체·부품', sw: '사람이 미리 정해 준 명령' };
  var NUM = ['', '한', '두', '세', '네'];

  var cardIdx = -1, prevCard = null;
  var pieces = [];          // {text, kind, put, moved}
  var guess = null;
  var held = null;
  var done = false;
  var justChecked = false;   // 확인한 바로 그때만 옮긴 조각이 한 번 튄다

  var $ = function (id) { return document.getElementById(id); };
  var cardicon = $('cardicon'), meter = $('meter'), cardBox = document.querySelector('.card'), cardname = $('cardname'), hint = $('hint'), tray = $('tray'), out = $('out');
  var colHw = $('col-hw'), colSw = $('col-sw');
  var dropHw = $('drop-hw'), dropSw = $('drop-sw');
  var checkBtn = $('check'), resetBtn = $('reset'), nextBtn = $('next');
  var opts = Array.prototype.slice.call(document.querySelectorAll('.opt'));

  function rnd(n) { return Math.floor(Math.random() * n); }
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = rnd(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }

  function pickCard() {
    var v;
    do { v = rnd(CARDS.length); } while (v === prevCard);
    prevCard = v;
    return v;
  }

  function dealPieces(card) {
    var hwN;
    if (!card.sw.length) { hwN = 4; }
    else {
      // 하드웨어 1~3개, 남는 자리는 소프트웨어. 묶음 크기를 넘지 않게.
      var lo = Math.max(1, 4 - card.sw.length), hi = Math.min(3, card.hw.length);
      hwN = lo + rnd(hi - lo + 1);
    }
    var hw = shuffle(card.hw.slice()).slice(0, hwN);
    var sw = shuffle(card.sw.slice()).slice(0, 4 - hwN);
    var list = hw.map(function (t) { return { text: t, kind: 'hw' }; })
      .concat(sw.map(function (t) { return { text: t, kind: 'sw' }; }));
    return shuffle(list).map(function (p) { p.put = null; p.moved = false; return p; });
  }

  function firstLoose() {
    for (var i = 0; i < pieces.length; i++) { if (pieces[i].put === null) { return i; } }
    return null;
  }

  function pieceButton(p, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'piece' + (held === i ? ' held' : '') + (p.moved ? ' wasmoved' : '') + (done ? ' k-' + p.kind : '') + (p.landed ? ' landed' : '') + (p.moved && justChecked ? ' pop' : '');
    b.disabled = done || guess === null;
    if (p.moved) {
      var m = document.createElement('span');
      m.className = 'moved';
      m.textContent = '옮김';
      b.appendChild(m);
    }
    b.appendChild(document.createTextNode(p.text));
    if (done) {
      var t = document.createElement('span');
      t.className = 'tag';
      t.textContent = TAG[p.kind];
      b.appendChild(t);
    }
    p.landed = false;
    b.setAttribute('aria-pressed', held === i ? 'true' : 'false');
    b.addEventListener('click', function () { hold(i); });
    return b;
  }

  function render() {
    // 조각 자리
    tray.textContent = '';
    [colHw, colSw].forEach(function (col) {
      while (col.children.length > 1) { col.removeChild(col.lastChild); }
    });
    var n = { hw: 0, sw: 0 };
    pieces.forEach(function (p, i) {
      var b = pieceButton(p, i);
      if (p.put === null) { tray.appendChild(b); }
      else { (p.put === 'hw' ? colHw : colSw).appendChild(b); n[p.put] += 1; }
    });
    $('cnt-hw').textContent = n.hw + '개';
    $('cnt-sw').textContent = n.sw + '개';
    colHw.classList.toggle('full', done && n.hw > 0);
    colSw.classList.toggle('full', done && n.sw > 0);

    opts.forEach(function (o) {
      o.setAttribute('aria-pressed', o.getAttribute('data-g') === guess ? 'true' : 'false');
      o.disabled = done;
    });
    var canDrop = !done && guess !== null && held !== null;
    dropHw.disabled = !canDrop;
    dropSw.disabled = !canDrop;

    var inCount = pieces.filter(function (q) { return q.put !== null; }).length;
    Array.prototype.forEach.call(meter.children, function (m, k) { m.className = k < inCount ? 'on' : ''; });
    var allIn = firstLoose() === null;
    checkBtn.disabled = done || guess === null || !allIn;
    checkBtn.classList.toggle('main', !done);
    nextBtn.classList.toggle('main', done);   // 확인 뒤엔 다음 물건이 눈에 띈다

    if (done) { hint.textContent = ''; }
    else if (guess === null) { hint.textContent = '예상을 먼저 골라요'; }
    else if (held !== null) { hint.textContent = '칸을 눌러 넣어요'; }
    else if (allIn) { hint.textContent = '다 넣었어요. 확인해요'; }
    else { hint.textContent = '조각을 눌러 집어요'; }
  }

  function setGuess(g) {
    if (done) { return; }
    guess = g;
    if (held === null) { held = firstLoose(); }
    render();
    if (window.Fun) { Fun.say(guess === 'both' ? '둘 다 들어 있을 거라고 예측했어요. 조각을 나눠 확인해 봐요.' : '한쪽만이라고 예측했어요. 조각을 나눠 보면 알 수 있어요.'); }
  }

  function hold(i) {
    if (done || guess === null) { return; }
    held = (held === i && pieces[i].put !== null) ? null : i;
    render();
  }

  function drop(col) {
    if (done || guess === null || held === null) { return; }
    pieces[held].put = col;
    pieces[held].landed = true;
    held = firstLoose();
    render();
    if (window.Fun && held === null) { Fun.say('네 조각을 다 넣었어요. 두 칸에 어떻게 나뉘었는지 확인해 봐요.'); }
  }

  function guessLine(actualBoth) {
    if (guess === 'both') { return actualBoth ? '예상대로 두 칸이 다 찼어요' : '소프트웨어 칸은 비었어요'; }
    if (guess === 'hw') { return actualBoth ? '소프트웨어 칸에도 조각이 들어갔어요' : '예상대로 하드웨어 칸만 찼어요'; }
    return actualBoth ? '하드웨어 칸에도 조각이 들어갔어요' : '소프트웨어 칸은 비고 하드웨어 칸만 찼어요';
  }

  function check() {
    if (done || guess === null || firstLoose() !== null) { return; }
    done = true;
    held = null;
    var moved = 0, putKinds = {};
    pieces.forEach(function (p) {
      putKinds[p.put] = true;
      if (p.put !== p.kind) { p.moved = true; moved += 1; p.put = p.kind; }
    });
    var actualBoth = pieces.some(function (p) { return p.kind === 'sw'; });
    var oneSide = Object.keys(putKinds).length === 1 && guess !== 'both';
    var line2 = moved === 0 ? '넣은 칸 그대로였어요'
      : NUM[moved] + ' 조각이 다른 칸으로 옮겨 갔어요';
    if (oneSide && actualBoth) { line2 = '한 칸에 다 넣었는데 두 칸으로 갈렸어요'; }
    out.textContent = '';
    [guessLine(actualBoth), line2].forEach(function (t) {
      var p = document.createElement('p'); p.textContent = t; out.appendChild(p);
    });
    out.classList.add('show');
    out.classList.remove('pop'); void out.offsetWidth; out.classList.add('pop');
    if (window.Fun) {
      if (moved === 0) { Fun.say('넣은 칸 그대로예요. 이 물건에서는 두 칸이 어떻게 찼나요? 다음 물건도 예측해 봐요.', 'cheer'); Fun.burst(out); }
      else { Fun.say('옮겨 간 조각이 있어요. 그 조각이 왜 그 칸인지 짝과 말해 봐요.', 'think'); Fun.shake(out); }
      Fun.stamp();
    }
    justChecked = true;
    render();
    justChecked = false;
    try {
      var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      out.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' });
    } catch (e) { /* 스크롤을 못 해도 결과는 그대로 보인다 */ }
  }

  function clearRound() {
    pieces.forEach(function (p) { p.put = null; p.moved = false; });
    guess = null; held = null; done = false;
    out.textContent = '';
    out.classList.remove('show', 'pop');
  }

  function resetRound() { clearRound(); render(); if (window.Fun) { Fun.say('같은 물건을 처음부터 나눠 봐요. 예상을 다시 골라요.'); } }

  function newRound() {
    cardIdx = pickCard();
    var card = CARDS[cardIdx];
    cardname.textContent = card.name;
    cardicon.src = 'assets/' + IMG[card.name] + '.webp';
    cardBox.classList.remove('flip'); void cardBox.offsetWidth; cardBox.classList.add('flip');
    if (window.Fun && pieces.length) { Fun.say('새 물건 「' + card.name + '」이에요. 먼저 예상을 골라요.'); }
    pieces = dealPieces(card);
    clearRound();
    render();
  }

  opts.forEach(function (o) { o.addEventListener('click', function () { setGuess(o.getAttribute('data-g')); }); });
  dropHw.addEventListener('click', function () { drop('hw'); });
  dropSw.addEventListener('click', function () { drop('sw'); });
  checkBtn.addEventListener('click', check);
  resetBtn.addEventListener('click', resetRound);
  nextBtn.addEventListener('click', newRound);

  newRound();
})();
</script>
