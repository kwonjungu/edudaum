<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신호등 명령 바꾸기</title>
<style>
:root{
  --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
  --point:#F59E0B; --point-soft:#FFF0C7;
  --muted:#6B6B6B; --red:#E5484D; --green:#12B76A;
  --r:18px; --r-sm:12px;
  --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  background-image:radial-gradient(var(--ink) .5px,transparent .5px);
  background-size:22px 22px;
  color:var(--ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:17px; line-height:1.45; font-weight:600;
  -webkit-text-size-adjust:100%;
}
main{max-width:920px;margin:0 auto;padding:16px 14px 28px}
h1{
  font-size:clamp(24px,5.6vw,34px); font-weight:900; letter-spacing:-.035em;
  margin:0 0 4px;
}
.lead{font-size:15px;color:var(--muted);margin:0 0 12px;font-weight:700}

.stage{
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px;
  align-items:start; margin:0;
}
@media (max-width:719px){ .stage{grid-template-columns:minmax(0,1fr)} }

.face{
  background:var(--surface); border:3px solid var(--ink);
  border-radius:var(--r); box-shadow:var(--hard); padding:12px;
}
.face + .face{margin-top:14px}
.face h2{font-size:13.5px;font-weight:900;letter-spacing:-.02em;margin:0 0 8px;color:var(--muted)}
.scene svg{display:block;width:100%;height:auto}

.lamp{fill:#EFEAE0;stroke:var(--ink);stroke-width:3}
.lamp.on.red{fill:var(--red)}
.lamp.on.green{fill:var(--green)}
.ring{fill:none;stroke:var(--ink);stroke-width:0}
.lamp.on + .ring{stroke-width:6}
.band{fill:#E8E2D6;stroke:var(--ink);stroke-width:3}
.stripe{fill:var(--surface)}
.walker{fill:var(--point);stroke:var(--ink);stroke-width:2.5;transition:cx .32s linear}
.svgtxt{font:700 15px "Pretendard","Malgun Gothic",sans-serif;fill:var(--ink)}

.who{font-size:15px;font-weight:800;margin:0 0 8px}
.who b{color:var(--point);font-size:19px}

/* 초 선택 띠 */
.strip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:0 0 8px}
.c{
  font-family:inherit;cursor:pointer;background:var(--surface);color:var(--ink);
  border:2.5px solid var(--ink);border-radius:9px;min-height:44px;
  font-weight:800;font-size:14px;
  transition:transform .1s,box-shadow .1s,background .12s;
}
.c:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.c.pick{background:var(--point);color:#fff;animation:pk .2s ease-out}
.c:disabled{opacity:.55;cursor:not-allowed}
.c:disabled.pick{opacity:1}
@keyframes pk{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}

.pickline{font-size:13.5px;font-weight:800;color:var(--muted);min-height:20px}
.pickline b{color:var(--point)}

.row{display:flex;flex-wrap:wrap;gap:8px}
button.act{
  font:inherit; font-weight:800; color:var(--ink); cursor:pointer;
  min-height:48px; min-width:88px; padding:10px 18px;
  border:3px solid var(--ink); border-radius:999px;
  background:var(--surface); box-shadow:var(--hard-sm);
  transition:transform .1s ease, box-shadow .1s ease;
}
button.act.main{background:var(--point)}
button.act:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
button.act:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button.act:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
:focus-visible{outline:3px solid var(--point);outline-offset:3px}

.out{
  margin:12px 0 0; min-height:52px; display:flex; align-items:center;
  border:3px solid var(--ink); border-radius:var(--r-sm);
  background:var(--ink); color:var(--paper); padding:10px 14px;
  font-weight:900; font-size:19px;
}
.out:empty{background:var(--surface)}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

/* 쪽 위 차시 표시 */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.topnav a{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);
  font-weight:800;font-size:14px;background:var(--surface);border:2.5px solid var(--ink);
  border-radius:999px;padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
.topnav b{font-weight:900;font-size:14px;background:var(--point);color:#fff;
  border:2.5px solid var(--ink);border-radius:999px;padding:6px 14px;
  box-shadow:var(--hard-sm);white-space:nowrap}
</style>
</head>
<body>
<main>
  <nav class="topnav"><a href="../">← 전체 목록</a><b>1~2</b></nav>
  <h1>신호등 명령 바꾸기</h1>
  <p class="lead">가장 짧은 초록불을 짚어요</p>

  <section class="stage">
    <div class="face">
      <h2>이번 판</h2>
      <p class="who">이번엔 <b id="nText">3</b>명이 건너요</p>
      <div class="strip" id="strip" role="group" aria-label="초록불 초 수"></div>
      <p class="pickline" id="pickline">초를 짚어요</p>
    </div>

    <div class="face">
      <h2>건너기</h2>
      <div class="scene">
        <svg viewBox="0 0 320 232" role="img" aria-label="보행자 신호등과 횡단보도">
          <rect x="10" y="6" width="64" height="112" rx="12" fill="#FFFFFF" stroke="#141414" stroke-width="3"/>
          <circle id="lampR" class="lamp red" cx="42" cy="38" r="19"/>
          <circle class="ring" cx="42" cy="38" r="25"/>
          <circle id="lampG" class="lamp green" cx="42" cy="86" r="19"/>
          <circle class="ring" cx="42" cy="86" r="25"/>
          <text class="svgtxt" x="84" y="44">빨강</text>
          <text class="svgtxt" x="84" y="92">초록</text>
          <rect x="36" y="118" width="12" height="50" fill="#FFFFFF" stroke="#141414" stroke-width="3"/>
          <rect class="band" x="8" y="168" width="304" height="52" rx="8"/>
          <g class="stripe" aria-hidden="true">
            <rect x="16" y="174" width="12" height="40"/><rect x="40" y="174" width="12" height="40"/>
            <rect x="64" y="174" width="12" height="40"/><rect x="88" y="174" width="12" height="40"/>
            <rect x="112" y="174" width="12" height="40"/><rect x="136" y="174" width="12" height="40"/>
            <rect x="160" y="174" width="12" height="40"/><rect x="184" y="174" width="12" height="40"/>
            <rect x="208" y="174" width="12" height="40"/><rect x="232" y="174" width="12" height="40"/>
            <rect x="256" y="174" width="12" height="40"/><rect x="280" y="174" width="12" height="40"/>
          </g>
          <g id="walkers"></g>
        </svg>
      </div>
      <div class="row">
        <button class="act main" id="run" type="button">건너 보기</button>
        <button class="act" id="reset" type="button">다시 하기</button>
        <button class="act" id="next" type="button">다음 판</button>
      </div>
      <p id="out" class="out" role="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<script>
(function () {
  'use strict';

  var NS = 'http://www.w3.org/2000/svg';
  var SEC_MIN = 5, SEC_MAX = 20;
  var N_MIN = 3, N_MAX = 8;
  var TICK = 220;
  var STARTX = 22, ENDX = 296;

  var stripEl = document.getElementById('strip');
  var pickline = document.getElementById('pickline');
  var nText = document.getElementById('nText');
  var runBtn = document.getElementById('run');
  var resetBtn = document.getElementById('reset');
  var nextBtn = document.getElementById('next');
  var out = document.getElementById('out');
  var lampR = document.getElementById('lampR');
  var lampG = document.getElementById('lampG');
  var walkersG = document.getElementById('walkers');

  var cells = [];
  var walkerEls = [];

  var N = 0, prevN = null;
  var pickedSec = null;
  var timer = null;
  var t = 0;
  var running = false;
  var ran = false;       // 확인을 눌렀나. 그 뒤로는 짚기가 잠긴다.

  (function buildStrip() {
    for (var s = SEC_MIN; s <= SEC_MAX; s++) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'c';
      b.textContent = String(s);
      b.setAttribute('aria-label', s + '초');
      (function (sec) {
        b.addEventListener('click', function () { pickSec(sec); });
      })(s);
      stripEl.appendChild(b);
      cells.push(b);
    }
  })();

  (function buildWalkers() {
    for (var i = 0; i < N_MAX; i++) {
      var g = document.createElementNS(NS, 'g');
      var c = document.createElementNS(NS, 'circle');
      c.setAttribute('class', 'walker');
      c.setAttribute('r', '6');
      c.setAttribute('cx', String(STARTX));
      c.setAttribute('cy', String(178 + i * 6));
      g.appendChild(c);
      walkersG.appendChild(g);
      walkerEls.push(c);
    }
  })();

  function lamps(mode) {
    lampR.classList.toggle('on', mode === 'red');
    lampG.classList.toggle('on', mode === 'green');
  }

  function halt() {
    if (timer !== null) { clearInterval(timer); timer = null; }
    running = false;
  }

  function pickN() {
    var v;
    do { v = N_MIN + Math.floor(Math.random() * (N_MAX - N_MIN + 1)); } while (v === prevN);
    prevN = v;
    return v;
  }

  function updateWalkers(crossedCount) {
    for (var i = 0; i < N_MAX; i++) {
      var el = walkerEls[i];
      if (i >= N) { el.setAttribute('display', 'none'); continue; }
      el.setAttribute('display', '');
      el.setAttribute('cx', String(i < crossedCount ? ENDX : STARTX));
    }
  }

  function render() {
    for (var i = 0; i < cells.length; i++) {
      var sec = SEC_MIN + i;
      cells[i].classList.toggle('pick', pickedSec === sec);
      cells[i].disabled = ran;   // 확인 전까지는 바꿀 수 있다
    }
    pickline.innerHTML = pickedSec === null
      ? '초를 짚어요'
      : '<b>' + pickedSec + '초</b>를 짚었어요';
    runBtn.disabled = running || pickedSec === null;
    resetBtn.disabled = running;
    nextBtn.disabled = running;
  }

  function pickSec(sec) {
    if (running || ran) { return; }   // 건너 보기 전까지는 바꿀 수 있다
    pickedSec = sec;
    render();
  }

  function tick() {
    t += 1;
    var crossedCount = Math.min(N, Math.floor(t / 2));
    updateWalkers(crossedCount);
    var blink = (t > pickedSec - 5) && (t % 2 === 1);
    lamps(blink ? 'off' : 'green');
    if (t >= pickedSec) { finish(); }
  }

  function finish() {
    halt();
    lamps('red');
    var minSec = N * 2;
    var crossedFinal = Math.min(N, Math.floor(pickedSec / 2));
    if (crossedFinal >= N) {
      var leftover = pickedSec - minSec;
      out.textContent = leftover <= 0 ? '모두 건넜어요' : (leftover + '초가 남았어요');
    } else {
      out.textContent = (N - crossedFinal) + '명이 남았어요';
    }
    render();
  }

  function run() {
    if (running || pickedSec === null) { return; }
    running = true; ran = true;
    t = 0;
    out.textContent = '';
    updateWalkers(0);
    lamps('green');
    render();
    timer = setInterval(tick, TICK);
  }

  function resetRun() {
    ran = false;
    if (running) { return; }
    halt();
    t = 0;
    out.textContent = '';
    updateWalkers(0);
    lamps('red');
    render();
  }

  function newRound() {
    ran = false;
    halt();
    N = pickN();
    nText.textContent = String(N);
    pickedSec = null;
    t = 0;
    out.textContent = '';
    updateWalkers(0);
    lamps('red');
    render();
  }

  runBtn.addEventListener('click', run);
  resetBtn.addEventListener('click', resetRun);
  nextBtn.addEventListener('click', newRound);
  window.addEventListener('pagehide', halt);

  newRound();
})();
</script>
</body>
</html>
