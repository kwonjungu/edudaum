<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>원인 짚고 한 부분만 고치기 — 에듀다움 B26</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#FF385C; --point-soft:#FFF0F3; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:6px 14px 14px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(20px,4.8vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:9px;margin-top:8px}
  h2{font-size:13px;font-weight:700;letter-spacing:-.02em;margin-bottom:6px;color:var(--muted);
    display:flex;align-items:center;gap:7px}
  h2 svg{flex:none}

  .card{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;
    background:var(--point-soft);border:1px solid var(--line);border-radius:999px;padding:4px 12px;margin-bottom:6px}

  table.tb{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
  table.tb th,table.tb td{border:1px solid var(--line);padding:3px 2px;text-align:center}
  table.tb thead th{background:var(--ink);color:var(--paper);font-size:12px}
  table.tb tbody th{font-size:12px;background:var(--surface)}
  table.tb td{height:44px}
  table.tb td.changed{border-color:var(--point);border-width:3.5px;animation:jump .4s ease-out}
  .mk{display:inline-flex;align-items:center;justify-content:center;gap:3px}
  .mk svg{width:14px;height:14px;flex:none}
  .mk .old{opacity:.4}
  .mk .sep{width:1px;height:14px;background:var(--line-strong)}
  .said{display:block;font-size:11px;font-weight:700;color:var(--muted);line-height:1.1}
  .ev{margin-top:6px;display:grid;gap:3px}
  .ev p{font-size:13.5px;font-weight:700;background:var(--point-soft);border-radius:var(--r-sm);padding:3px 8px}
  .ev b{display:inline-block;min-width:4.8em;color:var(--muted)}
  .sum{margin-top:6px;font-size:13.5px;font-weight:700;background:#F7F7F7;border-radius:var(--r-sm);padding:6px 8px}
  @keyframes jump{0%{transform:translateY(0)}30%{transform:translateY(-5px)}100%{transform:translateY(0)}}

  .line{margin-top:6px;font-size:13.5px;font-weight:700}
  .score{font-size:clamp(19px,5vw,24px);font-variant-numeric:tabular-nums;font-weight:700;
    line-height:1;color:var(--point);text-align:center;margin:6px 0 2px}
  .score.pulse{animation:jump .4s ease-out}
  .tries{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center}

  .fix{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:9px 12px;box-shadow:var(--hard-sm);flex:1 1 92px;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff}
  .btn[aria-pressed="true"]{background:var(--point-soft);border-width:3.5px}
  .btn:disabled{opacity:.42;cursor:default;box-shadow:none}

  .say{margin-top:7px;font-size:14px;font-weight:700;min-height:1.5em}
  .say.dim{color:var(--muted);font-weight:700}
  .note{margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
  .note b{font-weight:700;color:var(--ink)}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
</head>
<body>
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <symbol id="mk-o" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="6" fill="#2563EB" stroke="#222222" stroke-width="2"/>
  </symbol>
  <symbol id="mk-x" viewBox="0 0 20 20">
    <circle cx="10" cy="10" r="6" fill="#FFFFFF" stroke="#222222" stroke-width="2"/>
    <path d="M7 7l6 6M13 7l-6 6" stroke="#222222" stroke-width="2" stroke-linecap="round"/>
  </symbol>
</svg>

<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">체험 목록</a><a class="back" href="../lessons/B26/">과정안</a></span>
    <span class="tag">25~26</span>
  </nav>
  <header>
    <h1>원인 짚고 한 부분만 고치기</h1>
    <p class="lead">체험 활동 · 시험 방법은 그대로 둬요</p>
  </header>

  <section aria-labelledby="h-t">
    <h2 id="h-t">
      <svg width="13" height="15" viewBox="0 0 13 15" aria-hidden="true">
        <path d="M3 6V4a3.5 3.5 0 017 0v2" fill="none" stroke="#222222" stroke-width="2"/>
        <rect x="1" y="6" width="11" height="8" rx="2" fill="#2563EB" stroke="#222222" stroke-width="2"/>
      </svg>
      시험 기록
    </h2>
    <p class="card">사용 조건 카드 · <span id="cardName"></span></p>
    <table class="tb">
      <thead><tr><th></th><th>손바닥</th><th>손등</th><th>손가락</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="note">✕ 아래 글자는 코치가 안내한 동작</p>
    <div class="ev" id="ev"></div>
    <p class="score" id="score"></p>
    <p class="tries" id="tries"></p>
  </section>

  <section aria-labelledby="h-f">
    <h2 id="h-f">원인 카드 하나</h2>
    <div class="fix" id="fix"></div>
    <div class="acts">
      <button class="btn main" id="retest" type="button" disabled>다시 시험</button>
    </div>
    <p class="say dim" id="say">근거를 보고 원인 카드를 하나 짚어요</p>
    <p class="sum" id="sum" hidden></p>
    <div class="acts">
      <button class="btn" id="next" type="button">다음 카드</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
    </div>
    <p class="note"><b>연습용 기록이에요 · 마이크로비트 코치로 다시 시험해요</b></p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  var CARDS = ['왼손', '빠르게', '천천히', '손등 착용'];
  var SHORT = ['손바닥', '손등', '손가락'];
  var FIX = [
    { k:'data',  nm:'데이터',    say:'그 조건으로 동작마다 샘플 3개씩 더 녹화해요' },
    { k:'model', nm:'모델',      say:'헷갈린 두 동작이 더 달라 보이는 샘플을 더해요' },
    { k:'use',   nm:'사용 조건', say:'밴드를 고치거나 사용 안내 카드를 써요' }
  ];
  var MEMO = ['밴드가 헐거웠어요', '동작을 짧게 했어요'];
  var TRIES = 2, VER = ['1.0', '2.0', '2.1'];

  var st, lastSig = '';
  var cells = [], fixBtns = [];
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }

  /* 판을 그 자리에서 뽑는다. 숨은 원인은 화면에 적지 않는다.
     셋에 한 판꼴로 원인이 두 갈래라 한 부분만 고쳐서는 다 알아보지 못한다. */
  function makeBoard(){
    var keys = ['data', 'model', 'use'];
    var c1 = pick(keys), causes = [c1];
    if (Math.random() < 1 / 3) causes.push(pick(keys.filter(function(k){ return k !== c1; })));
    var has = function(k){ return causes.indexOf(k) >= 0; };
    var pair = Math.random() < 0.6 ? [0, 2] : pick([[0, 1], [1, 2], [0, 2]]);
    var useHit = [0, 1, 2].filter(function(){ return Math.random() < 0.5; });
    if (!useHit.length) useHit = [pick([0, 1, 2])];
    var keep = Math.floor(Math.random() * 4);            /* 3이면 카드 줄 모두 빗나감 */

    var needs = [], half = [], wrong = [];
    for (var row = 0; row < 2; row++){
      needs.push([]); half.push([]); wrong.push([]);
      for (var m = 0; m < 3; m++){
        var n = [];
        if (has('model') && pair.indexOf(m) >= 0) n.push('model');
        if (row === 1 && has('data') && m !== keep) n.push('data');
        if (row === 1 && has('use') && useHit.indexOf(m) >= 0) n.push('use');
        needs[row].push(n);
        half[row].push(n.length === 1 && n[0] === 'use' && Math.random() < 0.5);
        var other = (has('model') && pair.indexOf(m) >= 0) ? pair[1 - pair.indexOf(m)]
          : pick([0, 1, 2].filter(function(x){ return x !== m; }));
        wrong[row].push(other);
      }
    }
    var memo = has('use') ? pick(MEMO) : (Math.random() < 0.2 ? pick(MEMO) : null);
    return { card: Math.floor(Math.random() * CARDS.length), causes: causes, needs: needs, half: half,
             wrong: wrong, smp: has('data') ? 0 : 3, memo: memo };
  }

  function sig(b){ return b.card + b.causes.join('') + JSON.stringify(b.needs); }

  /* 칸마다 두 번: [첫째, 둘째] 알아봤나 */
  function judgeAll(b, fixed){
    var out = [];
    for (var row = 0; row < 2; row++){
      for (var m = 0; m < 3; m++){
        var ok = b.needs[row][m].every(function(k){ return fixed.indexOf(k) >= 0; });
        out.push(ok ? [true, true] : (b.half[row][m] ? [true, false] : [false, false]));
      }
    }
    return out;
  }
  function rowCount(res, row){
    var n = 0;
    for (var m = 0; m < 3; m++) n += (res[row * 3 + m][0] ? 1 : 0) + (res[row * 3 + m][1] ? 1 : 0);
    return n;
  }
  function allOk(res){ return rowCount(res, 0) === 6 && rowCount(res, 1) === 6; }

  function pickBoard(){
    var b;
    do { b = makeBoard(); } while (sig(b) === lastSig || allOk(judgeAll(b, [])));
    return b;
  }

  (function build(){
    var rows = ['기본 조건', '카드 조건'];
    for (var r = 0; r < 2; r++){
      var tr = document.createElement('tr');
      var th = document.createElement('th');
      th.textContent = rows[r];
      tr.appendChild(th);
      for (var m = 0; m < 3; m++){
        var td = document.createElement('td');
        tr.appendChild(td);
        cells.push(td);
      }
      $('tbody').appendChild(tr);
    }
    FIX.forEach(function(f, i){
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = f.nm;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', function(){ choose(i); });
      $('fix').appendChild(b);
      fixBtns.push(b);
    });
  })();

  function start(b){
    var first = judgeAll(b, []);
    st = { b: b, fixed: [], pick: null, left: TRIES, prev: null, now: first, first: first, round: 0 };
    $('sum').hidden = true;
    render(false);
  }

  function choose(i){
    if (st.left === 0 || allOk(st.now)) return;
    st.pick = i;
    render(false);
  }

  function retest(){
    if ($('retest').disabled) return;
    var k = FIX[st.pick].k;
    if (st.fixed.indexOf(k) < 0) st.fixed.push(k);
    st.prev = st.now;
    st.now = judgeAll(st.b, st.fixed);
    st.left -= 1;
    st.round += 1;
    st.pick = null;
    render(true);
  }

  function mark(ok, cls){
    return '<svg class="' + (cls || '') + '" aria-hidden="true"><use href="#' + (ok ? 'mk-o' : 'mk-x') + '"></use></svg>';
  }

  /* 근거 세 줄: 지도안 활동2의 물음 순서(데이터 → 모델 → 사용 조건) */
  function evidence(b){
    var mix = [];
    for (var m = 0; m < 3; m++) if (!st.first[m][0]) mix.push(SHORT[m] + '→' + SHORT[b.wrong[0][m]]);
    var lines = [
      ['계획표', CARDS[b.card] + ' 샘플 ' + b.smp + '개'],
      ['기본 조건', mix.length ? mix.join(', ') : '헷갈림 없음'],
      ['사용 메모', b.memo || '메모 없음']
    ];
    $('ev').innerHTML = lines.map(function(l){ return '<p><b>' + l[0] + '</b> ' + l[1] + '</p>'; }).join('');
  }

  function render(afterTest){
    var b = st.b, done = allOk(st.now), over = st.left === 0;
    $('cardName').textContent = CARDS[b.card];
    evidence(b);

    var changed = 0;
    for (var i = 0; i < 6; i++){
      var row = Math.floor(i / 3), m = i % 3;
      var ok = st.now[i], was = st.prev ? st.prev[i] : null;
      var diff = !!(afterTest && was && (was[0] !== ok[0] || was[1] !== ok[1]));
      if (diff) changed++;
      var html = '<span class="mk">' + (was ? mark(was[0], 'old') + mark(was[1], 'old') + '<i class="sep"></i>' : '') +
        mark(ok[0]) + mark(ok[1]) + '</span>';
      if (!ok[0] || !ok[1]) html += '<span class="said">→' + SHORT[b.wrong[row][m]] + '</span>';
      cells[i].innerHTML = html;
      var n = (ok[0] ? 1 : 0) + (ok[1] ? 1 : 0);
      cells[i].setAttribute('aria-label', (was ? '지난 ' + ((was[0] ? 1 : 0) + (was[1] ? 1 : 0)) + '번, ' : '') +
        '이번 두 번 가운데 ' + n + '번 알아봄');
      cells[i].classList.remove('changed');
      if (diff){ void cells[i].offsetWidth; cells[i].classList.add('changed'); }
    }

    var sc = $('score');
    sc.textContent = '기본 ' + rowCount(st.now, 0) + '/6 · 카드 ' + rowCount(st.now, 1) + '/6';
    sc.classList.remove('pulse');
    if (afterTest && done){ void sc.offsetWidth; sc.classList.add('pulse'); }
    $('tries').textContent = '코치 ' + VER[st.round] + ' · 남은 시험 ' + st.left + '번';

    fixBtns.forEach(function(btn, j){
      btn.disabled = over || done;
      btn.setAttribute('aria-pressed', st.pick === j ? 'true' : 'false');
    });
    $('retest').disabled = over || done || st.pick === null;

    var say = $('say');
    if (done && st.round > 0){ say.textContent = '여섯 번을 다 알아봤어요'; say.className = 'say'; }
    else if (over){ say.textContent = '두 번을 다 썼어요 · 알려진 한계에 적어요'; say.className = 'say'; }
    else if (afterTest){ say.textContent = changed ? changed + '칸이 달라졌어요' : '달라진 칸이 없어요'; say.className = 'say'; }
    else if (st.pick !== null){ say.textContent = FIX[st.pick].say; say.className = 'say dim'; }
    else { say.textContent = '근거를 보고 원인 카드를 하나 짚어요'; say.className = 'say dim'; }

    if ((done && st.round > 0) || over){
      $('sum').hidden = false;
      $('sum').textContent = '고친 점 기록 · ' + CARDS[b.card] + ' · 기본 ' + rowCount(st.first, 0) + '/6 → ' +
        rowCount(st.now, 0) + '/6 · 카드 ' + rowCount(st.first, 1) + '/6 → ' + rowCount(st.now, 1) + '/6 (' + VER[st.round] + ')';
    }
  }

  $('retest').addEventListener('click', retest);
  $('reset').addEventListener('click', function(){ start(st.b); });
  $('next').addEventListener('click', function(){ lastSig = sig(st.b); start(pickBoard()); });

  start(pickBoard());
})();
</script>
</body>
</html>
