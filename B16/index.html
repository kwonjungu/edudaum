<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기계와 인공지능 짝 가르기</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
:root{--line:#DDDDDD;--line-strong:#C1C1C1;
  --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
  --point:#FF385C; --point-soft:#FFF0F3;
  --muted:#6A6A6A; --amber:#FFE3E9;
  --r:14px; --r-sm:8px;
  --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  
  
  color:var(--ink);
  font-family:"Pretendard","Noto Sans KR",-apple-system,"Segoe UI","Malgun Gothic",sans-serif;
  font-size:17px; line-height:1.45; font-weight:600;
  -webkit-text-size-adjust:100%;
}
main{max-width:900px;margin:0 auto;padding:14px 14px 24px}
h1{font-size:clamp(23px,5.4vw,32px);font-weight:700;letter-spacing:-.035em;margin:0 0 5px}
.lead{color:var(--muted);font-size:14px;margin:0 0 11px}

section{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--hard);padding:11px;margin:0 0 10px;
}
h2{font-size:13px;font-weight:700;margin:0 0 7px;color:var(--muted)}

.ask{font-size:16px;font-weight:700;margin:0 0 9px;word-break:keep-all}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px}
.case{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);padding:8px;min-width:0}
.case.open{border-color:var(--line-strong)}
.name{font-size:17px;font-weight:700;margin:0 0 7px;word-break:keep-all;line-height:1.3}
.sensor{display:inline-block;margin-left:5px;font-size:12px;font-weight:700;color:var(--muted);
  border:1px dashed var(--line-strong);border-radius:999px;padding:1px 7px;vertical-align:2px;white-space:nowrap}
.bins{display:flex;flex-direction:column;gap:6px}
.bin{
  font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:700;
  background:var(--surface);border:1px solid var(--ink);border-radius:9px;
  min-height:44px;padding:4px 6px;box-shadow:var(--hard-sm);word-break:keep-all;line-height:1.15;
  transition:transform .1s,box-shadow .1s,background .1s;
}
.bin[data-k="m"][aria-pressed="true"]{background:var(--sky);border-color:var(--ink);color:var(--ink)}
.bin[data-k="a"][aria-pressed="true"]{background:var(--mint);border-color:var(--ink);color:var(--ink)}
.bin[data-k="q"][aria-pressed="true"]{background:var(--sun);border-color:var(--ink);color:var(--ink)}
.bin[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.ico{display:block;width:64px;height:64px;object-fit:contain;margin:0 0 4px}
.pair.deal .case{animation:deal .32s ease-out both}
.pair.deal .case:nth-child(2){animation-delay:.08s}
@keyframes deal{0%{opacity:0;transform:translateY(-14px) rotate(-2deg)}100%{opacity:1;transform:none}}
.track{display:flex;gap:6px;margin:0 0 9px}
.track i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.track i.on{background:var(--sky)}
.track i.now{background:var(--sun)}
.bin.ref,.bin.ref:disabled{outline-color:var(--ink)}
.bin:disabled{cursor:default}
.bin:disabled:not([aria-pressed="true"]){opacity:.45}
.io{margin:8px 0 0;font-size:14px;font-weight:600;line-height:1.4;word-break:keep-all;animation:popin .22s ease-out}
.tag{margin:5px 0 0;font-size:13px;font-weight:700;color:var(--ink);background:var(--sun-l);border-radius:6px;padding:2px 6px;word-break:keep-all}
.key{font-size:13px;font-weight:700;color:var(--muted);margin:9px 0 0;word-break:keep-all}
@keyframes popin{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
.round{font-weight:700;color:var(--point);margin-left:4px}
@media (max-width:400px){.pair{gap:6px}.case{padding:6px}.name{font-size:15.5px}.bin{font-size:14px}}
main{overflow-x:hidden}
.case.off{border-color:var(--ink);border-style:dashed;background:var(--sun-l)}
.bin.ref,.bin.ref:disabled{outline:2px dashed var(--point);outline-offset:2px;opacity:1}
.btn.go{background:var(--point);border-color:var(--point);color:#fff}
.note{font-size:13px;font-weight:700;color:var(--muted);margin:9px 0 0}

.msg{margin-top:9px;font-size:14px;font-weight:700;min-height:20px}
.msg.dim{color:var(--muted);font-weight:700}

.acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.btn{
  font-family:inherit;cursor:pointer;color:var(--ink);font-size:14.5px;font-weight:700;
  background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
  min-height:46px;padding:8px 12px;box-shadow:var(--hard-sm);flex:1 1 92px;
  transition:transform .1s,box-shadow .1s;
}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.main{background:var(--amber)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}

:focus-visible{outline:3px solid var(--point);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 쪽 위 차시 표시 */
.topnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 11px}
.topnav a{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);
  font-weight:600;font-size:14px;background:var(--surface);border:1px solid var(--ink);
  border-radius:999px;padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
.topnav b{font-weight:700;font-size:14px;background:var(--point);color:#fff;
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;
  box-shadow:var(--hard-sm);white-space:nowrap}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<main>
  <nav class="topnav"><span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a href="../play/">← 체험 목록</a><a href="../lessons/B16/">과정안</a></span><b>3~4</b></nav>
  <h1>기계와 인공지능 짝 가르기</h1>
  <p class="lead">짝마다 두 장을 칸에 짚고 확인해요</p>

  <section aria-labelledby="h-pair">
    <h2 id="h-pair">이번 짝 <span class="round" id="round"></span></h2>
    <div class="track" id="track" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p class="ask">정해진 조건 하나로 반응하나요, 데이터로 배운 대로 여러 가지를 보고 판단하나요?</p>
    <div class="pair" id="pair"></div>
    <p class="key">기계: 단순히 반응하는 기계 · 인공지능: 데이터로 배운 대로 여러 가지를 보고 판단하는 인공지능</p>
  </section>

  <section aria-labelledby="h-chk">
    <h2 id="h-chk">확인</h2>
    <p class="msg dim" id="msg" role="status" aria-live="polite">두 장 모두 칸을 짚어요</p>
    <div class="acts">
      <button class="btn main" id="confirmBtn" type="button" disabled>확인하기</button>
      <button class="btn" id="resetBtn" type="button">다시 하기</button>
      <button class="btn" id="nextBtn" type="button">다음 짝</button>
    </div>
    <p class="note">까닭은 비교표에 한 줄로 써요</p>
  </section>
</main>

<script>
(function () {
  'use strict';

  // 지도안 3차시 활동2의 사례 카드 여덟 장과 짝. io 는 활동1 비교 활동지의 '받아들이는 것 → 하는 일'.
  // ref: 'm' 기계, 'a' 인공지능, null 생각이 나뉨(지도안: 단정하지 않는다)
  var CARDS = [
    { n: '자동문', pair: 1, sensor: true, io: '다가오는 사람 → 늘 같게 문을 연다', ref: 'm' },
    { n: '사진 속 얼굴 묶기', pair: 1, sensor: false, io: '사진 속 생김새 → 같은 사람끼리 묶는다', ref: 'a' },
    { n: '주방 타이머', pair: 2, sensor: false, io: '맞춰 둔 시간 → 시간이 되면 늘 같게 울린다', ref: 'm' },
    { n: '영상 추천', pair: 2, sensor: false, io: '내가 본 영상들 → 볼 만한 영상을 골라 준다', ref: 'a' },
    { n: '계산기', pair: 3, sensor: false, io: '누른 숫자 → 정해진 대로 셈한다', ref: 'm' },
    { n: '손동작 알아보기', pair: 3, sensor: true, io: '손의 움직임 → 어떤 동작인지 알아본다', ref: 'a' },
    { n: '복도 전등', pair: 4, sensor: true, io: '지나가는 움직임 → 늘 같게 불을 켠다', ref: 'm' },
    { n: '걸음 수 세기', pair: 4, sensor: true, io: '몸의 흔들림 → 걸음으로 센다', ref: null }
  ];
  var P = 'fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  var IMG = {"자동문": "door", "사진 속 얼굴 묶기": "face_group", "주방 타이머": "timer", "영상 추천": "recommend", "계산기": "calculator", "손동작 알아보기": "gesture", "복도 전등": "hall_light", "걸음 수 세기": "step"};
  var ICON = {
    '자동문': '<rect x="5" y="6" width="30" height="28" rx="2"/><path d="M20 6v28M14 20l-4 0M26 20l4 0"/>',
    '사진 속 얼굴 묶기': '<circle cx="12" cy="15" r="6"/><circle cx="28" cy="15" r="6"/><path d="M9 14h.1M15 14h.1M25 14h.1M31 14h.1M7 30q13 6 26 0"/>',
    '주방 타이머': '<circle cx="20" cy="22" r="14"/><path d="M20 22V12M20 22l7 4M16 5h8"/>',
    '영상 추천': '<rect x="4" y="9" width="32" height="22" rx="3"/><path d="M17 15l8 5-8 5z"/>',
    '계산기': '<rect x="8" y="4" width="24" height="32" rx="3"/><path d="M13 10h14M14 18h.1M20 18h.1M26 18h.1M14 25h.1M20 25h.1M26 25h.1M14 31h.1M20 31h.1M26 31h.1"/>',
    '손동작 알아보기': '<path d="M12 22V9M17 20V5M22 20V7M27 22V11M12 22q-5-3-6 2 3 10 10 12h8q5-3 5-12"/>',
    '복도 전등': '<path d="M14 26a9 9 0 1 1 12 0v4H14zM16 34h8M20 2v3M6 8l2 2M34 8l-2 2"/>',
    '걸음 수 세기': '<ellipse cx="13" cy="25" rx="5" ry="8"/><ellipse cx="27" cy="14" rx="5" ry="8"/>'
  };
  function icon(n) {
    var d = document.createElement('img');
    d.className = 'ico'; d.src = 'assets/' + IMG[n] + '.webp'; d.alt = '';
    return d;
  }
  var BINS = [['m', '기계'], ['a', '인공지능'], ['q', '더 알아봐야 함']];
  var BINNAME = { m: '기계', a: '인공지능', q: '더 알아봐야 함' };
  var COUNT = ['', '한 장', '두 장'];

  var pairEl = document.getElementById('pair');
  var msgEl = document.getElementById('msg');
  var confirmBtn = document.getElementById('confirmBtn');
  var resetBtn = document.getElementById('resetBtn');
  var nextBtn = document.getElementById('nextBtn');

  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  var queue = shuffle([1, 2, 3, 4]);
  var cur = [], guess = [], shown = [], confirmed = false, revealing = false, lastKey = '', gen = 0, stamped = false;

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function hasBatchim(w) {
    var ch = w.charCodeAt(w.length - 1);
    return ch >= 0xAC00 && ch <= 0xD7A3 && (ch - 0xAC00) % 28 !== 0;
  }
  function wa(w) { return hasBatchim(w) ? '과' : '와'; }
  function iyo(w) { return hasBatchim(w) ? '이에요' : '예요'; }
  function keyOf(a, b) { return a < b ? a + '-' + b : b + '-' + a; }

  // 처음 네 판은 지도안 짝, 그 뒤로는 여덟 장을 섞은 새 짝(지도안 짝·직전 판은 빼고)
  function drawPair() {
    if (queue.length) {
      var p = queue.shift();
      var two = [];
      CARDS.forEach(function (c, i) { if (c.pair === p) { two.push(i); } });
      return shuffle(two);
    }
    // 섞은 짝의 절반은 '센서 있음' 두 장끼리 낸다 — 센서가 있다고 인공지능은 아니라는 지도안 유의점
    var from = [];
    var sensorOnly = Math.random() < 0.5;
    CARDS.forEach(function (c, i) { if (!sensorOnly || c.sensor) { from.push(i); } });
    for (var t = 0; t < 100; t++) {
      var a = from[Math.floor(Math.random() * from.length)];
      var b = from[Math.floor(Math.random() * from.length)];
      if (a === b) { continue; }
      if (CARDS[a].pair === CARDS[b].pair) { continue; }
      if (keyOf(a, b) === lastKey) { continue; }
      return [a, b];
    }
    return [0, 6];
  }

  var roundEl = document.getElementById('round');
  var dealt = 0;

  function newRound() {
    gen++;
    dealt++;
    roundEl.textContent = dealt <= 4 ? '지도안 짝 ' + dealt + '/4' : '섞은 짝';
    var tr = document.getElementById('track').children;
    for (var q = 0; q < 4; q++) { tr[q].className = dealt > 4 || q < dealt - 1 ? 'on' : (q === dealt - 1 ? 'now' : ''); }
    cur = drawPair();
    lastKey = keyOf(cur[0], cur[1]);
    guess = [null, null]; shown = [false, false];
    confirmed = false; revealing = false;
    pairEl.classList.add('deal');
    render();
    setTimeout(function () { pairEl.classList.remove('deal'); }, 600);
    if (window.Fun) {
      var both = CARDS[cur[0]].sensor && CARDS[cur[1]].sensor;
      Fun.say(both ? '두 장 다 센서가 있어요. 센서가 있으면 모두 인공지능일까요? 먼저 예측해 봐요.' : '새 짝은 「' + CARDS[cur[0]].n + '」' + wa(CARDS[cur[0]].n) + ' 「' + CARDS[cur[1]].n + '」' + iyo(CARDS[cur[1]].n) + '. 칸을 먼저 짚어 봐요.');
    }
  }

  function pick(slot, k) {
    if (confirmed) { return; }
    guess[slot] = k;
    render();
    try { pairEl.querySelector('.bin[data-slot="' + slot + '"][data-k="' + k + '"]').focus({ preventScroll: true }); } catch (e) {}
    if (window.Fun && guess[0] !== null && guess[1] !== null) { Fun.say('두 장 다 짚었어요. 확인하기 전에 바꿀 수 있어요.'); }
  }

  function tagOf(c, g) {
    if (c.ref === null) { return '생각이 나뉘는 카드예요 · 모둠에서 따져 봐요'; }
    if (g === c.ref) { return ''; }
    if (g === 'q') { return '구분 기준으로는 ' + BINNAME[c.ref] + ' 칸 · 모둠에서 따져 봐요'; }
    return '구분 기준으로는 ' + BINNAME[c.ref] + ' 칸';
  }

  function confirmRound() {
    if (confirmed || guess[0] === null || guess[1] === null) { return; }
    confirmed = true; revealing = true;
    var myGen = gen;
    var off = 0, talk = [];
    cur.forEach(function (ci, s) {
      var c = CARDS[ci];
      if (c.ref !== null && guess[s] !== 'q' && guess[s] !== c.ref) { off++; }
      if (tagOf(c, guess[s]).indexOf('모둠에서 따져 봐요') >= 0) { talk.push(c.n); }
    });
    render();
    var delay = reduceMotion ? 0 : 300;
    setTimeout(function () {
      if (myGen !== gen) { return; }
      shown[0] = true; render();
      setTimeout(function () {
        if (myGen !== gen) { return; }
        shown[1] = true; revealing = false;
        msgEl.textContent = off === 0 ? '구분 기준과 반대 칸에 놓은 카드는 없어요' : '구분 기준과 반대 칸에 놓은 카드가 ' + COUNT[off] + '이에요';
        msgEl.className = 'msg';
        render();
        if (window.Fun) {
          if (off === 0 && talk.length) {
            var last = talk[talk.length - 1];
            Fun.say((talk.length > 1 ? '「' + talk[0] + '」' + wa(talk[0]) + ' ' : '') + '「' + last + '」' + (hasBatchim(last) ? '은' : '는') + ' 모둠에서 따져 봐요. 딱지를 읽고 까닭을 비교표에 한 줄로 써 봐요.', 'think');
            Array.prototype.forEach.call(pairEl.querySelectorAll('.case.off'), function (el) { Fun.shake(el); });
          } else if (off === 0) {
            Fun.say('짚은 칸이 구분 기준과 모두 같아요. 까닭은 비교표에 한 줄로 써 봐요.', 'cheer'); Fun.burst(pairEl);
          } else {
            Fun.say('구분 기준과 다른 칸이 있어요. 어디서 갈렸는지 딱지를 봐요.' + (talk.length ? ' 「모둠에서 따져 봐요」가 뜬 카드는 모둠에서 따져 봐요.' : ''), 'think');
            var offEl = pairEl.querySelector('.case.off'); if (offEl) { Fun.shake(offEl); }
          }
          if (!stamped) { stamped = true; Fun.stamp(); }
        }
        try { nextBtn.focus({ preventScroll: true }); } catch (e) {}
      }, delay);
    }, delay);
  }

  function render() {
    pairEl.innerHTML = '';
    cur.forEach(function (ci, s) {
      var c = CARDS[ci];
      var box = document.createElement('div');
      box.className = 'case';
      var isOff = shown[s] && (c.ref === null || guess[s] !== c.ref);
      if (isOff) { box.classList.add('off'); }
      var head = document.createElement('p');
      head.className = 'name';
      head.textContent = c.n;
      if (c.sensor) {
        var sb = document.createElement('span');
        sb.className = 'sensor';
        sb.textContent = '센서 있음';
        head.appendChild(sb);
      }
      box.appendChild(icon(c.n));
      box.appendChild(head);
      var grp = document.createElement('div');
      grp.className = 'bins';
      grp.setAttribute('role', 'group');
      grp.setAttribute('aria-label', c.n + ' 칸 고르기');
      BINS.forEach(function (bn) {
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'bin'; b.setAttribute('data-k', bn[0]); b.setAttribute('data-slot', s);
        b.textContent = bn[1];
        b.setAttribute('aria-pressed', guess[s] === bn[0] ? 'true' : 'false');
        b.disabled = confirmed;
        if (isOff && c.ref !== null && bn[0] === c.ref) { b.classList.add('ref'); }
        b.addEventListener('click', function () { pick(s, bn[0]); });
        grp.appendChild(b);
      });
      box.appendChild(grp);
      if (shown[s]) {
        var io = document.createElement('p');
        io.className = 'io';
        io.textContent = c.io;
        box.appendChild(io);
        var t = tagOf(c, guess[s]);
        if (t) {
          var tg = document.createElement('p');
          tg.className = 'tag';
          tg.textContent = t;
          box.appendChild(tg);
        }
        box.classList.add('open');
      }
      pairEl.appendChild(box);
    });

    var both = guess[0] !== null && guess[1] !== null;
    confirmBtn.disabled = confirmed || !both;
    resetBtn.disabled = confirmed || (guess[0] === null && guess[1] === null);
    nextBtn.disabled = revealing;
    nextBtn.classList.toggle('go', confirmed && !revealing);
    if (!confirmed) {
      msgEl.textContent = both ? '확인하기를 눌러요' : '두 장 모두 칸을 짚어요';
      msgEl.className = 'msg dim';
    }
  }

  confirmBtn.addEventListener('click', confirmRound);
  resetBtn.addEventListener('click', function () {
    if (confirmed) { return; }
    guess = [null, null]; render();
    if (window.Fun) { Fun.say('이 판의 짚기를 지웠어요. 다시 예측해 봐요.'); }
  });
  nextBtn.addEventListener('click', newRound);

  newRound();
})();
</script>
