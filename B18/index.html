<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소리 내어 목표 글자 맞추기 — 에듀다움</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --point:#2f78b5; --point-soft:#e6f3fc; --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    
    background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5vw,28px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:10px;margin-top:9px}
  h2{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}

  .duo{display:flex;align-items:flex-start;justify-content:center;gap:14px}
  .box{display:block;border:1px solid var(--line);border-radius:var(--r-sm);min-width:2.1em;
    text-align:center;padding:4px 11px;font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.15}
  .box.want{background:var(--point-soft)}
  .box.now{background:var(--surface)}
  .box.same{background:var(--point);color:#fff}
  .box.pulse{animation:pulse .17s ease-out}
  @keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}
  .cap{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-align:center;margin-top:2px}

  .line{margin-top:8px;width:100%;height:auto;display:block}
  .rail{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round}
  .tick{stroke:var(--ink);stroke-width:5}
  .tick.on{stroke:var(--point);stroke-width:12}
  .tlab{font-size:20px;font-weight:700;fill:var(--muted);text-anchor:middle}
  .tlab.on{fill:var(--point);font-size:26px}
  .band{fill:var(--point-soft)}
  .mark{fill:var(--point);stroke:var(--ink);stroke-width:3}

  .val{margin-top:3px;text-align:center;font-family:'Courier New',monospace;
    font-size:22px;font-weight:700;color:var(--point)}

  input[type=range]{width:100%;margin-top:7px;min-height:44px;accent-color:var(--point)}
  input[type=range][hidden]{display:none}

  .say{margin-top:6px;font-size:14.5px;font-weight:700;text-align:center;min-height:1.5em}
  .say.dim{color:var(--muted);font-weight:700;font-size:13px}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:46px;padding:9px 13px;box-shadow:var(--hard-sm);flex:1 1 96px}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}

  .practice{margin-top:6px;display:inline-flex;font-size:12.5px;font-weight:700;color:var(--ink);
    background:var(--point-soft);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
  .note{margin-top:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}

.guess{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.guess b{font-size:13px;color:var(--muted);margin-right:2px}
.chip{font-family:inherit;cursor:pointer;font-size:15px;font-weight:700;color:var(--ink);background:var(--surface);
  border:1px solid var(--ink);border-radius:999px;min-height:44px;min-width:52px;padding:6px 12px;box-shadow:var(--hard-sm)}
.chip[aria-pressed=true]{background:var(--grape-l,#efecfd);border:3px solid var(--grape,#9b8cf2)}
.flag{stroke:var(--grape,#9b8cf2);stroke-width:4;stroke-dasharray:6 5}
.flagt{font-size:14px;font-weight:700;fill:var(--grape,#9b8cf2);text-anchor:middle}
.pair{display:flex;gap:8px;margin-top:8px}
.slot{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;text-align:center;background:var(--surface);min-height:62px}
.slot.full{background:var(--sky-l,#e6f3fc);animation:pulse .17s ease-out}
.slot small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.slot strong{font-family:'Courier New',monospace;font-size:24px;line-height:1.2}
.slot em{font-style:normal;font-size:13px;font-weight:700;color:var(--muted)}
@media (max-width:400px){.chip{min-width:46px;padding:6px 8px}.btn{padding:9px 8px;font-size:14px}}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B18/">과정안</a></span>
    <span class="tag">7~8</span>
  </nav>

  <header>
    <h1>소리 내어 목표 글자 맞추기</h1>
    <p class="lead">이 글자가 걸리게 소리를 내요</p>
  </header>

  <section aria-labelledby="h-n">
    <h2 id="h-n">맞출 글자</h2>
    <div class="duo">
      <p><b class="box want" id="want">다</b><span class="cap">맞출 글자</span></p>
      <p><b class="box now" id="now">가</b><span class="cap">지금 걸린 글자</span></p>
    </div>

    <svg class="line" viewBox="0 0 400 80" role="img"
         aria-label="지금 수가 규칙표 네 값 가운데 어디에 있는지">
      <rect class="band" id="band" x="0" y="44" width="0" height="28" rx="6"></rect>
      <line class="rail" x1="12" y1="58" x2="388" y2="58"></line>
      <g id="ticks"></g>
      <line class="flag" id="flag" x1="0" y1="16" x2="0" y2="78" visibility="hidden"></line>
      <text class="flagt" id="flagt" x="0" y="12" visibility="hidden">예상</text>
      <polygon class="mark" id="mark" points="0,0 0,0 0,0"></polygon>
    </svg>
    <p class="val" id="val">0</p>
    <input type="range" id="slide" min="0" max="99" step="1" aria-label="지금 수" hidden>

    <div class="guess" role="group" aria-label="나올 수 예상"><b>먼저 걸어요</b>
      <button class="chip" type="button" data-g="20" aria-pressed="false">20</button>
      <button class="chip" type="button" data-g="40" aria-pressed="false">40</button>
      <button class="chip" type="button" data-g="60" aria-pressed="false">60</button>
      <button class="chip" type="button" data-g="80" aria-pressed="false">80</button>
    </div>
    <p class="say dim" id="say">소리를 내 보세요</p>
    <p class="practice" id="practice" hidden>연습 모드 · 막대로 수를 옮겨요</p>
  </section>

  <section aria-labelledby="h-k">
    <h2 id="h-k">담은 수</h2>
    <div class="acts">
      <button class="btn main" id="keep" type="button">담기</button>
      <button class="btn" id="next" type="button">다음 글자</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
    </div>
    <div class="pair" id="kept" aria-live="polite">
      <div class="slot" id="s0"><small>첫 번째</small><strong>·</strong><em></em></div>
      <div class="slot" id="s1"><small>두 번째</small><strong>·</strong><em></em></div>
    </div>
    <p class="note" id="hint">수를 걸고 같은 글자를 두 번 담아 견줘요</p>
    <p class="note">목소리는 저장되지 않아요</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var TABLE = [{ n:10, c:'가' }, { n:35, c:'나' }, { n:60, c:'다' }, { n:85, c:'라' }];
  var X0 = 12, X1 = 388;

  var value = 0;
  var want = 2;
  var lastWant = -1;
  var slots = [null, null];
  var lastHit = -1;
  var guess = null, rounds = 0;
  function say(t, m){ if (window.Fun) Fun.say(t, m); }

  var ticks = [], tlabs = [];
  function px(v){ return X0 + (X1 - X0) * (v / 99); }

  (function build(){
    for (var i = 0; i < TABLE.length; i++){
      var x = px(TABLE[i].n);
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('class', 'tick');
      ln.setAttribute('x1', x); ln.setAttribute('y1', '44');
      ln.setAttribute('x2', x); ln.setAttribute('y2', '76');
      var tx = document.createElementNS(NS, 'text');
      tx.setAttribute('class', 'tlab'); tx.setAttribute('x', x); tx.setAttribute('y', '38');
      tx.textContent = TABLE[i].c;
      $('ticks').appendChild(ln); $('ticks').appendChild(tx);
      ticks.push(ln); tlabs.push(tx);
    }
  })();

  // 차이가 가장 작은 줄 하나. 같으면 위쪽 줄.
  function pick(v){
    var best = 0, bd = Math.abs(v - TABLE[0].n);
    for (var i = 1; i < TABLE.length; i++){
      var d = Math.abs(v - TABLE[i].n);
      if (d < bd){ bd = d; best = i; }
    }
    return best;
  }

  // 맞출 글자가 걸리는 수의 구간. 이웃과의 한가운데가 경계다.
  function bandOf(i){
    var lo = (i === 0) ? 0 : (TABLE[i - 1].n + TABLE[i].n) / 2;
    var hi = (i === TABLE.length - 1) ? 99 : (TABLE[i].n + TABLE[i + 1].n) / 2;
    return [lo, hi];
  }

  function render(){
    $('val').textContent = String(value);
    var b = pick(value);
    for (var i = 0; i < TABLE.length; i++){
      ticks[i].classList.toggle('on', i === b);
      tlabs[i].classList.toggle('on', i === b);
    }
    $('want').textContent = TABLE[want].c;
    var nowEl = $('now');
    nowEl.textContent = TABLE[b].c;
    nowEl.className = 'box ' + (b === want ? 'same' : 'now');

    var bd = bandOf(want);
    $('band').setAttribute('x', px(bd[0]).toFixed(1));
    $('band').setAttribute('width', (px(bd[1]) - px(bd[0])).toFixed(1));

    var x = px(value);
    $('mark').setAttribute('points', (x - 10) + ',40 ' + (x + 10) + ',40 ' + x + ',56');

    if (b !== lastHit){
      lastHit = b;
      nowEl.classList.remove('pulse'); void nowEl.offsetWidth; nowEl.classList.add('pulse');
    }

    var s = $('say');
    if (b === want){ s.textContent = '이 글자가 걸렸어요'; s.className = 'say'; }
    else if (b < want){ s.textContent = '더 크게 내 보세요'; s.className = 'say dim'; }
    else { s.textContent = '더 작게 내 보세요'; s.className = 'say dim'; }

    for (var k = 0; k < 2; k++){
      var sl = $('s' + k);
      sl.querySelector('strong').textContent = slots[k] === null ? '·' : String(slots[k]);
      sl.querySelector('em').textContent = slots[k] === null ? '' : TABLE[pick(slots[k])].c;
      sl.classList.toggle('full', slots[k] !== null);
    }
    var fl = $('flag'), ft = $('flagt');
    if (guess === null){ fl.setAttribute('visibility', 'hidden'); ft.setAttribute('visibility', 'hidden'); }
    else {
      var gx = px(guess).toFixed(1);
      fl.setAttribute('x1', gx); fl.setAttribute('x2', gx); ft.setAttribute('x', gx);
      fl.setAttribute('visibility', 'visible'); ft.setAttribute('visibility', 'visible');
    }
    var chips = document.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) chips[c].setAttribute('aria-pressed', String(+chips[c].dataset.g === guess));
    $('keep').disabled = (slots[1] !== null) || guess === null;
    $('hint').textContent = slots[1] !== null ? '두 칸이 찼어요. 다음 글자로 가요' : (guess === null ? '먼저 나올 수를 걸어요' : '같은 글자를 두 번 담아 견줘요');
  }

  function clearRound(){ slots = [null, null]; guess = null; }
  function newWord(first){
    var w;
    do { w = Math.floor(Math.random() * TABLE.length); } while (w === lastWant);
    lastWant = w; want = w; clearRound();
    render();
    if (!first) say('새 글자 「' + TABLE[w].c + '」이에요. 몇 쯤 나올지 먼저 걸어요.');
  }

  var chipEls = document.querySelectorAll('.chip');
  for (var ci = 0; ci < chipEls.length; ci++){
    chipEls[ci].addEventListener('click', function(){
      guess = +this.dataset.g;
      render();
      say('「' + TABLE[want].c + '」가 걸리려면 ' + guess + '쯤일 거라고 걸었어요. 소리를 내서 담아 봐요.');
    });
  }

  $('keep').addEventListener('click', function(){
    if (guess === null || slots[1] !== null) return;
    var i = slots[0] === null ? 0 : 1;
    slots[i] = value;
    render();
    if (i === 0){
      say('걸어 둔 수 ' + guess + ', 담은 수 ' + value + '. 같은 소리를 한 번 더 내서 담아 봐요.');
    } else {
      var same = pick(slots[0]) === pick(slots[1]);
      if (same){
        say('첫 수 ' + slots[0] + ', 둘째 수 ' + slots[1] + '. 글자는 같아요. 수도 같았나요?', 'cheer');
        if (window.Fun) Fun.burst($('s1'));
      } else {
        say('첫 수 ' + slots[0] + ', 둘째 수 ' + slots[1] + '. 글자가 달라졌어요. 같은 소리였는데 어디서 갈렸을까요?', 'think');
        if (window.Fun) Fun.shake($('s1'));
      }
      if (window.Fun) Fun.stamp();
    }
  });
  $('next').addEventListener('click', function(){ newWord(false); });
  $('reset').addEventListener('click', function(){ clearRound(); render(); say('같은 글자로 다시 해요. 수를 먼저 걸어요.'); });

  /* 연습 모드 */
  function usePractice(){
    if (!$('slide').hidden) return;
    stopMic();
    $('slide').hidden = false;
    $('practice').hidden = false;
    $('slide').value = String(value);
  }
  $('slide').addEventListener('input', function(){
    value = parseInt(this.value, 10) || 0;
    render();
  });

  /* 마이크 — 지금 이 순간의 크기만 본다. 어떤 표본도 담아 두지 않는다. */
  var stream = null, actx = null, analyser = null, buf = null, timer = null;

  function stopMic(){
    if (timer){ clearInterval(timer); timer = null; }
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if (actx){ actx.close(); actx = null; }
    analyser = null; buf = null;
  }

  function tick(){
    if (!analyser) return;
    analyser.getByteTimeDomainData(buf);
    var s = 0;
    for (var i = 0; i < buf.length; i++){ var t = (buf[i] - 128) / 128; s += t * t; }
    var rms = Math.sqrt(s / buf.length);
    var db = 20 * Math.log(Math.max(rms, 1e-6)) / Math.LN10;
    var v = Math.round((db + 60) / 50 * 99);
    if (v < 0) v = 0; if (v > 99) v = 99;
    value = Math.round(value * 0.4 + v * 0.6);
    render();
  }

  function startMic(){
    if (!$('slide').hidden) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ usePractice(); return; }
    navigator.mediaDevices.getUserMedia({
      // 자동 게인이 켜져 있으면 조용할 때 마이크가 저 혼자 키워 수가 제멋대로 움직인다.
      audio:{ autoGainControl:false, noiseSuppression:false, echoCancellation:false },
      video:false
    })
      .then(function(s){
        stream = s;
        actx = new AC();
        if (actx.state === 'suspended') actx.resume();
        analyser = actx.createAnalyser();
        analyser.fftSize = 1024;
        buf = new Uint8Array(analyser.fftSize);
        actx.createMediaStreamSource(s).connect(analyser);
        s.getTracks()[0].addEventListener('ended', usePractice);
        timer = setInterval(tick, 100);
      })
      .catch(function(){ usePractice(); });
  }

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopMic();
    else if ($('slide').hidden) startMic();
  });
  window.addEventListener('pagehide', stopMic);

  newWord(true);
  startMic();
})();
</script>
<script src="../assets/play/fun.js" data-block="B18" data-mission="소리를 내서 목표 글자가 걸리게 해요. 나올 수를 먼저 걸고, 같은 소리를 두 번 담아 견줘요!"></script>
</body>
</html>
