<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소리를 수로 — 에듀다움 B18</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#7C3AED; --point-soft:#E7DCFF; --muted:#5E5E5E;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:12px 14px 28px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;
    font-size:14px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;border:2.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(23px,5.6vw,32px);font-weight:900;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:15px;color:var(--muted);margin-top:5px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:12px;margin-top:11px}
  h2{font-size:13.5px;font-weight:900;letter-spacing:-.02em;margin-bottom:8px;color:var(--muted)}

  .now{display:flex;align-items:center;justify-content:center;gap:16px}
  .val{font-family:'Courier New',monospace;font-size:clamp(46px,13vw,68px);font-weight:900;
    line-height:1;color:var(--point);min-width:2.4em;text-align:right}
  .hit{font-size:clamp(34px,10vw,52px);font-weight:900;line-height:1;
    border:3px solid var(--ink);border-radius:var(--r-sm);background:var(--point-soft);
    min-width:1.7em;text-align:center;padding:6px 10px}

  input[type=range]{width:100%;margin-top:11px;min-height:44px;accent-color:var(--point)}
  input[type=range][hidden]{display:none}

  .priv{margin-top:8px;font-size:12.5px;font-weight:900;color:var(--muted)}
  .practice{margin-top:7px;display:inline-flex;font-size:12.5px;font-weight:900;color:var(--ink);
    background:var(--point-soft);border:2px solid var(--ink);border-radius:999px;padding:5px 11px}
  [hidden]{display:none!important}

  table{width:100%;border-collapse:collapse;font-weight:800}
  th{font-size:12.5px;color:var(--muted);text-align:left;padding:0 8px 5px}
  th:last-child,td:last-child{text-align:right}
  td{padding:7px 8px;border-top:2px solid var(--ink);font-family:'Courier New',monospace;font-size:17px}
  tr.on td{background:var(--point-soft)}
  tr.on td:first-child{box-shadow:inset 6px 0 0 var(--point)}
  .ch{font-family:inherit;font-size:19px;font-weight:900}

  .keep{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .slot{border:2.5px solid var(--ink);border-radius:var(--r-sm);padding:8px;text-align:center}
  .slot span{display:block;font-size:12px;font-weight:900;color:var(--muted)}
  .slot b{display:block;font-family:'Courier New',monospace;font-size:30px;font-weight:900;
    line-height:1.2;color:var(--ink)}
  .slot b.none{color:var(--point-soft)}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:9px 16px;box-shadow:var(--hard-sm);flex:1 1 110px;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff}
  .btn:disabled{opacity:.42;cursor:default;box-shadow:none}

  .note{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .note b{font-weight:900;color:var(--ink)}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">← 전체 목록</a>
    <span class="tag">B18</span>
  </nav>

  <header>
    <h1>소리를 수로</h1>
    <p class="lead">같은 소리를 두 번 내 보세요</p>
  </header>

  <section aria-labelledby="h-n">
    <h2 id="h-n">지금</h2>
    <div class="now">
      <b class="val" id="val" aria-live="off">0</b>
      <span class="hit" id="hit">가</span>
    </div>
    <input type="range" id="slide" min="0" max="99" step="1" aria-label="지금 수" hidden>
    <p class="practice" id="practice" hidden>연습 모드 · 막대로 수를 옮겨요</p>
    <p class="note" id="same" hidden>막대는 두 번 같아요</p>
    <p class="priv">목소리는 저장되지 않아요</p>
  </section>

  <section aria-labelledby="h-r">
    <h2 id="h-r">규칙표</h2>
    <table>
      <thead><tr><th>수</th><th>글자</th><th>차이</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section aria-labelledby="h-k">
    <h2 id="h-k">담은 수</h2>
    <div class="keep">
      <p class="slot"><span>첫 번째</span><b class="none" id="k1">·</b></p>
      <p class="slot"><span>두 번째</span><b class="none" id="k2">·</b></p>
    </div>
    <div class="acts">
      <button class="btn main" id="keep" type="button">담기</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
    </div>
    <p class="note" id="full" hidden>두 칸이 찼어요</p>
    <p class="note">두 수가 같았나요</p>
    <p class="note"><b>받아쓰기는 공용 기기로 해요</b></p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var valEl = $('val'), hitEl = $('hit'), rowsEl = $('rows');
  var slide = $('slide'), practiceEl = $('practice');
  var k1 = $('k1'), k2 = $('k2'), keepBtn = $('keep');

  var TABLE = [{ n:10, c:'가' }, { n:35, c:'나' }, { n:60, c:'다' }, { n:85, c:'라' }];
  var value = 0;
  var slots = [null, null];
  var trs = [], diffs = [];

  (function build(){
    for (var i = 0; i < TABLE.length; i++){
      var tr = document.createElement('tr');
      var a = document.createElement('td'); a.textContent = String(TABLE[i].n);
      var b = document.createElement('td'); b.className = 'ch'; b.textContent = TABLE[i].c;
      var d = document.createElement('td'); d.textContent = '0';
      tr.appendChild(a); tr.appendChild(b); tr.appendChild(d);
      rowsEl.appendChild(tr);
      trs.push(tr); diffs.push(d);
    }
  })();

  // 차이가 가장 작은 줄 하나. 같으면 위쪽 줄.
  function pick(v){
    var best = 0, bd = Math.abs(v - TABLE[0].n);
    for (var i = 1; i < TABLE.length; i++){
      var d = Math.abs(v - TABLE[i].n);
      if (d < bd){ bd = d; best = i; }
    }
    return best;
  }

  function render(){
    valEl.textContent = String(value);
    var b = pick(value);
    for (var i = 0; i < TABLE.length; i++){
      diffs[i].textContent = String(Math.abs(value - TABLE[i].n));
      trs[i].classList.toggle('on', i === b);
    }
    hitEl.textContent = TABLE[b].c;
  }

  function renderSlots(){
    var els = [k1, k2];
    for (var i = 0; i < 2; i++){
      var has = slots[i] !== null;
      els[i].textContent = has ? String(slots[i]) : '·';
      els[i].classList.toggle('none', !has);
    }
    keepBtn.disabled = (slots[1] !== null);
    $('full').hidden = !keepBtn.disabled;
  }

  keepBtn.addEventListener('click', function(){
    if (slots[0] === null) slots[0] = value;
    else if (slots[1] === null) slots[1] = value;
    renderSlots();
  });
  $('reset').addEventListener('click', function(){
    slots = [null, null];
    renderSlots();
  });

  /* 연습 모드 — 막대로 수를 옮긴다 */
  function usePractice(){
    if (!slide.hidden) return;
    stopMic();
    slide.hidden = false;
    practiceEl.hidden = false;
    $('same').hidden = false;
    slide.value = String(value);
  }
  slide.addEventListener('input', function(){
    value = parseInt(slide.value, 10) || 0;
    render();
  });

  /* 마이크 — 지금 이 순간의 크기만 본다. 어떤 표본도 담아 두지 않는다. */
  var stream = null, actx = null, analyser = null, buf = null, timer = null;

  function stopMic(){
    if (timer){ clearInterval(timer); timer = null; }
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if (actx){ actx.close(); actx = null; }
    analyser = null; buf = null;
  }

  function tick(){
    if (!analyser) return;
    analyser.getByteTimeDomainData(buf);
    var s = 0;
    for (var i = 0; i < buf.length; i++){ var t = (buf[i] - 128) / 128; s += t * t; }
    var rms = Math.sqrt(s / buf.length);
    var db = 20 * Math.log(Math.max(rms, 1e-6)) / Math.LN10;
    var v = Math.round((db + 60) / 50 * 99);
    if (v < 0) v = 0; if (v > 99) v = 99;
    value = Math.round(value * 0.4 + v * 0.6);
    render();
  }

  function startMic(){
    if (!slide.hidden) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ usePractice(); return; }
    navigator.mediaDevices.getUserMedia({
      // 자동 게인이 켜져 있으면 조용할 때 마이크가 저 혼자 키워 수가 제멋대로 움직인다.
      audio:{ autoGainControl:false, noiseSuppression:false, echoCancellation:false },
      video:false
    })
      .then(function(s){
        stream = s;
        actx = new AC();
        if (actx.state === 'suspended') actx.resume();
        analyser = actx.createAnalyser();
        analyser.fftSize = 1024;
        buf = new Uint8Array(analyser.fftSize);
        actx.createMediaStreamSource(s).connect(analyser);
        s.getTracks()[0].addEventListener('ended', usePractice);
        timer = setInterval(tick, 100);
      })
      .catch(function(){ usePractice(); });
  }

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopMic();
    else if (slide.hidden) startMic();
  });
  window.addEventListener('pagehide', stopMic);

  render();
  renderSlots();
  startMic();
})();
</script>
</body>
</html>
