<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소리를 수로 — 에듀다움</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#7C3AED; --point-soft:#E7DCFF; --muted:#5E5E5E;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;
    font-size:14px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;border:2.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5vw,28px);font-weight:900;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:10px;margin-top:9px}
  h2{font-size:13px;font-weight:900;margin-bottom:6px;color:var(--muted)}

  .duo{display:flex;align-items:flex-start;justify-content:center;gap:14px}
  .box{display:block;border:3px solid var(--ink);border-radius:var(--r-sm);min-width:2.1em;
    text-align:center;padding:4px 11px;font-size:clamp(28px,8vw,40px);font-weight:900;line-height:1.15}
  .box.want{background:var(--point-soft)}
  .box.now{background:var(--surface)}
  .box.same{background:var(--point);color:#fff}
  .box.pulse{animation:pulse .17s ease-out}
  @keyframes pulse{0%{transform:scale(1)}45%{transform:scale(1.15)}100%{transform:scale(1)}}
  .cap{display:block;font-size:11.5px;font-weight:900;color:var(--muted);text-align:center;margin-top:2px}

  .line{margin-top:8px;width:100%;height:42px;display:block}
  .rail{fill:none;stroke:var(--ink);stroke-width:2.5}
  .tick{stroke:var(--ink);stroke-width:2.5}
  .tick.on{stroke:var(--point);stroke-width:6}
  .tlab{font-size:9px;font-weight:900;fill:var(--muted);text-anchor:middle}
  .tlab.on{fill:var(--point);font-size:11px}
  .band{fill:var(--point-soft)}
  .mark{fill:var(--point);stroke:var(--ink);stroke-width:1.5}

  .val{margin-top:3px;text-align:center;font-family:'Courier New',monospace;
    font-size:22px;font-weight:900;color:var(--point)}

  input[type=range]{width:100%;margin-top:7px;min-height:44px;accent-color:var(--point)}
  input[type=range][hidden]{display:none}

  .say{margin-top:6px;font-size:14.5px;font-weight:900;text-align:center;min-height:1.5em}
  .say.dim{color:var(--muted);font-weight:700;font-size:13px}

  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:46px;padding:9px 13px;box-shadow:var(--hard-sm);flex:1 1 96px}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff}
  .btn:disabled{opacity:.4;cursor:default;box-shadow:none}

  .practice{margin-top:6px;display:inline-flex;font-size:12.5px;font-weight:900;color:var(--ink);
    background:var(--point-soft);border:2px solid var(--ink);border-radius:999px;padding:5px 11px}
  .note{margin-top:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
  [hidden]{display:none!important}

  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">← 전체 목록</a>
    <span class="tag">7~8</span>
  </nav>

  <header>
    <h1>소리를 수로</h1>
    <p class="lead">이 글자가 걸리게 소리를 내요</p>
  </header>

  <section aria-labelledby="h-n">
    <h2 id="h-n">맞출 글자</h2>
    <div class="duo">
      <p><b class="box want" id="want">다</b><span class="cap">맞출 글자</span></p>
      <p><b class="box now" id="now">가</b><span class="cap">지금 걸린 글자</span></p>
    </div>

    <svg class="line" viewBox="0 0 100 22" preserveAspectRatio="none" role="img"
         aria-label="지금 수가 규칙표 네 값 가운데 어디에 있는지">
      <rect class="band" id="band" x="0" y="8" width="0" height="7" rx="2"></rect>
      <line class="rail" x1="3" y1="14" x2="97" y2="14"></line>
      <g id="ticks"></g>
      <polygon class="mark" id="mark" points="0,0 0,0 0,0"></polygon>
    </svg>
    <p class="val" id="val">0</p>
    <input type="range" id="slide" min="0" max="99" step="1" aria-label="지금 수" hidden>

    <p class="say dim" id="say">소리를 내 보세요</p>
    <p class="practice" id="practice" hidden>연습 모드 · 막대로 수를 옮겨요</p>
  </section>

  <section aria-labelledby="h-k">
    <h2 id="h-k">담은 수</h2>
    <div class="acts">
      <button class="btn main" id="keep" type="button">담기</button>
      <button class="btn" id="next" type="button">다음 글자</button>
      <button class="btn" id="reset" type="button">다시 하기</button>
    </div>
    <p class="note" id="kept">첫 번째 · 두 번째 ·</p>
    <p class="note">같은 글자를 두 번 담아 견줘요</p>
    <p class="note">목소리는 저장되지 않아요</p>
  </section>
</div>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var TABLE = [{ n:10, c:'가' }, { n:35, c:'나' }, { n:60, c:'다' }, { n:85, c:'라' }];
  var X0 = 3, X1 = 97;

  var value = 0;
  var want = 2;
  var lastWant = -1;
  var slots = [null, null];
  var lastHit = -1;

  var ticks = [], tlabs = [];
  function px(v){ return X0 + (X1 - X0) * (v / 99); }

  (function build(){
    for (var i = 0; i < TABLE.length; i++){
      var x = px(TABLE[i].n);
      var ln = document.createElementNS(NS, 'line');
      ln.setAttribute('class', 'tick');
      ln.setAttribute('x1', x); ln.setAttribute('y1', '8');
      ln.setAttribute('x2', x); ln.setAttribute('y2', '21');
      var tx = document.createElementNS(NS, 'text');
      tx.setAttribute('class', 'tlab'); tx.setAttribute('x', x); tx.setAttribute('y', '6');
      tx.textContent = TABLE[i].c;
      $('ticks').appendChild(ln); $('ticks').appendChild(tx);
      ticks.push(ln); tlabs.push(tx);
    }
  })();

  // 차이가 가장 작은 줄 하나. 같으면 위쪽 줄.
  function pick(v){
    var best = 0, bd = Math.abs(v - TABLE[0].n);
    for (var i = 1; i < TABLE.length; i++){
      var d = Math.abs(v - TABLE[i].n);
      if (d < bd){ bd = d; best = i; }
    }
    return best;
  }

  // 맞출 글자가 걸리는 수의 구간. 이웃과의 한가운데가 경계다.
  function bandOf(i){
    var lo = (i === 0) ? 0 : (TABLE[i - 1].n + TABLE[i].n) / 2;
    var hi = (i === TABLE.length - 1) ? 99 : (TABLE[i].n + TABLE[i + 1].n) / 2;
    return [lo, hi];
  }

  function render(){
    $('val').textContent = String(value);
    var b = pick(value);
    for (var i = 0; i < TABLE.length; i++){
      ticks[i].classList.toggle('on', i === b);
      tlabs[i].classList.toggle('on', i === b);
    }
    $('want').textContent = TABLE[want].c;
    var nowEl = $('now');
    nowEl.textContent = TABLE[b].c;
    nowEl.className = 'box ' + (b === want ? 'same' : 'now');

    var bd = bandOf(want);
    $('band').setAttribute('x', px(bd[0]).toFixed(1));
    $('band').setAttribute('width', (px(bd[1]) - px(bd[0])).toFixed(1));

    var x = px(value);
    $('mark').setAttribute('points', (x - 3.2) + ',12 ' + (x + 3.2) + ',12 ' + x + ',18');

    if (b !== lastHit){
      lastHit = b;
      nowEl.classList.remove('pulse'); void nowEl.offsetWidth; nowEl.classList.add('pulse');
    }

    var s = $('say');
    if (b === want){ s.textContent = '이 글자가 걸렸어요'; s.className = 'say'; }
    else if (b < want){ s.textContent = '더 크게 내 보세요'; s.className = 'say dim'; }
    else { s.textContent = '더 작게 내 보세요'; s.className = 'say dim'; }

    $('kept').textContent = '첫 번째 ' + (slots[0] === null ? '·' : slots[0]) +
      ' · 두 번째 ' + (slots[1] === null ? '·' : slots[1]);
    $('keep').disabled = (slots[1] !== null);
  }

  function newWord(){
    var w;
    do { w = Math.floor(Math.random() * TABLE.length); } while (w === lastWant);
    lastWant = w; want = w;
    render();
  }

  $('keep').addEventListener('click', function(){
    if (slots[0] === null) slots[0] = value;
    else if (slots[1] === null) slots[1] = value;
    render();
  });
  $('next').addEventListener('click', newWord);
  $('reset').addEventListener('click', function(){ slots = [null, null]; render(); });

  /* 연습 모드 */
  function usePractice(){
    if (!$('slide').hidden) return;
    stopMic();
    $('slide').hidden = false;
    $('practice').hidden = false;
    $('slide').value = String(value);
  }
  $('slide').addEventListener('input', function(){
    value = parseInt(this.value, 10) || 0;
    render();
  });

  /* 마이크 — 지금 이 순간의 크기만 본다. 어떤 표본도 담아 두지 않는다. */
  var stream = null, actx = null, analyser = null, buf = null, timer = null;

  function stopMic(){
    if (timer){ clearInterval(timer); timer = null; }
    if (stream){ stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if (actx){ actx.close(); actx = null; }
    analyser = null; buf = null;
  }

  function tick(){
    if (!analyser) return;
    analyser.getByteTimeDomainData(buf);
    var s = 0;
    for (var i = 0; i < buf.length; i++){ var t = (buf[i] - 128) / 128; s += t * t; }
    var rms = Math.sqrt(s / buf.length);
    var db = 20 * Math.log(Math.max(rms, 1e-6)) / Math.LN10;
    var v = Math.round((db + 60) / 50 * 99);
    if (v < 0) v = 0; if (v > 99) v = 99;
    value = Math.round(value * 0.4 + v * 0.6);
    render();
  }

  function startMic(){
    if (!$('slide').hidden) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ usePractice(); return; }
    navigator.mediaDevices.getUserMedia({
      // 자동 게인이 켜져 있으면 조용할 때 마이크가 저 혼자 키워 수가 제멋대로 움직인다.
      audio:{ autoGainControl:false, noiseSuppression:false, echoCancellation:false },
      video:false
    })
      .then(function(s){
        stream = s;
        actx = new AC();
        if (actx.state === 'suspended') actx.resume();
        analyser = actx.createAnalyser();
        analyser.fftSize = 1024;
        buf = new Uint8Array(analyser.fftSize);
        actx.createMediaStreamSource(s).connect(analyser);
        s.getTracks()[0].addEventListener('ended', usePractice);
        timer = setInterval(tick, 100);
      })
      .catch(function(){ usePractice(); });
  }

  document.addEventListener('visibilitychange', function(){
    if (document.hidden) stopMic();
    else if ($('slide').hidden) startMic();
  });
  window.addEventListener('pagehide', stopMic);

  newWord();
  render();
  startMic();
})();
</script>
</body>
</html>
