<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>처음 값 바꿔 흔든수 예상하기 — 에듀다움 B10</title>
<link rel="icon" href="../assets/icons/game.svg">
<style>
  :root{--line:#DDDDDD;--line-strong:#C1C1C1;
    --ink:#222222; --paper:#FFFFFF; --surface:#FFFFFF;
    --muted:#6A6A6A;
    --r:14px; --r-sm:8px;
    --hard:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0; --hard-sm:0 1px 2px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5}
  .wrap{max-width:640px;margin:0 auto;padding:10px 14px 22px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:600;
    font-size:14px;background:var(--surface);border:1px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm)}
  .tag{font-weight:700;font-size:14px;background:var(--point);color:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(21px,5vw,27px);font-weight:700;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:14px;color:var(--muted);margin-top:3px;font-weight:700}

  section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--hard);padding:10px;margin-top:9px}
  h2{font-size:13px;font-weight:700;margin-bottom:6px;color:var(--muted)}

  .stage{display:grid;grid-template-columns:118px minmax(0,1fr);gap:9px;align-items:stretch}
  .panel{background:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:9px;display:flex;align-items:center;justify-content:center}
  #led{width:100%;max-width:140px;height:auto;display:block}
  .px{fill:#333030}
  .px.on{fill:#FF3B2F;filter:drop-shadow(0 0 2px #FF3B2F)}
  .vbox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .vbox span{font-size:12px;font-weight:700}
  .vbox b{font-family:'Courier New',monospace;font-size:clamp(30px,9vw,42px);font-weight:700;
    color:var(--point);line-height:1}

  .code{margin-top:9px;display:grid;gap:6px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
  .card .when{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--muted)}
  .card .line{font-size:14px;font-weight:600;margin-top:3px}
  .card .line b.iv{display:inline-block;min-width:2.2em;text-align:center;background:var(--point-soft);
    border:1px solid var(--point);border-radius:6px;padding:0 4px}


  .ask{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
  .ask label{font-size:15px;font-weight:700;flex:1 1 100%}
  .ask input{font-family:'Courier New',monospace;font-size:20px;font-weight:700;width:84px;min-height:46px;
    text-align:center;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
  .ask input:disabled{color:var(--muted);border-color:var(--line)}

  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:15px;font-weight:700;
    background:var(--surface);border:1px solid var(--ink);border-radius:var(--r-sm);
    min-height:46px;padding:8px 12px;box-shadow:var(--hard-sm);flex:1 1 96px;
    transition:transform .1s,box-shadow .1s}
  .btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);border-color:var(--point);color:#fff}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none}
  .ask .btn{flex:0 1 auto}

  .acts{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}

  .say{margin-top:8px;font-size:13.5px;font-weight:700}
  .say.dim{color:var(--muted)}


  :focus-visible{outline:3px solid var(--point);outline-offset:3px}
  @media(max-width:420px){ .stage{grid-template-columns:1fr 1fr} }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .steps{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;min-height:34px}
  .steps span{min-width:34px;height:34px;border:1px solid var(--line);border-radius:6px;display:inline-flex;
    align-items:center;justify-content:center;font-family:'Courier New',monospace;font-weight:700;font-size:15px;color:var(--muted)}
  .steps span.on{border-color:var(--point);color:var(--ink);background:var(--point-soft)}
  .diff{word-break:keep-all;margin-top:6px;font-size:13px;font-weight:700;color:var(--point)}
  .ask .step{flex:0 0 46px;padding:0}
  .vbox.end{border-color:var(--point);background:var(--point-soft);box-shadow:0 0 0 3px var(--point-soft)}
  .past{list-style:none;font-size:13.5px;display:grid;gap:3px}
  .past li{border-bottom:1px dashed var(--line);padding:3px 0}
  .past li.empty{color:var(--muted)}

/* 에듀다움 통일 테마 2026-09-27 */
.btn.main{background:var(--point);border-color:var(--point);color:#fff}
  .panel.wob{animation:wob .38s ease}
  @keyframes wob{0%,100%{transform:none}20%{transform:translate(-5px,2px) rotate(-4deg)}45%{transform:translate(5px,-2px) rotate(4deg)}70%{transform:translate(-3px,1px) rotate(-2deg)}}
  .steps span.pop{animation:pop .3s ease}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .vbox b.bump{animation:pop .3s ease}
  .gap{display:none;margin-top:8px}
  .gap.on{display:block}
  .gap svg{width:100%;max-width:460px;height:auto;display:block;margin:0 auto}
</style>
<link rel="stylesheet" href="../assets/play/fun.css">
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <span style="display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center"><a class="back" href="../play/">← 체험 목록</a><a class="back" href="../lessons/B10/">과정안</a></span>
    <span class="tag">19~20</span>
  </nav>

  <header>
    <h1>처음 값 바꿔 흔든수 예상하기</h1>
    <p class="lead">예상을 먼저 적고 흔들어 견줘요 · 체험 활동</p>
  </header>

  <section aria-labelledby="h-code">
    <h2 id="h-code">흔들기 카운터</h2>
    <div class="stage">
      <div class="panel"><svg id="led" viewBox="0 0 100 100" role="img" aria-label="마이크로비트 엘이디 화면"></svg></div>
      <p class="vbox"><span>흔든수</span><b id="num">0</b></p>
    </div>
    <div class="code">
      <div class="card"><span class="when">시작하면 실행</span><p class="line">흔든수에 <b class="iv" id="initV">0</b> 저장</p></div>
      <div class="card"><span class="when">흔들림 감지하면 실행</span><p class="line">흔든수 값 1 증가</p><p class="line">수 출력 흔든수</p></div>
    </div>
    <p class="diff" id="diff"></p>
  </section>

  <section aria-labelledby="h-round">
    <h2 id="h-round">이번 판</h2>
    <div class="ask">
      <label for="guess" id="askLabel">처음 값 0, 5번 흔들면 흔든수는?</label>
      <button class="btn step" id="minus" type="button" aria-label="하나 빼기">−</button>
      <input id="guess" type="number" inputmode="numeric" min="0" max="99" placeholder="?">
      <button class="btn step" id="plus" type="button" aria-label="하나 더하기">+</button>
    </div>
    <div class="acts">
      <button class="btn" id="pick" type="button" disabled>예상 적기</button>
      <button class="btn main" id="shake" type="button" disabled>흔들기</button>
    </div>
    <div class="steps" id="steps" aria-label="흔들 때마다 흔든수"></div>
    <div class="gap" id="gap"></div>
    <p class="say dim" id="say" aria-live="polite">예상을 적어야 흔들 수 있어요</p>
    <div class="acts">
      <button class="btn" id="next" type="button" disabled>다음 판</button>
      <button class="btn" id="reset" type="button">처음으로</button>
    </div>
  </section>

  <section aria-labelledby="h-past">
    <h2 id="h-past">지난 판</h2>
    <ul class="past" id="past"><li class="empty">아직 없어요</li></ul>
  </section>
</div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };

  var GLYPH = {
    '0':'111101101101111', '1':'010110010010111', '2':'111001111100111',
    '3':'111001111001111', '4':'101101111001001', '5':'111100111001111',
    '6':'111100111101111', '7':'111001001001001', '8':'111101111101111',
    '9':'111101111001111'
  };
  var INITS = [0, 10];

  var numEl = $('num'), initEl = $('initV'), askEl = $('askLabel'), diffEl = $('diff');
  var guessEl = $('guess'), minusBtn = $('minus'), plusBtn = $('plus');
  var pickBtn = $('pick'), shakeBtn = $('shake'), nextBtn = $('next'), resetBtn = $('reset');
  var vboxEl = numEl.parentNode, panelEl = document.querySelector('.panel'), gapEl = $('gap');
  var stepsEl = $('steps'), sayEl = $('say'), pastEl = $('past');

  var cells = [];
  (function buildLed() {
    var led = $('led');
    for (var r = 0; r < 5; r++) {
      for (var c = 0; c < 5; c++) {
        var el = document.createElementNS(NS, 'rect');
        el.setAttribute('x', (c * 21.25).toFixed(2));
        el.setAttribute('y', (r * 21.25).toFixed(2));
        el.setAttribute('width', '15');
        el.setAttribute('height', '15');
        el.setAttribute('rx', '3');
        el.setAttribute('class', 'px');
        led.appendChild(el);
        cells.push(el);
      }
    }
  })();

  function paint(ch) {
    var g = ch === null ? null : GLYPH[ch];
    for (var i = 0; i < cells.length; i++) {
      var r = (i / 5) | 0, c = i % 5;
      var lit = false;
      if (g && c >= 1 && c <= 3) { lit = g.charAt(r * 3 + (c - 1)) === '1'; }
      cells[i].classList.toggle('on', lit);
    }
  }

  var seq = null;
  function clearSeq() { if (seq) { clearTimeout(seq); seq = null; } }
  function show(v) {
    clearSeq();
    var s = String(v);
    if (s.length === 1) { paint(s); return; }   // 한 자리 수는 그대로 멈춰 보인다
    // 두 자리 이상은 실제 마이크로비트처럼 왼쪽으로 흘러가고, 다 지나가면 화면이 빈다
    var cols = [], k, r;
    for (k = 0; k < 5; k++) cols.push('00000');
    for (var d = 0; d < s.length; d++) {
      var g = GLYPH[s.charAt(d)];
      for (var c = 0; c < 3; c++) { var col = ''; for (r = 0; r < 5; r++) col += g.charAt(r * 3 + c); cols.push(col); }
      cols.push('00000');
    }
    for (k = 0; k < 5; k++) cols.push('00000');
    var x = 0;
    var next = function () {
      for (var i = 0; i < cells.length; i++) cells[i].classList.toggle('on', cols[x + (i % 5)].charAt((i / 5) | 0) === '1');
      x += 1;
      seq = x + 5 <= cols.length ? setTimeout(next, 140) : null;
    };
    next();
  }

  // 판: 한 쌍(처음 값 0 → 10) 안에서 흔들 횟수 n은 같다.
  var n = 5, half = 0, init = 0, count = 0, shaken = 0, guess = null, step = 'guess';
  var history = [];

  function drawN(prev) {
    var v = prev;
    while (v === prev) { v = 3 + Math.floor(Math.random() * 6); }
    return v;
  }

  function say(t, mood) { if (window.Fun) { Fun.say(t, mood); } }
  // 예상과 화면의 수를 수직선 위에 점으로 놓는다.
  function drawGap(g, v) {
    var lo = Math.min(g, v, init), hi = Math.max(g, v, init) + 1, span = hi - lo;
    var X = function (k) { return 20 + (k - lo) / span * 260; };
    var h = '<svg viewBox="0 0 300 64" role="img" aria-label="예상 ' + g + ', 화면 ' + v + '"><line x1="14" y1="36" x2="286" y2="36" stroke="#cfc6b6" stroke-width="3" stroke-linecap="round"/>';
    h += '<text x="' + X(init) + '" y="58" text-anchor="middle" font-size="11" fill="#6f6a62">처음 ' + init + '</text>';
    h += '<circle cx="' + X(v) + '" cy="36" r="9" fill="var(--point)"/><text x="' + X(v) + '" y="14" text-anchor="middle" font-size="12" font-weight="700">화면 ' + v + '</text>';
    if (g !== v) {
      h += '<line x1="' + X(g) + '" y1="36" x2="' + X(v) + '" y2="36" stroke="var(--point)" stroke-width="3" stroke-dasharray="5 4"/>';
    }
    h += '<circle cx="' + X(g) + '" cy="36" r="7" fill="#fff" stroke="#33302b" stroke-width="3"/>';
    if (g !== v) { h += '<text x="' + X(g) + '" y="58" text-anchor="middle" font-size="12" font-weight="700">예상 ' + g + '</text>'; }
    gapEl.innerHTML = h + '</svg>';
    gapEl.classList.add('on');
  }

  function setSay(t, strong) { sayEl.textContent = t; sayEl.className = strong ? 'say' : 'say dim'; }

  function readGuess() {
    var t = String(guessEl.value).trim();
    if (!/^\d{1,2}$/.test(t)) { return null; }
    return parseInt(t, 10);
  }

  function lockGuess(on) {
    guessEl.disabled = on; minusBtn.disabled = on; plusBtn.disabled = on;
  }

  function openRound() {
    clearSeq(); paint(null);
    vboxEl.classList.remove('end');
    gapEl.classList.remove('on'); gapEl.innerHTML = '';
    init = INITS[half];
    count = init; shaken = 0; guess = null; step = 'guess';
    initEl.textContent = String(init);
    numEl.textContent = String(count);
    diffEl.textContent = half === 1 ? '지난 판과 다른 것: 처음 값이 0에서 10으로 바뀌었어요' : '';
    askEl.textContent = '처음 값 ' + init + ', ' + n + '번 흔들면 흔든수는?';
    guessEl.value = '';
    lockGuess(false);
    pickBtn.disabled = true;
    shakeBtn.disabled = true;
    shakeBtn.textContent = '흔들기';
    nextBtn.disabled = true;
    stepsEl.innerHTML = '';
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.textContent = String(i + 1) + '번';
      stepsEl.appendChild(s);
    }
    setSay('예상을 적어야 흔들 수 있어요', false);
    say(half === 0 ? '새 판이에요. 처음 값 ' + init + '에서 ' + n + '번 흔들면 어디까지 갈지 먼저 예측해 봐요.' :
      '같은 ' + n + '번인데 처음 값만 10이에요. 결과가 어떻게 달라질지 예측해 봐요.');
  }

  // 예상을 적은 뒤에도 첫 흔들기 전까지는 고칠 수 있다. 고치면 다시 적어야 흔들린다.
  function onInput() {
    if (step === 'shake' && shaken === 0) {
      step = 'guess';
      shakeBtn.disabled = true;
      shakeBtn.textContent = '흔들기';
      setSay('예상을 고쳤어요. 다시 적어요', false);
    }
    if (step !== 'guess') { return; }
    pickBtn.disabled = readGuess() === null;
  }

  function nudge(d) {
    if (step !== 'guess' && !(step === 'shake' && shaken === 0)) { return; }
    var g = readGuess();
    if (g === null) { g = d > 0 ? 0 : 1; }
    g = Math.max(0, Math.min(99, g + d));
    guessEl.value = String(g);
    onInput();
  }

  function pick() {
    if (step !== 'guess') { return; }
    var g = readGuess();
    if (g === null) { return; }
    guess = g;
    step = 'shake';
    pickBtn.disabled = true;
    shakeBtn.disabled = false;
    shakeBtn.textContent = '흔들기 (' + n + ')';
    setSay('예상: ' + g + '. 흔들기 전엔 고칠 수 있어요', false);
    say('예상: ' + g + '. 흔들 때마다 흔든수가 어떻게 변하는지 봐요.');
    shakeBtn.focus();
  }

  function shake() {
    if (step !== 'shake') { return; }
    if (shaken === 0) { lockGuess(true); }
    count += 1; shaken += 1;
    numEl.textContent = String(count);
    panelEl.classList.remove('wob'); numEl.classList.remove('bump'); void panelEl.offsetWidth;
    panelEl.classList.add('wob'); numEl.classList.add('bump');
    show(count);
    var box = stepsEl.children[shaken - 1];
    box.textContent = String(count);
    box.classList.add('on'); box.classList.add('pop');
    if (shaken < n) {
      shakeBtn.textContent = '흔들기 (' + (n - shaken) + ')';
      return;
    }
    step = 'done';
    vboxEl.classList.add('end');
    shakeBtn.disabled = true;
    shakeBtn.textContent = '흔들기';
    var d = Math.abs(count - guess);
    setSay(d === 0 ? '예상과 화면의 수가 같아요' :
      '예상 ' + guess + ', 화면 ' + count + '. ' + d + ' 떨어졌어요', true);
    drawGap(guess, count);
    if (window.Fun) {
      if (d === 0) { Fun.say('예상과 화면의 수가 같아요. 처음 값이 ' + init + '이고 ' + n + '번 늘었기 때문이에요.', 'cheer'); Fun.burst(vboxEl); }
      else { Fun.say('예상과 다르게 나왔어요. 처음 값 ' + init + '에서 ' + n + '번 늘린 걸 어디서 다르게 셌는지 봐요.', 'think'); Fun.shake(vboxEl); }
      Fun.stamp();
    }
    history.unshift('처음 값 ' + init + ' · ' + n + '번 → ' + count + ' (예상 ' + guess + ')');
    if (history.length > 4) { history.length = 4; }
    renderPast();
    if (half === 1) {
      diffEl.textContent = '0 판과 10 판의 흔든수를 견줘 보고, 기기에서 확인한 뒤 추적지에 한 문장으로 써요';
    }
    nextBtn.disabled = false;
    nextBtn.focus();
  }

  function renderPast() {
    pastEl.innerHTML = '';
    if (!history.length) {
      var e = document.createElement('li'); e.className = 'empty'; e.textContent = '아직 없어요';
      pastEl.appendChild(e); return;
    }
    for (var i = 0; i < history.length; i++) {
      var li = document.createElement('li'); li.textContent = history[i]; pastEl.appendChild(li);
    }
  }

  function nextRound() {
    if (step !== 'done') { return; }
    if (half === 0) { half = 1; } else { half = 0; n = drawN(n); }
    openRound();
    guessEl.focus();
  }

  function resetAll() {
    n = 5; half = 0; history = [];
    renderPast();
    openRound();
  }

  guessEl.addEventListener('input', onInput);
  guessEl.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); pick(); } });
  minusBtn.addEventListener('click', function () { nudge(-1); });
  plusBtn.addEventListener('click', function () { nudge(1); });
  pickBtn.addEventListener('click', pick);
  shakeBtn.addEventListener('click', shake);
  nextBtn.addEventListener('click', nextRound);
  resetBtn.addEventListener('click', resetAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) { clearSeq(); } });
  window.addEventListener('pagehide', clearSeq);

  resetAll();
})();
</script>
<script src="../assets/play/fun.js" data-block="B10" data-mission="처음 값과 흔들 횟수를 보고, 흔들기 전에 흔든수를 먼저 예상해 적어요."></script>
</body>
</html>
