<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가로로 세로로 — 에듀다움 B02</title>
<style>
  :root{
    --ink:#141414; --paper:#FBF7EC; --surface:#FFFFFF;
    --point:#059669; --point-soft:#D3F1E6; --muted:#5E5E5E;
    --r:18px; --r-sm:12px;
    --hard:5px 5px 0 var(--ink); --hard-sm:3px 3px 0 var(--ink);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif;
    background:var(--paper);color:var(--ink);font-size:17px;line-height:1.5;
    background-image:radial-gradient(var(--ink) .5px,transparent .5px);
    background-size:22px 22px;background-position:-11px -11px}
  .wrap{max-width:640px;margin:0 auto;padding:14px 14px 32px}

  .nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .back{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink);font-weight:800;
    font-size:14px;background:var(--surface);border:2.5px solid var(--ink);border-radius:999px;
    padding:9px 15px;min-height:44px;box-shadow:var(--hard-sm);transition:transform .12s,box-shadow .12s}
  .back:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .tag{font-weight:900;font-size:14px;background:var(--point);color:#fff;border:2.5px solid var(--ink);
    border-radius:999px;padding:6px 14px;box-shadow:var(--hard-sm);white-space:nowrap}

  h1{font-size:clamp(24px,5.8vw,34px);font-weight:900;letter-spacing:-.035em;line-height:1.08}
  .lead{font-size:15px;color:var(--muted);margin-top:6px;font-weight:700}

  section{background:var(--surface);border:3px solid var(--ink);border-radius:var(--r);
    box-shadow:var(--hard);padding:13px 12px;margin-top:12px}
  h2{font-size:13.5px;font-weight:900;letter-spacing:-.02em;margin-bottom:9px;color:var(--muted)}

  .tbl{display:grid;grid-template-columns:74px repeat(3,minmax(44px,1fr)) 34px;gap:5px}
  .cell{display:flex;align-items:center;justify-content:center;text-align:center;
    min-height:44px;border-radius:var(--r-sm);padding:3px;font-size:11.5px;line-height:1.15}
  .cell.corner{background:transparent;color:var(--muted);font-weight:800;font-size:10.5px}
  .cell.head{background:var(--ink);color:var(--paper);font-weight:900;border:2px solid var(--ink)}
  .cell.rowlabel{background:var(--surface);border:2px solid var(--ink);font-weight:800;color:var(--ink)}
  .cell.count{background:var(--surface);border:2px solid var(--ink);font-weight:900;color:var(--point);
    font-family:'Courier New',monospace;font-size:16px}
  button.cell.mark{font-family:inherit;cursor:pointer;color:var(--point);background:var(--surface);
    border:2.5px solid var(--ink);border-radius:var(--r-sm);font-weight:900;font-size:22px;
    box-shadow:var(--hard-sm);transition:transform .1s,box-shadow .1s}
  button.cell.mark:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  button.cell.mark:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

  .ask{margin-top:10px;font-size:13.5px;font-weight:800;color:var(--muted)}

  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{font-family:inherit;cursor:pointer;color:var(--ink);font-size:16px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:44px;padding:10px 18px;box-shadow:var(--hard-sm);
    transition:transform .1s,box-shadow .1s}
  .btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn.main{background:var(--point);color:#fff;flex:1 1 140px}
  .btn.main[aria-pressed="true"]{background:var(--point-soft);color:var(--ink)}
  .btn.sub{flex:1 1 120px}

  .note{margin-top:9px;font-size:12.5px;font-weight:700;color:var(--muted)}

  button, a{outline-offset:3px}
  :focus-visible{outline:3px solid var(--point);outline-offset:3px}

    .flip{animation:flip .26s ease-out}
  @keyframes flip{0%{transform:rotate(-2.5deg) scale(.97)}100%{transform:none}}
  .guess{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
  .gb{font-family:inherit;cursor:pointer;color:var(--ink);font-size:13px;font-weight:900;
    background:var(--surface);border:2.5px solid var(--ink);border-radius:var(--r-sm);
    min-height:46px;padding:5px 6px;box-shadow:var(--hard-sm);line-height:1.2}
  .gb[aria-pressed="true"]{background:var(--point);color:#fff;border-width:3.5px}
  .gb:disabled{opacity:.42;cursor:default;box-shadow:none}
  .say{margin-top:7px;font-size:13.5px;font-weight:900;min-height:1.4em}
  .say.dim{color:var(--muted);font-weight:700;font-size:12.5px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="back" href="../">← 전체 목록</a>
    <span class="tag">3~4</span>
  </nav>

  <header>
    <h1>가로로 세로로</h1>
    <p class="lead">어느 기준이 자주 걸렸나요</p>
  </header>

  <section aria-labelledby="h-t">
    <h2 id="h-t">표</h2>
    <div class="tbl" id="table" role="group" aria-labelledby="h-t"></div>
    <div class="guess" id="guess" role="group" aria-label="✕가 가장 많은 기준 짚기"></div>
    <p class="say dim" id="say">아홉 칸을 모두 채워요</p>
  </section>

  <section aria-labelledby="h-a">
    <h2 id="h-a">보기</h2>
    <div class="acts">
      <button class="btn main" id="flip" type="button" aria-pressed="false">세로로 보기</button>
      <button class="btn sub" id="reset" type="button">다시 하기</button>
    </div>
    <p class="note">세로로 보면 달라지나요</p>
    <p class="note">문제는 모둠에서 정해요</p>
  </section>
</div>

<script>
(function(){
  'use strict';

  var CRIT = ['자주 일어나나', '순서를 말할 수 있나', '우리가 확인할 수 있나'];
  var CAND = ['첫째', '둘째', '셋째'];
  var MARKS = ['', 'O', 'V', 'X'];
  var DISPLAY = { '': '', 'O': '○', 'V': '△', 'X': '✕' };

  var tableEl = document.getElementById('table');
  var flipBtn = document.getElementById('flip');
  var resetBtn = document.getElementById('reset');

  var grid = [['', '', ''], ['', '', ''], ['', '', '']];
  var vertical = false;

  function nextMark(v){
    var i = MARKS.indexOf(v);
    return MARKS[(i + 1) % MARKS.length];
  }

  function rowCount(r){
    var n = 0, c, crit, cand;
    for (c = 0; c < 3; c++) {
      crit = vertical ? c : r;
      cand = vertical ? r : c;
      if (grid[crit][cand] === 'O') n++;
    }
    return n;
  }

  function makeCell(tag, cls, text){
    var el = document.createElement(tag);
    el.className = cls;
    if (text) el.textContent = text;
    return el;
  }

  function render(){
    var headLabels = vertical ? CRIT : CAND;
    var rowLabels = vertical ? CAND : CRIT;
    var r, c, crit, cand, v, lab, mark, cnt;

    tableEl.textContent = '';

    tableEl.appendChild(makeCell('div', 'cell corner'));
    for (c = 0; c < 3; c++) {
      tableEl.appendChild(makeCell('div', 'cell head', headLabels[c]));
    }
    tableEl.appendChild(makeCell('div', 'cell corner', '○ 수'));

    for (r = 0; r < 3; r++) {
      tableEl.appendChild(makeCell('div', 'cell rowlabel', rowLabels[r]));
      for (c = 0; c < 3; c++) {
        crit = vertical ? c : r;
        cand = vertical ? r : c;
        v = grid[crit][cand];
        lab = rowLabels[r] + ' ' + headLabels[c] + ' 지금 ' + (v ? DISPLAY[v] : '빈칸');
        mark = document.createElement('button');
        mark.type = 'button';
        mark.className = 'cell mark';
        mark.setAttribute('data-crit', String(crit));
        mark.setAttribute('data-cand', String(cand));
        mark.setAttribute('data-row', String(r));
        mark.setAttribute('data-col', String(c));
        mark.setAttribute('aria-label', lab);
        mark.textContent = v ? DISPLAY[v] : '';
        tableEl.appendChild(mark);
      }
      cnt = makeCell('div', 'cell count', String(rowCount(r)));
      cnt.id = 'cnt-' + r;
      tableEl.appendChild(cnt);
    }
  }

  tableEl.addEventListener('click', function(e){
    var t = e.target;
    if (t.tagName !== 'BUTTON' || !t.classList.contains('mark')) return;
    var crit = parseInt(t.getAttribute('data-crit'), 10);
    var cand = parseInt(t.getAttribute('data-cand'), 10);
    var r = parseInt(t.getAttribute('data-row'), 10);
    var c = parseInt(t.getAttribute('data-col'), 10);
    var v = nextMark(grid[crit][cand]);
    grid[crit][cand] = v;
    t.textContent = v ? DISPLAY[v] : '';
    var headLabels = vertical ? CRIT : CAND;
    var rowLabels = vertical ? CAND : CRIT;
    t.setAttribute('aria-label', rowLabels[r] + ' ' + headLabels[c] + ' 지금 ' + (v ? DISPLAY[v] : '빈칸'));
    document.getElementById('cnt-' + r).textContent = String(rowCount(r));
    renderGuess();
  });

  var guess = null;          // 짚은 기준. 세우기 전까지 바꿀 수 있다.
  var gEls = [];
  (function buildGuess(){
    for (var i = 0; i < CRIT.length; i++){
      var b = document.createElement('button');
      b.className = 'gb'; b.type = 'button'; b.setAttribute('aria-pressed', 'false');
      b.textContent = CRIT[i];
      b.setAttribute('aria-label', CRIT[i] + '에 ✕가 가장 많다고 짚기');
      (function(k){ b.addEventListener('click', function(){
        if (vertical || !allFilled()) return;   // 세우기 전까지 바꿀 수 있다
        guess = k; renderGuess();
      }); })(i);
      document.getElementById('guess').appendChild(b);
      gEls.push(b);
    }
  })();

  function allFilled(){
    for (var c = 0; c < 3; c++) for (var d = 0; d < 3; d++) if (!grid[c][d]) return false;
    return true;
  }
  function xCount(c){
    var n = 0;
    for (var d = 0; d < 3; d++) if (grid[c][d] === 'X') n++;
    return n;
  }
  function mostX(){
    var best = 0, bn = xCount(0), tie = false;
    for (var c = 1; c < 3; c++){
      var n = xCount(c);
      if (n > bn){ bn = n; best = c; tie = false; }
      else if (n === bn) tie = true;
    }
    return { c:best, n:bn, tie:tie };
  }

  function renderGuess(){
    var ok = allFilled();
    for (var i = 0; i < 3; i++){
      gEls[i].setAttribute('aria-pressed', guess === i ? 'true' : 'false');
      gEls[i].disabled = !ok || vertical;
    }
    flipBtn.disabled = (guess === null);

    var s = document.getElementById('say');
    if (!ok){ s.textContent = '아홉 칸을 모두 채워요'; s.className = 'say dim'; }
    else if (guess === null){ s.textContent = '✕가 가장 많을 기준을 짚어요'; s.className = 'say dim'; }
    else if (!vertical){ s.textContent = '세로로 보기를 눌러요'; s.className = 'say dim'; }
    else {
      var m = mostX();
      if (m.n === 0) s.textContent = '✕가 한 칸도 없어요';
      else if (m.tie) s.textContent = '가장 많은 기준이 갈렸어요';
      else if (m.c === guess) s.textContent = '짚은 기준에 ✕가 가장 많아요';
      else s.textContent = '다른 기준에 ✕가 더 많아요';
      s.className = 'say';
    }
  }

  flipBtn.addEventListener('click', function(){
    vertical = !vertical;
    flipBtn.setAttribute('aria-pressed', vertical ? 'true' : 'false');
    render();
    // 세우는 순간을 몸으로 느끼게 한다. 글자는 늘리지 않는다.
    var t = document.getElementById('table');
    t.classList.remove('flip'); void t.offsetWidth; t.classList.add('flip');
    renderGuess();
  });

  resetBtn.addEventListener('click', function(){
    grid = [['', '', ''], ['', '', ''], ['', '', '']];
    guess = null; vertical = false;
    flipBtn.setAttribute('aria-pressed', 'false');
    render(); renderGuess();
  });

  render();
  renderGuess();
})();
</script>
</body>
</html>
